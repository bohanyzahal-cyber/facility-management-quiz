<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>חומר פתוח — ניהול תשתיות גלובליות</title>
<style>
/* ---------- בסיס ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{background:#8a8f96}
body{font:12.4px/1.46 "Segoe UI","Arial Hebrew",Arial,sans-serif;color:#12161c;direction:rtl}

/* ---------- עמוד ---------- */
/* A4 = 210×297mm. הריפוד הימני רחב יותר — שם הכריכה/הסיכה. */
.pg{position:relative;width:210mm;height:297mm;padding:13mm 11mm 11mm 16mm;
    background:#fff;margin:0 auto 7mm;overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.35)}
.pg.over{outline:3px solid #d92b2b}
.pg.over::after{content:"גלישה";position:absolute;left:2mm;bottom:2mm;
    background:#d92b2b;color:#fff;font-size:9px;padding:1px 5px;border-radius:3px}

/* כותרת רצה */
.hd{position:absolute;top:5mm;right:11mm;left:16mm;display:flex;
    justify-content:space-between;align-items:baseline;
    border-bottom:1.6px solid var(--c,#333);padding-bottom:1.5mm;
    font-size:10px;letter-spacing:.2px}
.hd b{font-size:12.5px;color:var(--c,#333)}
.hd span{color:#7a828c}
.pgn{position:absolute;bottom:4.5mm;left:16mm;font-size:10px;color:#7a828c}
.pgn b{color:#333}

/* לשונית צד — המיקום האנכי משתנה לפי הנושא, כך שבערימת דפים
   נראות "מדרגות" וניתן לדפדף ישר לנושא בלי לקרוא. */
.tab{position:absolute;left:0;width:11mm;background:var(--c,#333);color:#fff;
     display:flex;align-items:center;justify-content:center;
     writing-mode:vertical-rl;font-size:9.5px;font-weight:700;letter-spacing:.4px;
     padding:2mm 0;border-radius:3px 0 0 3px}

/* ---------- תוכן ---------- */
.body{margin-top:6.5mm;column-gap:7mm}
.body.c2{column-count:2;column-rule:1px solid #dfe3e8}
h2{font-size:13.5px;color:#fff;background:var(--c,#333);padding:1.3mm 2.5mm;
   border-radius:2.5px;margin:0 0 1.6mm;break-after:avoid}
h2:not(:first-child){margin-top:3mm}
h3{font-size:12px;color:var(--c,#333);margin:2.4mm 0 1mm;break-after:avoid;
   border-bottom:1px dotted #c3c9d0;padding-bottom:.6mm}
h3:first-child{margin-top:0}
dl{margin:0 0 1.2mm}
dt{font-weight:700;font-size:12.2px;display:inline}
dd{display:inline;margin:0}
dl>div{margin-bottom:.9mm;break-inside:avoid;text-indent:-3.2mm;padding-right:3.2mm}
dt::before{content:"▪ ";color:var(--c,#333);font-weight:700}
dt::after{content:" — ";font-weight:400;color:#7a828c}
.n{color:#0b4f9e;font-weight:700;font-feature-settings:"tnum"}
.q{color:#3d4650;font-style:italic}
em{font-style:normal;background:#fff2b8;padding:0 1px;border-radius:2px}
.warn{background:#fdeaea;border-right:2.5px solid #d92b2b;padding:1.2mm 2mm;
      margin:1.2mm 0;break-inside:avoid;border-radius:0 2.5px 2.5px 0}
.warn b{color:#a51b1b}

/* טבלאות */
table{border-collapse:collapse;width:100%;font-size:11.2px;margin:0 0 2mm;break-inside:avoid}
th{background:var(--c,#333);color:#fff;text-align:right;padding:1mm 2mm;font-size:10px}
td{border-bottom:1px solid #dfe3e8;padding:.9mm 2mm;vertical-align:top}
tr:nth-child(even) td{background:#f6f8fa}
td.k{font-weight:700;white-space:nowrap;color:#0b4f9e;font-feature-settings:"tnum"}

/* ---------- שער ---------- */
.cover{text-align:center;padding-top:24mm}
.cover h1{font-size:30px;letter-spacing:-.5px;margin-bottom:2mm}
.cover .sub{font-size:13px;color:#5b6470;margin-bottom:12mm}
.toc{text-align:right;max-width:150mm;margin:0 auto}
.toc a{display:flex;align-items:baseline;gap:2mm;text-decoration:none;color:#12161c;
       padding:1.5mm 2mm;border-radius:3px;font-size:13px}
.toc a:nth-child(odd){background:#f2f5f8}
.toc .sw{width:4mm;height:4mm;border-radius:2px;flex:none}
.toc .nm{flex:1;font-weight:700}
.toc .dots{flex:1;border-bottom:1.5px dotted #b9c0c8;transform:translateY(-2px)}
.toc .pn{font-weight:700;color:#0b4f9e;font-feature-settings:"tnum"}
.tip{max-width:150mm;margin:10mm auto 0;background:#f2f5f8;border-radius:4px;
     padding:4mm 5mm;font-size:11px;line-height:1.55}
.tip b{display:block;margin-bottom:1.5mm;font-size:12px}

/* ---------- מפתח ---------- */
.idx{column-count:3;column-gap:6mm;font-size:10.6px;line-height:1.5}
.idx div{break-inside:avoid}
.idx .t{font-weight:700}
.idx .p{color:#0b4f9e;font-weight:700}
.idx h3{column-span:all}

/* ---------- הדפסה ---------- */
@page{size:A4;margin:0}
@media print{
  html{background:#fff}
  .pg{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .pg:last-child{break-after:auto;page-break-after:auto}
  .pg.over{outline:none}
  .pg.over::after{display:none}
  .noprint{display:none}
}
.noprint{position:fixed;top:8px;left:8px;z-index:99;background:#12161c;color:#fff;
  border-radius:6px;padding:7px 11px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.noprint button{background:#2d6cdf;color:#fff;border:0;border-radius:4px;
  padding:4px 9px;font-size:12px;cursor:pointer;margin-right:6px}
</style>
</head>
<body>
<div class="noprint"><span id="stat">בונה…</span><button onclick="print()">הדפסה</button></div>

<script>
var DATA = {sections:[

/* ═══════════════════════════════════════════════════ 1 · מבוא ויסודות */
{name:"יסודות", color:"#1a5fb4", sub:"הגדרות · מודלים · מגמות", cols:2, blocks:[

{h2:"מהו ניהול תשתיות (FM)"},
{items:[
"**ההגדרה** :: ניהול כלל הפעילות והשירותים הנדרשים להבטחת פעולה **תקינה ורצופה** של העסק, __ללא עיסוק בליבת העשייה__, כדי לאפשר למנהל להתרכז בליבה — ברמת שירות טובה ובמחיר סביר.",
"**המילה שמסכמת** :: «Business Continuity» — רציפות עסקית.",
"**על מי חל** :: כל ארגון עם פעילות תומכת — ממשרד בודד ועד מפעל, מכון מו״פ, בית חולים, מלון, קניון, אוניברסיטה, נמל תעופה, מוסד שלטון.",
"**מתי הגיע לישראל** :: לפני כ-⟨30⟩ שנה, עם החברות הגלובליות (אינטל, אמדוקס, SAP, אפל) שהיו רגילות לשירות בחו״ל. בעולם — מתחילת המאה ה-20, כ-⟨100⟩ שנה.",
"**מי עשה זאת קודם** :: עובדי הארגון עצמו, כתוספת לתפקידם — משאבי אנוש טיפלו באוכל ובעובד, תפעול בהסעות."
]},

{h2:"שלושת זוגות המושגים"},
{items:["**למה שלושה זוגות** :: הם מגדירים יחד את התחום ויוצרים __שפה עסקית משותפת__ — מיקוד, סדר עדיפויות וסטנדרט זהה בין אתרים של אותה חברה."]},
{tbl:{head:["הזוג","צד א׳","צד ב׳"],rows:[
["SOFT / HARD","שירותים לוגיסטיים לעובד ולאתר","שירותים מוטי תשתיות ומבנים"],
["CORE / NON-CORE","ליבת העסק","תומך, אינו ליבה"],
["CRITICAL / NON-CRITICAL","סיכון לעמידת העסק ביעדיו","אין סיכון כזה"]
]}},
{items:[
"**האם הם חופפים** :: לעיתים קרובות כן (HARD≈ליבה≈קריטי), __אבל יש יוצאים מן הכלל__. החלוקה ניהולית ועקרונית ויש להתאימה לכל עסק.",
"**CRITICAL — המשמעות** :: תשומת לב ניהולית ממוקדת + __יתירות מערכות__. נגזר מ**סקר סיכונים שנתי** (בחברה ציבורית — גם דיווח לשוק ההון).",
"**למה בכלל לחלק** :: לטפל בכל האזורים באותה רמה עולה הרבה כסף. במפעל בלי חשמל או מיזוג — הקו נעצר; במשרד ⟨4⟩ שעות בלי מיזוג «לא יקרה שום דבר»."
]},

{h3:"SOFT SERVICES — הרשימה"},
{items:["**מה נכלל** :: דואר ומשלוחים · הדפסות · ציוד משרדי · PPE · שירותי נדל״ן ומיסוי · ביגוד וכביסה · ניקיון אזורים שאינם ייצור · גינון · הדברה · פינוי שלג · אמהות/אבות בית · מלגזות · **הסעדה** · **הסעות** · בריאות וכושר · **צי רכב** · פינוי אשפה · כיבוי אש · **ביטחון** · **הובלות**. (בעולם גם אחזקת נהרות החוצים אתר.)"]},
{h3:"HARD SERVICES — הרשימה"},
{items:["**מה נכלל** :: **אחזקה** על צורותיה · **אנרגיה** (אספקה וצריכה) · **כיול וולידציה** · מיזוג/אוורור לאזורי ליבה · **חומרים מסוכנים** ופסולת מסוכנת · כיבוי אש · טיהור מים · יחידות איסוף אבק · בינוי · מכלים · ניקוז וביוב · ציוד בקרת איכות במעבדות (UPLC/HPLC, שקילה, מנדפים) · מנופים ומסועים."]},
{warn:"**גבול נייד:** החלוקה משתנה בין חברה לחברה. דוגמת המרצה — **פינוי אשפה** הוא SOFT ברוב המקומות, אך בחברות רפואיות הוא HARD, כי פסולת רפואית היא נושא בטיחותי מורכב."},

{h2:"מודלים של הפעלה"},
{items:[
"**שלוש צורות ההפעלה** :: ⟨1⟩ **SINGLE / IN-HOUSE** — ניהול עצמאי · ⟨2⟩ **IFM** — אינטגרציה מלאה בידי גורם חיצוני · ⟨3⟩ **BUNDLER / HYBRID** — משולב. __ההיברידי הוא המקובל ביותר בעשור האחרון.__",
"**סדר ההתפתחות** :: עצמי ← מיקור חוץ ← מיקור חוץ מתקדם ← IFM ← משולב/היברידי ← שיתופי פעולה.",
"**מיקור חוץ מול מתקדם** :: רגיל = בפועל __שכירת כוח אדם__ (תשומות). מתקדם = רכישת שירותים לפי __תפוקות__; העסק מנהל פיקוח ובקרה. מקובל ב-SOFT.",
"**ציר הזמן ההיסטורי** :: עד שנות ה-⟨80⟩ עובדי חברה · ⟨80⟩–⟨2000⟩ מיקור חוץ/עובדי קבלן בניהול העסק · מ-⟨2000⟩ התפתחות IFM · העשור האחרון — היברידי.",
"**למה החל מיקור חוץ בשנות ה-90** :: עבודות פיזיות קשות לא התאימו לעובדים ותיקים בני ⟨50⟩–⟨55⟩ שאי אפשר לפטר עד הפרישה, ונדרש כוח אדם נוסף במקומם. בשלב זה עוד __קנו עובדים, לא שירותים__."
]},

{h3:"מעבר ל-IFM — תנאי סף"},
{items:["**שני בסיסי השוואה חובה** :: ⟨1⟩ **BASE LINE** כספי ברור וידוע · ⟨2⟩ **SLA** — רמת שירות קיימת וברורה. בלעדיהם אי אפשר להוכיח חיסכון או שיפור.",
"**מה משפיע על הבחירה** :: גודל החברה · שלב מחזור החיים · המורכבות הנדרשת · מבנה המחזור והרווח התפעולי. __ככל שהרווח קטן — ניהול הדוק ומבוקר יותר.__ חברות קטנות/חדשות יעדיפו שירות כולל."]},
{h3:"שיטות התקשרות מול IFM"},
{tbl:{rows:[
["FIXED PRICE","מחיר קבוע + חריגים"],
["COST PLUS","עלות + רווח מוסכם"],
["OPEN BOOKS","__שקיפות מלאה__ בעלויות, בהוצאות וברווח מוסכם, במדרגות מקובלות, עם מנגנון **קנס/פרס**"]
]}},
{warn:"**מלכודת נפוצה:** FIXED PRICE / COST PLUS / OPEN BOOKS הן **שיטות התקשרות** מול IFM — __לא__ צורות הפעלה. צורות ההפעלה הן SINGLE, IFM ו-BUNDLER."},

{h2:"מבנה עלויות ומנופי הוזלה"},
{items:[
"**התפלגות ההוצאה בעולם** :: ⟨70%–80%⟩ **כוח אדם** · ⟨10%–20%⟩ חומרים ואמצעים · ⟨5%–10%⟩ השפעות רגולטוריות.",
"**למה זה משנה** :: כשרוב ההוצאה היא שכר, כל טכנולוגיה שמחליפה עבודת כפיים משפיעה ישירות על העלות — ובמקביל __החשיפה לרגולציה (שכר מינימום) גדלה__.",
"**ODS — On Demand Service** :: מעבר מפעילות **מונוטונית קבועה** לפעילות **לפי צורך בפועל**. דוגמה: ניקוי משרד רק כשהוא מאויש, במקום שלוש פעמים בשבוע.",
"**שיתופיות (SHARING)** :: עסקים סמוכים רוכשים שירותים במשותף — הסעות, מטבח אחד לכמה חדרי אוכל, פינוי פסולת.",
"**קבוצות רכישה** :: הגדלת כוח קנייה משותף.",
"**Shared Services** :: יחידה **פנים-ארגונית** הנותנת שירות נושאי לאזור/מרחב — כספים, משאבי אנוש, רכש, IT — ללא שיוך עסקי חד-ערכי. כולל מוקדי תמיכה גלובליים העונים בשפת הפונה."
]},
{warn:"שלושת המנגנונים להתמודדות עם עלויות: **שיתופיות** (בין עסקים) · **קבוצות רכישה** (כוח קנייה) · **Shared Services** (ריכוז פנימי)."},

{h2:"הארגון הגלובלי"},
{items:[
"**מבנה התפקיד המקובל** :: **מנהל FM ברמת סמנכ״ל**, ותחתיו מנהל **Soft** ומנהל **Hard**. בישראל השמות משתנים: סמנכ״ל תפעול / לוגיסטיקה / FM.",
"**הרקע המקצועי** :: מנהל Soft — לוגיסטיקה, תקשורת או רפואה. מנהל Hard — __מהנדס__: מכונות, חשמל או מיזוג.",
"**ניתוק המיקום הפיזי** :: ייזום, מו״פ, תכנון, ייצור, הפצה, מכירה ותחזוקה במיקומים נפרדים — ניצול יתרונות יחסיים בכל מקום.",
"**למה ייצור נודד בין מדינות** :: בכל שלב בוחנים היכן הכי זול והכי טוב — __ובנוסף שיקולי מיסוי__. דוגמה: חומר גלם בישראל ← עיבוד ← מזרח אירופה ← מערב אירופה ← שיווק במקום אחר.",
"**דוגמת המזגנים** :: יבואן ברעננה ייבא מנועים, מעבים וכרטיסים **בנפרד** — כי __על חלפים אין מס__ — והרכיב את המזגנים בישראל.",
"**אתגרי הניהול הגלובלי** :: הבדלי זמן (ימים, שעות, חגים) · הבדלי תרבות · בסיסי נתונים ומערכות שונים · אינטרסים שונים · מחסור בפגישות פרונטליות.",
"**הסטנדרט הגלובלי** :: __לעולם אינו גובר על רגולציה מקומית__ — סטנדרטים מקומיים תמיד יותאמו לדרישות ולנורמות המקומיות.",
"**תיירות עבודה** :: עובדים במדינות אחרות הנותנים שירות מרחוק במחשב (IT, סוכני מכירות). המרצה גייס מנהל רכש בהודו עבור טבע: «מה זה משנה איפה הוא יושב?»",
"**תרבות יפן** :: מגיעים ביום שני, ישנים במפעל עד שישי וחוזרים הביתה — גם מי שגר ⟨20⟩ דקות מהאתר. בכל מפעלי טבע ביפן היו מגדלי מגורים.",
"**מפעל המתכת בירוחם** :: מפעל פלדה עצום ש__כמעט אינו מייצר__ — מקבל הזמנות ומייצר בטורקיה ובסין. התחרות היא מול העולם."
]},

{h2:"רגולציה"},
{items:[
"**מהי** :: הנחיות, חוקים ותקנות ממשרדי ממשלה ויחידות סמך — **כלכלה, עבודה, איכות הסביבה, אנרגיה**. לכל משרד הנחיות משלו.",
"**גם דיני עבודה הם רגולציה** :: חוק שעות עבודה ומנוחה · צווי הרחבה · שכר מינימום.",
"**חוק האוויר** :: נחקק בישראל לפני כ-⟨10⟩ שנים, __הועתק מאירופה ומארה״ב__, קבע מגבלות פליטה ואילץ השקעה כבדה — בעיקר במפעלים כימיים ובחברת החשמל.",
"**זיהום הקרקע בשדה דב** :: אימצו תקן אמריקאי בתוך שבוע.",
"**מלחמה ורגולציה** :: __לא שונו רגולציות ולא ניתנו הקלות__ — רק פתרונות מקומיים. עם פרוץ המלחמה ⟨50%⟩ מהאתרים לא עבדו וההכנסה ירדה בחצי; שאלת הפיצוי לא הוכרעה, אף שהמדינה עצמה הורתה על הסגירה."
]},

{h2:"שינוי — מי ששרד ומי שלא"},
{items:[
"**העיקרון המנחה** :: לשמור על איכות ורמת שירות מחד ועל שליטה מלאה בהוצאות מאידך — ו__לא «להתאהב» במה שקיים, גם אם אתה יצרת אותו__.",

{items:[

"**BOT** :: **Build – Operate – Transfer**. גורם פרטי בונה, מפעיל ומתחזק לתקופה ארוכה (כ-⟨25⟩ שנה) ואז מעביר לבעלים. לצדו **PFI** (Private Finance Initiative) ו-**PPP** (Public Private Partnership).",

"**כשירות התחמושת (1995)** :: כ-⟨3⟩ חודשים להתארגן, ואז __יום לחימה אחד בכל חודש__. הקושי בהקמת קו ייצור אינו המכונות אלא הכשרת כוח אדם.",
"**התעשייה בשנתיים האחרונות** :: הסבה רחבה לצורכי ביטחון — אלביט תכננה שני מפעלים ברמת בקע ובונה שישה; ירוחם מייצר את בסיסי החץ. עד אוקטובר ⟨2023⟩ הרכש בארץ הצטמצם כי בחו״ל היה זול יותר."
]}

/* ═══════════════════════════════════════════════════════════ 2 · הסעדה */
{name:"הסעדה", color:"#c64600", sub:"מפרט · מטבחים · מדידה", cols:2, blocks:[

{h2:"המדד המרכזי"},
{items:[
"**המדד הבינלאומי** :: __פוטנציאל אוכלים מול אוכלים בפועל__. ⟨85%⟩ נחשב מצב טוב.",
"**דוגמה נגדית** :: חדר האוכל החדש בקריה — יפה ונקי, אך רק ⟨35%⟩ מהחיילים אכלו בו. עצת המרצה למפקד: «מה החיילים הולכים לאכול באזריאלי? פסטה, פיצה, פלאפל — אז תעשה להם את זה».",
"**בקרה בלי מערכת** :: לעמוד היכן שמחזירים את המגשים ולראות מה נלקח, מה נאכל ומה הוחזר.",
"**מספונים** :: מסכי שביעות רצון (אייפד, ⟨4⟩ פרצופים) בכניסה לשירותים, למלתחות ולחדרי אוכל. היום גם ברקוד/QR לסלולר."
]},
{h3:"סקר שביעות רצון — הכללים"},
{items:["**סקר הוא דיאלוג** :: לא ארוך מדי · בזמן נכון · לפרסם תוצאות __ותוכנית מתקנת__ · לבצע מעקב · ובסקר הבא להשוות ולתקשר שוב. רק כך נוצר אמון."]},

{h2:"מפרט הדרישות — לב ההסכם"},
{items:[
"**מה חשוב למנהל** :: בחוזה יש חלק משפטי, ביטוח וחלק כספי — __אבל החלק שלנו הוא מפרט הדרישות__.",
"**הפגם שמצא בטבע** :: הסכם בן ⟨42⟩ עמודים — ⟨40⟩ «הואיל והואיל» וכמה שורות על הארוחות. «זה לא נותן לך מכשיר להתמודד עם הספק».",
"**מי כותב אותו** :: __יועץ קולינרי__ — מגוון לכל האוכלוסיות (בשרי, חלבי, צמחוני, טבעוני, צליאק, קטוגני), סוג ומשקל למנה, הרכב תזונתי וערך קלורי.",
"**למה לא «12 סלטים»** :: הספק ייתן ⟨12⟩ סלטי גזר. צריך סוג, צורת חיתוך ורוטב לכל אחד.",
"**משקל לפני בישול** :: «שניצל ⟨120⟩ גרם לפני טיגון» — המשקל אחרי בישול משתנה לפי שיטת ההכנה, ולכן רק הגולמי בר-בקרה. בטבע שקלו מנות בפועל לפני כל ארוחה.",
"**למה פירוט מאפשר בקרה** :: «ארוחת בוקר» היא בינארית — אחד או אפס. «ארבעה סוגי ביצים» אפשר לספור. __אם זה לא מפורט, לא תוכלו לבדוק.__"
]},
{warn:"**הכלל שחוזר בכל הקורס:** «ברגע שספק רואה שאתה בודק אותו — הוא מקפיד». בבדיקת מעבדה לשמן «בטעם זית» התברר שאין בו רכיב שמן זית כלל — «הוא היה יותר קרוב לשמן מנוע»."},

{h2:"מטבחים ורמות"},
{tbl:{head:["סולם המטבחים","מה יש בו"],rows:[
["מחמם","הרמה הבסיסית — הבישול במטבח מרכזי רחוק (**בשל-צנן**)"],
["ביניים / קצה","יכולות מוגבלות — טיגון, אפייה"],

{items:[
"**חמש רמות ההסעדה** :: בסיסי (מוסדות ציבור, צה״ל, משטרה, שב״ס, בתי חולים) ← בינוני (מפעלים ותעשייה) ← טוב (הנהלות ומטות) ← טוב מאוד (הייטק נבחר) ← מצוין (מסעדות שף).",
"**מה קובע איזה מטבח אפשר** :: גודל · מקום · תשתית · מיכון · תקציב · **רישוי עסקים** (משתנה מעיר לעיר) · משרד הבריאות · רבנות ורמת כשרות · החלטת החברה.",
"**סו-ויד (sous-vide)** :: בישול בשקיות אטומות באמבט מים או קיטור. צרפתית: «תחת ואקום». נכנס להסעדה מוסדית בזכות __שליטה מדויקת בטמפרטורה ובזמן__ — מתאים להרבה אוכלים בזמן קצר.",
"**המיכון** :: כמעט כולו מגיע __מטורקיה__, בלי קשר לשם המותג. ההבדל הוא ברמת האיכות ובמחיר.",
"**הציוד — של מי** :: __הלקוח רוכש__; הספק מתחזק ואחראי לבלאי __משימוש לא נכון__ (לא לבלאי טבעי). נדרשים החתמה, ספירה עיתית, קרן חידוש ואכיפת תחזוקה לפי הוראות היצרן.",
"**קרן חידוש לכלים** :: השלמת כלים, סכו״ם ומגשים. «יש שיעור בלאי טבעי — אבל אם שוברים ⟨50%⟩ מהצלחות בחודש, כנראה זה לא טבעי».",
"**כשרות** :: ⟨24⟩ סוגי כשרויות. ההמלצה: __תמיד הרבנות המקומית שבתחומה האתר__. לדורשי כשרות אחרת — מנות מוכנות וקפואות.",
"**רישיון עסק למטבח** :: הרשות המקומית בודקת רק את __חוקיות הנכס__ ומשמשת אינטגרטור. האישורים מגיעים ממשטרה, כיבוי אש, משרד הבריאות והרבנות."
]},

{h2:"מודלים כספיים"},
{tbl:{head:["","ישראל","חו״ל"],rows:[

"**מינימום מחייב** :: נדרש כדי שהספק יוכל להתחייב שיהיה אוכל — «במקום אלף מגיעים ⟨200⟩». התחדד בקורונה ובמלחמה. מקובל בעיקר מתחת ל-⟨250⟩ עובדים.",
"**סף כדאיות לקבלן** :: כ-⟨250⟩ עובדים. «אפשר להביא קבלן גם ל-⟨30⟩ עובדים — רק זה יעלה הרבה כסף». הפתרון לאתר קטן: __שותפות עם עסק סמוך__ — או שתבשל עבורם או שיבשלו עבורך.",
"**אכלת — שילמת** :: חיוב לפי מה שנלקח בפועל. «שתית רק מרק — תשלם רק על המרק». מקובל באירופה ובארה״ב, מתחיל בישראל. __דורש קופות, שקילה וכוח אדם נוסף.__",
"**סיבוס / תן ביס / Wolt** :: הסדרי הסעדה חיצונית בתקציב קבוע מראש — מצטבר או מתאפס יומי/שבועי/חודשי.",
"**מס** :: ארוחה במקום העבודה היא **הטבה — וחייבת במס**. הכלל הרחב: כל הטבה חייבת במס."
]},

{h2:"התמודדות עם הסועדים"},
{items:[
"**«קהל שבוי»** :: «גם במסעדה עם ⟨3⟩ כוכבי מישלן — אחרי ⟨5⟩ ימים יימאס לכם». הפתרונות: להחליף סדר מנות בכל שבוע (שניצל שלם/פרוס, קציצות עגולות/ארוכות), עמדת שף, פוד-טראק, __שף אורח («פופ-אפ»)__.",
"**דרישות עדכניות** :: אוכל בריא · מוצרים טריים ולא מתועשים · __הכנה במקום לעיני הלקוח__ · הרכבה עצמית · הכנה לפי דרישה.",
"**הזמנה ממוכנת מראש** :: המגמה החדשה באירופה. בבוקר העובד מקבל מייל/וואטסאפ עם התפריט ובוחר __מה ומתי__ יאכל. מדייק את כמות המנות, מקטין פחת ומקצר המתנה.",
"**ויסות עומסים** :: תמריצים למי שמגיע לפני ⟨12:30⟩ או אחרי ⟨13:30⟩ — למשל קינוח חינם.",
"**מה עשתה הקורונה** :: אי-ודאות בכמות. באתר טבע בת״א ל-⟨1,600⟩ עובדים וארבע מסעדות — «יום אחד באים ⟨200⟩, יום אחד ⟨800⟩».",
"**הרגלי ארוחות בעולם** :: מזרח אירופה, המזרח הרחוק ודרום אמריקה — הצהריים היא הארוחה העיקרית, כמו בישראל. **מערב אירופה וארה״ב — הערב**; הצהריים «ברנץ׳» קליל. «אתה לא רוצה לדבר עם גרמניה בארוחת הצהריים»."
]}

/* ═════════════════════════════════════════════════ 3 · הובלה והסעות */
{name:"הובלה והסעות", color:"#0d6b5e", sub:"מטען מלא · תכנון · רגולציה", cols:2, blocks:[

{h2:"העיקרון המרכזי"},
{items:[
"**השאיפה** :: __«נסיעה במטען מלא» רוב הזמן__ — התאמת סוג הרכב למטען (סוג, גודל, משקל, נפח), תכנון קווים, ואף שילוב גורמים מחוץ לחברה כדי למצוא **הובלה חוזרת** מלאה.",
"**איך מחשבים עלות** :: __מחיר למשטח או לפריט מוסע__ — לא עלות כוללת של הובלה יומית או ליעד.",
"**דוגמת שני המשטחים לאשדוד** :: המחסנאי השיג מחיר נסיעה זול — ושילם ⟨1,100⟩ ש״ח למשטח, כי המשאית נושאת ⟨20⟩–⟨24⟩. «מה אכפת לו?» — הוא נמדד על מחיר הנסיעה, לא על העלות למשטח.",
"**מרכז הובלה** :: מרכז שליטה, תכנון ובקרה המאחד גורמים בחברה שאין ביניהם קשר — כדי לשלב, למצות ולנסוע מלא. אותו רעיון ב**מוקד הסעות** ארצי.",
"**שופרסל — הסיפור** :: ⟨320⟩ משאיות; שתיים לקריית שמונה כל בוקר וחזרה __ריקות__, וכך לאילת. הוא מכר הובלות חוזרות לתנובה, שטראוס ואוסם בחצי מחיר והגיע ל-⟨70%⟩ ניצול. המרכז הלוגיסטי התחיל להרוויח.",
"**«אצלנו אי אפשר לתכנן»** :: לבדוק אחורה במערכות — הכל מוזמן, משולם ומתועד. בבדיקה של ⟨3⟩ שנים אחורה נמצא ש-⟨90%⟩ ניתן לתכנון ורק ⟨10%⟩ חריגים אמיתיים.",
"**האתגר** :: רצון כל עסק לשמור על גמישות ולא לתכנן. __נדרש שינוי בתרבות הארגונית__ — תהליך קבוע להגדרת צרכים עד יום קבוע בשבוע."
]},

{h2:"רגולציה ובקרה בהובלה"},
{items:[
"**קצין בטיחות בתעבורה** :: חובה בכל חברה המבצעת הובלה — __גם בצי עצמי וגם ברכישת שירות__. הובלת חומ״ס מחייבת בנוסף **מנהל בטיחות**.",
"**GDP** :: Good Distribution Process — מחייב **ולידציה** לרכב (בקרת טמפרטורה, לחות, אטימות) ו__תיעוד רצוף__ מנקודת המוצא לנקודת הקבלה.",
"**ולידציה למשאית מזון** :: בדיקת טמפרטורות, רעידות, זוויות והטיות — ורק אז הסמכה להוביל מזון.",
"**אמצעי בקרה** :: **GPS וטכוגרף** — חיווי עצירה, פתיחת דלת מטען, חריגה ממסלול, חריגה בזמן; ברכבי קירור חיווי טמפרטורה ורשם דיגיטלי מקוון.",
"**חיסונים** :: יש להוכיח שהטמפרטורה נשמרה __מהמפעל ועד בית המרקחת__. בקורונה: ⟨2⟩–⟨8⟩ מעלות (וחלקם מתחת לאפס); סטייה פוסלת את החיסון. היום החיישן __על המוצר עצמו__, לא רק על המשאית.",
"**הובלת כספת** :: נסגרת אצל השולח; רק מקבל מורשה ביעד מקבל את הקוד. למטענים רגישים — סמים, כסף, אבנים יקרות.",
"**עמדת המרצה על בטיחות** :: «אני לא רוצה הכי בטוח בארץ — אני רוצה הכי בטוח __לפי החוק__». חריגה מעבר לנדרש מייקרת את המוצר. אין לעבור על החוק, אך «יש הרבה שממציאים»."
]},

{h2:"שוק ההובלה"},
{items:[
"**מבנה השוק בישראל** :: כמה חברות גדולות עם יכולת לוגיסטית משלימה, לצד חברות קטנות ובינוניות — לעיתים מאוגדות ב**קואופרטיב**. לעיתים גם צי בבעלות החברה.",
"**רכבת** :: כמעט אינה קיימת בהובלה. ההובלה המשמעותית היחידה — __תפזורת ממפעלי ים המלח__. קו מערבי אחד משרת כמעט את כל המדינה.",
"**שאטלים ימיים** :: לא מעשי — הים התיכון גלי, וכלי שיט כזה זקוק לשוקע עמוק. «בשביל הפוליטיקה זה טוב».",
"**משבר החות׳ים** :: אוניות הקיפו דרך **כף התקווה הטובה** במקום תעלת סואץ — האריך וייקר. ⟨95%⟩ מיבוא ישראל עובר בים. בחלפי אחזקה — יקר יותר ועוד כ-⟨3⟩ שבועות.",
"**TrackNet** :: «טינדר למשאיות» — מערכת ישראלית המשדכת משאיות ריקות למטענים, לפי מיקום ובעזרת AI. הראשונה מאילת הנסחרת בת״א: הונפקה במרץ לפי ⟨60⟩ מיליון ש״ח, זינקה ל-⟨195⟩ מיליון בעקבות **הסכם כוונות עם פולקסווגן** לכמיליון משאיות באירופה."
]},

{h2:"הסעות עובדים"},
{items:[
"**גיל התחום** :: כ-⟨30⟩ שנה בלבד בישראל. __אגד ודן הוקמו בזמנו רק לצורך הסעות עובדים.__",
"**אחריות המעסיק** :: __מרגע היציאה מדלת הבית ועד החזרה הביתה__ — כל אירוע בדרך באחריות מקום העבודה.",
"**סדר גודל** :: משרד החינוך לבדו מוציא כ-⟨3⟩ מיליארד ש״ח בשנה על הסעות, בעיקר לחינוך המיוחד.",
"**ערכי הנוהל** :: הליכה ⟨200⟩–⟨250⟩ מטר לתחנה · שהייה עד __חצי שעה__ ברכב. «לא רוצים למלא אוטובוס של ⟨50⟩ ולקחת שעתיים וחצי — הבן אדם מגיע שחוט».",
"**מה עוד קובע הנוהל** :: מי רשאי להשתמש (בעל רכב חברה? מקבל אחזקת רכב?) · מה קורה עם עובד שנרשם ולא הגיע · הוראות בטיחות מקצין בטיחות.",
"**MOBILITY** :: תקציב חודשי לעובד + מערך הסכמים — רכבת, מטרו, אוטובוס, אופניים (עם מקלחת וחניה בטוחה), ולעיתים רכב לסוף שבוע. מובילות **הולנד ואיטליה**; המוטיב — __איכות סביבה ובריאות__.",
"**קארפול** :: לא הצליח בישראל למרות תמריצים (חניה טובה, פיצוי לקבוצה של ⟨3⟩–⟨4⟩) — «פתאום מקבלים טלפון מהגן, בוא קח את הילד».",
"**GETT / YANGO** :: __אין יחסי עובד-מעביד__ בין בעל המונית לחברה — ולכן הביטוח דורש טיפול מיוחד ושונה. בעיה נוספת: מחויבות נמוכה של הנהגים בשעות ביקוש.",
"**רפורמת התחבורה הציבורית** :: המעסיק נדרש לדעת __היכן מתגורר כל עובד__ — התעריף וההנחה משתנים לפי אזור ואף לפי שכונה."
]},
{h3:"תכנון ובקרה בהסעות"},
{items:[
"**איך גילה שאין תכנון** :: ראה אוטובוסים מגיעים __חצי ריקים__. בתעשייה האווירית (⟨30⟩ אלף עובדים) נמצאו קווים שלא נבחנו כ-⟨20⟩ שנה.",
"**מפעל במשמרות** :: רשימת המשמרות מתקבלת עד __יום חמישי__ לשבוע שאחריו, והתכנון נעשה מחדש — ייתכן אוטובוס בשבוע אחד ומונית בשבוע הבא.",
"**מה מערכת לא עושה** :: היא מחשבת מסלולים אך __אינה מחליטה על גודל הרכב__ — בלי תכנון תשלם על אוטובוס ל-⟨50⟩ ויסעו בו עשרה.",
"**יתרון המערכת במחלוקות** :: מתעדת גם את המתוכנן וגם את המבוצע — מול «הגעתי והאוטובוס לא היה». העובד מקבל רחוב, תחנה ושעה מדויקים.",
"**ריכוז נסיעות מזדמנות** :: הכלל בטבע — ריכוז של __עד שעה__: מי שרצה ב-⟨8:00⟩ ומי שרצה ב-⟨9:00⟩ נוסעים יחד. הוקם מוקד לכל מפעלי הדרום: שני אנשים וטלפון ⟨24/7⟩.",
"**דרישות מרכב ההסעה** :: נקי ומסודר · נהג בלבוש מוגדר · ותק שאינו עולה על ⟨3⟩ שנים · אישור קצין בטיחות — __ועל כל אלה ביקורות בפועל__.",
"**הזמנת מיניבוס והגיע אוטובוס** :: משלמים __על מה שהוזמן__. «הזמנתי טנדר והוא הביא משאית — אני משלם על טנדר».",
"**שעה נוספת למונית** :: עובדים נשארו חצי שעה כדי לזכות במונית ובארוחת ערב; נקבע סף של __שעה נוספת לפחות__. «תמיד בקצוות».",
"**⟨40⟩ אלף המנות בלבנון השנייה** :: נשלחו ⟨40⟩ אלף מנות ליום ל-⟨4,000⟩ חיילים — והם לא אכלו. הכשל היה בלוגיסטיקה הפנימית. __«להציף זה לא תמיד הפתרון».__"
]}

]},

/* ═══════════════════════════════════════════════════════ 4 · ציי רכב */
{name:"ציי רכב", color:"#6b3fa0", sub:"ליסינג · מס · בטיחות", cols:2, blocks:[

{h2:"מס ומעמד הרכב"},
{items:[
"**שווי שימוש** :: החיוב במס על השימוש הפרטי ברכב חברה — כ-⟨2.48%⟩ ממחיר הרכב __החדש לפי מחירון היבואן__, ללא קשר לדגם בפועל. לחשמלי/היברידי — הקלה.",
"**רכב תפעולי** :: לעבודה בלבד · __חייב לחזור בסוף כל יום__ למקום העבודה · אסור בשימוש פרטי __על פי חוק__ · חייב **פוליגון מוגדר** (סלולרי או אחר) המקובל על רשות המסים.",
"**מה חושפת המערכת** :: עובדים המחזירים את הרכב לחברה לפני נסיעה לחו״ל כדי לא לשלם שווי שימוש — המערכת מחוברת למשרד התחבורה ולמערכת הכספים.",
"**הסבת דו״ח** :: הרכב רשום על החברה, ולכן חייב מנגנון להעברת הדו״ח לשם הנוהג. __בלי הסבה הקנס על החברה גבוה מאוד.__",
"**מהקצאה לפי דרגה לתקציב** :: פעם הרכב היה סטטוס «כמו דרגה בצבא». היום — תקציב (קורולה ב-⟨3,000⟩ לחודש) ובחירה מטבלה: לשדרג, להוריד דרגה או __לקחת את הכסף__. סמנכ״ל באמדוקס לקח את הכסף כי היה רוב הזמן בחו״ל.",
"**למה מגבילים סוג וצבע** :: הרכב נושא את שם החברה ו__מייצג אותה — זה חלק מהפרסום__. מכאן ההסתייגות מרכב ספורט דו-דלתי או מצבע בולט. בפולין סמנכ״ל מקבל מרצדס; בישראל באותה דרגה — מאזדה 3."
]},

{h2:"ליסינג — מה לסכם בהסכם"},
{tbl:{head:["סעיף","המקובל"],rows:[
["מדיניות החלפה","⟨3⟩–⟨5⟩ שנים **או** ⟨100,000⟩ ק״מ — המקדים מביניהם (או גם וגם)"],
["זמן אספקה","⟨14⟩ יום אם קיים במלאי בארץ; אחרת — לו״ז צפוי **ורכב גישור באותה רמת גימור**"],
["החזרה מוקדמת","עד ⟨15%⟩ מהצי ללא קנס בתקופה של ⟨3⟩ שנים; מעבר לכך — תשלום (רכב שהוחזר אחרי שנה מתוך שלוש ≈ חודשיים)"],
["השבה לקדמות","התחשבנות על מצב הרכב. אפשר סכום קבוע ללא בדיקה — ⟨100⟩–⟨400⟩ דולר לרכב, נתון למו״מ"],
["בנק ק״מ","מכסה **לכלל הצי** — אחד יעשה ⟨10,000⟩ ואחר ⟨40,000⟩, וההתחשבנות על הממוצע, אחת לשנה או לשלוש"],
["בנק צמיגים","ניהול מצרפי; אילו סוגים מותרים וכמה החלפות ב-⟨4⟩ שנים ללא חיוב"],
["מוקד שירות","מענה תוך ⟨10⟩ שניות, ו**הבעיה נפתרת** תוך שעתיים — לא רק שמישהו מגיע"],
["מוסכים","**מוסכי שירות מורשים בלבד** — לא «מוסכי שמש» שמחליפים שמן בחניון"]
]}},
{warn:"**המחיר המוצג אינו העלות:** «אתה רואה ⟨2,500⟩, ובסוף שילמת על חריגת ק״מ, חריגת צמיגים והשבה לקדמות — שזה עונש». ההמלצה: לרכוש גם **ביטול השתתפות עצמית** — «המוסך עושה את כל התרגילים, גם על השריטה הקטנה ביותר»."},
{items:[
"**מוקד שירות — למה ההבחנה** :: אחרת הגורר מגיע תוך שעתיים, לא מצליח, קורא למישהו אחר, והנהג תקוע. לכן __הגורר מגיע עם רכב חלופי__: תיקן — תיקן; לא — לוקח את הרכב ומשאיר את החלופי.",
"**שטיפות** :: בבדיקה התברר שההסכם כלל שטיפה __שבועית__ בעוד השימוש בפועל היה כפעם וחצי בחודש. בהסכם הבא — אחת לשבועיים. «בסוף הכל מתבטא במחיר».",
"**פריפריה** :: שם בעיות הזמינות. הפתרון: לדרוש מהספק __להציב כלי רכב חלופיים בפריסה__.",
"**«הכנה לטסט»** :: רשימת החלפות מנופחת. הפתרון: «אל תחליף כלום — תגיד לי מה צריך, __ותשמור את החלק שהחלפתם__». פתאום הרשימה מתקצרת.",
"**אבחון מרחוק** :: המוסך מתחבר לרכב לפי המספר הסידורי שעל השמשה, מאבחן ואף משתלט על המערכות. «אתה פותח מכסה מנוע ולא יודע להסתכל על זה».",
"**רפורמת החלפים** :: נועדה להוזיל חלפים בכ-⟨40%⟩ באמצעות חלפים מקבילים — __טרם אושרה__."
]},

{h2:"שלוש שיטות ההפעלה"},
{items:[
"**⟨1⟩ בעלות** :: רכב שנרכש על ידי החברה. __מחייב לבנות בעצמך את כל המערך שהליסינג נותן__ — מוסכים, צמיגים, פחחות, רישוי, דלק, בוחנים, נהגים ומנגנון מכירה מבוקר. «יש כאלה שעושים חשבון ׳נחסוך כסף׳ ולא מבינים שהמערך גם עולה כסף».",
"**⟨2⟩ שכירות / ליסינג תפעולי** :: בתפעול מלא או חלקי. המקובל בישראל — כ-⟨220,000⟩ כלי רכב (לעומת כ-⟨280,000⟩ לפני הקורונה).",
"**⟨3⟩ חברות הפעלה חיצוניות** :: רכב בבעלות המופעל בידי חברה חיצונית. מקובל מאוד באירופה ובדרום אמריקה.",
"**איפה הרווח של הליסינג** :: __בהפרש בין עלות הרכישה בהנחה למחיר המכירה בסוף התקופה__ — לא בתחזוקה (שם ⟨1%⟩–⟨2%⟩). לכן מדיניות ההחלפה ומצב הרכב בהחזרה כה משמעותיים."
]},

{h2:"בטיחות ורגולציה"},
{items:[
"**הדרכת נוהגים** :: פעילה, __לפחות אחת לשנתיים__, על ידי מנהל צי הרכב וקצין בטיחות. + מעקב מעורבות בתאונות (באשמה ולא באשמה) ודיווח שנתי למשרד התחבורה. אפשרי בלומדה.",
"**מדד הבטיחות** :: כמות מעורבים בתאונות באשמה/לא באשמה __ביחס לנסועה__ (מספר כלי רכב וק״מ) — מול שנה קודמת ומול השוואה כללית.",
"**מנהל צי רכב** :: כ-⟨1⟩ לכל ⟨100⟩ כלי רכב; חלקם גם קציני בטיחות.",
"**קציני בטיחות** :: אחד בכל מקרה, ועוד אחד לכל ⟨300⟩ כלי רכב — __בסמכות ראש אגף הבטיחות בתעבורה, «אין מפתח כתוב»__. הפתרון של המרצה: להכניס את החובה לספק אותם __להסכם עם חברות הליסינג__.",
"**תדירות בדיקות** :: משאיות אחת לחודש · פרטיים אחת לשלושה חודשים. בצי של ⟨2,500⟩ כלי רכב — בדיקות מדי יום.",
"**תקנה 6** :: חובה שהרכב יישא בחלקו האחורי __פרטי התקשרות לתלונות («כוכבית ⟨4⟩ ספרות»)__ — עם מוקד, ניהול ורישום טיפול ודיווח למשרד התחבורה.",
"**דיווחים שנתיים** :: פניות המוקד (תקנה 6) + תאונות. שיעור נמוך __מדי__ נבדק גם הוא: «אולי לא אספת, אולי לא דיווחת את האמת».",
"**החשיפה של המנהל** :: __פלילית__. ההגנה: להראות שפעלת לפי ההוראות והתקנות — כלומר כ**מנהל סביר**. מכאן חשיבות ההדרכות ותיעודן.",
"**ביטוח הצי** :: בשופרסל מצא שהפוליסה יקרה __פי עשרה מהנזקים בפועל__; לכן רוב חברות הצי מחזיקות **ביטוח חובה בלבד**. הוא הגיע מהצבא, שבו אין ביטוח, ושאל את השאלה שאיש לא שאל."
]},
{h3:"עבודה מול הספק"},
{items:[
"**סקר** :: קצר וממוקד, __נגזר מסעיפי ה-SLA__. «סקר עם ⟨40⟩ שאלות — בפעם הבאה לא יענו לך». התוצאות מופצות ומתורגמות לפעילות מתקנת.",
"**מפגשי ספק** :: אחת לרבעון, __עם המשתמשים שהעלו טענות ולא רק ההנהלה__. «אל תחשבו שרק לכם יש טענות» — הדיון נסגר ונבדק שוב ברבעון הבא."
]}

]}

]};

/* ---- עזרי בנייה ---- */
function E(t,a,h){var e=document.createElement(t);for(var k in a)e.setAttribute(k,a[k]);
  if(h!=null)e.innerHTML=h;return e;}

/* טקסט עשיר: **מודגש** ⟨מספר⟩ «ציטוט» __הדגשה__ */
function rt(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/__(.+?)__/g,'<em>$1</em>')
    .replace(/«(.+?)»/g,'<span class="q">"$1"</span>')
    .replace(/⟨(.+?)⟩/g,'<span class="n">$1</span>');
}

/* ---- הופך בלוק לאלמנט ---- */
function block(b){
  if(b.h2) return E('h2',{},rt(b.h2));
  if(b.h3) return E('h3',{},rt(b.h3));
  if(b.warn) return E('div',{'class':'warn'},rt(b.warn));
  if(b.tbl){
    var t=E('table'),th=E('tr');
    (b.tbl.head||[]).forEach(function(c){th.appendChild(E('th',{},rt(c)));});
    if(b.tbl.head)t.appendChild(th);
    b.tbl.rows.forEach(function(r){
      var tr=E('tr');
      r.forEach(function(c,i){tr.appendChild(E('td',{'class':i===0?'k':''},rt(c)));});
      t.appendChild(tr);
    });
    return t;
  }
  var dl=E('dl');
  b.items.forEach(function(it){
    var d=E('div'), p=String(it).split(' :: ');
    d.appendChild(E('dt',{},rt(p[0])));
    d.appendChild(E('dd',{},rt(p.slice(1).join(' :: '))));
    dl.appendChild(d);
  });
  return dl;
}

/* ---- דפדוף: ממלא עמוד עד שהוא מתמלא, ואז פותח חדש ---- */
var out=document.getElementById('out'), pages=[];
function newPage(sec,cont){
  var p=E('div',{'class':'pg','style':'--c:'+sec.color});
  p.appendChild(E('div',{'class':'hd'},
    '<b>'+sec.name+'</b><span>'+(cont?'המשך':(sec.sub||''))+'</span>'));
  var tabTop = 14 + sec.idx*(70/Math.max(1,DATA.sections.length-1));
  p.appendChild(E('div',{'class':'tab',
    'style':'top:'+tabTop+'mm;height:34mm'},sec.name));
  var bd=E('div',{'class':'body'+(sec.cols===2?' c2':'')});
  p.appendChild(bd); p.appendChild(E('div',{'class':'pgn'}));
  out.appendChild(p); pages.push(p);
  return bd;
}
function fits(pg){return pg.scrollHeight<=pg.clientHeight+1;}

DATA.sections.forEach(function(sec,si){
  sec.idx=si;
  var bd=newPage(sec,false), pg=bd.parentNode;
  sec.blocks.forEach(function(b){
    var el=block(b);
    bd.appendChild(el);
    if(!fits(pg)){
      bd.removeChild(el);
      /* כותרת בסוף עמוד — מעבירים אותה יחד עם מה שבא אחריה */
      var trail=[];
      while(bd.lastChild && /^H[23]$/.test(bd.lastChild.tagName)){
        trail.unshift(bd.lastChild); bd.removeChild(bd.lastChild);
      }
      bd=newPage(sec,true); pg=bd.parentNode;
      trail.forEach(function(t){bd.appendChild(t);});
      bd.appendChild(el);
    }
  });
});

/* ---- מספור, שער ומפתח ---- */
var first={};
pages.forEach(function(p,i){
  p.querySelector('.pgn').innerHTML='עמ׳ <b>'+(i+2)+'</b>';
  var nm=p.querySelector('.hd b').textContent;
  if(first[nm]===undefined)first[nm]=i+2;
});

var cover=E('div',{'class':'pg'});
cover.innerHTML='<div class="cover"><h1>ניהול תשתיות גלובליות</h1>'+
  '<div class="sub">חומר פתוח למבחן · 865562302 · מר אלי אהרוני</div></div>';
var toc=E('div',{'class':'toc'});
DATA.sections.forEach(function(s){
  var a=E('a',{href:'#'},'<span class="sw" style="background:'+s.color+'"></span>'+
    '<span class="nm">'+s.name+'</span><span class="dots"></span>'+
    '<span class="pn">'+first[s.name]+'</span>');
  toc.appendChild(a);
});
cover.querySelector('.cover').appendChild(toc);
cover.querySelector('.cover').appendChild(E('div',{'class':'tip'},
  '<b>איך מנווטים כאן מהר</b>'+rt(
  'הלשוניות בשוליים השמאליים יורדות מדרגה-מדרגה לפי סדר הנושאים — בערימת דפים '+
  'רואים אותן מהצד ומדפדפים ישר לנושא, בלי לקרוא כותרות. '+
  'בסוף החוברת **מפתח מונחים לפי א״ב** עם מספרי עמודים, ולפניו **טבלת כל המספרים**. '+
  '⟨מספרים⟩ מודגשים בכחול · __הדגשה צהובה__ = נקודה שהמרצה חזר עליה · '+
  '«מירכאות אלכסוניות» = ציטוט מהכיתה.')));
out.insertBefore(cover,out.firstChild);
cover.appendChild(E('div',{'class':'pgn'},'עמ׳ <b>1</b>'));

/* מפתח א״ב — נבנה מהמונחים שסומנו, כך שמספרי העמודים תמיד נכונים */
var terms={};
pages.forEach(function(p,i){
  p.querySelectorAll('dt').forEach(function(d){
    var t=d.textContent.replace(/^▪\s*/,'').replace(/\s*—\s*$/,'').trim();
    if(t.length<2||t.length>44)return;
    (terms[t]=terms[t]||[]).push(i+2);
  });
});
var keys=Object.keys(terms).sort(function(a,b){return a.localeCompare(b,'he');});
var ixSec={name:'מפתח',color:'#3d4650',sub:'לפי א״ב',idx:DATA.sections.length-1};
var bd=newPage(ixSec,false), pg=bd.parentNode, idx=E('div',{'class':'idx'});
bd.appendChild(idx);
keys.forEach(function(k){
  var u=terms[k].filter(function(v,i,a){return a.indexOf(v)===i;});
  idx.appendChild(E('div',{},'<span class="t">'+k+'</span> <span class="p">'+u.join(', ')+'</span>'));
});
pages.forEach(function(p,i){var e=p.querySelector('.pgn');if(e)e.innerHTML='עמ׳ <b>'+(i+2)+'</b>';});

/* ---- בקרת גלישה ---- */
var over=0;
document.querySelectorAll('.pg').forEach(function(p){
  if(p.scrollHeight>p.clientHeight+1){p.classList.add('over');over++;}
});
document.getElementById('stat').textContent=
  document.querySelectorAll('.pg').length+' עמודים'+(over?' · '+over+' בגלישה':' · תקין');
</script>
</body>
