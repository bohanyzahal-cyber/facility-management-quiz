/* ===================== 12. מושגים (Glossary) ===================== */
{t:"מושגים",s:"מושגים",q:"לפי רשימת המושגים באתר הקורס, מהי ההגדרה של Facility Management?",o:["Maintenance of the buildings, grounds and technical systems of an organization, in line with manufacturer instructions and local regulation, including preventive and breakdown maintenance planning and full documentation of all works performed","Integration of processes within an organization to maintain and develop the agreed services that support and improve the effectiveness of its primary processes and activities","Management of the real estate portfolio of an organization, including acquisition, leasing, valuation and disposal of properties","Outsourcing of all non-core support services to external providers under a single integrated long-term agreement"],c:1,e:"ההגדרה ברשימת המושגים: שילוב תהליכים בתוך הארגון לשמירה ולפיתוח של השירותים המוסכמים, התומכים ומשפרים את האפקטיביות של התהליכים והפעילויות העיקריים שלו."},
{t:"מושגים",s:"מושגים",q:"מהו BASELINE?",o:["היעד השנתי שנקבע לשיפור בכל אחד מהמדדים, שצריך להיות אתגרי אך בר-השגה","אוסף מדדים הקובע נקודת התחלה או מצב קיים, המשמש להשוואה מול שיפורים וחיסכון עתידיים — כאשר יחידות המדידה חייבות להיות מוגדרות כתקפות לפני איסוף הנתונים","השוואה מול שיטות העבודה הטובות בענף, לצורך שיפור ביצועים ואיכות בארגון, ולזהות פערים מול המתחרים בענף ומול הסטנדרטים המקובלים בשוק","רמת השירות המינימלית הנדרשת מהספק, כפי שהוגדרה ב-SLA ובמפרט הדרישות"],c:1,e:"BASELINE = אוסף מדדים הקובע נקודת התחלה/מצב קיים להשוואה מול שיפורים וחיסכון עתידיים. חשוב: יש להגדיר את צורות המדידה ויחידותיה כתקפות לפני איסוף הנתונים. (השוואה מול best practices בענף היא BENCHMARKING.)"},
{t:"מושגים",s:"מושגים",q:"מהו BENCHMARKING?",o:["קביעת נקודת מוצא ומצב קיים למדידה, לפני תחילת תהליך שיפור או התייעלות","נוהג ניהולי של השוואה מול שיטות העבודה הטובות בענף (industry best practices) לשיפור ביצועים ואיכות","מדידת שביעות רצון הלקוחות באמצעות סקרים תקופתיים ומספונים במוקדי השירות, ואשר תוצאותיהם מפורסמים לעובדים יחד עם תוכנית מתקנת מוסכמת","הגדרת רמת השירות הנדרשת בהסכם, לרבות המדדים, היעדים ושיטות המדידה"],c:1,e:"BENCHMARKING = השוואה מול best practices בענף כדי לשפר ביצועים ואיכות. יש להבחין בינו לבין BASELINE, שהוא נקודת ההתחלה למדידה."},
{t:"מושגים",s:"מושגים",q:"מהו BIM?",o:["Building Insurance Management — ניהול מערך הביטוח של מבני החברה ותכולתם","Building Information Modeling — מודל תכנון וסימולציה תלת-ממדי דיגיטלי, בעל פוטנציאל רב לשיפור תהליכי התכנון והעיצוב ולספק חומר יקר ערך לתפעול ולאחזקה בהמשך","Basic Infrastructure Maintenance — תוכנית האחזקה הבסיסית למערכות התשתית באתר","Business Intelligence Model — מודל לניתוח נתונים עסקיים ולהפקת דו\"חות ניהוליים, used mainly to produce management reports and to identify trends across sites and business units"],c:1,e:"BIM = Building Information Modeling. מודל דיגיטלי תלת-ממדי לתכנון וסימולציה, בעל פוטנציאל רב לשיפור תהליכי התכנון והעיצוב, וללכידת מידע שיהיה יקר ערך לתפעול ולאחזקה בהמשך."},
{t:"מושגים",s:"מושגים",q:"מהו LCC?",o:["Low Cost Contract — חוזה בעלות נמוכה, שבו הספק מתחייב למחיר הזול ביותר בשוק","Life Cycle Cost — תהליך קביעת כל העלויות (בערך נוכחי) הכרוכות בתכנון, בעיצוב, בבנייה, בתפעול ובאחזקה של מבנה לאורך זמן","Local Compliance Code — קוד הציות המקומי לדרישות רגולטוריות בכל מדינה ואזור","Labour Cost Calculation — שיטת חישוב עלות העבודה לפי מקצועות ולפי שעות בפועל, which is applied when comparing outsourcing alternatives against in-house service provision"],c:1,e:"LCC = Life Cycle Cost. תהליך קביעת כל העלויות, בערך נוכחי, הכרוכות בתכנון, בעיצוב, בבנייה, בתפעול ובאחזקה של מבנה לאורך זמן. כלל בסיסי: כל הניתוחים הכלכליים צריכים להתבסס על עלויות מחזור חיים."},
{t:"מושגים",s:"מושגים",q:"מהו ROI?",o:["Rate Of Inflation — שיעור האינפלציה, המשמש למנגנוני הצמדה בחוזים ארוכי טווח, ואשר משמש להצמדת מחירי ההסכם לאורך כל תקופת ההתקשרות עם הספק","Return On Investment — סך הרווח מחולק בסך הסכום שהושקע במקור כדי להשיג את הרווח","Risk Of Investment — מדד לרמת הסיכון הכרוכה בהשקעה מסוימת ולהסתברות לכשל","Return On Income — שיעור התשואה המחושב ביחס להכנסות ולא ביחס להון המושקע"],c:1,e:"ROI = Return On Investment. סך הרווח מחולק בסך הסכום שהושקע במקור. בקורס צוין שהחזר השקעה מקובל הוא 5-8 שנים לכל היותר."},
{t:"מושגים",s:"מושגים",q:"מהו NPV?",o:["Net Property Value — שווי הנכס נטו, לאחר ניכוי שעבודים, התחייבויות ופחת שנצבר","Net Present Value — ערך נוכחי של תזרימי מזומנים עתידיים בניכוי ההשקעה נטו","New Project Valuation — שיטה להערכת כדאיותו הכלכלית של פרויקט חדש בשלב הייזום","Nominal Price Variation — מנגנון לחישוב שינוי המחיר הנומינלי לאורך תקופת ההסכם"],c:1,e:"NPV = NET PRESENT VALUE — ערך נוכחי של תזרימי מזומנים עתידיים בניכוי ההשקעה נטו. כלי מרכזי בהערכת כדאיות השקעות לצד ROI ו-LCC."},
{t:"מושגים",s:"מושגים",q:"מהו Co-sourcing (Hybrid Service / Bundling Service)?",o:["מיקור חוץ מלא של כל שירותי התשתיות לחברת IFM אחת, האחראית לניהול ולביצוע","שילוב של insourcing ו-outsourcing","העברת שירותים למדינה אחרת שבה עלות כוח האדם נמוכה יותר (offshoring)","שיתוף פעולה בין שתי חברות מתחרות לצורך רכש משותף וניצול יתרון לגודל"],c:1,e:"Co-sourcing / Hybrid Service / Bundling Service = שילוב בין insourcing (עובדי חברה) ל-outsourcing (מיקור חוץ). בשיעור 1 זה מוצג כמודל BUNDLER/HYBRID — התפיסה המקובלת ביותר בעשור האחרון."},
{t:"מושגים",s:"מושגים",q:"מהו Helpdesk לפי רשימת המושגים?",o:["מחלקת שירות הלקוחות של הספק, המטפלת בפניות ובתלונות של מקבלי השירות","נקודת מגע לבקשת מידע ולמענה לצורך הקשור בתשתיות — לא חייבת להיות מקום פיזי, אך יכולה להיות","מוקד החירום של החברה, הפועל 24/7 ומרכז את הטיפול באירועים חריגים ובתקלות, ואשר מפעיל צוותי התערבות ומדווח לגורמי הביטחון לפי הצורך","מערכת ממוחשבת לניהול תקלות והפקת פקודות עבודה למערך האחזקה באתר"],c:1,e:"Helpdesk = point of contact for requesting information and in response to a facility related need. ההדגשה: \"it does not have to be a physical location, but can\" — לא חייב להיות מקום פיזי."},
{t:"מושגים",s:"מושגים",q:"מהו SOW?",o:["Standard Operating Workflow — תהליך העבודה התקני המוגדר לכל פעילות בארגון","Scope Of Work — תכולת העבודה","Service Order Warrant — כתב הזמנת שירות המחייב את הספק לבצע את העבודה","Statement Of Warranty — הצהרת האחריות של היצרן או הספק על המוצר שסופק"],c:1,e:"SOW = Scope Of Work — תכולת העבודה. מרכיב הכרחי בכל הסכם, לצד SLA (רמת שירות) ומנגנוני מדידה."},
{t:"מושגים",s:"מושגים",q:"מהו Space Management?",o:["ניהול מלאי הציוד, הריהוט וחלקי החילוף המאוחסנים במחסני החברה באתרים השונים","התהליך שבו נעשה השימוש הטוב ביותר בשטח הזמין בהתאמה לצרכים","תכנון ובניית שטחים חדשים בהתאם לצפי הגידול בכוח האדם ובפעילות העסקית","ניהול חוזי השכירות והחכירה של נכסי החברה מול בעלי הנכסים והרשויות"],c:1,e:"Space management = process by which best use is made of available space matched to needs — התאמת מיטבית של השטח הזמין לצרכים. מדדים נלווים: מדד אכלוס/צפיפות, מ\"ר לעובד."},
{t:"מושגים",s:"מושגים",q:"מהו Cost Center?",o:["מרכז רווח בארגון, שאליו נזקפות ההכנסות וההוצאות של יחידה עסקית מוגדרת","יחידה ארגונית שבה נעשה שימוש במימון תקציבי לקיום הפעילות","מחלקת הכספים של החברה, האחראית לרישום החשבונאי ולבקרה התקציבית","סעיף ההוצאה הגדול ביותר בתקציב, שאליו מופנית עיקר תשומת הלב הניהולית"],c:1,e:"Cost center = יחידה ארגונית שבה נעשה שימוש במימון תקציבי לקיום הפעילות. בשיעור הפיננסי הוסבר שנדרש לבנות תשתית רישום נכונה ב-cost centers, בדרך כלל 3-5 לפי מדינה."},
{t:"מושגים",s:"מושגים",q:"מהו Depreciation לפי רשימת המושגים, וכמה שיטות פחת קיימות?",o:["ההפסד החשבונאי הנוצר ממכירת נכס מתחת לערכו בספרים; קיימות שתי שיטות חישוב, ואשר מחושב לפי ההפרש בין מחיר המכירה לערך הרשום בספרי החברה","הוצאה משוערת המבטאת את ירידת ערך הנכס עם חלוף הזמן בחיים הפרודוקטיביים שלו; ארבע שיטות פחת","עלות התיקון והשיפוץ הנדרשת להשבת הנכס למצבו התקין; קיימות שלוש שיטות","המס המוטל על החזקת נכס לאורך זמן, המחושב לפי שיטה אחת הקבועה בחוק"],c:1,e:"Depreciation = an estimated expense that an asset's value diminishes as time passes in its productive life. ברשימת המושגים מצוין במפורש: \"there are four depreciations methods\" — ארבע שיטות פחת."},
{t:"מושגים",s:"מושגים",q:"מהו Base level services?",o:["רמת השירות המינימלית שהספק מתחייב לה בהסכם, שמתחתיה מופעל מנגנון קנס","בתפעול מתקנים — אותם שירותים הנדרשים כדי לתמוך באכלוס המתקן","שירותי הליבה של העסק, המהווים את הפעילות המרכזית שלו ואת מקור הכנסתו","השירותים הזולים ביותר בסל השירותים, הניתנים לכל העובדים ללא תשלום נוסף"],c:1,e:"Base level services = in facilities operations, those services required to support occupancy of a facility — השירותים הבסיסיים הנדרשים לתמיכה באכלוס המתקן."},
{t:"מושגים",s:"מושגים",q:"מהו Access control?",o:["מערכת בקרת גישה למערכות המידע והנתונים של הארגון, המבוססת על הרשאות","נוהלי ואמצעי הגנה ביטחוניים פיזיים סטנדרטיים — כגון מחסומים ותאורה — המשמשים לשליטה בגישה למתקן","נוהל אישור ההרשאות לביצוע רכש והתחייבות כספית לפי מדרגי הסמכות בחברה","בקרת כניסה של סחורות וחומרי גלם למחסן, כולל בדיקת התאמה לתעודת המשלוח, ואשר מתועדת בתעודת משלוח חתומה ובמערכת ניהול המלאי של האתר"],c:1,e:"Access control = physical security protective standard procedures and devices such as barriers and light used to control access to a facility — נוהלי ואמצעי הגנה פיזיים לשליטה בגישה למתקן."},
{t:"מושגים",s:"מושגים",q:"מהם CORE BUSINESS ו-NON CORE BUSINESS לפי רשימת המושגים?",o:["CORE — הפעילות הרווחית של הארגון; NON CORE — הפעילות המפסידה שיש לצמצמה","CORE — אסטרטגיה עסקית, יעדים, תוכנית ותהליכים ראשוניים; NON CORE — פעילויות עסקיות ראשוניות, שירותי תמיכה, מרחב בר-קיימא ותשתית","CORE — הפעילות המתבצעת בישראל; NON CORE — הפעילות המתבצעת באתרים בחו\"ל","CORE — פעילות המבוצעת בעובדי החברה; NON CORE — פעילות המבוצעת בעובדי קבלן, בהתאם לאופן ההעסקה שנקבע במדיניות משאבי האנוש של הארגון"],c:1,e:"ברשימת המושגים: CORE BUSINESS = BUSINESS STRATEGY, OBJECTIVES, PLAN AND PRIMARY PROCESSES. NON CORE BUSINESS = BUSINESS PRIMARY ACTIVITIES, SUPPORT SERVICES, SUSTAINABLE SPACE, INFRASTRUCTURE."},
{t:"מושגים",s:"מושגים",q:"מהו ILS?",o:["International Logistics Standard — תקן בינלאומי לניהול שרשרת ההספקה וההובלה","Integrated Logistics Support — תמיכה לוגיסטית משולבת","Internal Loss Statement — דו\"ח פנימי המרכז הפסדים ונזקים בתקופת הדיווח","Infrastructure Life Support — מערך התמיכה בתשתיות קריטיות בעת אירוע חירום"],c:1,e:"ILS = INTEGRATED LOGISTICS SUPPORT. בשיעור האחזקה הוסבר שהמשמעות היא שילוב כלל הגורמים האפשריים כבר משלב הייזום — ובעיקר המשתמש והעסק המפעיל — כדי לגשר על האינטרסים המנוגדים לאורך מחזור החיים."},
{t:"מושגים",s:"מושגים",q:"מהו OSHA?",o:["Organization for Safety and Health Advancement — ארגון בינלאומי לקידום בטיחות","Occupational Safety and Health Administration של משרד העבודה האמריקאי","Operational Standards for Hazard Assessment — תקני הערכת סיכונים תפעוליים","Office of Safety and Hygiene Authority — רשות הבטיחות וההיגיינה התעסוקתית"],c:1,e:"OSHA = Occupational Safety and Health Administration of U.S. Department of Labor. בשיעור ציי הרכב הוזכר \"מדד OSHA\" בהקשר של דיווח בטיחות שנתי."},
{t:"מושגים",s:"מושגים",q:"מהו PPE?",o:["Preventive Planned Engineering — הנדסה מונעת מתוכננת לתכנון מערך האחזקה","Personal Protective Equipment — ציוד מגן אישי","Public Private Enterprise — מיזם משותף בין המגזר הציבורי למגזר הפרטי","Performance Planning Evaluation — תהליך תכנון והערכת ביצועים של עובדים"],c:1,e:"PPE = PERSONAL PROTECTIVE EQUIPMENT — ציוד מגן אישי. נמנה ברשימת השירותים תחת SOFT SERVICES, ומהווה חלק ממערך הבטיחות (חובת החברה לנקוט בכל האמצעים להבטחת בטיחות העובדים)."},
{t:"מושגים",s:"מושגים",q:"מהו GMP?",o:["Global Management Policy — מדיניות הניהול הגלובלית המחייבת את כלל אתרי החברה","Good Manufacturing Processes — תהליכי ייצור נאותים","General Maintenance Program — תוכנית האחזקה הכללית של מערכות ומבנים באתר","Guaranteed Minimum Price — מחיר מינימום מובטח לספק בהתקשרות ארוכת טווח"],c:1,e:"GMP = Good Manufacturing Processes. בקורס משמש להגדרת אזורי ליבה תחת רגולציה מחייבת — לעומת NON-GMP באזורים שאינם מחייבים באותה רמה."},
{t:"מושגים",s:"מושגים",q:"מהו IFM לפי רשימת המושגים?",o:["International Facility Management — ניהול תשתיות ברמה בינלאומית בכל אתרי החברה, which is coordinated centrally by a global FM headquarters function","Integrated Facility Management — מערך של שירותי תשתיות המקיימים אינטראקציה זה עם זה","Internal Facility Maintenance — אחזקה פנימית המבוצעת על ידי עובדי החברה בלבד","Industrial Facility Model — מודל תפעולי המותאם לאתרי ייצור ולמפעלים תעשייתיים"],c:1,e:"IFM = integrated facility management — set of facility services that interact with each other. בשיעור 1 זו אחת משלוש צורות ההפעלה: אינטגרציה מלאה על ידי גורם חיצוני."},

/* ===================== 13. ביבליוגרפיה ===================== */
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Cotts, מהי ההגדרה הנפוצה של facility management?",o:["ניהול הנכסים והמבנים של הארגון לאורך מחזור החיים, מרכישה ועד גריטה או מכירה, לרבות תכנון האחזקה, ניהול החוזים ומדידת רמת השירות בכל אתר","\"הפרקטיקה של תיאום מקום העבודה הפיזי עם האנשים והעבודה של הארגון; משלבת עקרונות של מנהל עסקים, אדריכלות ומדעי ההתנהגות וההנדסה\"","אחזקה מונעת ומזדמנת של מערכות המבנה, לפי הוראות היצרן והדרישות הרגולטוריות","ניהול חוזי השירותים מול ספקים חיצוניים, לרבות מדידת ביצועים ו-benchmarking"],c:1,e:"Cotts: \"the practice of coordinating the physical workplace with the people and work of the organization; integrates the principles of business administration, architecture, and the behavioral and engineering sciences\". מפושט: שילוב ה-people עם ה-purpose (work) וה-place (facilities) — שלוש טבעות משתלבות."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Cotts, מהן שלוש \"הטבעות המשתלבות\" שמגדירות את מהות ה-FM?",o:["Cost, Quality, Time — שלושת האילוצים הקלאסיים של ניהול פרויקטים ותפעול","Purpose (work), Place (facilities), People — ששטח החפיפה ביניהן מייצג את האופי האינטגרטיבי של ניהול התשתיות","Plan, Do, Check — שלושת שלבי מעגל השיפור המתמיד המיושם בניהול איכות","Strategy, Structure, Systems — שלושת מרכיבי המודל הארגוני של ניהול חברות, three elements that together define the organizational model of a company"],c:1,e:"התפיסה שפותחה על ידי ה-Facility Management Institute: שלוש טבעות משתלבות — purpose (העבודה), place (המתקנים) ו-people (האנשים) — ששטח החפיפה המשותף מייצג את האופי האינטגרטיבי של ניהול התשתיות."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"מתי ואיפה נוסד ה-Facility Management Institute, ואיזה ארגון צמח ממנו?",o:["1985 בשיקגו; ממנו צמח מכון BOMI להסמכת מנהלי נכסים ומבנים מסחריים","1979 באן ארבור, מישיגן; בסמינר מוקדם שלו הקימו כ-40 מנהלי תשתיות את NFMA, שהפך מאוחר יותר ל-IFMA","1990 בניו יורק; ממנו צמח ארגון APPA של מנהלי התשתיות במוסדות ההשכלה הגבוהה, ואשר אליו הצטרפו לאחר מכן ארגונים נוספים מארה\"ב ומקנדה","1975 בבוסטון; ממנו צמח AIPE, שלימים שינה את שמו ל-AFE (הנדסת מתקנים)"],c:1,e:"FMI נוסד ב-1979 באן ארבור, מישיגן. בסמינר מוקדם שלו כ-40 מנהלי תשתיות ציבוריים ותאגידיים ייסדו את NFMA (National Facility Management Association) ב-1980; בעקבות התעניינות קנדית הוא הפך ל-IFMA (International)."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי סקר IFMA שהוצג אצל Cotts, כיצד ראו מנהלים בכירים את התשתיות?",o:["רובם המכריע ראו בהן יתרון תחרותי מובהק ומשאב אסטרטגי לקידום מטרות החברה, ולכן הקצו לתחום תקציבים גדולים ומשאבי ניהול בכירים בארגון","60% ראו בהן \"עלות של עשיית עסקים המאפשרת לארגון לתפקד\", ו-37% ראו בהן \"משאב שיכול לספק יתרון תחרותי\"","כל המנהלים שנשאלו ראו בתשתיות מרכז עלות בלבד, שיש לצמצמו ככל האפשר","הנושא לא נבדק בסקר, שהתמקד בכישורים הנדרשים ממנהלי התשתיות בלבד"],c:1,e:"בסקר של 252 מנהלים בכירים: 60% ראו בתשתיות \"a cost of doing business that enables our organization to function\", ו-37% ראו בהן \"a resource that can provide a competitive edge\". תשעה מכל עשרה סברו שכישורי ניהול פיננסי וניהול פרויקטים הם החשובים ביותר במנהל התשתיות."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Cotts, מהו מקומן של התשתיות בהוצאות החברה?",o:["מרכיב שולי בהוצאות התפעול, שאינו מצדיק תשומת לב ניהולית ברמת ההנהלה הבכירה, ואשר נכלל בדרך כלל בסעיף הנהלה וכלליות בדו\"חות הכספיים","אחרי השכר (payroll), התשתיות הן בדרך כלל המרכיב הגדול ביותר בהוצאה האדמיניסטרטיבית של החברה","המרכיב הגדול ביותר בהוצאות החברה, עוד לפני עלויות השכר וכוח האדם","מרכיב שאינו נמדד בנפרד בדו\"חות הכספיים אלא נכלל תחת הנהלה וכלליות"],c:1,e:"Cotts: \"After payroll, facilities are usually the greatest component of a company's administrative expense\". לצד זאת: מחלקות תשתיות חסכו או מנעו עלויות בטווח של 30%-35% ללא פגיעה בשירותים, באמצעות תכנון נכון, ניהול חכירות וניהול אנרגיה."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"אילו מבין הבאים נכללים ב\"נושאים המרכזיים של ניהול תשתיות\" (Major Themes) אצל Cotts?",o:["עלות הבעלות ותמחור מחזור החיים בלבד — שני הנושאים הכלכליים המרכזיים בתחום, שהם שני הצירים שלאורכם נמדדת הכדאיות הכלכלית של כל השקעה בתשתיות","עלות הבעלות, תמחור מחזור חיים, אינטגרציה של שירותים, תכנון לתפעול ולאחזקה, אחריות מואצלת, עלות-תועלת, איכות חיים, יתירות וגמישות, תשתיות כנכס, FM כפונקציה עסקית ו-FM כרצף","איכות החיים של העובדים ואיכות הסביבה בלבד — שני הנושאים החברתיים בתחום","אחריות מואצלת ותכנון לתפעול בלבד — שני העקרונות הארגוניים המנחים בתחום"],c:1,e:"Cotts מונה שורה של נושאים מרכזים: cost of ownership; life-cycle costing; integration of services; design for operations and maintenance; delegated responsibility; cost-effectiveness; efficiency improvement; quality of life; integration of elements; redundancy and flexibility; facilities as assets; FM as a business function; FM as a continuum; service."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Cotts, מהי המשמעות של \"FM as a continuum\"?",o:["שירותי ניהול התשתיות ניתנים ברציפות 24 שעות ביממה, בכל ימות השבוע והשנה","ניהול תשתיות הוא רצף — מתכנון ועד גריטה — ולא סדרה של פרויקטים בדידים","האחריות של מנהל התשתיות ממשיכה גם לאחר מכירת הנכס או העברתו לבעלים אחר","צוות ניהול התשתיות מתחלף ברצף ובחפיפה מסודרת, ללא הפסקה בין המשמרות"],c:1,e:"\"FM as a continuum. FM is a continuum, from planning through disposal. It is not a series of discrete projects\" — ניהול התשתיות הוא רצף לאורך כל מחזור החיים, ולא אוסף פרויקטים נפרדים."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Cotts, מי מגדיר מהו שירות טוב?",o:["מנהל התשתיות, על סמך ניסיונו המקצועי והיכרותו עם צורכי הארגון והמשתמשים, ובהתבסס על מדדי ה-SLA וה-KPI שנקבעו בהסכם מול הספקים","הלקוח — והלקוח בלבד; באחריות מנהל התשתיות לברר כיצד הלקוח מדרג את שירותיו","הספק שנותן את השירות, שהוא בעל הידע המקצועי והסטנדרטים המקובלים בענף","ההנהלה הבכירה של החברה, הקובעת את רמת השירות בהתאם לתקציב ולמדיניות"],c:1,e:"מפילוסופיית ה-FM של Cotts: \"Remember that the customer — and the customer alone — defines service. The facility manager's responsibility is to find out how his customer rates his services\". תואם את הדגש בקורס על סקרי שביעות רצון שיטתיים."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Total Facility Management (Atkin & Brooks), מהי ההגדרה המקובלת לניהול תשתיות?",o:["אחזקת המבנים והתשתיות במחיר הנמוך ביותר האפשרי, תוך עמידה בדרישות הרגולציה, ותוך עמידה בדרישות הבטיחות, אבטחת האיכות ואיכות הסביבה בכל אתר","גישה משולבת לתפעול, לאחזקה, לשיפור ולהתאמה של המבנים והתשתיות של הארגון, במטרה ליצור סביבה התומכת באופן חזק ביעדים העיקריים של הארגון","ניהול תיק הנדל\"ן והשירותים הנלווים לו, לרבות רכישה, השכרה, השבחה ומכירה","ניהול מיקור החוץ של שירותי התמיכה, לרבות בחירת ספקים ומדידת ביצועיהם"],c:1,e:"ההגדרה בפרק 1: \"an integrated approach to operating, maintaining, improving and adapting the buildings and infrastructure of an organization in order to create an environment that strongly supports the primary objectives of that organization\"."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Total FM, מהו \"the informed client function\" ומדוע הוא חשוב?",o:["פונקציית שירות הלקוחות של הספק, האחראית לתקשורת שוטפת מול מקבלי השירות, ואשר מרכזת את הפניות, התלונות ובקשות השירות מהמשתמשים באתר","תפקיד ה\"לקוח המיודע\" — הארגון חייב לפעול כלקוח מיודע כדי להבטיח שביעות רצון של משתמשי הקצה ו-best value; זהו תנאי הכרחי ללא קשר לאופן שבו נרכשים השירותים","מחלקת הרכש של הארגון, המנהלת את תהליכי התיחור וההתקשרות מול הספקים","היועץ החיצוני המלווה את הארגון בתהליכי מיקור החוץ ובבחירת ספקי השירות"],c:1,e:"informed client function: הארגון חייב לפעול כלקוח מיודע כדי להשיג end-user satisfaction ו-best value — \"a requisite irrespective of how services are procured\". התפקיד כולל הבנת הארגון ותרבותו, אפיון דרישות ויעדים, ניהול ספקים ומדידת ביצועים, benchmarking וסקרי שביעות רצון."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Total FM, מהו ההבדל בין value for money ל-best value?",o:["אין ביניהם הבדל — שני מונחים המתארים את אותו יחס בין העלות לאיכות המתקבלת","value for money מבטא את היחס בין עלות לאיכות/ביצועים; best value מרחיב זאת ומשמעו חתירה מתמדת למשהו טוב יותר בעלות הנמוכה ביותר האפשרית — ולכן יש לבחון לא את התוצאה אלא את קבלת ההחלטות וההנחות שבבסיסה","best value פירושו תמיד בחירה במחיר הנמוך ביותר מבין ההצעות שהתקבלו בתיחור","value for money חל רק על החלטות מיקור חוץ ואילו best value חל על רכש טובין, and it therefore has no bearing on how services are procured or specified"],c:1,e:"best value מרחיב את value for money: חתירה מתמדת למשהו superior בעלות הנמוכה ביותר המעשית. הספר מדגיש שיש לבחון לא את התוצאה אלא את תהליך קבלת ההחלטות וההנחות שבבסיסו. החלטת best value מצוטטת בדרך כלל כמכריעה האם למקר חוץ שירות."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Total FM, מהו \"operability\" ומדוע הוא חשוב?",o:["מדד הזמינות של המערכות באחוזים, המחושב מתוך MTBF ו-MTTR לאורך תקופה","עקרון ה\"תכנון לתפעוליות\" — הצלחת מתקן חדש או משופץ תלויה בכך שהתכנון ייקח בחשבון את דרישות התפעול; בניגוד ל-constructability, שמיושם באופן נרחב, עקרון זה אינו מוכר באותה מידה","יכולתו של המתקן לעמוד בעומסים ובתנאי הסביבה לאורך כל תקופת חייו התכנונית, ואשר נבחן בכל פעם מחדש בעת חידוש ההתקשרות או בתיחור חוזר","נוהל ההפעלה המפורט של מערכות המבנה, הנמסר עם מסירת המתקן למשתמש"],c:1,e:"Operability = design for operability. \"Once the facility is operational, it is too late to take issue with the fitness for purpose of the design\". הספר מציין שעקרון ה-constructability מיושם נרחב על ידי מתכננים, אך design for operability אינו מוכר באותה מידה — והתעלמות ממנו פוגעת ביעילות התפעולית ובביצועי האנרגיה."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Total FM, מהם שלבי תהליך ניהול התשתיות (מודל תהליכי)?",o:["תכנון ← ביצוע ← בקרה ← הפקת לקחים — מעגל השיפור המתמיד הקלאסי בניהול, ואשר נמדדת באמצעות מדדי זמינות ואמינות לאורך כל חיי המתקן","פיתוח אסטרטגיית FM ← קביעת מודל הסורסינג (Insource/Outsource/Co-source) ← רכש שירותים ← אספקת השירותים ← ניהול ביצועים","רכש ← אחזקה ← מדידה ← דיווח — ארבעת השלבים התפעוליים במערך התשתיות","ייזום ← הקמה ← הפעלה ← גריטה — ארבעת שלבי מחזור החיים של מתקן"],c:1,e:"המודל התהליכי: Develop facility management strategy (ניתוח אסטרטגי, פיתוח פתרון, יישום) ← Determine sourcing model (Insource/Outsource/Co-source) ← Procure services (מיון מוקדם, RFP/מכרז, הגשת הצעות) ← Deliver services (התארגנות, מעבר, ניהול חוזה) ← Manage performance (סקירת שירות, מדידת ביצועים, benchmarking)."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Total FM, מהו מקור המונח והתחום facility management?",o:["בבריטניה בשנות ה-70, עם התפתחות שוק הנדל\"ן המסחרי וניהול הנכסים המניבים, ואשר מיושם בכל אחד משלבי מחזור החיים של המתקן בנפרד","בארה\"ב במאה ה-19 — חברות הרכבות האמריקאיות סברו שעדיף לספק את התועלת של המתקנים ולא רק מבנים; התחום התפתח לאורך כ-150 שנה","ביפן לאחר מלחמת העולם השנייה, כחלק מתפיסות הייצור הרזה והשיפור המתמיד","באיחוד האירופי בשנות ה-90, עם פרסום התקנים האירופיים הראשונים בתחום"],c:1,e:"Total FM: התחום התפתח לאורך כ-150 שנה. \"It originated at some time in the 1800s, when the American railroad companies thought it better to provide the utility of facilities and not merely buildings\" — פרשנות רחבה יותר של המושג facility."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Total FM פרק 2, מהי \"sustainable space provision\"?",o:["שימוש בחומרי בנייה ידידותיים לסביבה ובתכנון החוסך אנרגיה ומים לאורך חיי המבנה, ואשר משם התפשט לשאר מדינות אירופה ולאחר מכן לארה\"ב ולאסיה","האיזון שיש למצוא בין מה שהארגון צריך לבין מה שהוא יכול להרשות לעצמו מבחינת שטח","הקצאת שטח קבועה לכל עובד, לפי הסטנדרט הארגוני ובהתאם לתפקיד ולדרג","שטח עתודה המיועד להרחבה עתידית, המוחזק מראש לצורכי גדילה של הארגון"],c:1,e:"מפרק 2 (Facility Planning): \"A balance has to be struck between what the organization needs and what it can afford, and this is referred to as its sustainable space provision\". יעילות השטח יכולה להיות גורם מפתח בהצלחת הארגון."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Total FM פרק 2, מהו \"briefing\"?",o:["תדריך בטיחות הניתן לעובדים ולקבלנים לפני תחילת עבודה במתקן או באזור מסוכן","התהליך של שיתוף הארגון בדיון מובנה על הפונקציות והמאפיינים הנדרשים במתקן","הצגת תוצאות הרבעון להנהלה הבכירה, כולל עמידה ביעדים ובמדדי הביצוע","העברת מידע מסודרת בין משמרות, הכוללת חפיפה ודיווח על אירועים חריגים"],c:1,e:"Briefing = \"the process for engaging the organization in a structured discussion about the functions and other characteristics it requires in a facility\". תהליך מרכזי בתכנון מתקן חדש או משופץ, ובסיס להבטחת operability."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Total FM, מהו סיכון מרכזי במפרטי שירות?",o:["מפרטים קצרים ולא מפורטים דיים, שאינם מגדירים את תכולת העבודה במדויק","מפרטים מכתיבים מדי (overly prescriptive) ו/או המתמקדים בפרוצדורות ולא בתפוקות (outputs)","מפרטים הכתובים באנגלית בלבד, שאינם נגישים לספקים ולעובדים המקומיים","מפרטים שנכתבו על ידי יועץ חיצוני שאינו מכיר את הארגון ואת צרכיו לעומק, ובשילוב מערכות מיזוג, תאורה ובקרה יעילות אנרגטית לאורך זמן"],c:1,e:"אחד הסיכונים ברשימת ה-downside risks: \"Specifications that are overly prescriptive and/or concentrate on procedures, not outputs\". תואם את הדגש בקורס על מעבר מתשומות לתפוקות. סיכונים נוספים ברשימה: gold plating של דרישות, ניטור מוגזם של ביצועי הספק, והיעדר מנגנוני תמריץ."},

{t:"הסעדה",s:"מצגת",q:"מהם ה\"מספונים\" שהוזכרו כאמצעי מדידה?",o:["מכשירים לספירת הסועדים בכניסה לחדר האוכל, המאפשרים מדידת ניצול הפוטנציאל, ואשר מדווחים למנהל ההסעדה לצורך התאמת הכמויות ליום המחרת","מסכי משוב (אייפד/סמיילי) המוצבים בסמוך למוקדי שירות, שבהם הלקוח מסמן את מידת שביעות רצונו","מכונות אוטומטיות למכירת מזון, שתייה ומוצרי יסוד המוצבות במתחמי ההסעדה","מדפסות תוויות למנות, המסמנות ערכים תזונתיים, אלרגנים ותאריך הכנה לכל מנה"],c:1,e:"מספונים = מסכי שביעות רצון (אייפד, בדרך כלל 4 פרצופים/סמיילי) המוצבים בכניסה לשירותים, מקלחות, מלתחות וחדרי אוכל. כיום מקובל גם משוב מיד לאחר קבלת שירות, וברקוד/QR לשימוש בסלולר."},
{t:"ניקיון, ביגוד וביטחון",s:"מצגת",q:"מהי \"באאז טק\" (BUZZTECH) שהוזכרה בהקשר של ניקיון?",o:["חברת ניקיון גלובלית המספקת שירותי IFM משולבים של ניקיון, הסעדה ואבטחה","מערכת פרואקטיבית היודעת, לפי הנחות עבודה מתוכנתות, לקרוא לעובד ב-7 שפות ישירות לסלולרי","רובוט ניקוי אוטונומי לחניונים, פרוזדורים ומרחבים ציבוריים, שנמצא בשלבי פיתוח, ואשר נמצא בשלבי אבולוציה ומשתפר עם הזמן אך עדיין אינו מושלם","סדרת חומרי ניקוי אקולוגיים על בסיס צמחים, המגיעים בשקיות אבקה למהילה במים"],c:1,e:"BUZZTECH — טכנולוגיה חכמה לניהול ניקיון: מערכת פרואקטיבית היודעת לפי הנחות עבודה מתוכנתות לקרוא לעובד ב-7 שפות ישירות לסלולרי. לצדה מסכי שביעות רצון וברקוד/QR לפידבק."},
{t:"ניקיון, ביגוד וביטחון",s:"מצגת",q:"אילו חומרי ניקוי נדרשים כיום מבחינה סביבתית?",o:["חומרים כימיים חזקים ככל האפשר, כדי להבטיח חיטוי מרבי ועמידה בתקני היגיינה, ואשר נבחרים לפי סוג המשטח, רמת הלכלוך ודרישות הרגולציה באתר","חומרים ידידותיים לסביבה ללא כימיקלים (אקולוגיים) על בסיס צמחים — אלוורה, חמצן פעיל, אנזימים חיים, סיליקון, לימון וסודה, המגיעים בשקיות אבקה קטנות למהילה במים במקום","רק חומרים מיובאים בעלי אישור משרד הבריאות ותו תקן בינלאומי מוכר בתחום","אין דרישות מיוחדות לחומרי ניקוי — הבחירה נתונה לשיקול דעתו של הקבלן המבצע"],c:1,e:"הדרישה כיום: חומרים ידידותיים לסביבה ללא כימיקלים (אקולוגיים), על בסיס צמחים — אלוורה, חמצן פעיל, אנזימים חיים, סיליקון, לימון, סודה. מגיעים בשקיות אבקה קטנות למהילה במים מקומית. בנוסף — חומרים מותאמים לכל משטח (שיש, קרמיקה, קוריאן, פרקט, דק, זכוכית, נירוסטה)."}
]);

{t:"אחזקה",s:"הקלטה",q:"בהרצאה ניתנה דוגמה למעליות בבניין מעל 6 קומות. מהי דרישת האחזקה המונעת שלהן?",o:["בדיקת מהנדס אחת לשנה, ובדיקת טכנאי לפני כל שינוי בעומס או בשימוש בבניין","טכנאי מעליות אחת לחודש, ובנוסף בדיקה של מהנדס אחת לחצי שנה","טכנאי אחת לרבעון, ובדיקת מכון התקנים אחת לשנתיים לפי הוראות היצרן","בדיקה רק לפי קריאה, שכן מעליות מודרניות מנוטרות מרחוק ואינן דורשות ביקור"],c:1,e:"בהרצאה: \"מעליות בבניין מעל 6 קומות — צריך לבוא טכנאי מעליות כל חודש, ופעם בחצי שנה בדיקה של מהנדס\". זו דוגמה לעלות הגבוהה של אחזקה יזומה — ולכן הפוטנציאל בחיישנים ובאחזקה חזויה."},
{t:"אחזקה",s:"הקלטה",q:"המרצה תיאר דוגמה של שש מעליות בבניין. מה היא באה להמחיש?",o:["שיש להזמין טכנאי לכל המעליות יחד, כדי לחסוך בעלות הקריאה ובזמן ההמתנה","שאם מתעדים כל קריאה וכל טיפול לפי המספר הסידורי של כל מעלית, אפשר לזהות שמעלית אחת מתנהגת אחרת מהחמש — וזה כבר לא \"עוד תקלה\" אלא בעיה","שכדאי להחליף את כל המעליות באותו מועד, כדי לשמור על אחידות בגיל ובדגם","שיש להתקין חיישנים רק על המעלית העמוסה ביותר, שהיא הראשונה להתבלות, שכן היא זו שצוברת את מרב שעות העבודה ואת מספר הנסיעות הגבוה ביותר בבניין"],c:1,e:"הדוגמה ממחישה \"ניהול מבוסס נתונים\": תיעוד כל טיפול לפי מספר סידורי מאפשר להשוות בין יחידות זהות. \"אם אתה לא מודד — אני לא יודע שום דבר. והרוב לא מודדים, כי זה קשה\"."},
{t:"אחזקה",s:"הקלטה",q:"מהי \"בדיקת אינטגרציה\" ומהי חשיבותה הרגולטורית?",o:["בדיקה שנתית שבה מהנדס מדמה תקלות (למשל שריפה) ובודק שכל המערכות פועלות במשולב — וזו למעשה הדרישה הרגולטורית היחידה בתחום","בדיקה של תאימות בין מערכות המחשוב של הבניין למערכות הניהול של חברת האחזקה","בדיקה רבעונית של מכון התקנים לכל מערכת בנפרד — מעליות, גנרטור, כיבוי אש, ואשר תוצאותיה מרוכזות בתיק המבנה ומוצגות לרשות המקומית בעת חידוש הרישיון","בדיקה חד-פעמית בעת האכלוס, המהווה תנאי לקבלת טופס 4 ורישיון העסק לבניין, ואשר בלעדיה לא ניתן לחבר את הבניין לרשת החשמל ולמערכות המים העירוניות"],c:0,e:"בהרצאה: בדיקת אינטגרציה נעשית פעם בשנה על ידי מהנדס המדמה תקלות. המרצה ציין שזה \"הדבר היחיד שמופיע ברגולציה\" בתחום ניהול בניינים גבוהים — לצד חובות בדיקה למערכות בודדות."},
{t:"אחזקה",s:"הקלטה",q:"אילו פעולות חייבות להתרחש יחד ברגע שמתגלה שריפה, כפי שנבדק בבדיקת אינטגרציה?",o:["רק הפעלת הספרינקלרים והתראה לכוחות הצלה חיצוניים באמצעות חיוג אוטומטי, בעוד ששאר המערכות ממשיכות לפעול כרגיל עד להגעת כוחות הכבאות וההצלה לאתר","זיהוי והתראה, כריזה לכיווני פינוי, ספרינקלרים, מפוחי אוויר צח לחדר המדרגות, רפפות חשמליות לפינוי עשן, הפעלת גנרטורים וירידת המעליות לקומה 0","סגירת כל דלתות האש, ניתוק החשמל הראשי והפעלת תאורת חירום בכל הקומות, ובמקביל הפעלת מערכת הכריזה והזעקת כוחות ההצלה באמצעות חיוג אוטומטי למוקד","הפעלת מערכת הכריזה בלבד, ולאחר מכן פינוי ידני בהנחיית צוות הביטחון באתר, ולאחר מכן דיווח מסודר לרשות המקומית ולמשרד העבודה על האירוע ועל תוצאותיו"],c:1,e:"כ-10 פעולות שצריכות לקרות בו-זמנית: מערכת זיהוי, התראה, רמקולים המכוונים לאן להתפנות, ספרינקלרים, מפוחי אוויר צח לחדר המדרגות, רפפות חשמליות לפינוי עשן, גנרטורים, והמעליות יורדות לקומה אפס. בדיקת האינטגרציה מוודאת שכולן עובדות במשולב."},
{t:"אחזקה",s:"הקלטה",q:"מדוע ניסיונות להעביר את מערך האחזקה במפעלים למיקור חוץ מלא לא צלחו?",o:["מפני שחברות מיקור החוץ סירבו לקבל אחריות על קווי ייצור מורכבים ורגישים","מפני שברגע שהידע אבד — השגת ידע מקצועי על קו ייצור לוקחת זמן רב, ולכן היום עיקר האחזקה במפעלים מבוצע על ידי המפעלים עצמם","מפני שהרגולציה בישראל אוסרת על העסקת קבלני חוץ באזורי ייצור מוגדרים","מפני שהעלות הייתה גבוהה מהותית מהעסקת צוות אחזקה פנימי באותם מקצועות"],c:1,e:"בהרצאה: ניסו בארץ ובעולם עם חברות כמו JLL, Cushman ו-CBRE — \"ברגע שאיבדת את הידע, להשיג ידע מקצועי לקו ייצור לוקח הרבה מאוד זמן\". הידע הבסיסי נשאר בעסק; ספקי שירות מוזמנים לחשמל, מיזוג ואלקטרומכניקה."},
{t:"אחזקה",s:"הקלטה",q:"אילו מחירונים מקובלים לתמחור עבודות אחזקה שאינן כלולות בהסכם?",o:["מחירון משרד השיכון ומחירון התאחדות הקבלנים, המתעדכנים אחת לשנה, המשמשים בעיקר בתחום הבינוי ופחות בתחום האחזקה השוטפת של מבנים","מחירון \"דקל\", \"המאגר המשולב\" ו\"המאגר המאוחד\" — כאשר משרד הביטחון עובד עם דקל","מחירון הלמ\"ס ומחירון החשב הכללי, המשמשים גם למנגנוני הצמדה בחוזים","מחירון מכון התקנים, המחייב בכל עבודה המבוצעת בבניין ציבורי או במפעל"],c:1,e:"המחירונים שהוזכרו: \"דקל\", \"המאגר המשולב\" ו\"המאגר המאוחד\" — מקובלים בבינוי וגם באחזקה; משרד הביטחון עובד לפי דקל. משמשים לתמחור עבודות שאינן בהסכם, לצד הצעות מחיר וניתוחי מחיר."},
{t:"אחזקה",s:"הקלטה",q:"בבנייני מגורים, כיצד נצברת בפועל \"קרן הפחת\" (קרן חידוש)?",o:["הבעלים מפרישים סכום חד-פעמי בעת רכישת הדירה, המופקד בנאמנות אצל היזם","אחוז מסוים מדמי הניהול — מקובל בין 3% ל-5% — מועבר לחשבון נפרד המשמש להחלפות עתידיות","היזם מחויב בחוק להעמיד את מלוא הסכום מראש לכל 25 שנות חיי הבניין, ומפקיד אותו בנאמנות עד למועד ההחלפה הראשון של המערכות בבניין","הקרן נצברת מדמי השכירות של השטחים המסחריים המשותפים שבבעלות הדיירים, ומחולקת ביניהם אחת לשנה לפי חלקם היחסי ברכוש המשותף של הבניין"],c:1,e:"בבנייני מגורים מקובל שאחוז מדמי הניהול, בדרך כלל 3%-5%, מועבר לחשבון נפרד — \"קרן פחת\". כך אין צורך לאסוף כסף מהבעלים כשמגיע מועד ההחלפה. אותו עיקרון נדרש בתכנון אחזקה במודל BOT."},
{t:"אחזקה",s:"הקלטה",q:"אילו נתוני אורך חיים הוצגו כבסיס לתכנון קרן פחת?",o:["מעליות — החלפת כבלים כל 6-7 שנים, שיפוץ אחרי 15 שנה ושיקום כללי אחרי 25 שנה; מצברי UPS — 4-5 שנים","מעליות — החלפה מלאה כל 10 שנים; מצברי UPS — החלפה כל 10-12 שנים לפי היצרן, בהתאם להוראות היצרן ולתנאי האחריות המסחרית שניתנה בעת הרכישה","מעליות — שיפוץ כל 5 שנים; מצברי UPS — החלפה שנתית בשל שחיקה מהירה, ואשר מחייבת התקשרות עם חברת המעליות בהסכם שירות שנתי מתחדש","מעליות — שיקום כללי כל 40 שנה; מצברי UPS — אינם מוחלפים אלא לפי תקלה, ואשר מחייבים בדיקה תקופתית של מהנדס מוסמך אחת לחמש שנים בלבד"],c:0,e:"הדוגמאות שניתנו: מעליות — כבלים כל 6-7 שנים, שיפוץ/החלפת מנוע אחרי 15 שנה, שיקום כללי אחרי 25 שנה. UPS — אורך חיי מצבר 4-5 שנים, וב\"בניינים גדולים זה לא מצבר כמו באוטו, זה חוות שלמות של מצברים. זה הרבה מאוד כסף\"."},
{t:"אחזקה",s:"הקלטה",q:"מהי המשמעות של \"התשלום כפול\" במודל BOT?",o:["הלקוח משלם גם ליזם המקים וגם לחברת ההפעלה, שהן שני גופים משפטיים נפרדים","הלקוח משלם במשך 25 שנה את עלות ההקמה, ובמקביל משלם גם על הטיפול והתפעול השוטף לפי ההסכם","הלקוח משלם מראש מחצית מהעלות ואת היתרה בתום 25 שנה בעת קבלת הבעלות","הלקוח משלם גם מס רכישה על הנכס וגם דמי ניהול שוטפים לאורך כל התקופה"],c:1,e:"בהרצאה: \"התשלום הוא כפול — אתה משלם במשך 25 שנה את עלות ההקמה, וכמובן משלם על הטיפול השוטף לפי ההסכם, ואחרי 25 שנה זה הופך להיות נכס שלך\". זו התפיסה שמאפשרת למדינה להקים ללא הוצאה תקציבית מיידית."},
{t:"אחזקה",s:"הקלטה",q:"אילו מהבאים הם פרויקטים בישראל שהוקמו במודל BOT/PFI/PPP?",o:["נמל המפרץ בחיפה, הרכבת הקלה בתל אביב ומסוף בן גוריון 3, שהוקמו כולם במימון ממשלתי מלא ובניהול חברות ממשלתיות ייעודיות","כביש 6, עיר הבה\"דים, קריות הממשלה בירושלים (ג'נרי) וברמלה, וקמפוס משרד המשפטים","קניון עזריאלי, מגדל ביונד ופרויקט Vertical City בבורסה ברמת גן","בתי החולים איכילוב ושיבא, ומרכזי הלוגיסטיקה של רשתות הקמעונאות"],c:1,e:"הדוגמאות שניתנו: כביש 6, עיר הבה\"דים, משרדי הממשלה בג'נרי בירושלים וברמלה, וקמפוס משרד המשפטים שאוכלס לפני כשנה — יזם בנה וחברת רמות מפעילה, ואחרי 25 שנה יעבור למשרד המשפטים."},
{t:"אחזקה",s:"הקלטה",q:"מה ממחיש הניסיון של המרצה מעיר הבה\"דים לגבי תכנון אחזקה ל-25 שנה?",o:["שרמת התקלות אחרי כעשר שנות הפעלה גבוהה בהרבה משלב ההתחלה — ומי שלא תכנן זאת מראש עלול להפסיד","שעלות האחזקה יורדת עם השנים, מכיוון שהצוות לומד את המערכות ומתייעל, ולכן ניתן להקטין בהדרגה את תקציב האחזקה השנתי לאורך התקופה","שרמת התקלות נשארת קבועה כל עוד מבצעים אחזקה מונעת לפי הוראות היצרן","שרוב התקלות מתרכזות בחמש השנים הראשונות, בעודן תחת אחריות היצרן, ולכן עיקר תקציב האחזקה מוקצה דווקא לתקופת ההרצה הראשונית"],c:0,e:"המרצה מחזיק את עיר הבה\"דים כעשר שנים: \"רמת התקלות שם היא הרבה יותר גדולה מאשר בשלב ההתחלה. אם לא היית יודע לתכנן את זה מראש, אתה יכול להפסיד את המכנסיים\". אותה תופעה בג'נרי בן 20 מול בניין חדש לידו."},
{t:"אחזקה",s:"הקלטה",q:"בתאונת העבודה בפרויקט תדהר בפארק צמרת, שני עובדים נפלו לאחר שהתירו את עצמם. מדוע נמצאה החברה תקינה?",o:["מפני שהעובדים היו קבלני משנה ולא עובדי החברה, ולכן האחריות לא חלה עליה, ולכן הם נחשבים לעובדים עצמאיים לכל דבר ועניין בדיני העבודה","מפני שנקטה בכל האמצעים הסבירים — תדריך בטיחות מתועד וחתום באותו בוקר, ווידוא שהעובדים נרתמו לפני העלייה לפיגום","מפני שהפיגום היה תקין ובעל אישור בודק מוסמך בתוקף במועד האירוע, ובעל תיעוד מלא של בדיקות התקינות שבוצעו בו לפני תחילת העבודה","מפני שהאירוע התרחש מחוץ לשעות העבודה הרשמיות שהוגדרו באתר הבנייה, ולכן חלה עליו פוליסת הביטוח של הקבלן ולא של החברה המזמינה"],c:1,e:"המבחן המשפטי הוא \"האם נקטת בכל האמצעים הסבירים כדי למנוע\". החברה עשתה תדריך בטיחות בבוקר, תיעדה אותו והעובדים חתמו, וּוידאה שהם נרתמים בעלייה לפיגום. \"אם למעלה הוא ישתחרר — אתה לא יכול לראות כל רגע מה הוא עושה\"."},
{t:"אחזקה",s:"הקלטה",q:"מתי נכנס לתוקף תקן הבנייה הירוקה בישראל, ועל מי הוא חל?",o:["ב-2018, על כל מבנה חדש ללא קשר לגודלו או לייעודו התכנוני","ב-2022, על בניין רב-קומות מעל 5,000 מ\"ר, ועל בית חולים או גן ילדים מעל 1,000 מ\"ר","ב-2015, על מבני ציבור בלבד שבבעלות המדינה או הרשויות המקומיות","ב-2024, על מבנים המבקשים דירוג LEED בלבד, כתנאי לקבלת הדירוג"],c:1,e:"בהרצאה: התקן נכנס ב-2022 ומחייב כל בניין רב-קומות מעל 5,000 מ\"ר, או בית חולים או גן ילדים מעל 1,000 מ\"ר, להיבנות בבנייה ירוקה ולקבל \"תו ירוק\". (התקן הישראלי הוא ת\"י 5281.)"},
{t:"אחזקה",s:"הקלטה",q:"כיצד מגיעים מים לקומה 120 בגורד שחקים, בהינתן שהעירייה מספקת לחץ קבוע?",o:["העירייה מחויבת לספק לחץ מוגבר למגדלים, ולכן אין צורך במערכת שאיבה ייעודית","העירייה מחויבת לספק 6 אטמוספרות בלבד; משם משאבות דוחפות את המים לבריכות על הגג ומשם נפילה חופשית עם מפחיתי לחץ כל 10 קומות, או דחיפה בלחץ קבוע כלפי מעלה","המים מסופקים מקידוח פרטי בבסיס הבניין, המוזרם ישירות לכל הקומות, ומועברים למערכת סינון וטיהור ייעודית בקומת המרתף של המגדל","המים מועלים באמצעות מיכלי ביניים בכל קומה עשירית, המתמלאים בשעות הלילה"],c:1,e:"\"מים מהעירייה אתה מקבל לווילה ולבניין כזה באותו לחץ — העירייה מחויבת לתת 6 אטמוספרות, וזהו\". משם: משאבות לבריכות על הגג ונפילה חופשית עם מפחיתי לחץ כל 10 קומות, או דחיפה בלחץ קבוע. בניקוז — הצנרת בתנועת ספירלה כדי להאט את קצב הירידה."},
{t:"אחזקה",s:"הקלטה",q:"מה ייחודי בפתרון הפינוי שתוכנן במגדל ביונד?",o:["מערכת מגלשות פינוי חיצוניות, המופעלת אוטומטית בעת גילוי שריפה בבניין","מתוך 42 המעליות, שתיים מוגנות אש ומיועדות אך ורק לפינוי אנשים בעת שריפה","גשר חילוץ המחבר את המגדל למגדל הסמוך בקומה ה-40 לצורך פינוי אופקי, ואשר נבנה במקביל לשני המגדלים כחלק מדרישות כבאות והצלה בהיתר","מסוק חילוץ הממתין על גג הבניין, בהתאם לדרישת כבאות והצלה למגדלים, ואשר מתוחזק על ידי חברה חיצונית המתמחה בפינוי ממגדלים גבוהים"],c:1,e:"בביונד (84 קומות) יש 42 מעליות ב-4 סקטורים, ומתוכן שתיים מוגנות אש שאינן בשימוש שוטף — כל תפקידן הוא פינוי אנשים בשריפה. מגמה משלימה המתפתחת בחו\"ל: קומת מילוט מוגנת כל 10 קומות."},
{t:"אחזקה",s:"הקלטה",q:"מהי המשמעות של \"ריתוק משקי\" ומה נדרש כדי להיערך אליו?",o:["התחייבות חוזית של הספק להגיע תוך זמן מוגדר, המגובה במנגנון קנס-פרס בהסכם, ואשר מגובה גם בערבות ביצוע בנקאית להבטחת עמידתו בזמני התגובה","הכרה של המפעל כחיוני מול משרד העבודה, ועדכון שוטף של רשימות שמיות של בעלי מקצוע — שברגע שמוכרז מצב חירום חייבים להתייצב לעבודה","הפקדת ערבות בנקאית לטובת המדינה, המבטיחה המשך פעילות בעת חירום, ואשר גובהה נקבע לפי היקף הפעילות ומספר העובדים המועסקים במפעל","הכשרה של עובדי החברה כמתנדבי פיקוד העורף, לצורך תפעול האתר בחירום, ואשר עוברים רענון תקופתי מטעם פיקוד העורף אחת לשנה לפחות"],c:1,e:"ריתוק משקי מחייב עבודה מול משרד העבודה: הכרה כמפעל חיוני ועדכון רשימות שמיות של בעלי מקצוע. \"ברגע שפורצת מלחמה ומכריזים מצב חירום, הם חייבים לבוא לעבודה — זה לא שאם הוא רוצה הוא בא\". רלוונטי במיוחד לאחר חרבות ברזל."},
{t:"אחזקה",s:"הקלטה",q:"מהי הנקודה שהמרצה הדגיש לגבי סמכותה של הרשות המקומית ברישוי עסקים?",o:["הרשות המקומית היא בעלת הסמכות המלאה, ויכולה להעניק רישיון גם ללא אישורי הגורמים","הרשות המקומית מנפיקה את הרישיון אך למעשה אין לה סמכות מהותית — היא אינטגרטור המרכז את אישורי המשטרה, הכבאות ומשרד הבריאות","הסמכות נתונה למשרד הפנים, והרשות המקומית רק מעבירה אליו את הבקשות","הסמכות נתונה למכון התקנים, שבודק את עמידת העסק בתקנים המחייבים לסוגו"],c:1,e:"\"מי שנותן רישיון עסק זה הרשות המקומית, אבל אין לה למעשה סמכות — היא אינטגרטור\". היא מרכזת את האישורים מהגורמים המוסמכים (משטרה, כיבוי אש, משרד הבריאות ועוד), ורק לאחר מכן מנפיקה."},
{t:"אחזקה",s:"הקלטה",q:"מדוע המרצה ממליץ להחזיק הסכם שירות עם ספק מיזוג אוויר גם אם הוא נראה יקר?",o:["מפני שהסכם קבוע מקנה הנחה משמעותית במחיר השעה ובעלות חלקי החילוף, וכן פטור מדמי קריאה ומעלות הנסיעה של הטכנאי בכל אירוע תקלה","מפני שבקיץ הספק ייתן שירות בעדיפות ראשונה למי שיש לו הסכם — ולמי שאין, פשוט לא יהיו לו משאבים פנויים","מפני שהרגולציה מחייבת הסכם שירות בתוקף לכל מערכת מיזוג מרכזית באתר","מפני שללא הסכם לא ניתן להזמין חלקי חילוף מקוריים ישירות מהיבואן בארץ"],c:1,e:"מהניסיון של המרצה: \"בקיץ, כשהוא רוצה ספק מיזוג אוויר — אין לו. כי הספק ייתן שירות למי שיש לו הסכם איתו בעדיפות ראשונה, ואם יהיו לו משאבים מיותרים הוא יבוא גם אליך — ואני יכול להגיד לכם מניסיון שאין להם משאבים מיותרים\"."},
{t:"אחזקה",s:"הקלטה",q:"מהו האתגר האחזקתי המרכזי ב\"עירוב שימושים\" בבניין אחד?",o:["הצורך להפריד בין מערכות החשמל של כל שימוש, כדרישת חברת החשמל בבניין רב-קומות","לכל שימוש רמת אחזקה שונה לגמרי — מלון, מסחר, מגורים וחניונים — ולעיתים שלושה או ארבעה סוגי חניונים באותו בניין (דיירים, מסחר, עירוני)","הקושי לגבות דמי ניהול אחידים מכל השוכרים בבניין, בשל פערי הכנסה ביניהם, ואשר מחייב מנגנון חלוקה מוסכם המעוגן בתקנון הבית המשותף","הצורך בהיתר בנייה נפרד לכל שימוש, המונפק על ידי ועדה מחוזית אחרת, ואשר מחייב גם חוות דעת נפרדת של יועץ בטיחות לכל אחד מהשימושים"],c:1,e:"עירוב שימושים מציב אתגר גדול: \"רמה של אחזקה בבית מלון שונה מאחזקה של בתי מגורים, והאחזקה של שטחי מסחר שונה\". בנוסף — שלושה ואף ארבעה סוגי חניונים: של הדיירים, של המסחר, וחניון עירוני שהעירייה חייבה במסגרת ההיתר."},
{t:"אחזקה",s:"הקלטה",q:"מה מלמדת העובדה ששמו של בית מלון הוא שם רשת ההפעלה ולא בעל הנכס?",o:["שרשת ההפעלה היא הבעלים בפועל של הנכס ונושאת במלוא עלויות האחזקה, ולכן היא זו שנושאת גם בעלות קרן החידוש ובהשקעות ההוניות בו","שהנכס שייך לגורם אחד והרשת מפעילה אותו — ולכן שיקולי האחזקה נגזרים מהסכם השכירות/ההפעלה בין הצדדים","שבתי מלון פטורים מהחובה לקיים אחזקה מונעת, בהיותם בשכירות ארוכת טווח, ולכן הן חלות רק על מלונות שבבעלות מלאה של רשת ההפעלה עצמה","שרשת ההפעלה אחראית רק לשירות לאורחים, ולא למערכות ולתשתיות המבנה, ואילו בעל הנכס אחראי לכלל המערכות, לתשתיות ולתחזוקת המבנה"],c:1,e:"דוגמת הילטון תל אביב: \"השם של בית המלון זה רשת ההפעלה, זה לא בעל הנכס\". זו המחשה לכך שסוג הבעלות — בעלות מול שכירות — הוא אחד משני השיקולים המרכזיים בבחירת שיטת האחזקה, לצד סוג הנכס."},
{t:"אחזקה",s:"הקלטה",q:"מהי הביקורת שהשמיע המרצה על היעדר רגולציה לחברות ניהול בישראל?",o:["שחברות הניהול אינן מחויבות בביטוח אחריות מקצועית כלפי הדיירים","ש\"בשביל להקים חברת ניהול צריך שיהיה לך דופק\" — אין דרישות סף, גם לא למגדל בן 120 קומות","שחברות הניהול אינן מחויבות לפרסם את דמי הניהול שהן גובות מהדיירים","שחברות הניהול פטורות מחובת רישוי עסק ומפיקוח של הרשות המקומית"],c:1,e:"\"היום בשביל להקים חברת ניהול צריך שיהיה לך דופק, אתה לא צריך שום דבר חוץ מזה\". יש רגולציה המחייבת טיפול באמצעים (בדיקת מעליות, כיבוי אש, אינטגרציה) — אך אין חוק המחייב מגדל להחזיק חברת ניהול או אחזקה. בכנסת מתנהלים הליכי חקיקה בנושא."},
{t:"אחזקה",s:"הקלטה",q:"מהו סדר הגודל של ההשקעה שנדרשה במפעל טבע בעקבות תקן האוויר, לפי עדות המרצה?",o:["כמיליון דולר, בעיקר בהחלפת מסנני אוויר ובכיול מערכות הניטור","כעשרה מיליון דולר — כולל טיפול בפליטות לאוויר ובנוזלים שבתהליך הייצור","כמאה מיליון דולר, שהצריכו הקמת מתקן טיפול שפכים ייעודי במפעל","ההשקעה הייתה זניחה, שכן המפעל עמד ממילא בדרישות התקן החדש, ולכן לא נדרשה כל השקעה נוספת מעבר לתחזוקה השוטפת הרגילה"],c:1,e:"מעדות המרצה מתקופתו בטבע: תקן האוויר \"חייב אותנו להשקיע במפעל, אם אני זוכר נכון, כעשרה מיליון דולר\" — פליטות לאוויר חייבות לעמוד בתקן, וגם נוזלים שבתהליך הייצור חייבים להיות מרוכזים ומטופלים ברמה מסוימת."}
]);

/* L02 (09-01-2026) — שיעור יעדים, מדדים וניהול פיננסי.
   דגשים, נתונים ודוגמאות שנאמרו בכיתה ואינם במקראה. */
BANK.push.apply(BANK,[
{t:"יעדים ומדדים",s:"הקלטה",q:"מהו הכלל המעשי שנתן המרצה לחישוב שטח משרדים הנדרש לעובד?",o:["כ-16 מ\"ר לאדם ברוטו — כולל חלק יחסי בקפיטריה, בחדרי הרצאות ובשטחים הציבוריים","כ-8 מ\"ר לאדם נטו, לא כולל שטחים ציבוריים, קפיטריה וחדרי ישיבות, המחושבים בנפרד לפי תקן","כ-25 מ\"ר לאדם, שהוא הסטנדרט המקובל במגדלי משרדים חדשים בתל אביב ובמרכז","אין כלל אצבע — השטח נגזר מהסטנדרט הארגוני ומהתפקיד של כל עובד ועובד בחברה"],c:0,e:"מניסיונו בטבע: \"בערך 16 מטר לאדם, כולל קפיטריה, כולל חדרי הרצאות\". מכאן: 100 עובדים ≈ 1,600 מ\"ר. הכלל שימש אותו כדי להפריך טענות של מנהלים מקומיים שהשטח אינו מספיק."},
{t:"יעדים ומדדים",s:"הקלטה",q:"כיצד השתמש המרצה במערכת נוכחות העובדים למטרה שלא לשמה נועדה?",o:["כדי לחשב את עלות ההסעדה לעובד ולתמחר מחדש את ההסכם מול ספק ההסעדה באתר, ולבחון האם כדאי לעבור לשיטת הזמנה ממוכנת מראש כדי לצמצם את הפחת","כדי לבדוק את אכלוס הקומות בפועל — כמה אנשים באמת מגיעים כל יום — ולהתמודד עם דרישות להגדלת שטח","כדי לזהות עובדים החורגים משעות העבודה המותרות ולדווח עליהם למשאבי אנוש","כדי לתכנן את מערך ההסעות והקווים בהתאם לשעות ההגעה והיציאה בפועל מהאתר"],c:1,e:"\"המערכת לא מיועדת לזה — היא מיועדת לדווח נוכחות לשכר. אבל אם אני מתחבר לזה, אני יכול לדעת כמה אנשים באים\". דוגמה מרכזית לעיקרון: המערכות בארגון לא נבנו עבור ה-FM, וצריך לדעת לשלוף מהן נתונים."},
{t:"יעדים ומדדים",s:"הקלטה",q:"כיצד הגדיר המרצה את ההתראה במערכת ה-BI בטבע?",o:["התראה על כל חריגה מהתקציב הרבעוני שאושר, בפילוח לפי אתר ולפי סעיף הוצאה, המופק אוטומטית ונשלח למנהלי האתרים ולמנהל הכספים של החטיבה","עלות ניקיון ממוצעת של 7 דולר למ\"ר, והמערכת התריעה רק על חריגה של 5% ממנה","התראה שבועית על עשרת האתרים היקרים ביותר בכל אחד מתחומי השירות שנמדדו, ולהעביר אותה לדיון בישיבת ההנהלה הרבעונית של אגף התשתיות בחברה","דו\"ח חודשי מרוכז לכל המדינות, שנבחן בישיבת ההנהלה של אגף התשתיות הגלובלי"],c:1,e:"\"המטר מרובע ניקיון עלה שבעה דולר בממוצע. הייתה לי מערכת BI, ואמרתי לה: תראי לי רק חריגה של חמישה אחוז\". זו המחשה מעשית של ניהול חריגים — לא לבחון הכל, אלא רק את מה שחורג מהנורמה."},
{t:"יעדים ומדדים",s:"הקלטה",q:"כיצד ביצע המרצה benchmark לעלות פינוי אשפה באור יהודה?",o:["השווה מול המחירון של משרד הפנים לרשויות מקומיות בדירוג סוציו-אקונומי דומה, ואשר מתפרסם מדי שנה יחד עם צו הארנונה המאושר על ידי שר הפנים","בחר ארבע עיריות בסדר גודל דומה — יבנה, פרדס חנה, מעלה אדומים — וגילה 450 ש\"ח לטון מול 580 ש\"ח אצלו","פנה לשלושה קבלני פינוי וביקש הצעות מחיר חדשות לצורך השוואה מול הקיים, ולאחר מכן ניהל מולם משא ומתן משותף כדי להוריד את המחיר לטון","השווה מול העלות בשנה הקודמת ומול התקציב שאושר בתחילת שנת הכספים ברשות, ובחן את הפער מול מדד המחירים לצרכן שפרסמה הלשכה המרכזית לסטטיסטיקה"],c:1,e:"עיקרון ה-benchmark בפעולה: השוואה מול גופים בעלי \"זהות תפקודית\" ובסדר גודל דומה. הפער — 580 מול 450 ש\"ח לטון — הוביל לבדיקה מעמיקה ולשורת שינויים. \"אי אפשר להשוות מפעל כימי למפעל שמייצר תבליט\"."},
{t:"יעדים ומדדים",s:"הקלטה",q:"מהי הדוגמה שנתן המרצה ליעד שאינו קביל, לעומת יעד קביל?",o:["\"נשפר את האחזקה בעיר הבה\"דים\" אינו קביל; \"אני עומד ב-85% ב-SLA ובשנה הבאה ארצה 90%\" קביל","\"נקטין את ההוצאות\" אינו קביל; \"נשפר את שביעות הרצון\" קביל, שכן ניתן למדוד אותה בסקר","\"נעבור לספק חדש\" אינו קביל; \"נחתום על הסכם ארוך טווח\" קביל, שכן הוא מעוגן במסמך","כל יעד שנקבע על ידי ההנהלה קביל, ובלבד שהוא מופיע בתוכנית העבודה השנתית המאושרת"],c:0,e:"\"מה אני אעשה עם 'נשפר את האחזקה'? אין לי מה לעשות עם זה\". לעומת זאת יעד SLA מספרי נמדד מדי חודש. זהו היישום של הכלל \"מה שאינו יכול להימדד לא קיים\" — והמרצה מספר שהוא מוחק יעדים כאלה מתוכניות העבודה שהוא מאשר."},
{t:"ניהול פיננסי",s:"הקלטה",q:"בדוגמת בנק הפועלים שהובאה בהרצאה — מה הקטינו וכמה חסכו?",o:["צמצמו את מצבת עובדי הניקיון בכ-20% וחסכו כמיליון ש\"ח בשנה בסניפים","הקטינו את החלפות האוויר בחניונים וחסכו כ-40 אלף ש\"ח בשנה","סגרו את מוקד השירות בסופי שבוע וחסכו כשלושה מיליון ש\"ח בשנה בכוח אדם","העבירו את מערך ההסעדה לספק חיצוני וחסכו כרבע מעלות הארוחה לעובד, תוך שמירה על אותה רמת שירות ועל אותו מגוון מנות בחדר האוכל באתר"],c:1,e:"הבנק הקטין את החלפות האוויר בחניונים (בהנחה שהשהות מהמעלית לרכב קצרה) וחסך כ-40 אלף ש\"ח בשנה. \"זה מצחיק מול המיליארדים שהם מרוויחים, אבל בסוף הדברים הקטנים האלה במכפלות מביאים הרבה\" — בכל שנה מבקשים להוריד, בלי קשר לרווחיות."},
{t:"ניהול פיננסי",s:"הקלטה",q:"בדוגמה שניתנה בהרצאה: נכס רשום בספרים ב-1.5 מיליון ונמכר במיליון. מה ההשפעה?",o:["הפסד של חצי מיליון בדו\"ח רווח והפסד, ובמקביל כניסה של מיליון ש\"ח לתזרים המזומנים","הפסד של חצי מיליון גם בדו\"ח רווח והפסד וגם בתזרים המזומנים, שכן שניהם משקפים את אותה עסקה","רווח של מיליון בתזרים, ללא כל השפעה על דו\"ח רווח והפסד או על המאזן של החברה, שכן המאזן מתעדכן רק אחת לשנה בעת עריכת הדו\"חות הכספיים המבוקרים","אין השפעה על אף אחד מהדו\"חות עד לסוף שנת הכספים, שבה מתבצעת התאמה כוללת, ולכן אין צורך לבחון את השפעת העסקה על אף אחד משלושת הדו\"חות"],c:0,e:"\"בדו\"ח רווח והפסד באמת הפסדתי חצי מיליון. אבל בבנק יש לי מיליון — התזרים עלה במיליון\". זו ההמחשה לכך שכל פעולה משפיעה אחרת על שלושת הדו\"חות, ושצריך להחליט מה חשוב: תזרים או רווח."},
{t:"ניהול פיננסי",s:"הקלטה",q:"מהו \"sale and lease back\", ובאיזה הקשר הוזכר?",o:["הסכם שבו הספק מוכר לחברה ציוד ומתחזק אותו לאורך תקופת האחריות המסחרית, ואשר במסגרתה הבעלות על הציוד עוברת ללקוח רק בתום תקופת האחריות","מכירת נכסים והשכרתם חזרה — טבע מכרה כך נכסים (בהם המרכז הלוגיסטי בשוהם) במחירים לא טובים, בשל מצוקה ולצורך הקטנת החוב","החזרת נכס שכור לבעליו בתום התקופה, ללא חובת השבת המצב לקדמותו, ואשר מעוגנת במנגנון בלאי ופונקציית זמן המוסכמים מראש בהסכם השכירות","רכישת נכס בליסינג מימוני עם אופציה לרכישה מלאה בתום תקופת ההסכם, ואשר במסגרתה הנכס נרשם כרכוש קבוע בספרי החברה כבר ממועד החתימה"],c:1,e:"\"תמכור ותשכיר\" — טבע, כשנקלעה למשבר, מכרה נכסים להקטנת החוב. \"הם מכרו במחירים לא טובים כי היו במצוקה, אבל נכנס להם לתזרים המזומנים כסף\". דוגמה לשיקול תזרים מול רווח."},
{t:"ניהול פיננסי",s:"הקלטה",q:"מהו שיעור ההחזר (ROI) שבפועל מאושר, ומה הדוגמה הנגדית שניתנה?",o:["החזר של עד שנתיים מאושר; מערכות אוטומציה חורגות מכך ולכן נדחות בדרך כלל","החזר של 3-5 שנים יאושר; מערכות סולאריות מחזירות את ההשקעה רק אחרי כ-12 שנה — ולכן \"אף אחד לא רוצה לעשות\"","החזר של עד 10 שנים מאושר; רק פרויקטים מעל כך מחייבים אישור דירקטוריון","אין תקרה מוגדרת — כל השקעה נבחנת לגופה מול התועלת התפעולית הצפויה ממנה"],c:1,e:"\"אם זה חוזר בין 3 ל-5 שנים — יאשרו לכם\". דוגמה נגדית: מערכות סולאריות עם החזר של כ-12 שנה. \"מי משקיע כדי לקבל את ההחזר אחרי 12 שנה? אף אחד\". אחרי שההשקעה חוזרת — זה רווח נקי לחברה."},
{t:"רכש",s:"הקלטה",q:"איזה מנגנון תמריץ לספקים נהוג בחברות הייטק, לפי ההרצאה?",o:["בונוס שנתי קבוע לספק העומד ביעדי ה-SLA לאורך כל ארבעת הרבעונים ברציפות","כל חיסכון שהספק ייצר — 30% ממנו נשארים אצלו למשך שלוש שנים","הארכה אוטומטית של ההסכם בשנתיים נוספות לספק שעמד בכל מדדי הביצוע, ובלבד שעמד גם ביעדי החיסכון השנתיים שנקבעו לו בתחילת התקופה","העברת נתח שוק נוסף לספק המצטיין על חשבון ספקים אחרים באותה קטגוריה"],c:1,e:"\"כל חיסכון שתעשה — 30% תהנה ממנו במשך שלוש שנים\". כלומר על חיסכון של 100 אלף מתוך מיליון, הספק מקבל כ-33 אלף בכל אחת משלוש השנים. כך מעודדים את הספק לחסוך במקום להסתיר התייעלות."},
{t:"רכש",s:"הקלטה",q:"מה מצפות חברות הייטק לראות בהצעת ספק במכרז, מעבר למחיר השנה הראשונה?",o:["ערבות ביצוע בנקאית בגובה 10% מהיקף ההסכם, המתחדשת מדי שנה לאורך התקופה","התחייבות להורדת מחיר של לפחות 2%-3% בכל שנה — \"אחרת אתה לא במגרש המשחקים\"","התחייבות להעסיק צוות ייעודי באתר הלקוח לאורך כל תקופת ההתקשרות, וכן להציב מנהל תיק לקוח ייעודי המרכז את כלל הפעילות מול הלקוח","אישור עמידה בתקן ISO 9001 ובתקני איכות הסביבה הרלוונטיים לתחום השירות, וכן אישור בטיחות בעבודה בתוקף לכל אחד מהעובדים המוצבים באתר"],c:1,e:"\"אתה תגיש מכרז לחברת הייטק, ואם לא תראה שאתה מוריד לפחות 2-3% כל שנה — אתה לא במגרש המשחקים\". הציפייה: הספק יתייעל ויכיר את המקום טוב יותר עם הזמן. החברות בונות את זה לתוך התקציב שלהן."},
{t:"ניהול פיננסי",s:"הקלטה",q:"אילו שיעורי פחת מקובלים הוזכרו בהרצאה?",o:["רכב — 8 שנים; מחשבים — 5 שנים; בניין — 50 שנה","רכב — 3 שנים; מחשבים — שנתיים; בניין — 25 שנה בהתאם לתקופת ה-BOT המקובלת, בהתאמה לתקופת ההחזר המקובלת בפרויקטים ארוכי טווח מסוג זה","רכב — 15 שנה; מחשבים — 10 שנים; בניין — 100 שנה לפי אורך החיים התכנוני, ואשר נקבעו בתקנות מס הכנסה ומתעדכנים מעת לעת בהתאם למדיניות","כל הנכסים מופחתים באופן אחיד על פני 10 שנים, לפי הוראות רשות המיסים, ללא הבחנה בין סוגי הנכסים ובין ענפי הפעילות השונים במשק"],c:0,e:"\"בדרך כלל אוטו מפחיתים בשמונה שנים, מחשבים חמש שנים, בניין חמישים שנה\" — לוקחים בניין של מיליון, מחלקים ל-50 ומורידים כל שנה. שיעורי הפחת נקבעים על ידי רשות המיסים ומשתנים ממדינה למדינה."},
{t:"ניהול פיננסי",s:"הקלטה",q:"כיצד משתמשות מדינות בשיעורי הפחת ככלי מדיניות כלכלית?",o:["באמצעות הגדלת שיעור המס על נכסים שלא הופחתו במלואם בתום אורך חייהם","באמצעות האצת הפחת — נשיא ארה\"ב אישר 100% פחת בשנה אחת לעידוד החזרת מפעלים, ובישראל ב-2005 אושרה הפחתה בשלוש שנים לעידוד רכישת ציוד תשתיות","באמצעות מתן מענקים ישירים ליצרנים הרוכשים ציוד חדש בישראל ובחו\"ל","באמצעות פטור מלא ממס על רווחי הון הנובעים ממכירת ציוד ישן ומופחת"],c:1,e:"פחת מואץ = פחות מס באותה שנה = תמריץ להשקיע. בישראל ב-2005 ניתנה הפחתה בשלוש שנים לרוכשי ציוד תשתיות (מנופים, טרקטורים, מפלסות) — \"כל השוק התחדש במכונות, כי כדאי לך: אתה תשלם פחות מס\"."},
{t:"ניהול פיננסי",s:"הקלטה",q:"מה השתנה ב-2016 באופן שבו נרשמות עסקאות שכירות, ומה הייתה ההשלכה?",o:["השכירות עברה מרישום כהוצאה חודשית לרישום כהתחייבות במאזן לכל תקופת ההסכם — מה שהקפיץ את התחייבויות החברות ופגע ביכולתן לקבל אשראי בנקאי","השכירות עברה מרישום כהתחייבות במאזן לרישום כהוצאה שוטפת, מה שהקל על החברות","נקבע שיש להעריך את שווי הנכסים השכורים על ידי שמאי מוסמך אחת לשנה בלבד, ולעדכן את ערכם בספרים בהתאם לשווי השוק שנקבע בחוות הדעת","נקבע שדמי השכירות יוצמדו למדד המחירים לצרכן בכל ההסכמים החדשים שייחתמו"],c:0,e:"מ-2016 (תקן IFRS 16) כל עסקאות השכירות נרשמות כהתחייבויות במאזן: שכירות של מיליון לשנה ל-10 שנים = 10 מיליון בהתחייבויות. בטבע — 30 מפעלים ו-3 מיליון מ\"ר בשכירות — \"זה עשה הר של התחייבויות, כמעט לא יכולנו לקבל אשראי בבנקים\"."},
{t:"ניהול פיננסי",s:"הקלטה",q:"מדוע חשוב למנהל FM לדעת שהבנק בוחן את יחס הנכסים להתחייבויות?",o:["מכיוון שהבנק דורש ערבות אישית של מנהל התשתיות על התחייבויות השכירות","מכיוון שהתחייבויות שכירות ארוכות טווח מגדילות את סך ההתחייבויות ופוגעות ביכולת החברה לגייס אשראי — כך שהחלטת נדל\"ן היא גם החלטה פיננסית","מכיוון שהבנק קובע את גובה דמי הניהול שניתן לגבות מהשוכרים בנכס, ואשר משמשים אותו לחישוב יכולת ההחזר של הלוואות ארוכות טווח","מכיוון שהבנק מחייב ביטוח נפרד לכל נכס המופיע במאזן החברה המדווחת, ואשר עלותו נזקפת לסעיף הוצאות המימון בדו\"ח רווח והפסד השנתי"],c:1,e:"\"כשאני בא לבנק, הם בודקים את סך הנכסים שלי מול ההתחייבויות שלי כדי לראות שאוכל לעמוד בזה\". מאז 2016 התחייבויות השכירות נכנסות למאזן — ולכן החלטות נדל\"ן של מנהל התשתיות משפיעות ישירות על כושר האשראי של החברה."},
{t:"יעדים ומדדים",s:"הקלטה",q:"כיצד קובעים בישראל את שכר המינימום מאז 2018?",o:["הוא נקבע בהסכם קיבוצי בין ההסתדרות לנשיאות המגזר העסקי אחת לשלוש שנים, ואשר מעוגן בצווי הרחבה החלים גם על המגזר הפרטי וגם על הציבורי","כל ינואר נבדק השכר הממוצע במשק ולפיו נקבע שכר המינימום, תוך שמירה על הפרש קבוע","הוא מתעדכן אוטומטית לפי מדד המחירים לצרכן שמפרסמת הלמ\"ס מדי רבעון, ואשר מפורסם בתחילת כל רבעון יחד עם יתר מדדי המחירים במשק","הוא נקבע בחוק ומתעדכן רק בחקיקה חדשה של הכנסת, ללא מנגנון אוטומטי, ולכן הוא נותר קבוע לאורך שנים עד לתיקון חקיקה מפורש בנושא"],c:1,e:"בהרצאה: מאז חוק שכר המינימום ב-2018, כל ינואר נבדק השכר הממוצע במשק ולפיו נקבע שכר המינימום, בהפרש קבוע. בעבר הוא לא היה צמוד — מה שיצר פערים גדולים. לכך השלכה ישירה על כל הסכמי הניקיון, האבטחה, ההסעדה וההסעות."},
{t:"ניקיון, ביגוד וביטחון",s:"הקלטה",q:"מה קרה בספטמבר 2024 בעקבות העלאת שכר המאבטחים, ומי סירב לשאת בעלות?",o:["הלקוחות הפרטיים סירבו לשלם ואילו משרדי הממשלה עדכנו את המחיר באופן מיידי","משרדי הממשלה היו היחידים שסירבו — בטענה שהתקציב כבר תוכנן — והספק ספג את העלות כשלושה חודשים","חברות האבטחה ספגו את מלוא ההעלאה, שכן ההסכמים לא כללו מנגנון הצמדה לשכר","ההעלאה בוטלה למפרע לאחר עתירה של ארגוני המעסיקים לבית הדין לעבודה"],c:1,e:"\"אתם יודעים מי הלקוחות היחידים שלא הסכימו לשלם לנו? משרדי הממשלה. הוא אומר: אני תכננתי תקציב, אותי לא מעניין\" — למרות שהעלאת השכר נבעה מהחלטת הממשלה עצמה. הספק ספג שלושה חודשים. זו הסיבה שמנגנוני הצמדה בהסכמים כה חשובים."},
{t:"רכש",s:"הקלטה",q:"מתי אין לספק בסיס לדרוש עדכון מחיר בעקבות עליית שכר המינימום?",o:["כאשר ההסכם נחתם לפני פחות משנה ולכן טרם חלה עליו התייקרות כלשהי, ולכן חלה עליו תקופת הצינון הקבועה בהסכמי המסגרת בענף השירותים","כאשר השכר שהוא משלם בפועל גבוה משמעותית משכר המינימום — למשל 38 ש\"ח לשעה כששכר המינימום עולה מ-34.5 ל-36","כאשר הלקוח הוא גוף ציבורי הכפוף לחוק חובת המכרזים ולמגבלות תקציב","כאשר ההסכם כולל מנגנון קנס-פרס, המאזן ממילא את השינויים בעלויות"],c:1,e:"\"אם שכר המינימום עולה, אבל השכר שאני מקבל עבור העבודה גבוה בהרבה משכר המינימום — אין לך קייס\". דוגמה: משלמים 38 ש\"ח לשעה, ושכר המינימום עולה מ-34.5 ל-36 — העלייה עדיין מתחת למה שמשולם בפועל."},
{t:"יעדים ומדדים",s:"הקלטה",q:"מהי האזהרה שהשמיע המרצה לגבי שימוש ב-AI לאיסוף נתוני benchmark?",o:["ש-AI אינו יכול לגשת לנתוני עלות של חברות פרטיות, ולכן התשובות תמיד חלקיות","שה-AI \"ממציא\" — הוצפו פסקי דין שאינם קיימים; משרד עו\"ד הגיע ל-98.5% דיוק רק על ידי הצלבת שלוש תוכנות שונות זו מול זו","שהשימוש ב-AI לאיסוף נתונים מפר את הוראות הגנת הפרטיות החלות על הארגון, ואשר מחייב קבלת אישור מפורש מהממונה על הגנת הפרטיות בארגון","שנתוני ה-AI מעודכנים רק עד למועד האימון ולכן אינם משקפים את מחירי השוק, ואשר מחייבים אימות מול מקורות מידע עדכניים לפני כל שימוש בהם"],c:1,e:"\"האיי ממציא\" — הוצפו פסקי דין שאינם קיימים, גם בארה\"ב וגם בישראל. הפתרון שהוצג: משרד עורכי דין הגיע לכ-98.5% דיוק על ידי הרצת שלוש תוכנות שונות והצלבתן. המסקנה: אפשר להיעזר ב-AI, אך \"צריך להסתכל עליהם בצורה מבוקרת\"."},
{t:"יעדים ומדדים",s:"הקלטה",q:"מדוע לא ניתן להסתמך על מערכת הכספים כמקור נתונים לניהול תשתיות?",o:["מכיוון שהנתונים בה מתעדכנים רק בסוף כל רבעון ולכן אינם רלוונטיים לניהול שוטף, ואשר מחייבים המתנה עד לסגירת הרבעון לפני קבלת כל החלטה תפעולית","מכיוון שהיא בנויה לצורכי רשויות המס — מבחינתה זו הוצאה או השקעה, וכל ההובלה, ההסעות, הניקיון, הביטחון וההסעדה נמצאים באותו סעיף כללי אחד","מכיוון שהגישה אליה מוגבלת לאנשי הכספים בלבד ואינה נגישה למנהלי התשתיות, ואשר מחייבת הגשת בקשת הרשאה מיוחדת לכל שליפת נתונים נדרשת","מכיוון שהיא רושמת את הנתונים במטבע המדווח בלבד ולא במטבע המקומי, ואשר מחייבת המרה ידנית בכל דיווח המוגש להנהלה או לשוק ההון"],c:1,e:"\"מבחינתם זה מתאים לרשויות המס: זו הוצאה או השקעה, וזהו\". כל תחומי ה-FM מרוכזים בסעיף כללי אחד, ולכן נדרשת תשתית רישום נפרדת. \"אם לא תניח את התשתית הזאת — כל הזמן תרדוף אחרי הזנב, לאסוף נתונים מכל מיני מקומות\"."}
]);

(function(){
"use strict";
var LET=["א","ב","ג","ד"];
var SRC_META={
  "מקראה":{bg:"var(--okBg)",fg:"var(--okTx)",full:"מקראה (סיכום המרצה)"},
  "מצגת":{bg:"var(--accentSoft)",fg:"var(--accent)",full:"מצגת השיעור"},
  "מושגים":{bg:"var(--clsBg)",fg:"var(--clsTx)",full:"רשימת המושגים"},
  "ביבליוגרפיה":{bg:"var(--bibBg)",fg:"var(--bibTx)",full:"ביבליוגרפיה (פרקים 1-2)"},
  "הקלטה":{bg:"var(--warnBg)",fg:"var(--warnTx)",full:"הקלטת הרצאה"}
};
var app=document.getElementById("app");
var TOPICS=[]; (function(){var s={};BANK.forEach(function(b){if(!s[b.t]){s[b.t]=1;TOPICS.push(b.t);}}); })();
var SOURCES=[]; (function(){var s={};BANK.forEach(function(b){if(!s[b.s]){s[b.s]=1;SOURCES.push(b.s);}}); })();

var sel={topics:TOPICS.slice(),src:"all",mode:"practice",shuffle:true,minutes:0,count:0};
var quiz=[],idx=0,score=0,answered=false,wrong=[],ansMap=[],timer=null,timeLeft=0;

document.getElementById("sub").textContent =
  "אלי אהרוני · קוד 865562302 · "+BANK.length+" שאלות מ-11 מקראות, 13 מצגות, רשימת המושגים ופרקים 1-2 בביבליוגרפיה · מבחן אמריקאי, חומר פתוח, ציון עובר 60";

function E(tag,attr,html){var e=document.createElement(tag);if(attr)for(var k in attr)e.setAttribute(k,attr[k]);if(html!=null)e.innerHTML=html;return e;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function filterBank(){return BANK.filter(function(x){return sel.topics.indexOf(x.t)>=0 && (sel.src==="all"||x.s===sel.src);});}
/* מערבב את סדר התשובות בכל שאלה, כדי שהתשובה הנכונה לא תהיה תמיד באותו מקום */
function prepQ(q){
  var order=shuffle([0,1,2,3]);
  var opts=order.map(function(i){return q.o[i];});
  return {t:q.t,s:q.s,q:q.q,o:opts,c:order.indexOf(q.c),e:q.e};
}
function buildQuiz(){
  var arr=filterBank().map(prepQ);
  if(sel.shuffle)shuffle(arr);
  return arr;
}
function srcBg(s){return (SRC_META[s]||{}).bg||"var(--surface2)";}
function srcFg(s){return (SRC_META[s]||{}).fg||"var(--muted)";}
function countBy(key,val){return BANK.filter(function(b){return b[key]===val;}).length;}
function fmt(s){var m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x;}

/* ---------- theme ---------- */
function initTheme(){
  var t=null;try{t=localStorage.getItem("fmq_theme");}catch(e){}
  if(t)document.documentElement.className=t;
}
function toggleTheme(){
  var cur=document.documentElement.className;
  var isDark = cur==="dark" || (cur!=="light" && window.matchMedia && window.matchMedia("(prefers-color-scheme:dark)").matches);
  var nx=isDark?"light":"dark";
  document.documentElement.className=nx;
  try{localStorage.setItem("fmq_theme",nx);}catch(e){}
}
initTheme();

/* ---------- setup screen ---------- */
function setup(){
  stopTimer();
  app.innerHTML="";
  var c=E("div",{"class":"card"});

  c.appendChild(E("div",{"class":"note"},
    "<b>מבנה הבחינה:</b> מבחן רב-ברירתי (אמריקאי), <b>חומר פתוח</b>, ציון עובר 60. 4 תשובות לשאלה. "+
    "המבחן הוא 70% מהציון, העבודה 25% והנוכחות 5%.<br>"+
    "<b>איך לתרגל:</b> ב<b>מצב תרגול</b> מקבלים משוב והסבר אחרי כל שאלה. ב<b>סימולציית מבחן</b> עונים על הכל ורק בסוף מקבלים ציון — כמו במבחן האמיתי."));

  /* mode */
  var row1=E("div",{"class":"toolbar"});
  row1.appendChild(E("span",{"class":"lbl"},"מצב:"));
  [["practice","תרגול עם הסברים"],["exam","סימולציית מבחן"]].forEach(function(m){
    var b=E("button",{"class":"chip"+(sel.mode===m[0]?" active":"")},m[1]);
    b.onclick=function(){sel.mode=m[0];setup();};
    row1.appendChild(b);
  });
  var sp=E("span",{"class":"spacer"});row1.appendChild(sp);
  var th=E("button",{"class":"iconbtn"},"מצב כהה / בהיר");
  th.onclick=toggleTheme;row1.appendChild(th);
  c.appendChild(row1);

  /* topics */
  var row2=E("div",{"class":"toolbar"});
  row2.appendChild(E("span",{"class":"lbl"},"נושאים:"));
  var allOn=sel.topics.length===TOPICS.length;
  var ball=E("button",{"class":"chip"+(allOn?" active":"")},"הכל");
  ball.onclick=function(){sel.topics=allOn?[]:TOPICS.slice();setup();};
  row2.appendChild(ball);
  TOPICS.forEach(function(t){
    var on=sel.topics.indexOf(t)>=0;
    var b=E("button",{"class":"chip"+(on?" active":"")},t+" <small>"+countBy("t",t)+"</small>");
    b.onclick=function(){
      var i=sel.topics.indexOf(t);
      if(i>=0)sel.topics.splice(i,1);else sel.topics.push(t);
      setup();
    };
    row2.appendChild(b);
  });
  c.appendChild(row2);

  /* source */
  var row3=E("div",{"class":"toolbar"});
  row3.appendChild(E("span",{"class":"lbl"},"מקור:"));
  var ba=E("button",{"class":"chip"+(sel.src==="all"?" active":"")},"הכל <small>"+BANK.length+"</small>");
  ba.onclick=function(){sel.src="all";setup();};
  row3.appendChild(ba);
  SOURCES.forEach(function(s){
    var b=E("button",{"class":"chip"+(sel.src===s?" active":"")},((SRC_META[s]||{}).full||s)+" <small>"+countBy("s",s)+"</small>");
    b.onclick=function(){sel.src=s;setup();};
    row3.appendChild(b);
  });
  c.appendChild(row3);

  /* options */
  var row4=E("div",{"class":"toolbar"});
  row4.appendChild(E("span",{"class":"lbl"},"אפשרויות:"));
  var sh=E("button",{"class":"chip"+(sel.shuffle?" active":"")},"ערבוב שאלות");
  sh.onclick=function(){sel.shuffle=!sel.shuffle;setup();};
  row4.appendChild(sh);
  if(sel.mode==="exam"){
    [[20,"20 שאלות"],[30,"30 שאלות"],[0,"הכל"]].forEach(function(n){
      var b=E("button",{"class":"chip"+(sel.count===n[0]?" active":"")},n[1]);
      b.onclick=function(){sel.count=n[0];setup();};
      row4.appendChild(b);
    });
    [[0,"בלי שעון"],[30,"30 דק'"],[45,"45 דק'"],[60,"60 דק'"]].forEach(function(m){
      var b=E("button",{"class":"chip"+(sel.minutes===m[0]?" active":"")},m[1]);
      b.onclick=function(){sel.minutes=m[0];setup();};
      row4.appendChild(b);
    });
  }
  c.appendChild(row4);

  var n=filterBank().length;
  var info=E("div",{"class":"stats"});
  info.innerHTML="<span>נבחרו <b>"+n+"</b> שאלות</span>";
  c.appendChild(info);

  var go=E("button",{"class":"btn btn-pri"},
    sel.mode==="exam"?"התחלת סימולציית מבחן":"התחלת תרגול");
  go.style.width="100%";
  if(n===0){go.disabled=true;go.textContent="בחרו לפחות נושא אחד";}
  go.onclick=function(){ sel.mode==="exam"?examStart():practiceStart(); };
  c.appendChild(go);

  app.appendChild(c);
}

/* ---------- shared bits ---------- */
function bar(frac){
  var b=E("div",{"class":"bar"});
  b.innerHTML='<i style="width:'+(frac*100)+'%"></i>';
  return b;
}
function metaRow(q){
  var r=E("div",{"class":"qmeta"});
  r.innerHTML='<span class="pill">'+q.t+'</span><span class="pill" style="background:'+srcBg(q.s)+';color:'+srcFg(q.s)+'">'+((SRC_META[q.s]||{}).full||q.s)+'</span>';
  return r;
}
function topBar(extraHtml){
  var t=E("div",{"class":"toolbar"});
  var back=E("button",{"class":"iconbtn"},"→ חזרה להגדרות");
  back.onclick=function(){if(!timer||confirm("לצאת מהמבחן? התשובות לא יישמרו."))setup();};
  t.appendChild(back);
  t.appendChild(E("span",{"class":"spacer"}));
  if(extraHtml)t.appendChild(E("span",{},extraHtml));
  var th=E("button",{"class":"iconbtn"},"◐");
  th.onclick=toggleTheme;t.appendChild(th);
  return t;
}

/* ---------- practice mode ---------- */
function practiceStart(){
  quiz=buildQuiz();
  idx=0;score=0;wrong=[];ansMap=[];
  pRender();
}
function pRender(){
  if(idx>=quiz.length)return pResults();
  var q=quiz[idx];
  app.innerHTML="";
  var c=E("div",{"class":"card"});
  c.appendChild(topBar());
  var st=E("div",{"class":"stats"});
  function statsHtml(done){
    var seen=idx+(done?1:0);
    return "<span>שאלה <b>"+(idx+1)+"</b> / <b>"+quiz.length+"</b></span>"+
      "<span>נכונות: <b>"+score+"</b></span>"+
      "<span>שגויות: <b>"+wrong.length+"</b></span>"+
      "<span class='spacer'></span><span>הצלחה: <b>"+(seen?Math.round(score/seen*100)+"%":"—")+"</b></span>";
  }
  st.innerHTML=statsHtml(false);
  c.appendChild(st);
  c.appendChild(bar(idx/quiz.length));
  c.appendChild(metaRow(q));
  c.appendChild(E("div",{"class":"qtext"},q.q));

  var box=E("div");
  answered=false;
  q.o.forEach(function(txt,i){
    var b=E("button",{"class":"opt"});
    b.innerHTML='<span class="ltr">'+LET[i]+'</span><span>'+txt+'</span>';
    b.onclick=function(){
      if(answered)return;
      answered=true;
      var all=box.querySelectorAll(".opt");
      for(var k=0;k<all.length;k++)all[k].className="opt locked";
      all[q.c].className="opt correct locked";
      if(i===q.c){score++;}
      else{all[i].className="opt wrong locked";wrong.push(q);}
      st.innerHTML=statsHtml(true);
      var ex=E("div",{"class":"expl"});
      ex.innerHTML='<span class="tag">'+(i===q.c?"נכון · ":"התשובה הנכונה: "+LET[q.c]+" · ")+'</span>'+q.e;
      c.insertBefore(ex,navRow);
      nextBtn.disabled=false;nextBtn.className="btn btn-pri";
    };
    box.appendChild(b);
  });
  c.appendChild(box);

  var navRow=E("div",{"class":"nav"});
  var nextBtn=E("button",{"class":"btn"},idx===quiz.length-1?"סיום וצפייה בציון":"השאלה הבאה ←");
  nextBtn.disabled=true;
  nextBtn.onclick=function(){idx++;pRender();};
  var skip=E("button",{"class":"btn"},"דילוג");
  skip.onclick=function(){idx++;pRender();};
  navRow.appendChild(nextBtn);navRow.appendChild(skip);
  c.appendChild(navRow);
  app.appendChild(c);
  window.scrollTo(0,0);
}
function pResults(){
  results(score,quiz.length,wrong,practiceStart,function(){
    quiz=wrong.slice();if(sel.shuffle)shuffle(quiz);
    idx=0;score=0;wrong=[];pRender();
  },null);
}

/* ---------- exam mode ---------- */
function examStart(){
  quiz=buildQuiz();
  if(sel.count&&quiz.length>sel.count)quiz=quiz.slice(0,sel.count);
  idx=0;ansMap=new Array(quiz.length);
  timeLeft=sel.minutes*60;
  if(sel.minutes)startTimer();
  eRender();
}
function startTimer(){
  stopTimer();
  timer=setInterval(function(){
    timeLeft--;
    var el=document.getElementById("clock");
    if(el)el.textContent=fmt(timeLeft);
    if(timeLeft<=0){stopTimer();examSubmit(true);}
  },1000);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function eRender(){
  var q=quiz[idx];
  app.innerHTML="";
  var c=E("div",{"class":"card"});
  c.appendChild(topBar(sel.minutes?'זמן שנותר: <span class="clock" id="clock">'+fmt(timeLeft)+'</span>':""));
  var nAns=0;for(var i=0;i<ansMap.length;i++)if(ansMap[i]!=null)nAns++;
  var st=E("div",{"class":"stats"});
  st.innerHTML="<span>שאלה <b>"+(idx+1)+"</b> / <b>"+quiz.length+"</b></span><span>נענו: <b>"+nAns+"</b></span>";
  c.appendChild(st);
  c.appendChild(bar(nAns/quiz.length));
  c.appendChild(metaRow(q));
  c.appendChild(E("div",{"class":"qtext"},q.q));

  var box=E("div");
  q.o.forEach(function(txt,i){
    var b=E("button",{"class":"opt"+(ansMap[idx]===i?" correct":"")});
    b.innerHTML='<span class="ltr">'+LET[i]+'</span><span>'+txt+'</span>';
    b.onclick=function(){ansMap[idx]=i;eRender();};
    box.appendChild(b);
  });
  c.appendChild(box);

  var nav=E("div",{"class":"nav"});
  var prev=E("button",{"class":"btn"},"→ הקודמת");
  prev.disabled=idx===0;prev.onclick=function(){idx--;eRender();};
  var next=E("button",{"class":"btn btn-pri"},"הבאה ←");
  next.disabled=idx===quiz.length-1;next.onclick=function(){idx++;eRender();};
  nav.appendChild(prev);nav.appendChild(next);
  c.appendChild(nav);

  c.appendChild(E("div",{"class":"ptitle",style:"margin-top:16px"},"מפת שאלות — לחצו למעבר"));
  var pal=E("div",{"class":"palette"});
  quiz.forEach(function(_,i){
    var b=E("button",{"class":"pbtn"+(ansMap[i]!=null?" ans":"")+(i===idx?" cur":"")},String(i+1));
    b.onclick=function(){idx=i;eRender();};
    pal.appendChild(b);
  });
  c.appendChild(pal);

  var sub=E("button",{"class":"btn btn-pri"},"הגשת המבחן");
  sub.style.width="100%";sub.style.marginTop="14px";
  sub.onclick=function(){
    var un=quiz.length-nAns;
    if(un>0&&!confirm("נותרו "+un+" שאלות ללא מענה. להגיש בכל זאת?"))return;
    examSubmit(false);
  };
  c.appendChild(sub);
  app.appendChild(c);
  window.scrollTo(0,0);
}
function examSubmit(auto){
  stopTimer();
  var sc=0,wr=[];
  quiz.forEach(function(q,i){ if(ansMap[i]===q.c)sc++; else wr.push({q:q,given:ansMap[i]}); });
  results(sc,quiz.length,wr.map(function(x){return x.q;}),examStart,null,wr,auto);
}

/* ---------- results ---------- */
function results(sc,total,wr,onAgain,onRetryWrong,detail,auto){
  stopTimer();
  app.innerHTML="";
  var pct=total?Math.round(sc/total*100):0;
  var c=E("div",{"class":"card result"});
  if(auto)c.appendChild(E("div",{"class":"note"},"<b>הזמן נגמר</b> — המבחן הוגש אוטומטית."));
  c.appendChild(E("div",{"class":"big"},pct));
  var g = pct>=90?"מצוין — שליטה מלאה בחומר":
          pct>=80?"טוב מאוד":
          pct>=70?"טוב — כדאי לחזור על הנושאים החלשים":
          pct>=60?"עובר (ציון עובר 60) — מומלץ לחזור ולתרגל":
                  "מתחת לציון עובר — כדאי לחזור על החומר ולתרגל שוב";
  c.appendChild(E("div",{"class":"grade"},sc+" מתוך "+total+" · "+g));

  var nav=E("div",{"class":"nav"});
  var again=E("button",{"class":"btn btn-pri"},"סבב חדש");
  again.onclick=onAgain;nav.appendChild(again);
  if(onRetryWrong&&wr.length){
    var rw=E("button",{"class":"btn"},"תרגול "+wr.length+" השגויות");
    rw.onclick=onRetryWrong;nav.appendChild(rw);
  }
  var home=E("button",{"class":"btn"},"הגדרות");
  home.onclick=setup;nav.appendChild(home);
  c.appendChild(nav);
  app.appendChild(c);

  if(detail&&detail.length){
    var d=E("div",{"class":"card"});
    d.appendChild(E("div",{"class":"ptitle"},"סקירת "+detail.length+" השאלות שנענו לא נכון"));
    detail.forEach(function(x){
      var r=E("div",{"class":"rev"});
      var given = x.given==null?"<i>לא נענתה</i>":LET[x.given]+". "+x.q.o[x.given];
      r.innerHTML='<div class="rq">'+x.q.q+'</div>'+
        '<div class="ra">התשובה שלך: '+given+'</div>'+
        '<div class="rc">התשובה הנכונה: '+LET[x.q.c]+". "+x.q.o[x.q.c]+'</div>'+
        '<div style="margin-top:6px;color:var(--muted)">'+x.q.e+'</div>';
      d.appendChild(r);
    });
    app.appendChild(d);
  } else if(wr.length){
    var d2=E("div",{"class":"card"});
    d2.appendChild(E("div",{"class":"ptitle"},"נושאים לחזרה"));
    var byTopic={};
    wr.forEach(function(q){byTopic[q.t]=(byTopic[q.t]||0)+1;});
    var ul=E("div",{"class":"toolbar"});
    Object.keys(byTopic).forEach(function(t){
      ul.appendChild(E("span",{"class":"pill"},t+" — "+byTopic[t]+" שגיאות"));
    });
    d2.appendChild(ul);
    app.appendChild(d2);
  }
  window.scrollTo(0,0);
}

setup();
})();
</script>
</body>
</html>
