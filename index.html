/* ===================== 8. אחזקה ===================== */
{t:"אחזקה",s:"מקראה",q:"מהו תפקידו של מערך האחזקה?",o:["לתקן תקלות במהירות האפשרית","לאפשר פעילות תקינה של מבנים, מערכות, תשתיות ואמצעים, כדי לאפשר לעסק לפעול ברציפות והמשכיות במחיר סביר וברמת שירות טובה","לחסוך בעלויות ככל האפשר","לעמוד בדרישות הרגולציה בלבד"],c:1,e:"תפקיד מערך האחזקה: לאפשר פעילות תקינה של מבנים, מערכות, תשתיות ואמצעים — כדי שהעסק יפעל ברציפות והמשכיות, במחיר סביר וברמת שירות טובה. עיקרון מנחה: \"ככל שיודעים פחות מוציאים יותר\" — ניהול מבוסס נתונים."},
{t:"אחזקה",s:"מקראה",q:"מהם שלושת סוגי/שיטות האחזקה המרכזיים?",o:["אחזקה יומית, שבועית וחודשית","אחזקה מונעת (יזומה), אחזקה מזדמנת (שבר), ואחזקה חזויה (Predictive)","אחזקה פנימית, חיצונית ומשולבת","אחזקה מכנית, חשמלית ואלקטרונית"],c:1,e:"(1) אחזקה מונעת/יזומה — Preventive, לפי הוראות יצרן או גורם הנדסי מוסמך, בקבועי זמן מחייבים. (2) אחזקה מזדמנת/שבר — Occasional/Break, רק כשמופיעה תקלה. (3) אחזקה חזויה — Predictive, מבוססת איסוף מידע, ניתוח וקבלת החלטות."},
{t:"אחזקה",s:"מקראה",q:"מדוע בדרך כלל לא מבצעים אחזקה חזויה כאשר המערכות נמצאות באחריות יצרן?",o:["כי זה יקר מדי","כדי לא לאבד את האחריות — היצרן מתנה את קיומה בביצוע הוראות היצרן לאחזקה יזומה","כי חסרים חיישנים במערכות חדשות","כי הרגולציה אוסרת זאת"],c:1,e:"אחזקה חזויה בדרך כלל לא תבוצע כשהמערכות באחריות יצרן, כדי לא לאבד את האחריות — היצרנים מתנים את קיום האחריות בכך שהלקוח מבצע את הוראות היצרן לאחזקה יזומה."},
{t:"אחזקה",s:"מקראה",q:"מהו MTBF ומה הוא משקף?",o:["Mean Time To Repair — משך ממוצע לתיקון","Mean Time Between Failures — משך זמן ממוצע בין תקלות, המשקף את זמינות ואמינות היחידה","Maximum Time Before Failure — הזמן המרבי עד כשל","Maintenance Time Budget Factor — מקדם תקציב אחזקה"],c:1,e:"MTBF = Mean Time Between Failures — משך זמן ממוצע בין תקלות. משקף זמינות ואמינות היחידה. מושפע מגיל היחידה, מאיכות ואופן התחזוקה המונעת ומשימוש בחלקים מקוריים."},
{t:"אחזקה",s:"מקראה",q:"מהו MTTR?",o:["Mean Time To Repair — משך ממוצע לביצוע תיקון והשבה לפעילות","Mean Time To Replace — משך ממוצע להחלפת מערכת","Maximum Tolerable Time of Recovery — זמן ההתאוששות המרבי","Maintenance Task Time Ratio — יחס זמני משימות אחזקה"],c:0,e:"MTTR = Mean Time To Repair — משך ממוצע לביצוע תיקון והשבה לפעילות, על בסיס נתוני יצרן, ניסיון הצוות ומדידת ביצועים בעבר. יחד עם MTBF אלו מדדי הבסיס לתכנון מערך האחזקה."},
{t:"אחזקה",s:"מקראה",q:"מהו מדרג העוצמות הנכון בין מדיניות, סטנדרט ונוהל?",o:["נוהל >> סטנדרט >> מדיניות","מדיניות >> סטנדרט >> נוהל (Policy >> Standard >> Procedure)","סטנדרט >> מדיניות >> נוהל","שלושתם באותה רמה"],c:1,e:"מדרג העוצמות: מדיניות (Policy) >> סטנדרט (Standard) >> נוהל (Procedure). ה-SOP — Standard Operating Procedure — מגדיר את הנורמות, התהליכים והסטנדרטים לפיהם יש לפעול בתחום מסוים."},
{t:"אחזקה",s:"מקראה",q:"מהם ראשי התיבות BOT, PFI ו-PPP?",o:["Build Operate Transfer; Private Finance Initiative; Public Private Partnership","Business Operations Team; Public Facility Investment; Preventive Planning Process","Budget Oriented Tender; Private Facility Investment; Public Procurement Policy","Building Operation Technology; Predictive Facility Intelligence; Physical Plant Protection"],c:0,e:"BOT = Build Operate Transfer; PFI = Private Finance Initiative; PPP = Public Private Partnership. הסכמים ארוכי טווח בין המגזר הפרטי לשירות הציבורי — קריות ממשלה, קריית ההדרכה, קריית המודיעין ועוד. החזר השקעה כ-25 שנה כולל תפעול ואחזקה."},
{t:"אחזקה",s:"מקראה",q:"מהי \"קרן חידוש\" בהקשר של תמחור אחזקה במודל BOT?",o:["קרן פנסיה של עובדי האחזקה","מנגנון תמחור המביא בחשבון החלפת מערכות לאורך תקופה ארוכה — כולל התייחסות לשנים הראשונות תחת אחריות ולירידת ערך המערכות עד להחלפה","קרן להשקעה בטכנולוגיות חדשות","קרן חירום לתיקוני שבר"],c:1,e:"במודל BOT (תמחור ל-25 שנה) משלבים קרן חידוש וקרן פחת. הנחות היסוד לתמחור: כוח אדם, חלפים, חומרים ומכללים עד להחלפה — עם התייחסות לשנים ראשונות תחת אחריות ומערכת חדשה ההולכת ופוחתת עד החלפה."},
{t:"אחזקה",s:"מקראה",q:"מהו ההבדל בין QA ל-QC?",o:["QA היא בדיקה מדגמית ו-QC היא בדיקה מלאה","QA (אבטחת איכות) היא ניהול האיכות — מגוון בדיקות לאורך תהליך הפיתוח, הייצור והאריזה למניעת פגמים; QC (בקרת איכות) היא פיקוח על ניהול האיכות ובדיקה מדגמית בסוף התהליך","QA מבוצעת על ידי הלקוח ו-QC על ידי הספק","אין הבדל — שני מונחים לאותו דבר"],c:1,e:"QA = Quality Assurance — אבטחת איכות, מניעת פגמים לאורך התהליך; למעשה ניהול האיכות. QC = Quality Control — בקרת איכות, פיקוח ובדיקה מדגמית בסוף התהליך ובקרה על תהליך אבטחת האיכות."},
{t:"אחזקה",s:"מקראה",q:"מהו העיקרון \"עשית לא תיעדת — לא עשית\"?",o:["כלל אצבע לניהול זמן","עיקרון התיעוד באחזקה — כל הפעילות חייבת להיות מתועדת: תכנון, מדיניות, תוכנית אחזקה, אבטחת איכות, בטיחות, איכות סביבה, הדרכות והכשרות","כלל בטיחות בעבודה בגובה","דרישה של חברות הביטוח בלבד"],c:1,e:"עיקרון התיעוד: \"עשית לא תיעדת, לא עשית\". נדרשת היערכות לתיעוד כלל הפעילות — מתכנון ומדיניות ועד תוכנית אחזקה מפורטת, אבטחת איכות, בטיחות, איכות סביבה, קיימות והכשרות — לפי דרישות הרגולטורים ומדיניות החברה."},
{t:"אחזקה",s:"מקראה",q:"מהו תקן LEED וכיצד הוא מדורג?",o:["תקן ישראלי לבנייה ירוקה","Leadership in Energy and Environmental Design — תקן אמריקאי המדורג: מאושר 49+, כסף 59+, זהב 79+, פלטינום 80+","תקן בטיחות אש בינלאומי","תקן לניהול איכות מסוג ISO"],c:1,e:"LEED = Leadership in Energy and Environmental Design. דירוג: מאושר 49+, כסף 59+, זהב 79+, פלטינום 80+. לכל קטגוריה משקל, כשחיסכון באנרגיה מקבל את המשקל הגבוה ביותר (35). התקן הישראלי המקביל: ת\"י 5281 לבנייה ירוקה."},
{t:"אחזקה",s:"מקראה",q:"מהי החלוקה המקובלת לגובה מבנים לפי הרשות להתחדשות עירונית?",o:["עד 10 קומות נמוך, מעל 10 גבוה","עד 4 קומות בניין נמוך, 5-9 בניין גבוה, 9-20 רב-קומות, מעל 20 מגדל, 60 ומעלה גורד שחקים","עד 8 קומות רגיל, 8-30 מגדל, מעל 30 גורד שחקים","אין חלוקה רשמית בישראל"],c:1,e:"החלוקה: עד 4 קומות — בניין נמוך; 5-9 — בניין גבוה; 9-20 — בניין רב-קומות; מעל 20 — מגדל; 60 ומעלה — גורד שחקים. חשוב לציין: אין רגולציה בישראל לחברות ניהול נכסים (בכנסת בתהליכי חקיקה חיוב חברות ניהול בבניינים גבוהים)."},
{t:"אחזקה",s:"מקראה",q:"מהו ILS ומדוע הוא חשוב בבחינת מחזור חיים?",o:["Integrated Logistics Support — שילוב כלל הגורמים האפשריים משלב הייזום, ובעיקר המשתמש והעסק המפעיל","International Labour Standard — תקן עבודה בינלאומי","Internal Loss Statement — דו\"ח הפסדים פנימי","Infrastructure Life Span — תוחלת חיי התשתית"],c:0,e:"ILS = Integrated Logistics Support. בעלי תפקידים שונים נושאים באחריות לכל שלב בחיי המערכת ויש להם אינטרסים נוגדים: היוזם מציג טכנולוגיה גבוהה במחיר נמוך; מנהל הפרויקט רוצה לו\"ז קצר ומחיר נמוך; והמשתמש נושא בתוצאות בתפעול ובתחזוקה."},
{t:"אחזקה",s:"מקראה",q:"מהי \"בעיית קבלני חצר\" באחזקה?",o:["קבלנים שאינם מורשים לעבוד באתר","קבלנים המייצרים עבודה יזומה ולא הכרחית","קבלנים שאינם עומדים בלוחות זמנים","קבלנים המעסיקים עובדים ללא היתר"],c:1,e:"במקראה נכתב במפורש: \"קבלני חצר — מייצרים עבודה יזומה ולא הכרחית\". זהו סיכון מובנה כשהקבלן הוא גם המאבחן וגם המבצע. השילוב המומלץ: מחלקת הנדסה מקומית עם מומחים לפי תחומי עיסוק ושורת הסכמים 24/7 עם רמת שירות מוסכמת."},
{t:"אחזקה",s:"מקראה",q:"מהי חובת ההיערכות של עסק להמשכיות עסקית בחירום?",o:["רק במפעלים המוגדרים כחיוניים","חובת כל עסק לתכנן ולהיערך להמשכיות רצופה בכלל מצבי החירום; בחברה ציבורית אף חובה לדווח מדי שנה לרשות לניירות ערך סקר סיכונים ופתרונות","רק בחברות ממשלתיות","רק כאשר קיים איום מוחשי"],c:1,e:"חובת כל עסק לתכנן ולהיערך להמשכיות עסקית רצופה. מחייב חשיבה לאור ניתוח סיכונים; בחברה ציבורית חובה לדווח לרשות לניירות ערך ולבורסה מדי שנה סקר סיכונים ופתרון אפשרי לסיכונים ברמה הגבוהה ביותר. הקורונה המחישה שאף אחד לא צפה השבתה מוחלטת."},
{t:"אחזקה",s:"מקראה",q:"מי מנפיק רישיון עסק בישראל?",o:["משרד הפנים","אך ורק הרשות המקומית — לאחר אישורי הגורמים השונים (כיבוי אש, משטרה, משרד הבריאות ועוד)","מכון התקנים","משרד הכלכלה"],c:1,e:"את הרישיון מנפיקה אך ורק הרשות המקומית, לאחר שלבים מקדימים של ביקורות: מחלקת רישוי עסקים, אגף הנדסה ורישוי בנייה, כיבוי אש, משטרה, משרד הבריאות ואחרים לפי העניין. (חוק רישוי עסקים — תיקון מספר 34.)"},
{t:"אחזקה",s:"מקראה",q:"מהו BMS?",o:["Business Management System","Building Management System — מערכת בקרת מבנה","Budget Monitoring Standard","Basic Maintenance Schedule"],c:1,e:"BMS = בקרת מבנה. יחד עם IOT (ניטור באמצעות חיישנים — אקוסטי, מהירות, חום, לחות, לחצים, חזותי) ו-AI (עיבוד נתונים, השוואה, התראה והתערבות יזומה) מאפשרים אחזקה חזויה — התייעלות קווי ייצור של כ-40% והתראה לפני השבתה."},

/* ===================== 9. יעדים ומדדים ===================== */
{t:"יעדים ומדדים",s:"מקראה",q:"מהו העיקרון היסודי בניהול עסקי לפי המקראה?",o:["\"מה שנמדד — משתפר\"","\"כל דבר נמדד; מה שאינו יכול להימדד לא קיים\"","\"מדדים הם כלי משני לניהול\"","\"עדיף מדד אחד טוב מעשרה בינוניים\""],c:1,e:"\"ניהול עסקי כולל בתוכו יעדים עסקיים ברורים להשגה וכן כל דבר נמדד, מה שאינו יכול להימדד לא קיים\". בנוסף: \"יעד צריך להיות אתגרי אבל בר השגה\"."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו ההבדל בין COST REDUCTION ל-COST AVOIDANCE?",o:["אין הבדל — שני שמות לאותו דבר","COST REDUCTION הוא הורדת הוצאות באופן ברור ומוחלט על בסיס זהה; COST AVOIDANCE הוא מניעת הוצאה — יעד וערך בפני עצמו אך אינו מוחלט","COST AVOIDANCE הוא חיסכון גדול יותר","COST REDUCTION חל רק על השקעות"],c:1,e:"COST REDUCTION — הורדת הוצאות מוחלטת, נבחנת מול שנה קודמת או רבעון מקביל. COST AVOIDANCE — מניעת הוצאה. דוגמה: שכירות שהייתה אמורה להתייקר ב-5% ולאחר מו\"מ עלתה ב-2% בלבד — זה אינו חיסכון (יקר משנה קודמת) אלא מניעת הוצאה גדולה יותר."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו LRP ומהו AOP?",o:["LRP — תוכנית עבודה שנתית; AOP — תוכנית ארוכת טווח","LRP (Long Range Plan) — תכנון אסטרטגי ל-3-5, 10 שנים ומעלה, מתעדכן כל שנה; AOP (Annual Operation Planning) — תוכנית עבודה שנתית מפורטת הנגזרת ממנה, מחולקת לרבעונים","LRP ו-AOP הם שמות שונים לאותו תהליך","LRP הוא דו\"ח כספי ו-AOP הוא תקציב"],c:1,e:"LRP = תכנון ארוך טווח (3-5, 10 שנים ואף יותר), מבטא כיוון אסטרטגי, מתעדכן שנתית ומשפיע מאוד על שוק ההון. AOP = תכנון שנתי מפורט להשגת יעדים עסקיים, מחולק לרבעונים: הכנסות, הוצאות, השקעות, תזרים, רווח תפעולי ונקי, EBITDA, EPS."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו LBE ומתי משתמשים בו?",o:["Long Business Estimate — הערכה עסקית ארוכת טווח","Last Best Estimation — עדכון התכנון השנתי לאחר הרבעון הראשון, לאור שינויים בלתי צפויים; המדידה נעשית כל רבעון גם ביחס ל-AOP וגם ביחס ל-LBE","Local Business Expense — הוצאה עסקית מקומית","Limited Budget Execution — ביצוע תקציב מוגבל"],c:1,e:"LBE = Last Best Estimation. מתבצע לאחר רבעון ראשון, בצמוד ל-AOP, לאור שינויים בלתי צפויים (למשל קורונה, מלחמה, אסונות טבע). התכנון המקורי נשאר תמיד כפי שתוכנן ולצדו ה-LBE; המדידה נעשית מול שניהם."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו KPI ומה תפקידו?",o:["Key Process Integration — שילוב תהליכים מרכזי","Key Performance Indicator — מדד ביצוע עיקרי המשקף ביצועים בתחום פעילות, מאפשר מיקוד והכוונה ניהוליים, השוואות ואיתור חריגים","Knowledge Performance Index — מדד ידע ארגוני","Key Planning Instrument — כלי תכנון מרכזי"],c:1,e:"KPI = Key Performance Indicator, מדד ביצוע עיקרי. דוגמאות: עלות לייצור אלף טבליות, מחיר שכירות למ\"ר, עלות הסעדה לעובד, צפיפות למ\"ר, עלות ניקיון למ\"ר, עלות ביטחון למ\"ר."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו SLA ומה הוא כולל?",o:["Service Level Agreement — הסכם רמת שירות הקובע מהם המדדים, מהו היעד לכל מדד ומהי שיטת המדידה (מקור הנתונים, שיטת האיסוף ואופן החישוב)","Standard Level Assessment — הערכת רמת סטנדרט","Supplier List Approval — אישור רשימת ספקים","Strategic Long-term Agreement — הסכם אסטרטגי ארוך טווח"],c:0,e:"SLA = Service Level Agreement. מגדיר מהם המדדים, מהו היעד לכל מדד ומהי שיטת המדידה. דוגמאות: מענה תוך 2 דקות ב-95% מהמקרים במוקד; תיקון תקלה משביתה תוך שעתיים ב-95% מהמקרים; שביעות רצון ממוצעת של 90%."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו BENCHMARK בהקשר של מדידה בניהול תשתיות?",o:["הגדרת נקודת הפתיחה לפני שיפור","השוואה בין עסקים בעלי זהות תפעולית — בין אתרים באותה חברה, בין מדינות (עם נרמול הערך הכספי) ומול עסקים אחרים","קביעת יעד שנתי לשיפור","תקן בינלאומי לניהול תשתיות"],c:1,e:"BENCHMARK = השוואת ביצועים בין עסקים בעלי עיסוק דומה. ניתן להשוות בין אתרים בעלי זהות תפקודית בחברה, בין מדינות עם נרמול הערך הכספי, ומול עסקים אחרים. (\"נקודת הפתיחה לפני שיפור\" היא BASELINE.)"},
{t:"יעדים ומדדים",s:"מקראה",q:"לפי איזה עיקרון בוחרים נושא לטיפול ולשיפור?",o:["לפי בקשת העובדים","לפי ניתוח היקף כספי (PARETO), חשיבות הנושא מבחינת העסק, או בחינה מחזורית של נושאים כל תקופת זמן","לפי סדר אלפביתי של הנושאים","לפי מה שקל ביותר ליישום"],c:1,e:"בחירת נושא לטיפול נעשית לפי ניתוח היקף כספי (עיקרון פארטו), חשיבות הנושא לעסק, או בחינה מחזורית של נושאים כל תקופת זמן."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו הסדר הנכון של שלבי בחינת נושא לשיפור?",o:["קביעת יעד ← מדידה ← ביצוע","הגדרת הנושא ← למידה שיטתית של הקיים בחברה ← למידה מחברות אחרות (BENCHMARK) ← הבנת צרכי העסק ← קביעת תוכנית מוסכמת עם סמכות ואחריות","ביצוע שינוי ← בדיקת תוצאות ← תיעוד","פנייה ליועץ חיצוני ← יישום המלצותיו"],c:1,e:"השלבים: הגדרת הנושא; למידה שיטתית — מה קיים, איך מתנהל, תהליכים מרכזיים, סמכות ואחריות, רמת שירות, KPI/SLA, מידע פיננסי משנים קודמות; למידה מחברות אחרות (BENCHMARK); הבנת צרכי העסק; וקביעת תוכנית מוסכמת עם סמכות ואחריות ותוכנית הטמעה."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו EPS ומדוע הוא רלוונטי למנהל תשתיות?",o:["Expense Per Site — הוצאה לאתר","Earnings Per Share — רווח למניה; היעד בחברה עסקית ציבורית הוא להגדילו, ולכן קיים צורך מתמיד להוריד הוצאות","Employee Performance Score — ציון ביצועי עובד","Energy Performance Standard — תקן ביצועי אנרגיה"],c:1,e:"EPS = Earnings Per Share, רווח למניה. תפקיד המנהל בחברה ציבורית \"להעשיר ולהשיא רווחים לבעלי המניות\", ולכן יש צורך מתמיד להוריד הוצאות — גם בעסקים מצליחים ורווחיים. גם במלכ\"ר יש צורך דומה, כדי להוסיף או להרחיב שירותים."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו טווח ההחזר המקובל להשקעה (ROI) שיש להציג?",o:["עד שנה","מקובל 5-8 שנים לכל היותר","15-20 שנה","אין דרישה להצגת החזר השקעה"],c:1,e:"בכל השקעה נדרש להציג החזר השקעה — תוך כמה זמן ההשקעה תוחזר כספית. המקובל: 5-8 שנים לכל היותר."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהם אמצעי המדידה של שביעות רצון שהוצגו?",o:["רק סקר שנתי","סקר שנתי קבוע הדוגם אוכלוסייה דומה באותן שאלות; משוב הנשלח אחרי כל טיפול; ומספונים/מסכי שביעות רצון (בדרך כלל 4 פרצופים) במקומות שירות","רק תלונות שהתקבלו במוקד","רק ראיונות אישיים עם עובדים"],c:1,e:"שלושה אמצעים: סקר שנתי קבוע באותן שאלות לאוכלוסייה דומה; משוב אחרי כל טיפול; ומספונים/מסכים במקומות שירות (שירותים, חדר אוכל, מקלחות) — בדרך כלל 4 פרצופים עם אפשרות פירוט. חשוב לנתח, ולקבוע דרך פעולה לתלונה — אם קריטי, תוך 10 דקות."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו מדד MICE?",o:["מדד לבקרת מזיקים במבנים","מדד בתחום כנסים ואירועים — עלות למשתתף בכנס מקצועי, עלות למשתתף בכנס ניהולי","מדד יעילות אנרגטית","מדד שביעות רצון עובדים"],c:1,e:"MICE = תחום הכנסים והאירועים. המדדים: עלות למשתתף בכנס מקצועי, עלות למשתתף בכנס ניהולי. ניתן להפיק ממערכות לניהול כנסים ואירועים בחיבור עם מערכות נסיעות חו\"ל."},

/* ===================== 10. ניהול פיננסי ===================== */
{t:"ניהול פיננסי",s:"מקראה",q:"מהם שלושת הדו\"חות הכספיים המרכזיים החשובים למנהל עסקי?",o:["דו\"ח רווח והפסד, דו\"ח מאזן, דו\"ח תזרים מזומנים","דו\"ח רווח והפסד, דו\"ח מלאי, דו\"ח שכר","דו\"ח מאזן, דו\"ח תקציב, דו\"ח ביקורת","דו\"ח תזרים מזומנים, דו\"ח השקעות, דו\"ח מיסוי"],c:0,e:"שלושת הדו\"חות: רווח והפסד (P&L); מאזן (Balance Sheet) — \"תצלום של הנכסים, ההתחייבויות וההון העצמי לסוף תקופה חשבונאית\"; ותזרים מזומנים (Cash Flow)."},
{t:"ניהול פיננסי",s:"מקראה",q:"מהו ההבדל בין EXPENSE ל-CAPEX?",o:["EXPENSE הן הוצאות גדולות ו-CAPEX הוצאות קטנות","EXPENSE הן הוצאות ההפעלה והייצור שאינן השקעות; CAPEX הן סך ההשקעות ברכוש קבוע ובכלל, המוכרות כהשקעה בהיבט החשבונאי","EXPENSE חלות רק על שכר ו-CAPEX רק על ציוד","אין הבדל חשבונאי מהותי"],c:1,e:"EXPENSE = הוצאות ההפעלה והייצור שאינן השקעות, המוכרות בהיבט החשבונאי. CAPEX (Capital Expenditure) = סך ההשקעות ברכוש קבוע ובכלל, המוכרות כהשקעה. חשוב להבין את ההבדל ואת ההשפעה על הדו\"חות הכספיים."},
{t:"ניהול פיננסי",s:"מקראה",q:"מהו EBITDA?",o:["Earnings Before Interest, Taxes, Depreciation, Amortization — רווח לפני ריבית, מס, פחת והפחתות; מאפשר השוואה טובה יותר בין עסקים דומים","Estimated Business Income Total Direct Assets","Expense Budget In Total Direct Allocation","Earnings Balance In Trading Development Accounts"],c:0,e:"EBITDA = רווח לפני ריבית, מס, פחת והפחתות. מאפשר השוואה טובה יותר של ביצועים עסקיים בין עסקים דומים, מכיוון שהוא מנטרל השפעות מימון, מיסוי ומדיניות פחת."},
{t:"ניהול פיננסי",s:"מקראה",q:"מהו \"פחת\" (DEPRECIATION) ומה משמעותו?",o:["ירידת ערך של מלאי שלא נמכר","הפחתת ערך ההשקעה לאורך שנים, הנרשמת בדו\"ח רווח והפסד תחת סעיף פחת, לפי הקבוע בהוראות רשות המיסים","הפסד שנוצר ממכירת נכס","הוצאה חד-פעמית בשנת הרכישה"],c:1,e:"כל השקעה כרוכה בהפחתת ערך בדו\"ח רווח והפסד תחת סעיף פחת. עלות ההשקעה מופחתת לאורך שנים, לפי סוג ומספר שנים המאושרים על ידי רשות המיסים."},
{t:"ניהול פיננסי",s:"מקראה",q:"מהן שלוש שיטות הרישום והדיווח החשבונאי העיקריות?",o:["מזומן, מצטבר, מעורב","תקן ישראלי (Israel GAAP), IFRS (הגישה האירופית, שאומצה גם בישראל), ו-US GAAP (השיטה האמריקאית)","FIFO, LIFO, ממוצע משוקלל","שיטת העלות, שיטת השווי המאזני, שיטת האיחוד"],c:1,e:"שלוש השיטות: Israel GAAP; IFRS — גישה אירופית שהרבה חברות בישראל אימצו; ו-US GAAP — שיטה אמריקאית שאומצה גם על ידי חברות בינלאומיות. מרגע שחברה מחליטה ומקבלת אישור היא חייבת לעבוד לפי כלל הנהלים של השיטה."},
{t:"ניהול פיננסי",s:"מקראה",q:"מול אילו פרמטרים נעשית הבקרה על הביצוע התקציבי?",o:["רק מול התכנון השנתי","ביצוע מול תכנון מאושר (AOP), ביצוע מול רבעון מקביל אשתקד, ומרבעון 2 גם מול LBE אם קיים","רק מול השנה הקודמת","רק מול תחזית הרבעון הבא"],c:1,e:"כל מדידה נעשית מול: (1) ביצוע מול תכנון מאושר AOP; (2) ביצוע מול רבעון מקביל בשנה קודמת; (3) החל מבקרת רבעון 2 — גם מול LBE אם קיים."},
{t:"ניהול פיננסי",s:"מקראה",q:"מהי \"קומבינציה חשבונאית\" ומדוע היא קריטית למנהל FM?",o:["שילוב בין שיטות דיווח שונות","מספר בן 14-16 ספרות, המשתנה בכל חברה, המתאר את סוג העסק, התחום והחשבון — רישום נכון שלו מאפשר ניהול על בסיס הפעילות הכספית","הצמדה של מספר מטבעות בחוזה","שילוב תקציב הוצאות והשקעות"],c:1,e:"\"הכול מתחיל ברישום נכון\". הקומבינציה החשבונאית — מספר בן 14-16 ספרות המשתנה בכל חברה — מתארת את סוג העסק, התחום והחשבון. רישום נכון מאפשר ניהול ובקרה על בסיס הפעילות הכספית ובניית KPI אמינים."},
{t:"ניהול פיננסי",s:"מקראה",q:"מדוע רישום ההוצאות בחברה אינו בהכרח מספק את צרכי מנהל התשתיות?",o:["כי מערכות הכספים אינן מדויקות","כי את הכספים מעניינים בעיקר הוצאות/השקעות לפי סוגים הרלוונטיים למיסוי, לרגולציה ולשוק ההון — ולא רמת הפירוט והסיווג שמנהלי תשתיות נדרשים לה; הרבה הוצאות נרשמות כ\"הוצאות שונות\" או \"הנהלה וכלליות\"","כי הרישום נעשה במטבע זר","כי הדיווח הוא רבעוני בלבד"],c:1,e:"בדרך כלל לא קיים בחברות פירוט מספק — הצרכים והאינטרסים שונים. הכספים מתמקדים במיסוי, ברגולציה ובשוק ההון; הרבה הוצאות נרשמות תחת \"שונות\" או \"הנהלה וכלליות\". לכן נדרשת בניית תשתית רישום ב-cost centers, בדרך כלל 3-5 לפי מדינה."},
{t:"ניהול פיננסי",s:"מקראה",q:"כיצד מתבצעת הבקרה על הוצאות בחברה ציבורית?",o:["ביקורת שנתית של רואה חשבון בלבד","אישור כל הוצאה על ידי לפחות 2 מאשרים מעבר לרכש ולגורמים המקצועיים, בקרה חודשית מחייבת, ודיווח רבעוני לשוק ההון","אישור מנהל הכספים בלבד","בקרה רק על הוצאות מעל מיליון ש\"ח"],c:1,e:"בחברה ציבורית: אישור כל הוצאה לפחות על ידי 2 מאשרים, מעבר לרכש ולגורמים המקצועיים הרלוונטיים; בקרה חודשית מחייבת; ודיווח רבעוני לשוק ההון על התוצאות העסקיות."},
{t:"ניהול פיננסי",s:"מקראה",q:"אילו שני מרכיבים נבחנים בדיווח הפיננסי של יחידת ה-FM?",o:["רק הוצאות התפעול","ההוצאות וההשקעות לפי הסעיפים השונים (הסעדה, הסעות וכו'), וכן עלות השכר של יחידת ה-FM — היקף כספי וכמות עובדים","רק עלות השכר","רק ההשקעות ברכוש קבוע"],c:1,e:"שני המרכיבים: (1) ההוצאות וההשקעות לפי סעיפים — הסעדה, הסעות וכו'; (2) עלות השכר של יחידת ה-FM — היקף כספי וכמות עובדים. שניהם נבחנים מול תוכנית העבודה שאושרה, מול שנה קודמת ומול LBE אם קיים."},

/* ===================== 11. מנהיגות ניהולית ===================== */
{t:"מנהיגות ניהולית",s:"מקראה",q:"במה שונה מהותית \"ניהול מנהלים\" מניהול עובדים?",o:["בכך שמנהלים דורשים שכר גבוה יותר","המנהלים שאתה מנהל הם ברמה גבוהה יותר, עם ניסיון והרגלים קיימים, ולעיתים מומחים בתחום שאתה לא — מה שמחייב תפיסה ניהולית מותאמת ומוטת שליטה מתאימה","בכך שאין צורך בהערכת ביצועים","בכך שהניהול מתבצע רק דרך דו\"חות"],c:1,e:"ניהול מנהלים מאתגר מכיוון שהמנוהלים הם ברמה גבוהה יותר, בעלי ניסיון והרגלים, ולעיתים מומחים בתחומם שאתה אינך מומחה בו. התפיסה הניהולית צריכה להתאים לרמה ולהיקף המנוהל."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהי המשמעות של \"צניעות (ענווה)\" כתכונה ניהולית?",o:["להימנע מהצגת הישגים אישיים","ההבנה שהאנשים שאתה מנהל חכמים ומקצועיים בתחומם לפחות כמוך אם לא יותר — ולכן יש לתת לכולם מקום, להקשיב ולהתייחס לדעתם; היתרון העיקרי שלך הוא הניסיון","לוותר על סמכות ניהולית","לא לקבל החלטות לבד"],c:1,e:"צניעות = ההבנה שהמנוהלים חכמים, מהירי מחשבה ומקצועיים בתחומם לפחות כמוך. לכן: לתת מקום, להקשיב, להתייחס לדעות. \"העדיפות העיקרית שיש לך היא הניסיון\" — ולנהוג בכבוד, בסבלנות ובסובלנות לדעות שונות."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהו העיקרון \"פשטות\" בהנחיית מנהלים?",o:["לפשט את התהליכים העסקיים עצמם","\"מה שלא פשוט — פשוט לא עובד\": יש להפריד בין תהליך התכנון הסבוך והמורכב לבין ההנחיה למנהלים, שחייבת להיות פשוטה וברורה — מה לעשות, איך ובאיזה לוח זמנים","להימנע מניתוחים מורכבים","לצמצם את מספר המנהלים"],c:1,e:"\"מה שלא פשוט — פשוט לא עובד\". חייבת להיות הפרדה בין התכנון הסבוך והמורכב (אקסל עם ניתוחים רבים) לבין ההנחיה — שיש לזקק למספר משפטים קצרים וברורים. פשטות היא גם היכולת לקבל בעיות מורכבות ולפשט אותן."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"כיצד נתפסת \"יכולת הודאה בטעות\" אצל מנהל?",o:["כחולשה שיש להימנע ממנה","כעוצמה — היא משדרת אנושיות ומסר לכפיפים שמותר לטעות, בתנאי שאין מדובר בטעות חוזרת; יש לתחקר ולהסיק מסקנות אך לא להעניש על טעות","כדבר שיש לעשות רק מול הממונים","כפעולה שיש לתעד לצורכי משמעת"],c:1,e:"\"היכולת להודות בטעות היא עוצמה, לא חולשה\" — תחת ההנחה שאינה חוזרת על עצמה. משדרת אנושיות ומסר שמותר לטעות. נדרשים תחקיר, הסקת מסקנות ויישום — אך לא ענישה על טעות שאינה סדרתית."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהי אחת ההחלטות הקשות והחשובות ביותר למנהל שתחום פעולתו רחב?",o:["את מי לקדם ואת מי לפטר","במה הוא עוסק פחות ובמה בכלל לא — מבין הנושאים שבתחום אחריותו — מתוך הבנה שיש לכך מחיר, ותוך בניית מערכות בקרה למזעור נזקים","כמה תקציב להקצות לכל יחידה","באילו כנסים מקצועיים להשתתף"],c:1,e:"\"אחת ההחלטות הקשות אבל החשובות למנהל שתחום פעולתו רחב — במה הוא עוסק פחות ומה בכלל לא\". זה חייב להיות ברור, מוגדר ושקוף למנהלים המנוהלים, גם אם לא נעים, ומחייב מערכות בקרה למזעור נזקים אפשריים."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהן מסגרות העבודה שמנהל צריך לקבוע מול המנהלים המדווחים לו?",o:["רק פגישת הנהלה שבועית","פגישת הנהלה, הנהלה מורחבת (רבעונית), דיון נושאי, פגישת עבודה שוטפת (שבועית/דו-שבועית), ופגישה אישית שנתית בסמוך להערכת עובדים","רק פגישות אישיות","רק דיונים נושאיים לפי הצורך"],c:1,e:"מסגרות העבודה: פגישת הנהלה; הנהלה מורחבת (מומלץ רבעונית, לרובד ניהולי שני); דיון נושאי; פגישת עבודה שוטפת (שבועית/דו-שבועית, כשעה עד שעה וחצי); ופגישה אישית שנתית. \"באין מסגרות עבודה קבועות וברורות ומוגדרות — יש מהומה\"."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהו הכלל לגבי פתיחת פגישה במסגרות עבודה קבועות?",o:["לפתוח בעדכון על תוצאות החברה","לפתוח בסקירת הסיכום של הפגישה הקודמת","לפתוח בסבב עדכונים אישיים","לפתוח בהצגת יעדי הרבעון"],c:1,e:"בכל מסגרות העבודה — פגישת הנהלה, מפגש ספק-לקוח, דיון נושאי — הכלל הוא: \"המפגש הבא תמיד יפתח בסקירת הסיכום של המפגש הקודם\". כך נוצרת אחריות למעקב ולביצוע."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהי השאלה שמנהל צריך לשאול את עצמו כל יום?",o:["האם עמדתי בכל לוחות הזמנים?","\"מה הערך שהבאתי היום לחברה?\" — ואם התשובה במשך יותר מיום אחד היא שלא הבאתי, יש בעיה שמחייבת שינוי","האם כל הכפיפים מרוצים?","האם חרגתי מהתקציב?"],c:1,e:"\"מנהל חייב לשאול את עצמו כל יום — מה הערך שהבאתי היום לחברה? אם התשובה של יותר מיום אחד שלא הבאתי, אני בבעיה\". זה מניע לעסוק בעיקר ובחשוב ופחות בדחוף."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהו \"ניהול מטריציוני\" ומהו הכלל החשוב בו?",o:["ניהול לפי מטריצת סיכונים","מבנה המקובל בחברות גלובליות שבו עובד מדווח למנהל מקצועי ממונה אך כפוף ניהולית לאחר; הכלל: כל מנהל חייב להיות מנוהל באופן ברור על ידי מנהל אחד, ויש להבחין בין הנחיה מקצועית להוראה עסקית","ניהול שבו כל עובד מדווח לשני מנהלים שווי מעמד","ניהול ללא היררכיה כלל"],c:1,e:"ניהול מטריציוני (Business partnership) מקובל בחברות גלובליות. חשוב להקפיד על הגדרות סמכות ואחריות ולא לשבור קווים, ובוודאי לא הנחיות סותרות. \"כל מנהל חייב להיות מנוהל באופן ברור על ידי מנהל אחד\", והסמכות תמיד אצל המנהל הנושא באחריות."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהי הגישה הנכונה לקבלת החלטות בסביבה של אי-ודאות?",o:["להמתין עד שכל המידע הנדרש יהיה זמין","עדיפה החלטה מהירה עם מעט חוסר ודאות מאשר אי-החלטה — גם אם המחיר הוא טעויות מעטות; כאשר כל המידע כבר בידך, ההחלטה פחות רלוונטית","להעביר את ההחלטה לדרג גבוה יותר","להחליט רק על בסיס נתונים כמותיים"],c:1,e:"\"מניסיון, כאשר כבר כל המידע הנדרש בידך ההחלטה פחות רלוונטית\". בעולם של היצף מידע ניתן לזהות מגמות וטרנדים. \"עדיפה החלטה מהירה עם מעט חוסר ודאות מאשר אי החלטה, גם אם המחיר הוא טעויות מעטות\"."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהו \"סרגל המדידה\" שמנהל חייב לעבוד לפיו?",o:["עמידה ביעדים כמותיים בלבד","\"מה טוב ונכון לחברה, לעסק, לארגון\" — ללא משוא פנים, חף מאינטרסים לא רלוונטיים ומהטיות אישיות","שביעות רצון העובדים","הערכת הממונים עליו"],c:1,e:"סרגל המדידה: מה טוב ונכון לחברה/לעסק/לארגון, ללא משוא פנים, חף מאינטרסים לא רלוונטיים ומהטיות אנושיות ואישיות. \"זה משדר לארגון ענייניות ותכליתיות ראויה\"."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהו \"מנהל מוביל נושא\"?",o:["המנהל הבכיר ביותר בתחום","מנוהל שקיבל אחריות וסמכות ישירה מהמנהל להוביל נושא מסוים בכל העסק/החברה — גם אם אינו בתחום תפקידו המוגדר — ולרכז את כלל המידע בו","נציג החברה מול הספקים","ראש צוות פרויקט זמני"],c:1,e:"פרט לשני מרכיבים יסודיים (תקציב וכוח אדם), לכל נושא בתחום עיסוק המנהל צריך להיות מנוהל שמוביל אותו. הוא אחראי להוביל לפי ההנחיות, לעקוב אחר הביצוע ולרכז את המידע מכל החברה — גם אם זה מחוץ לתפקידו המוגדר — תחת הגדרה ברורה של אחריות וסמכות."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהי \"יושרה\" (אינטגריטי) לפי המקראה?",o:["לומר תמיד את מה שהממונים רוצים לשמוע","כנות ואמיתות — להמשיך לפעול בהגינות ותחת ערכים גם במצבים קשים, ולהביע תמיד עמדה מקצועית נכונה לפי אמונתך גם כשאתה מבין ש\"הרוח שונה\"","להימנע מעימותים בכל מחיר","לפעול תמיד לפי הנהלים בלבד"],c:1,e:"יושרה = כנות ואמיתות; להמשיך לפעול בהגינות ויושר תחת ערכים חשובים גם במצבים קשים, מסובכים ומביכים. להביע עמדה מקצועית נכונה גם כשהציפיות שונות, ולעמוד על דעתך — באופן מנומס, מכובד ובפורום מתאים."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מה מומלץ לגבי איוש תפקיד שהתפנה?",o:["לפנות מיד לשוק החיצוני כדי להביא רעננות","להפיץ ראשית אפשרות פנים-חברה לפני פנייה החוצה, ולהתעקש על מועמד פנימי מתאים גם אם המנהל שלו לא רוצה לוותר עליו","לקדם תמיד את הוותיק ביותר","להשאיר את התפקיד פנוי עד למציאת מועמד מושלם"],c:1,e:"\"לכל תפקיד מתפנה להפיץ ראשית אפשרות פנים חברה לפני פנייה החוצה, להתעקש על מועמד מתאים פנימי גם שהמנהל שלו לא רוצה לוותר עליו\". זאת כחלק מפיתוח וטיפוח כפיפים ומתן אופק קידום."}
]);

BANK.push.apply(BANK,[
/* ===================== 12. מושגים (Glossary) ===================== */
{t:"מושגים",s:"מושגים",q:"לפי רשימת המושגים באתר הקורס, מהי ההגדרה של Facility Management?",o:["Maintenance of buildings and grounds of an organization","Integration of processes within an organization to maintain and develop the agreed services that support and improve the effectiveness of its primary processes and activities","Management of the real estate portfolio of an organization","Outsourcing of all non-core services to external providers"],c:1,e:"ההגדרה ברשימת המושגים: שילוב תהליכים בתוך הארגון לשמירה ולפיתוח של השירותים המוסכמים, התומכים ומשפרים את האפקטיביות של התהליכים והפעילויות העיקריים שלו."},
{t:"מושגים",s:"מושגים",q:"מהו BASELINE?",o:["היעד השנתי שנקבע לשיפור","אוסף מדדים הקובע נקודת התחלה או מצב קיים, המשמש להשוואה מול שיפורים וחיסכון עתידיים — כאשר יחידות המדידה חייבות להיות מוגדרות כתקפות לפני איסוף הנתונים","השוואה מול שיטות העבודה הטובות בענף","רמת השירות המינימלית הנדרשת"],c:1,e:"BASELINE = אוסף מדדים הקובע נקודת התחלה/מצב קיים להשוואה מול שיפורים וחיסכון עתידיים. חשוב: יש להגדיר את צורות המדידה ויחידותיה כתקפות לפני איסוף הנתונים. (השוואה מול best practices בענף היא BENCHMARKING.)"},
{t:"מושגים",s:"מושגים",q:"מהו BENCHMARKING?",o:["קביעת נקודת מוצא למדידה","נוהג ניהולי של השוואה מול שיטות העבודה הטובות בענף (industry best practices) לשיפור ביצועים ואיכות","מדידת שביעות רצון לקוחות","הגדרת רמת השירות בהסכם"],c:1,e:"BENCHMARKING = השוואה מול best practices בענף כדי לשפר ביצועים ואיכות. יש להבחין בינו לבין BASELINE, שהוא נקודת ההתחלה למדידה."},
{t:"מושגים",s:"מושגים",q:"מהו BIM?",o:["Building Insurance Management","Building Information Modeling — מודל תכנון וסימולציה תלת-ממדי דיגיטלי, בעל פוטנציאל רב לשיפור תהליכי התכנון והעיצוב ולספק חומר יקר ערך לתפעול ולאחזקה בהמשך","Basic Infrastructure Maintenance","Business Intelligence Model"],c:1,e:"BIM = Building Information Modeling. מודל דיגיטלי תלת-ממדי לתכנון וסימולציה, בעל פוטנציאל רב לשיפור תהליכי התכנון והעיצוב, וללכידת מידע שיהיה יקר ערך לתפעול ולאחזקה בהמשך."},
{t:"מושגים",s:"מושגים",q:"מהו LCC?",o:["Low Cost Contract — חוזה בעלות נמוכה","Life Cycle Cost — תהליך קביעת כל העלויות (בערך נוכחי) הכרוכות בתכנון, בעיצוב, בבנייה, בתפעול ובאחזקה של מבנה לאורך זמן","Local Compliance Code — קוד ציות מקומי","Labour Cost Calculation — חישוב עלות עבודה"],c:1,e:"LCC = Life Cycle Cost. תהליך קביעת כל העלויות, בערך נוכחי, הכרוכות בתכנון, בעיצוב, בבנייה, בתפעול ובאחזקה של מבנה לאורך זמן. כלל בסיסי: כל הניתוחים הכלכליים צריכים להתבסס על עלויות מחזור חיים."},
{t:"מושגים",s:"מושגים",q:"מהו ROI?",o:["Rate Of Inflation — שיעור האינפלציה","Return On Investment — סך הרווח מחולק בסך הסכום שהושקע במקור כדי להשיג את הרווח","Risk Of Investment — סיכון ההשקעה","Return On Income — תשואה על הכנסה"],c:1,e:"ROI = Return On Investment. סך הרווח מחולק בסך הסכום שהושקע במקור. בקורס צוין שהחזר השקעה מקובל הוא 5-8 שנים לכל היותר."},
{t:"מושגים",s:"מושגים",q:"מהו NPV?",o:["Net Property Value — שווי נכס נטו","Net Present Value — ערך נוכחי של תזרימי מזומנים עתידיים בניכוי ההשקעה נטו","New Project Valuation — הערכת פרויקט חדש","Nominal Price Variation — שינוי מחיר נומינלי"],c:1,e:"NPV = NET PRESENT VALUE — ערך נוכחי של תזרימי מזומנים עתידיים בניכוי ההשקעה נטו. כלי מרכזי בהערכת כדאיות השקעות לצד ROI ו-LCC."},
{t:"מושגים",s:"מושגים",q:"מהו Co-sourcing (Hybrid Service / Bundling Service)?",o:["מיקור חוץ מלא של כל השירותים","שילוב של insourcing ו-outsourcing","העברת שירותים לחו\"ל","שיתוף פעולה בין שתי חברות מתחרות"],c:1,e:"Co-sourcing / Hybrid Service / Bundling Service = שילוב בין insourcing (עובדי חברה) ל-outsourcing (מיקור חוץ). בשיעור 1 זה מוצג כמודל BUNDLER/HYBRID — התפיסה המקובלת ביותר בעשור האחרון."},
{t:"מושגים",s:"מושגים",q:"מהו Helpdesk לפי רשימת המושגים?",o:["מחלקת שירות הלקוחות של הספק","נקודת מגע לבקשת מידע ולמענה לצורך הקשור בתשתיות — לא חייבת להיות מקום פיזי, אך יכולה להיות","מוקד חירום של החברה","מערכת ממוחשבת לניהול תקלות"],c:1,e:"Helpdesk = point of contact for requesting information and in response to a facility related need. ההדגשה: \"it does not have to be a physical location, but can\" — לא חייב להיות מקום פיזי."},
{t:"מושגים",s:"מושגים",q:"מהו SOW?",o:["Standard Operating Workflow — תהליך עבודה תקני","Scope Of Work — תכולת העבודה","Service Order Warrant — הזמנת שירות","Statement Of Warranty — הצהרת אחריות"],c:1,e:"SOW = Scope Of Work — תכולת העבודה. מרכיב הכרחי בכל הסכם, לצד SLA (רמת שירות) ומנגנוני מדידה."},
{t:"מושגים",s:"מושגים",q:"מהו Space Management?",o:["ניהול מלאי הציוד במחסנים","התהליך שבו נעשה השימוש הטוב ביותר בשטח הזמין בהתאמה לצרכים","תכנון בניית שטחים חדשים","ניהול חוזי השכירות"],c:1,e:"Space management = process by which best use is made of available space matched to needs — התאמת מיטבית של השטח הזמין לצרכים. מדדים נלווים: מדד אכלוס/צפיפות, מ\"ר לעובד."},
{t:"מושגים",s:"מושגים",q:"מהו Cost Center?",o:["מרכז רווח בארגון","יחידה ארגונית שבה נעשה שימוש במימון תקציבי לקיום הפעילות","מחלקת הכספים של החברה","מרכז ההוצאות הגדול ביותר בחברה"],c:1,e:"Cost center = יחידה ארגונית שבה נעשה שימוש במימון תקציבי לקיום הפעילות. בשיעור הפיננסי הוסבר שנדרש לבנות תשתית רישום נכונה ב-cost centers, בדרך כלל 3-5 לפי מדינה."},
{t:"מושגים",s:"מושגים",q:"מהו Depreciation לפי רשימת המושגים, וכמה שיטות פחת קיימות?",o:["הפסד ממכירת נכס; שתי שיטות","הוצאה משוערת המבטאת את ירידת ערך הנכס עם חלוף הזמן בחיים הפרודוקטיביים שלו; ארבע שיטות פחת","עלות תיקון הנכס; שלוש שיטות","מס על החזקת נכס; שיטה אחת"],c:1,e:"Depreciation = an estimated expense that an asset's value diminishes as time passes in its productive life. ברשימת המושגים מצוין במפורש: \"there are four depreciations methods\" — ארבע שיטות פחת."},
{t:"מושגים",s:"מושגים",q:"מהו Base level services?",o:["רמת השירות המינימלית שהספק מתחייב לה בהסכם","בתפעול מתקנים — אותם שירותים הנדרשים כדי לתמוך באכלוס המתקן","שירותי הליבה של העסק","השירותים הזולים ביותר בסל השירותים"],c:1,e:"Base level services = in facilities operations, those services required to support occupancy of a facility — השירותים הבסיסיים הנדרשים לתמיכה באכלוס המתקן."},
{t:"מושגים",s:"מושגים",q:"מהו Access control?",o:["מערכת בקרת גישה למערכות המידע","נוהלי ואמצעי הגנה ביטחוניים פיזיים סטנדרטיים — כגון מחסומים ותאורה — המשמשים לשליטה בגישה למתקן","נוהל אישור הרשאות רכש","בקרת כניסה של סחורות למחסן"],c:1,e:"Access control = physical security protective standard procedures and devices such as barriers and light used to control access to a facility — נוהלי ואמצעי הגנה פיזיים לשליטה בגישה למתקן."},
{t:"מושגים",s:"מושגים",q:"מהם CORE BUSINESS ו-NON CORE BUSINESS לפי רשימת המושגים?",o:["CORE — הפעילות הרווחית; NON CORE — הפעילות המפסידה","CORE — אסטרטגיה עסקית, יעדים, תוכנית ותהליכים ראשוניים; NON CORE — פעילויות עסקיות ראשוניות, שירותי תמיכה, מרחב בר-קיימא ותשתית","CORE — פעילות בישראל; NON CORE — פעילות בחו\"ל","CORE — עובדי החברה; NON CORE — עובדי קבלן"],c:1,e:"ברשימת המושגים: CORE BUSINESS = BUSINESS STRATEGY, OBJECTIVES, PLAN AND PRIMARY PROCESSES. NON CORE BUSINESS = BUSINESS PRIMARY ACTIVITIES, SUPPORT SERVICES, SUSTAINABLE SPACE, INFRASTRUCTURE."},
{t:"מושגים",s:"מושגים",q:"מהו ILS?",o:["International Logistics Standard","Integrated Logistics Support — תמיכה לוגיסטית משולבת","Internal Loss Statement","Infrastructure Life Support"],c:1,e:"ILS = INTEGRATED LOGISTICS SUPPORT. בשיעור האחזקה הוסבר שהמשמעות היא שילוב כלל הגורמים האפשריים כבר משלב הייזום — ובעיקר המשתמש והעסק המפעיל — כדי לגשר על האינטרסים המנוגדים לאורך מחזור החיים."},
{t:"מושגים",s:"מושגים",q:"מהו OSHA?",o:["Organization for Safety and Health Advancement","Occupational Safety and Health Administration של משרד העבודה האמריקאי","Operational Standards for Hazard Assessment","Office of Safety and Hygiene Authority"],c:1,e:"OSHA = Occupational Safety and Health Administration of U.S. Department of Labor. בשיעור ציי הרכב הוזכר \"מדד OSHA\" בהקשר של דיווח בטיחות שנתי."},
{t:"מושגים",s:"מושגים",q:"מהו PPE?",o:["Preventive Planned Engineering","Personal Protective Equipment — ציוד מגן אישי","Public Private Enterprise","Performance Planning Evaluation"],c:1,e:"PPE = PERSONAL PROTECTIVE EQUIPMENT — ציוד מגן אישי. נמנה ברשימת השירותים תחת SOFT SERVICES, ומהווה חלק ממערך הבטיחות (חובת החברה לנקוט בכל האמצעים להבטחת בטיחות העובדים)."},
{t:"מושגים",s:"מושגים",q:"מהו GMP?",o:["Global Management Policy","Good Manufacturing Processes — תהליכי ייצור נאותים","General Maintenance Program","Guaranteed Minimum Price"],c:1,e:"GMP = Good Manufacturing Processes. בקורס משמש להגדרת אזורי ליבה תחת רגולציה מחייבת — לעומת NON-GMP באזורים שאינם מחייבים באותה רמה."},
{t:"מושגים",s:"מושגים",q:"מהו IFM לפי רשימת המושגים?",o:["International Facility Management — ניהול תשתיות בינלאומי","Integrated Facility Management — מערך של שירותי תשתיות המקיימים אינטראקציה זה עם זה","Internal Facility Maintenance — אחזקה פנימית","Industrial Facility Model — מודל מתקן תעשייתי"],c:1,e:"IFM = integrated facility management — set of facility services that interact with each other. בשיעור 1 זו אחת משלוש צורות ההפעלה: אינטגרציה מלאה על ידי גורם חיצוני."},

/* ===================== 13. ביבליוגרפיה ===================== */
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Cotts, מהי ההגדרה הנפוצה של facility management?",o:["ניהול הנכסים והמבנים של הארגון","\"הפרקטיקה של תיאום מקום העבודה הפיזי עם האנשים והעבודה של הארגון; משלבת עקרונות של מנהל עסקים, אדריכלות ומדעי ההתנהגות וההנדסה\"","אחזקה מונעת ומזדמנת של מערכות המבנה","ניהול חוזי השירותים מול ספקים חיצוניים"],c:1,e:"Cotts: \"the practice of coordinating the physical workplace with the people and work of the organization; integrates the principles of business administration, architecture, and the behavioral and engineering sciences\". מפושט: שילוב ה-people עם ה-purpose (work) וה-place (facilities) — שלוש טבעות משתלבות."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Cotts, מהן שלוש \"הטבעות המשתלבות\" שמגדירות את מהות ה-FM?",o:["Cost, Quality, Time","Purpose (work), Place (facilities), People — ששטח החפיפה ביניהן מייצג את האופי האינטגרטיבי של ניהול התשתיות","Plan, Do, Check","Strategy, Structure, Systems"],c:1,e:"התפיסה שפותחה על ידי ה-Facility Management Institute: שלוש טבעות משתלבות — purpose (העבודה), place (המתקנים) ו-people (האנשים) — ששטח החפיפה המשותף מייצג את האופי האינטגרטיבי של ניהול התשתיות."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"מתי ואיפה נוסד ה-Facility Management Institute, ואיזה ארגון צמח ממנו?",o:["1985 בשיקגו; ממנו צמח BOMI","1979 באן ארבור, מישיגן; בסמינר מוקדם שלו הקימו כ-40 מנהלי תשתיות את NFMA, שהפך מאוחר יותר ל-IFMA","1990 בניו יורק; ממנו צמח APPA","1975 בבוסטון; ממנו צמח AIPE"],c:1,e:"FMI נוסד ב-1979 באן ארבור, מישיגן. בסמינר מוקדם שלו כ-40 מנהלי תשתיות ציבוריים ותאגידיים ייסדו את NFMA (National Facility Management Association) ב-1980; בעקבות התעניינות קנדית הוא הפך ל-IFMA (International)."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי סקר IFMA שהוצג אצל Cotts, כיצד ראו מנהלים בכירים את התשתיות?",o:["רובם ראו בהן יתרון תחרותי מובהק","60% ראו בהן \"עלות של עשיית עסקים המאפשרת לארגון לתפקד\", ו-37% ראו בהן \"משאב שיכול לספק יתרון תחרותי\"","כולם ראו בהן מרכז עלות בלבד","הנושא לא נבדק בסקר"],c:1,e:"בסקר של 252 מנהלים בכירים: 60% ראו בתשתיות \"a cost of doing business that enables our organization to function\", ו-37% ראו בהן \"a resource that can provide a competitive edge\". תשעה מכל עשרה סברו שכישורי ניהול פיננסי וניהול פרויקטים הם החשובים ביותר במנהל התשתיות."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Cotts, מהו מקומן של התשתיות בהוצאות החברה?",o:["מרכיב שולי בהוצאות התפעול","אחרי השכר (payroll), התשתיות הן בדרך כלל המרכיב הגדול ביותר בהוצאה האדמיניסטרטיבית של החברה","המרכיב הגדול ביותר לפני השכר","מרכיב שאינו נמדד בנפרד בדו\"חות"],c:1,e:"Cotts: \"After payroll, facilities are usually the greatest component of a company's administrative expense\". לצד זאת: מחלקות תשתיות חסכו או מנעו עלויות בטווח של 30%-35% ללא פגיעה בשירותים, באמצעות תכנון נכון, ניהול חכירות וניהול אנרגיה."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"אילו מבין הבאים נכללים ב\"נושאים המרכזיים של ניהול תשתיות\" (Major Themes) אצל Cotts?",o:["רק עלות הבעלות ותמחור מחזור חיים","עלות הבעלות, תמחור מחזור חיים, אינטגרציה של שירותים, תכנון לתפעול ולאחזקה, אחריות מואצלת, עלות-תועלת, איכות חיים, יתירות וגמישות, תשתיות כנכס, FM כפונקציה עסקית ו-FM כרצף (continuum)","רק איכות החיים ואיכות הסביבה","רק אחריות מואצלת ותכנון לתפעול"],c:1,e:"Cotts מונה שורה של נושאים מרכזים: cost of ownership; life-cycle costing; integration of services; design for operations and maintenance; delegated responsibility; cost-effectiveness; efficiency improvement; quality of life; integration of elements; redundancy and flexibility; facilities as assets; FM as a business function; FM as a continuum; service."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Cotts, מהי המשמעות של \"FM as a continuum\"?",o:["שירות ה-FM ניתן 24 שעות ביממה","ניהול תשתיות הוא רצף — מתכנון ועד גריטה — ולא סדרה של פרויקטים בדידים","ה-FM ממשיך גם לאחר מכירת הנכס","הצוות מתחלף ברצף ללא הפסקות"],c:1,e:"\"FM as a continuum. FM is a continuum, from planning through disposal. It is not a series of discrete projects\" — ניהול התשתיות הוא רצף לאורך כל מחזור החיים, ולא אוסף פרויקטים נפרדים."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Cotts, מי מגדיר מהו שירות טוב?",o:["מנהל התשתיות, על סמך ניסיונו","הלקוח — והלקוח בלבד; באחריות מנהל התשתיות לברר כיצד הלקוח מדרג את שירותיו","הספק שנותן את השירות","ההנהלה הבכירה של החברה"],c:1,e:"מפילוסופיית ה-FM של Cotts: \"Remember that the customer — and the customer alone — defines service. The facility manager's responsibility is to find out how his customer rates his services\". תואם את הדגש בקורס על סקרי שביעות רצון שיטתיים."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Total Facility Management (Atkin & Brooks), מהי ההגדרה המקובלת לניהול תשתיות?",o:["אחזקת המבנים והתשתיות במחיר הנמוך ביותר","גישה משולבת לתפעול, לאחזקה, לשיפור ולהתאמה של המבנים והתשתיות של הארגון, במטרה ליצור סביבה התומכת באופן חזק ביעדים העיקריים של הארגון","ניהול הנדל\"ן והשירותים הנלווים","ניהול מיקור החוץ של שירותי התמיכה"],c:1,e:"ההגדרה בפרק 1: \"an integrated approach to operating, maintaining, improving and adapting the buildings and infrastructure of an organization in order to create an environment that strongly supports the primary objectives of that organization\"."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Total FM, מהו \"the informed client function\" ומדוע הוא חשוב?",o:["פונקציית שירות הלקוחות של הספק","תפקיד ה\"לקוח המיודע\" — הארגון חייב לפעול כלקוח מיודע כדי להבטיח שביעות רצון של משתמשי הקצה ו-best value; זהו תנאי הכרחי ללא קשר לאופן שבו נרכשים השירותים","מחלקת הרכש של הארגון","היועץ החיצוני שמלווה את הארגון"],c:1,e:"informed client function: הארגון חייב לפעול כלקוח מיודע כדי להשיג end-user satisfaction ו-best value — \"a requisite irrespective of how services are procured\". התפקיד כולל הבנת הארגון ותרבותו, אפיון דרישות ויעדים, ניהול ספקים ומדידת ביצועים, benchmarking וסקרי שביעות רצון."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Total FM, מהו ההבדל בין value for money ל-best value?",o:["אין הבדל — שני מונחים לאותו דבר","value for money מבטא את היחס בין עלות לאיכות/ביצועים; best value מרחיב זאת ומשמעו חתירה מתמדת למשהו טוב יותר בעלות הנמוכה ביותר האפשרית — ולכן יש לבחון לא את התוצאה אלא את קבלת ההחלטות וההנחות שבבסיסה","best value פירושו תמיד המחיר הנמוך ביותר","value for money חל רק על מיקור חוץ"],c:1,e:"best value מרחיב את value for money: חתירה מתמדת למשהו superior בעלות הנמוכה ביותר המעשית. הספר מדגיש שיש לבחון לא את התוצאה אלא את תהליך קבלת ההחלטות וההנחות שבבסיסו. החלטת best value מצוטטת בדרך כלל כמכריעה האם למקר חוץ שירות."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Total FM, מהו \"operability\" ומדוע הוא חשוב?",o:["זמינות המערכות באחוזים","עקרון ה\"תכנון לתפעוליות\" — הצלחת מתקן חדש או משופץ תלויה בכך שהתכנון ייקח בחשבון את דרישות התפעול; בניגוד ל-constructability, שמיושם באופן נרחב, עקרון זה אינו מוכר באותה מידה","יכולת המתקן לעמוד בעומסים","נוהל ההפעלה של מערכות המבנה"],c:1,e:"Operability = design for operability. \"Once the facility is operational, it is too late to take issue with the fitness for purpose of the design\". הספר מציין שעקרון ה-constructability מיושם נרחב על ידי מתכננים, אך design for operability אינו מוכר באותה מידה — והתעלמות ממנו פוגעת ביעילות התפעולית ובביצועי האנרגיה."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Total FM, מהם שלבי תהליך ניהול התשתיות (מודל תהליכי)?",o:["תכנון ← ביצוע ← בקרה","פיתוח אסטרטגיית FM ← קביעת מודל הסורסינג (Insource/Outsource/Co-source) ← רכש שירותים ← אספקת השירותים ← ניהול ביצועים","רכש ← אחזקה ← מדידה","ייזום ← הקמה ← הפעלה ← גריטה"],c:1,e:"המודל התהליכי: Develop facility management strategy (ניתוח אסטרטגי, פיתוח פתרון, יישום) ← Determine sourcing model (Insource/Outsource/Co-source) ← Procure services (מיון מוקדם, RFP/מכרז, הגשת הצעות) ← Deliver services (התארגנות, מעבר, ניהול חוזה) ← Manage performance (סקירת שירות, מדידת ביצועים, benchmarking)."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Total FM, מהו מקור המונח והתחום facility management?",o:["בבריטניה בשנות ה-70","בארה\"ב במאה ה-19 — חברות הרכבות האמריקאיות סברו שעדיף לספק את התועלת של המתקנים ולא רק מבנים; התחום התפתח לאורך כ-150 שנה","ביפן לאחר מלחמת העולם השנייה","באיחוד האירופי בשנות ה-90"],c:1,e:"Total FM: התחום התפתח לאורך כ-150 שנה. \"It originated at some time in the 1800s, when the American railroad companies thought it better to provide the utility of facilities and not merely buildings\" — פרשנות רחבה יותר של המושג facility."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Total FM פרק 2, מהי \"sustainable space provision\"?",o:["שימוש בחומרי בנייה ידידותיים לסביבה","האיזון שיש למצוא בין מה שהארגון צריך לבין מה שהוא יכול להרשות לעצמו מבחינת שטח","הקצאת שטח קבועה לכל עובד","שטח המיועד להרחבה עתידית"],c:1,e:"מפרק 2 (Facility Planning): \"A balance has to be struck between what the organization needs and what it can afford, and this is referred to as its sustainable space provision\". יעילות השטח יכולה להיות גורם מפתח בהצלחת הארגון."},
{t:"ביבליוגרפיה",s:"ביבליוגרפיה",q:"לפי Total FM פרק 2, מהו \"briefing\"?",o:["תדריך בטיחות לעובדים","התהליך של שיתוף הארגון בדיון מובנה על הפונקציות והמאפיינים הנדרשים במתקן","הצגת תוצאות הרבעון להנהלה","העברת מידע בין משמרות"],c:1,e:"Briefing = \"the process for engaging the organization in a structured discussion about the functions and other characteristics it requires in a facility\". תהליך מרכזי בתכנון מתקן חדש או משופץ, ובסיס להבטחת operability."},

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function filterBank(){return BANK.filter(function(x){return sel.topics.indexOf(x.t)>=0 && (sel.src==="all"||x.s===sel.src);});}
/* מערבב את סדר התשובות בכל שאלה, כדי שהתשובה הנכונה לא תהיה תמיד באותו מקום */
function prepQ(q){
  var order=shuffle([0,1,2,3]);
  var opts=order.map(function(i){return q.o[i];});
  return {t:q.t,s:q.s,q:q.q,o:opts,c:order.indexOf(q.c),e:q.e};
}
function buildQuiz(){
  var arr=filterBank().map(prepQ);
  if(sel.shuffle)shuffle(arr);
  return arr;
}
function srcBg(s){return (SRC_META[s]||{}).bg||"var(--surface2)";}
function srcFg(s){return (SRC_META[s]||{}).fg||"var(--muted)";}
function countBy(key,val){return BANK.filter(function(b){return b[key]===val;}).length;}
function fmt(s){var m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x;}

/* ---------- theme ---------- */
function initTheme(){
  var t=null;try{t=localStorage.getItem("fmq_theme");}catch(e){}
  if(t)document.documentElement.className=t;
}
function toggleTheme(){
  var cur=document.documentElement.className;
  var isDark = cur==="dark" || (cur!=="light" && window.matchMedia && window.matchMedia("(prefers-color-scheme:dark)").matches);
  var nx=isDark?"light":"dark";
  document.documentElement.className=nx;
  try{localStorage.setItem("fmq_theme",nx);}catch(e){}
}
initTheme();

/* ---------- setup screen ---------- */
function setup(){
  stopTimer();
  app.innerHTML="";
  var c=E("div",{"class":"card"});

  c.appendChild(E("div",{"class":"note"},
    "<b>מבנה הבחינה:</b> מבחן רב-ברירתי (אמריקאי), <b>חומר פתוח</b>, ציון עובר 60. 4 תשובות לשאלה. "+
    "המבחן הוא 70% מהציון, העבודה 25% והנוכחות 5%.<br>"+
    "<b>איך לתרגל:</b> ב<b>מצב תרגול</b> מקבלים משוב והסבר אחרי כל שאלה. ב<b>סימולציית מבחן</b> עונים על הכל ורק בסוף מקבלים ציון — כמו במבחן האמיתי."));

  /* mode */
  var row1=E("div",{"class":"toolbar"});
  row1.appendChild(E("span",{"class":"lbl"},"מצב:"));
  [["practice","תרגול עם הסברים"],["exam","סימולציית מבחן"]].forEach(function(m){
    var b=E("button",{"class":"chip"+(sel.mode===m[0]?" active":"")},m[1]);
    b.onclick=function(){sel.mode=m[0];setup();};
    row1.appendChild(b);
  });
  var sp=E("span",{"class":"spacer"});row1.appendChild(sp);
  var th=E("button",{"class":"iconbtn"},"מצב כהה / בהיר");
  th.onclick=toggleTheme;row1.appendChild(th);
  c.appendChild(row1);

  /* topics */
  var row2=E("div",{"class":"toolbar"});
  row2.appendChild(E("span",{"class":"lbl"},"נושאים:"));
  var allOn=sel.topics.length===TOPICS.length;
  var ball=E("button",{"class":"chip"+(allOn?" active":"")},"הכל");
  ball.onclick=function(){sel.topics=allOn?[]:TOPICS.slice();setup();};
  row2.appendChild(ball);
  TOPICS.forEach(function(t){
    var on=sel.topics.indexOf(t)>=0;
    var b=E("button",{"class":"chip"+(on?" active":"")},t+" <small>"+countBy("t",t)+"</small>");
    b.onclick=function(){
      var i=sel.topics.indexOf(t);
      if(i>=0)sel.topics.splice(i,1);else sel.topics.push(t);
      setup();
    };
    row2.appendChild(b);
  });
  c.appendChild(row2);

  /* source */
  var row3=E("div",{"class":"toolbar"});
  row3.appendChild(E("span",{"class":"lbl"},"מקור:"));
  var ba=E("button",{"class":"chip"+(sel.src==="all"?" active":"")},"הכל <small>"+BANK.length+"</small>");
  ba.onclick=function(){sel.src="all";setup();};
  row3.appendChild(ba);
  SOURCES.forEach(function(s){
    var b=E("button",{"class":"chip"+(sel.src===s?" active":"")},((SRC_META[s]||{}).full||s)+" <small>"+countBy("s",s)+"</small>");
    b.onclick=function(){sel.src=s;setup();};
    row3.appendChild(b);
  });
  c.appendChild(row3);

  /* options */
  var row4=E("div",{"class":"toolbar"});
  row4.appendChild(E("span",{"class":"lbl"},"אפשרויות:"));
  var sh=E("button",{"class":"chip"+(sel.shuffle?" active":"")},"ערבוב שאלות");
  sh.onclick=function(){sel.shuffle=!sel.shuffle;setup();};
  row4.appendChild(sh);
  if(sel.mode==="exam"){
    [[20,"20 שאלות"],[30,"30 שאלות"],[0,"הכל"]].forEach(function(n){
      var b=E("button",{"class":"chip"+(sel.count===n[0]?" active":"")},n[1]);
      b.onclick=function(){sel.count=n[0];setup();};
      row4.appendChild(b);
    });
    [[0,"בלי שעון"],[30,"30 דק'"],[45,"45 דק'"],[60,"60 דק'"]].forEach(function(m){
      var b=E("button",{"class":"chip"+(sel.minutes===m[0]?" active":"")},m[1]);
      b.onclick=function(){sel.minutes=m[0];setup();};
      row4.appendChild(b);
    });
  }
  c.appendChild(row4);

  var n=filterBank().length;
  var info=E("div",{"class":"stats"});
  info.innerHTML="<span>נבחרו <b>"+n+"</b> שאלות</span>";
  c.appendChild(info);

  var go=E("button",{"class":"btn btn-pri"},
    sel.mode==="exam"?"התחלת סימולציית מבחן":"התחלת תרגול");
  go.style.width="100%";
  if(n===0){go.disabled=true;go.textContent="בחרו לפחות נושא אחד";}
  go.onclick=function(){ sel.mode==="exam"?examStart():practiceStart(); };
  c.appendChild(go);

  app.appendChild(c);
}

/* ---------- shared bits ---------- */
function bar(frac){
  var b=E("div",{"class":"bar"});
  b.innerHTML='<i style="width:'+(frac*100)+'%"></i>';
  return b;
}
function metaRow(q){
  var r=E("div",{"class":"qmeta"});
  r.innerHTML='<span class="pill">'+q.t+'</span><span class="pill" style="background:'+srcBg(q.s)+';color:'+srcFg(q.s)+'">'+((SRC_META[q.s]||{}).full||q.s)+'</span>';
  return r;
}
function topBar(extraHtml){
  var t=E("div",{"class":"toolbar"});
  var back=E("button",{"class":"iconbtn"},"→ חזרה להגדרות");
  back.onclick=function(){if(!timer||confirm("לצאת מהמבחן? התשובות לא יישמרו."))setup();};
  t.appendChild(back);
  t.appendChild(E("span",{"class":"spacer"}));
  if(extraHtml)t.appendChild(E("span",{},extraHtml));
  var th=E("button",{"class":"iconbtn"},"◐");
  th.onclick=toggleTheme;t.appendChild(th);
  return t;
}

/* ---------- practice mode ---------- */
function practiceStart(){
  quiz=buildQuiz();
  idx=0;score=0;wrong=[];ansMap=[];
  pRender();
}
function pRender(){
  if(idx>=quiz.length)return pResults();
  var q=quiz[idx];
  app.innerHTML="";
  var c=E("div",{"class":"card"});
  c.appendChild(topBar());
  var st=E("div",{"class":"stats"});
  function statsHtml(done){
    var seen=idx+(done?1:0);
    return "<span>שאלה <b>"+(idx+1)+"</b> / <b>"+quiz.length+"</b></span>"+
      "<span>נכונות: <b>"+score+"</b></span>"+
      "<span>שגויות: <b>"+wrong.length+"</b></span>"+
      "<span class='spacer'></span><span>הצלחה: <b>"+(seen?Math.round(score/seen*100)+"%":"—")+"</b></span>";
  }
  st.innerHTML=statsHtml(false);
  c.appendChild(st);
  c.appendChild(bar(idx/quiz.length));
  c.appendChild(metaRow(q));
  c.appendChild(E("div",{"class":"qtext"},q.q));

  var box=E("div");
  answered=false;
  q.o.forEach(function(txt,i){
    var b=E("button",{"class":"opt"});
    b.innerHTML='<span class="ltr">'+LET[i]+'</span><span>'+txt+'</span>';
    b.onclick=function(){
      if(answered)return;
      answered=true;
      var all=box.querySelectorAll(".opt");
      for(var k=0;k<all.length;k++)all[k].className="opt locked";
      all[q.c].className="opt correct locked";
      if(i===q.c){score++;}
      else{all[i].className="opt wrong locked";wrong.push(q);}
      st.innerHTML=statsHtml(true);
      var ex=E("div",{"class":"expl"});
      ex.innerHTML='<span class="tag">'+(i===q.c?"נכון · ":"התשובה הנכונה: "+LET[q.c]+" · ")+'</span>'+q.e;
      c.insertBefore(ex,navRow);
      nextBtn.disabled=false;nextBtn.className="btn btn-pri";
    };
    box.appendChild(b);
  });
  c.appendChild(box);

  var navRow=E("div",{"class":"nav"});
  var nextBtn=E("button",{"class":"btn"},idx===quiz.length-1?"סיום וצפייה בציון":"השאלה הבאה ←");
  nextBtn.disabled=true;
  nextBtn.onclick=function(){idx++;pRender();};
  var skip=E("button",{"class":"btn"},"דילוג");
  skip.onclick=function(){idx++;pRender();};
  navRow.appendChild(nextBtn);navRow.appendChild(skip);
  c.appendChild(navRow);
  app.appendChild(c);
  window.scrollTo(0,0);
}
function pResults(){
  results(score,quiz.length,wrong,practiceStart,function(){
    quiz=wrong.slice();if(sel.shuffle)shuffle(quiz);
    idx=0;score=0;wrong=[];pRender();
  },null);
}

/* ---------- exam mode ---------- */
function examStart(){
  quiz=buildQuiz();
  if(sel.count&&quiz.length>sel.count)quiz=quiz.slice(0,sel.count);
  idx=0;ansMap=new Array(quiz.length);
  timeLeft=sel.minutes*60;
  if(sel.minutes)startTimer();
  eRender();
}
function startTimer(){
  stopTimer();
  timer=setInterval(function(){
    timeLeft--;
    var el=document.getElementById("clock");
    if(el)el.textContent=fmt(timeLeft);
    if(timeLeft<=0){stopTimer();examSubmit(true);}
  },1000);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function eRender(){
  var q=quiz[idx];
  app.innerHTML="";
  var c=E("div",{"class":"card"});
  c.appendChild(topBar(sel.minutes?'זמן שנותר: <span class="clock" id="clock">'+fmt(timeLeft)+'</span>':""));
  var nAns=0;for(var i=0;i<ansMap.length;i++)if(ansMap[i]!=null)nAns++;
  var st=E("div",{"class":"stats"});
  st.innerHTML="<span>שאלה <b>"+(idx+1)+"</b> / <b>"+quiz.length+"</b></span><span>נענו: <b>"+nAns+"</b></span>";
  c.appendChild(st);
  c.appendChild(bar(nAns/quiz.length));
  c.appendChild(metaRow(q));
  c.appendChild(E("div",{"class":"qtext"},q.q));

  var box=E("div");
  q.o.forEach(function(txt,i){
    var b=E("button",{"class":"opt"+(ansMap[idx]===i?" correct":"")});
    b.innerHTML='<span class="ltr">'+LET[i]+'</span><span>'+txt+'</span>';
    b.onclick=function(){ansMap[idx]=i;eRender();};
    box.appendChild(b);
  });
  c.appendChild(box);

  var nav=E("div",{"class":"nav"});
  var prev=E("button",{"class":"btn"},"→ הקודמת");
  prev.disabled=idx===0;prev.onclick=function(){idx--;eRender();};
  var next=E("button",{"class":"btn btn-pri"},"הבאה ←");
  next.disabled=idx===quiz.length-1;next.onclick=function(){idx++;eRender();};
  nav.appendChild(prev);nav.appendChild(next);
  c.appendChild(nav);

  c.appendChild(E("div",{"class":"ptitle",style:"margin-top:16px"},"מפת שאלות — לחצו למעבר"));
  var pal=E("div",{"class":"palette"});
  quiz.forEach(function(_,i){
    var b=E("button",{"class":"pbtn"+(ansMap[i]!=null?" ans":"")+(i===idx?" cur":"")},String(i+1));
    b.onclick=function(){idx=i;eRender();};
    pal.appendChild(b);
  });
  c.appendChild(pal);

  var sub=E("button",{"class":"btn btn-pri"},"הגשת המבחן");
  sub.style.width="100%";sub.style.marginTop="14px";
  sub.onclick=function(){
    var un=quiz.length-nAns;
    if(un>0&&!confirm("נותרו "+un+" שאלות ללא מענה. להגיש בכל זאת?"))return;
    examSubmit(false);
  };
  c.appendChild(sub);
  app.appendChild(c);
  window.scrollTo(0,0);
}
function examSubmit(auto){
  stopTimer();
  var sc=0,wr=[];
  quiz.forEach(function(q,i){ if(ansMap[i]===q.c)sc++; else wr.push({q:q,given:ansMap[i]}); });
  results(sc,quiz.length,wr.map(function(x){return x.q;}),examStart,null,wr,auto);
}

/* ---------- results ---------- */
function results(sc,total,wr,onAgain,onRetryWrong,detail,auto){
  stopTimer();
  app.innerHTML="";
  var pct=total?Math.round(sc/total*100):0;
  var c=E("div",{"class":"card result"});
  if(auto)c.appendChild(E("div",{"class":"note"},"<b>הזמן נגמר</b> — המבחן הוגש אוטומטית."));
  c.appendChild(E("div",{"class":"big"},pct));
  var g = pct>=90?"מצוין — שליטה מלאה בחומר":
          pct>=80?"טוב מאוד":
          pct>=70?"טוב — כדאי לחזור על הנושאים החלשים":
          pct>=60?"עובר (ציון עובר 60) — מומלץ לחזור ולתרגל":
                  "מתחת לציון עובר — כדאי לחזור על החומר ולתרגל שוב";
  c.appendChild(E("div",{"class":"grade"},sc+" מתוך "+total+" · "+g));

  var nav=E("div",{"class":"nav"});
  var again=E("button",{"class":"btn btn-pri"},"סבב חדש");
  again.onclick=onAgain;nav.appendChild(again);
  if(onRetryWrong&&wr.length){
    var rw=E("button",{"class":"btn"},"תרגול "+wr.length+" השגויות");
    rw.onclick=onRetryWrong;nav.appendChild(rw);
  }
  var home=E("button",{"class":"btn"},"הגדרות");
  home.onclick=setup;nav.appendChild(home);
  c.appendChild(nav);
  app.appendChild(c);

  if(detail&&detail.length){
    var d=E("div",{"class":"card"});
    d.appendChild(E("div",{"class":"ptitle"},"סקירת "+detail.length+" השאלות שנענו לא נכון"));
    detail.forEach(function(x){
      var r=E("div",{"class":"rev"});
      var given = x.given==null?"<i>לא נענתה</i>":LET[x.given]+". "+x.q.o[x.given];
      r.innerHTML='<div class="rq">'+x.q.q+'</div>'+
        '<div class="ra">התשובה שלך: '+given+'</div>'+
        '<div class="rc">התשובה הנכונה: '+LET[x.q.c]+". "+x.q.o[x.q.c]+'</div>'+
        '<div style="margin-top:6px;color:var(--muted)">'+x.q.e+'</div>';
      d.appendChild(r);
    });
    app.appendChild(d);
  } else if(wr.length){
    var d2=E("div",{"class":"card"});
    d2.appendChild(E("div",{"class":"ptitle"},"נושאים לחזרה"));
    var byTopic={};
    wr.forEach(function(q){byTopic[q.t]=(byTopic[q.t]||0)+1;});
    var ul=E("div",{"class":"toolbar"});
    Object.keys(byTopic).forEach(function(t){
      ul.appendChild(E("span",{"class":"pill"},t+" — "+byTopic[t]+" שגיאות"));
    });
    d2.appendChild(ul);
    app.appendChild(d2);
  }
  window.scrollTo(0,0);
}

setup();
})();
</script>
</body>
</html>
