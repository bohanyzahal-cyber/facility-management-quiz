<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בוחן תרגול — ניהול תשתיות גלובליות</title>
<style>
:root{
  --bg:#f7f6f3; --surface:#ffffff; --surface2:#f1efe8; --text:#1f1f1d; --muted:#6b6b66;
  --border:#e3e1da; --borderS:#cfccc2; --accent:#185fa5; --accentSoft:#e8f0f8;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --warnTx:#854f0b; --warnBg:#faeeda;
  --clsTx:#6b21a8; --clsBg:#f3e8ff;
  --bibTx:#0f6e56; --bibBg:#e1f5ee;
  --chipBg:#efeee9;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1a1a18; --surface:#242421; --surface2:#2f2f2c; --text:#ececea; --muted:#a3a39c;
    --border:#37372f; --borderS:#4a4a46; --accent:#5b9bd5; --accentSoft:#22344a;
    --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
    --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
    --warnTx:#fac775; --warnBg:#4a2b06;
    --clsTx:#d8b4fe; --clsBg:#3b1d6e;
    --bibTx:#9fe1cb; --bibBg:#0d4438;
    --chipBg:#2f2f2a;
  }
}
html.dark{
  --bg:#1a1a18; --surface:#242421; --surface2:#2f2f2c; --text:#ececea; --muted:#a3a39c;
  --border:#37372f; --borderS:#4a4a46; --accent:#5b9bd5; --accentSoft:#22344a;
  --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
  --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
  --warnTx:#fac775; --warnBg:#4a2b06;
  --clsTx:#d8b4fe; --clsBg:#3b1d6e;
  --bibTx:#9fe1cb; --bibBg:#0d4438;
  --chipBg:#2f2f2a;
}
html.light{
  --bg:#f7f6f3; --surface:#ffffff; --surface2:#f1efe8; --text:#1f1f1d; --muted:#6b6b66;
  --border:#e3e1da; --borderS:#cfccc2; --accent:#185fa5; --accentSoft:#e8f0f8;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --warnTx:#854f0b; --warnBg:#faeeda;
  --clsTx:#6b21a8; --clsBg:#f3e8ff;
  --bibTx:#0f6e56; --bibBg:#e1f5ee;
  --chipBg:#efeee9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',Arial,'Helvetica Neue',sans-serif;line-height:1.65;
  overflow-wrap:break-word;-webkit-text-size-adjust:100%;}
.wrap{max-width:820px;margin:0 auto;padding:22px 20px 60px;}
header h1{font-size:23px;margin:0 0 4px;font-weight:650;}
header .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px;}
.chip{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit;}
.chip:hover{border-color:var(--accent);}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.chip small{opacity:.75;font-size:11px;}
.lbl{font-size:12px;color:var(--muted);margin-left:4px;align-self:center;min-width:44px;}
.spacer{flex:1;}
.iconbtn{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;}
.iconbtn:hover{border-color:var(--accent);}
.note{background:var(--accentSoft);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;font-size:13px;margin-bottom:14px;}
.note b{color:var(--accent);}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;margin-bottom:12px;color:var(--muted);}
.stats b{color:var(--text);}
.bar{height:7px;background:var(--chipBg);border-radius:999px;overflow:hidden;margin-bottom:18px;}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);}
.qtext{font-size:17.5px;font-weight:600;margin-bottom:15px;line-height:1.6;}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--borderS);
  border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:.12s;
  background:var(--surface);width:100%;text-align:right;font:inherit;color:var(--text);}
.opt:hover{border-color:var(--accent);background:var(--accentSoft);}
.opt .ltr{font-weight:700;color:var(--accent);min-width:19px;}
.opt.correct{background:var(--okBg);border-color:var(--okBd);}
.opt.correct .ltr{color:var(--okTx);}
.opt.wrong{background:var(--errBg);border-color:var(--errBd);}
.opt.wrong .ltr{color:var(--errTx);}
.opt.locked{cursor:default;}
.opt.locked:hover{background:var(--surface);border-color:var(--borderS);}
.opt.correct.locked:hover{background:var(--okBg);border-color:var(--okBd);}
.opt.wrong.locked:hover{background:var(--errBg);border-color:var(--errBd);}
.expl{margin-top:8px;padding:13px 15px;border-radius:10px;background:var(--accentSoft);
  border:1px solid var(--border);font-size:14px;}
.expl .tag{font-weight:700;color:var(--accent);}
.nav{display:flex;gap:10px;margin-top:16px;}
.btn{flex:1;background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:12px;font-size:15px;cursor:pointer;font-family:inherit;}
.btn:hover{border-color:var(--accent);}
.btn-pri{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-height:190px;overflow-y:auto;}
.pbtn{width:33px;height:33px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);font-size:12.5px;cursor:pointer;font-family:inherit;}
.pbtn.cur{outline:2px solid var(--accent);outline-offset:1px;}
.pbtn.ok{background:var(--okBg);border-color:var(--okBd);color:var(--okTx);}
.pbtn.bad{background:var(--errBg);border-color:var(--errBd);color:var(--errTx);}
.pbtn.ans{background:var(--accentSoft);border-color:var(--accent);color:var(--accent);}
.ptitle{font-size:12.5px;color:var(--muted);margin-bottom:7px;}
.result{text-align:center;}
.result .big{font-size:46px;font-weight:800;color:var(--accent);line-height:1.1;}
.result .grade{font-size:17px;margin:8px 0 16px;}
.clock{font-variant-numeric:tabular-nums;font-weight:650;}
.rev{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface2);font-size:14px;text-align:right;}
.rev .rq{font-weight:600;margin-bottom:6px;}
.rev .ra{color:var(--errTx);}
.rev .rc{color:var(--okTx);}
@media (max-width:540px){
  .wrap{padding:16px 14px 48px;} .card{padding:16px;} .qtext{font-size:16px;}
  header h1{font-size:19px;} .pbtn{width:29px;height:29px;font-size:11.5px;}
  .opt{padding:11px 12px;} .stats{gap:11px;font-size:13px;}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>בוחן תרגול — ניהול תשתיות גלובליות</h1>
  <div class="sub" id="sub"></div>
</header>
<div id="app"></div>
<div style="text-align:center;color:var(--muted);font-size:12px;margin-top:24px;">
  חומר סגור · לתרגול לימודי בלבד · נבנה מחומרי הקורס באתר "למדה"
</div>
</div>
<script>
var BANK=[
/* ===================== 1. מבוא ויסודות ===================== */
{t:"מבוא ויסודות",s:"מקראה",q:"מנכ\"ל חברת תרופות שואל את מנהל התשתיות מהי בעצם מטרת מערך ה-FM. מהי ההגדרה המדויקת ביותר לפי המקראה?",o:["ניהול תקציב האחזקה והניקיון של המבנים בלבד","ניהול כלל הפעילות והשירותים הנדרשים כדי להבטיח פעולה תקינה ורצופה של העסק, ללא עיסוק בליבת העשייה — ובעיקר לאפשר למנהל להתרכז בליבה","ניהול הרכש והמלאי של החברה מול ספקים חיצוניים","ניהול משאבי האנוש והשירותים לעובד בלבד"],c:1,e:"ההגדרה בשיעור 1: ניהול כלל הפעילות הנדרשת להבטחת פעולה תקינה ורצופה של העסק, ללא עיסוק בליבת העשייה, במטרה לאפשר למנהל להתרכז בליבת עשייתו — \"BUSINESS CONTINUITY\", ברמת שירות טובה ובמחיר סביר."},
{t:"מבוא ויסודות",s:"מקראה",q:"אילו שלושה זוגות מושגים מגדירים יחד את תחום ניהול התשתיות ויוצרים \"שפה עסקית משותפת\" גלובלית?",o:["INSOURCING/OUTSOURCING, FIXED PRICE/COST PLUS, SLA/KPI","SOFT/HARD SERVICES, CORE/NON-CORE TO BUSINESS, CRITICAL/NON-CRITICAL","CAPEX/OPEX, ROI/NPV, LCC/BENCHMARK","GMP/NON-GMP, QA/QC, RFP/RFI"],c:1,e:"שלושת המשתנים המגדירים את התחום הם: SOFT & HARD SERVICE, CORE & NON-CORE, CRITICAL & NON-CRITICAL. הם מאפשרים מיקוד, סדר עדיפויות ושפה משותפת בין אתרים."},
{t:"מבוא ויסודות",s:"מקראה",q:"מה בדרך כלל נכלל תחת HARD SERVICES?",o:["הסעדה, הסעות, ניקיון וביגוד — שירותים לעובד","אחזקה על צורותיה, צריכת אנרגיה, כיולים וולידציות, מערכות מיזוג לאזורי הליבה וטיפול בפסולת מסוכנת","שירותי דואר, הדפסות וציוד משרדי","ניהול חוזי שכירות ודמי ניהול"],c:1,e:"HARD מכוון לפעילות ותמיכה בליבת העסק ובאזורים קריטיים: אחזקה, אנרגיה, כיול וולידציה, מערכות מיזוג/אוורור לאזורי ליבה, פסולת מסוכנת. SOFT הוא בעיקר שירותים לוגיסטיים לעובד."},
{t:"מבוא ויסודות",s:"מקראה",q:"מנהל תשתיות טוען: \"HARD זה תמיד CORE וגם תמיד CRITICAL\". מה נכון לפי המקראה?",o:["הטענה נכונה — שלושת החלוקות זהות לחלוטין","לעיתים קרובות ההגדרות מקבילות ודומות, אבל ישנם גם יוצאים מן הכלל — החלוקה היא ניהולית ועקרונית ויש להתאימה לכל עסק","הטענה שגויה לגמרי — אין שום קשר בין החלוקות","HARD הוא תמיד NON-CORE, כי הליבה מטופלת רק על ידי עובדי החברה"],c:1,e:"המקראה מציינת שלעיתים זה מקביל ודומה (HARD≈ליבה≈קריטי, SOFT≈לא ליבה≈לא קריטי) \"אבל ישנם גם יוצאים מן הכלל\". החלוקה היא ניהולית ועקרונית ויש להתאימה לכל סוג עסק."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהי המשמעות המרכזית של הגדרת אזור או נושא כ-CRITICAL?",o:["האזור מסוכן פיזית ולכן דורש ציוד מגן אישי","האזור מהווה סיכון לעמידת העסק ביעדיו, ולכן מקבל תשומת לב ניהולית ממוקדת ויתירות מערכות להבטחת המשכיות עסקית","האזור נמצא תחת רגולציית GMP ולכן חייב ולידציה","האזור מנוהל תמיד במיקור חוץ מלא"],c:1,e:"\"קריטי\" = מהווה סיכון לעמידת העסק ביעדיו. בכל חברה נדרש סקר סיכונים שנתי (בחברה ציבורית גם דיווח לשוק ההון), ולפיו מוגדרים האזורים הקריטיים שמקבלים יתירות ותמיכה מיוחדת."},
{t:"מבוא ויסודות",s:"מקראה",q:"שלוש צורות ההפעלה המקובלות של פעילות ה-FM הן:",o:["FIXED PRICE, COST PLUS, OPEN BOOKS","SINGLE/INHOUSE, IFM (אינטגרציה מלאה על ידי גורם חיצוני), ו-BUNDLER/HYBRID (משולב)","INSOURCING, OUTSOURCING, OFFSHORING","BOT, PFI, PPP"],c:1,e:"שלוש צורות ההפעלה: ניהול עצמאי SINGLE/INHOUSE; אינטגרציה מלאה חיצונית IFM; ומשולב BUNDLER/HYBRID. (FIXED PRICE / COST PLUS / OPEN BOOKS הן שיטות התקשרות/התחשבנות מול חברת IFM — לא צורות הפעלה.)"},
{t:"מבוא ויסודות",s:"מקראה",q:"לפי ההתפתחות ההיסטורית שהוצגה בקורס — מה אפיין את התקופה שמשנות ה-80 ועד שנת 2000?",o:["כלל הפעילות בוצעה על ידי עובדי החברה בלבד","התפתחה פעילות משולבת שעיקרה ביצוע העבודה על ידי עובדי קבלן/חברות חיצוניות, בניהול העסק המעסיק","IFM מלא השתלט על השוק","התפיסה ההיברידית הפכה למקובלת ביותר"],c:1,e:"עד שנות ה-80 — עובדי חברה. משנות ה-80 עד 2000 — מיקור חוץ/עובדי קבלן בניהול העסק. מ-2000 ואילך — התפתחות IFM. ב-10 השנים האחרונות — התפיסה המשולבת (היברידית) היא המקובלת ביותר."},
{t:"מבוא ויסודות",s:"מקראה",q:"חברה ותיקה וגדולה שוקלת להעביר את מערך ה-FM לחברת IFM. אילו שני בסיסי השוואה היא חייבת שיהיו לה כדי שהמהלך יהיה בר-מדידה?",o:["דו\"ח רווח והפסד ותזרים מזומנים","בסיס כספי ברור וידוע (BASE LINE) ורמת שירות קיימת וברורה (SLA)","סקר שביעות רצון וניתוח פארטו","מפרט טכני ותקן ISO 9000"],c:1,e:"המקראה: כדי לאפשר ניהול וביצוע חיצוני עם יכולת השוואה נדרשים שני בסיסים — BASE LINE כספי ברור, ו-SLA (רמת שירות קיימת וברורה). בלעדיהם אי אפשר להוכיח חיסכון או שיפור."},
{t:"מבוא ויסודות",s:"מקראה",q:"שיטת ההתקשרות OPEN BOOKS מול חברת IFM מאופיינת ב:",o:["מחיר קבוע לפעילות נתונה וחישוב חריגים בנפרד","שקיפות מלאה בעלויות ובהוצאות ורווח מוסכם, תוך קביעת מנגנוני קנס/פרס","תשלום לפי מ\"ר בלבד ללא קשר לעלויות בפועל","תשלום רק עבור תפוקות שנמדדו, ללא התייחסות לתשומות"],c:1,e:"OPEN BOOKS = שקיפות מלאה בעלויות, בהוצאות וברווח המוסכם, במדרגות מקובלות, עם מנגנון קנס/פרס. FIXED PRICE הוא מחיר קבוע + חריגים; COST PLUS הוא עלות + רווח מוסכם."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהי \"שיתופיות\" (SHARING) בהקשר של ניהול תשתיות, כפי שהוצגה בקורס?",o:["שיתוף עובדים בין מחלקות שונות באותו אתר","בחינת אפשרות שעסקים סמוכים ירכשו שירותים במשותף — הסעות משותפות, מטבח אחד לכמה חדרי אוכל, פינוי פסולת — כדי להגביר זמינות ולהוריד הוצאות","חלוקת רווחי חברת ה-IFM עם הלקוח","העברת עובדי הקבלן להיות עובדי החברה"],c:1,e:"שיתופיות = שיתוף פעולה בין עסקים סמוכים (או בין אתרים של אותו עסק) לרכישת שירותים משותפים. מקבילה לתחום \"קבוצות רכישה\". בנוסף קיימים בתוך חברות מרכזי shared services נושאיים."},
{t:"מבוא ויסודות",s:"מצגת",q:"מהי התפלגות ההוצאות הטיפוסית בעולם בתחום ה-FM?",o:["50%-60% כוח אדם, 30% חומרים, 10% רגולציה","70%-80% עלויות כוח אדם, 10%-20% חומרים ואמצעים, 5%-10% השפעות רגולטוריות","90% חומרים ואמצעים, 10% כוח אדם","שליש כוח אדם, שליש חומרים, שליש רגולציה"],c:1,e:"מבנה העלויות בעולם ב-FM: כ-70%-80% עלויות כוח אדם, 10%-20% חומרים ואמצעים, 5%-10% השפעות רגולטוריות. ההתפלגות משתנה לפי סוג העסק ומבנהו."},
{t:"מבוא ויסודות",s:"מקראה",q:"מדוע מבנה עלויות שבו כוח אדם הוא המרכיב הדומיננטי כל כך משמעותי בניהול תשתיות?",o:["כי הוא מקטין את החשיפה לשינויים רגולטוריים","כי ככל שהטכנולוגיה מתפתחת היחס בין כוח אדם לאמצעים משתנה — אוטומציה ורובוטיקה מאפשרות מעבר מפעילות מונוטונית קבועה לפעילות לפי צורך (ODS)","כי הוא הופך את הרכש למרכיב שולי","כי הוא מבטיח רווחיות גבוהה לספק"],c:1,e:"מכיוון שרוב ההוצאה היא שכר, כל שינוי טכנולוגי שמחליף עבודת כפיים משפיע ישירות על העלות. לכן המעבר ל-ODS (On Demand Service), אוטומציה ורובוטיקה הוא מנוף מרכזי להוזלה. חשיפה לשינויים רגולטוריים (כמו שכר מינימום) דווקא גדלה."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהו ODS (On Demand Service)?",o:["מערכת דיווח כספי אמריקאית","מעבר מפעילות מונוטונית קבועה לפעילות המבוצעת על פי צורך בפועל","נוהל תפעול סטנדרטי מחייב","הסכם רמת שירות עם ספק חיצוני"],c:1,e:"ODS = ביצוע השירות לפי צורך ולא בתדירות קבועה. לדוגמה: ניקוי משרד רק כשהוא מאויש, במקום שלוש פעמים בשבוע קבוע. חוסך עלות כוח אדם משמעותית."},
{t:"מבוא ויסודות",s:"מקראה",q:"כל הבאים נמנים עם הערך המוסף של ניהול תשתיות גלובלי, למעט:",o:["יצירת סטנדרטיזציה ואחידות באופי וברמת השירות, ויתרון לגודל","שיתוף ידע בין אתרים וזיהוי שיטות עבודה מומלצות","קביעת סטנדרט גלובלי אחיד שגובר על דרישות רגולטוריות מקומיות","שיפור הנראות וההבנה של הוצאות האתרים ובסיס ההוצאה הכוללת"],c:2,e:"זו הטעות: \"סטנדרטים מקומיים תמיד יותאמו לדרישות רגולטוריות מקומיות ויהיו מותאמים לנורמות מקומיות ולשוני תרבותי\". הסטנדרט הגלובלי לעולם אינו גובר על הרגולציה המקומית."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהם הגורמים המרכזיים המשפיעים על הבחירה בין ניהול עצמי לבין רכישת שירותי IFM?",o:["רק מחיר השירות","גודל החברה, שלב מחזור החיים שלה, המורכבות הנדרשת, וכן מבנה המחזור והרווח התפעולי","רק דרישות רגולטוריות מקומיות","רק מספר האתרים של החברה"],c:1,e:"המשפיעים העיקריים: גודל החברה ושלב מחזור החיים, המורכבות הנדרשת, ומבנה המחזור והרווח התפעולי — ככל שהרווח קטן יותר, הצורך להקטין הוצאות גדול יותר ולכן יעדיפו ניהול מבוקר והדוק. חברות קטנות/חדשות יעדיפו רכישת שירותים כוללים."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהם ששת הגורמים המחייבים ארגון מחדש של תמיכת פעילות העסקים? אחד מהבאים אינו נמנה עמם:",o:["שוק חופשי ופתוח ברמה עולמית המחייב תחרות באיכות, שירות ומחיר","התפתחות תובענית בצרכי העובדים, הלקוחות והמנהלים ודרישות רגולטוריות גוברות","קיום עסק סימולטני במספר אתרים במדינה, ביבשת או גלובלית","ירידה בקצב השינויים הטכנולוגיים המאפשרת יציבות ארוכת טווח"],c:3,e:"ההפך הוא הנכון — אחד הגורמים הוא דווקא \"צורך הכרחי לקיים מערכות ותהליכים המסוגלים להשתנות בקצב מהיר מאוד לעין שיעור ביחס לעבר\". הקצב מואץ, לא מאט."},
{t:"מבוא ויסודות",s:"מקראה",q:"מנהל תשתיות מסכם: \"מידע כבר אינו כוח\". כיצד המשפט מסתיים במקראה?",o:["אלא הכוח הוא בשמירת המידע בסודיות מלאה","אלא הכוח הוא בניהול הידע והמידע ובאופן השימוש בו","אלא הכוח הוא בכמות הנתונים שנאספים","אלא הכוח הוא בהשקעה במערכות מידע יקרות"],c:1,e:"\"מידע כבר אינו כוח, אלא הכוח הוא בניהול הידע והמידע ואופן השימוש בו\". זמינות המידע ונגישותו מאפשרים תהליכים שלא התאפשרו קודם."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהי המשמעות של \"ניתוק החשיבות של המיקום הפיזי\" בהקשר של ארגונים גלובליים?",o:["ביטול הצורך במשרדים פיזיים לחלוטין","מאפשר ביזור וניצול יתרונות שונים במקומות שונים — ייזום, מו\"פ, תכנון, ייצור, הפצה, מכירה, שירות ותחזוקה במיקומים נפרדים","העברת כל הפעילות למדינה אחת זולה","הפחתת החשיבות של רגולציה מקומית"],c:1,e:"קיום עסק סימולטני במספר אתרים (מדינה, יבשת, גלובלי) לאורך כל השרשרת — מייזום ומו\"פ ועד שירות ותחזוקה — מאפשר ביזור וניצול יתרונות יחסיים במקומות שונים."},
{t:"מבוא ויסודות",s:"מצגת",q:"אילו מהבאים הן חברות FM/נדל\"ן גלובליות המיוצגות גם בישראל?",o:["Sodexo, Compass, Aramark בלבד","CBRE, JLL, Colliers, Cushman & Wakefield, NAI","SAP, Oracle, Priority בלבד","Amazon, Google, Microsoft"],c:1,e:"החברות הגלובליות שהוצגו: CBRE (הגדולה בעולם לשירותי נדל\"ן מסחרי), JLL, Colliers, Cushman & Wakefield ו-NAI Global. סודקסו היא בעיקר חברת הסעדה/שירותים."},
{t:"מבוא ויסודות",s:"מצגת",q:"על פי הנתונים שהוצגו, CBRE היא:",o:["חברת הסעדה גלובלית עם 50,000 עובדים","חברת שירותי הנדל\"ן המסחרי וההשקעות הגדולה בעולם, עם למעלה מ-100,000 עובדים ולקוחות ביותר מ-100 מדינות","חברת אבטחה ישראלית","יצרנית מערכות בקרת מבנה"],c:1,e:"CBRE Group (NYSE: CBRE), חברת Fortune 500 ו-S&P 500 שמטה שלה בדאלאס, היא חברת שירותי הנדל\"ן המסחרי וההשקעות הגדולה בעולם — מעל 100,000 עובדים ביותר מ-100 מדינות."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהם המשפיעים העיקריים על הצורך בשירותי FM איכותיים לעובדים בעידן שאחרי הקורונה?",o:["רק חיסכון בהוצאות","תחרות בין-עסקית לגיוס ושימור עובדים, חיסכון בהוצאות, מתן שירות עדכני התואם ציפיות, וגמישות תפעולית לעבודה מרחוק","רק דרישות רגולטוריות חדשות","רק התפתחות הטכנולוגיה"],c:1,e:"ארבעת המשפיעים: תחרות על גיוס ושימור עובדים; חיסכון בהוצאות (עלויות תפעול, מחיר ליחידה); שירות עדכני והולם לציפיות; וגמישות תפעולית לעבודה מרחוק/מהבית."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהו סדר ההתפתחות הנכון של מודלי ההפעלה בניהול תשתיות, מהפשוט למורכב?",o:["IFM ← מיקור חוץ ← עצמי ← משולב","עצמי ← מיקור חוץ (שכירת כוח אדם) ← מיקור חוץ מתקדם (הגדרת תפוקות) ← IFM ← משולב/היברידי ← שיתופי פעולה","משולב ← עצמי ← IFM ← מיקור חוץ","מיקור חוץ ← עצמי ← שיתופי פעולה ← IFM"],c:1,e:"סדר ההתפתחות: עצמי (משאבים עצמיים) ← מיקור חוץ שהוא בפועל \"שכירת כוח אדם\" ← מיקור חוץ מתקדם המוגדר לפי תפוקות ולא תשומות ← IFM מלא ← משולב/היברידי ← שיתופי פעולה ו-shared services."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהו ההבדל המהותי בין \"מיקור חוץ\" ל\"מיקור חוץ מתקדם\"?",o:["מיקור חוץ מתקדם עולה פחות","במיקור חוץ רגיל למעשה שוכרים כוח אדם, ואילו במיקור חוץ מתקדם רוכשים שירותים תוך הגדרת תפוקות ולא תשומות","מיקור חוץ מתקדם מבוצע רק על ידי עובדי החברה","אין הבדל מהותי — רק בשם"],c:1,e:"מיקור חוץ רגיל = הוצאת פעילות לספקים חיצוניים בניהול העסק, בפועל \"שכירת כוח אדם\" (תשומות). מיקור חוץ מתקדם = רכישת שירותים תוך הגדרת תפוקות; העסק מנהל בעיקר פיקוח ובקרה. מקובל ב-SOFT."},
{t:"מבוא ויסודות",s:"מקראה",q:"על אילו סוגי \"עסק\" חלה תורת ניהול התשתיות?",o:["רק על מפעלי ייצור תעשייתיים","רק על בנייני משרדים ומרכזים מסחריים","החל ממשרד בודד ועד אתר המשלב שלל עיסוקים — משרדים, מפעלים, מכוני מו\"פ, בתי חולים, בתי מלון, קניונים, אוניברסיטאות, נמלי תעופה, מוסדות שלטון ועוד","רק על חברות גלובליות עם נוכחות בכמה יבשות"],c:2,e:"ההגדרה רחבה מאוד: כל ארגון שיש בו פעילות תומכת — ממשרד בודד ועד אתרים מורכבים: בנייני משרדים, מפעלים, מכוני מחקר, בתי חולים, מלונות, קניונים, בתי ספר ואוניברסיטאות, תחנות רכבת, נמלי תעופה וים, מוסדות שלטון ועוד."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהי המטרה העיקרית של ההבחנה בין SOFT ל-HARD SERVICES?",o:["לקבוע מי מהעובדים יקבל שכר גבוה יותר","לתכנן ולבצע מערכי תמיכה ופעילות מותאמים לדרישות השונות — חלקן רגולטוריות — וליצור שפה משותפת בחברה גם כשיש אתרים מרובים","להחליט אילו שירותים לבטל בעת משבר","לקבוע מי מדווח למנהל התשתיות ומי למשאבי אנוש"],c:1,e:"החלוקה נועדה לתכנן מערכי תמיכה מותאמים לדרישות השונות (חלקן רגולטוריות), ובעיקר ליצור שפה משותפת ואחידה בחברה — כך שסטנדרט ההפעלה יהיה זהה באתרים שונים של אותה חברה."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהו העיקרון המנחה בכל הנוגע לניהול תשתיות ולתנאי הסף לשינוי בעסק?",o:["לשמר את מה שעובד ולא לשנות אותו","להיות קשוב וערני לשינויים בעסק ובסביבה כל הזמן, לא \"להתאהב\" במה שקיים — גם אם אתה יצרת אותו — ולשמור על איכות ביצוע ורמת שירות לצד שליטה מלאה בהוצאות","להתמקד אך ורק בהורדת עלויות","להעביר את כל הפעילות למיקור חוץ"],c:1,e:"התנאי החשוב: לשמור על איכות ביצוע ורמת שירות מחד, ושליטה מלאה ומוחלטת בהוצאות מאידך. ובמקביל — \"לא להתאהב במה שקיים אפילו אם אתה עשית שינויים אלו\"; להיות פתוח לשינוי מתמיד."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהו NETWORKING בהקשר הניהולי של ניהול תשתיות?",o:["הקמת רשת תקשורת מחשבים בין אתרי החברה","יצירת רשת קשרים מקצועיים רלוונטיים ולמידה מעסקים אחרים — דומים ושונים — כדי לזהות מגמות ולהיות מוכן לשנות","קישור מערכות ה-ERP של הספקים ללקוח","ניהול קשרי ספק-לקוח באמצעות פורטל דיגיטלי"],c:1,e:"NETWORKING = יצירת רשת קשרים מקצועיים ולמידה מעסקים אחרים בארץ ובעולם, לא בהכרח באותו תחום. מטרתו לזהות מגמות בזמן ולהיות מוכן לשנות — \"מה שקורה בעולם מגיע אלינו ומהר\"."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהו BOT ומה מאפיין אותו?",o:["Business Operation Transfer — העברת פעילות עסקית בין חברות","Build Operate Transfer — מודל שבו גורם פרטי בונה, מפעיל ומתחזק את הנכס לתקופה ארוכה (כ-25 שנה) ולאחריה מעביר אותו לבעלים","Budget Optimization Tool — כלי לתכנון תקציב","Basic Outsourcing Terms — תנאי מיקור חוץ בסיסיים"],c:1,e:"BOT = BUILD OPERATE TRANSFER. לצדו PFI (Private Finance Initiative) ו-PPP (Public Private Partnership). הסכמים ארוכי טווח לשיתוף פעולה בין המגזר הפרטי לשירות הציבורי, החזר השקעה כ-25 שנה, כולל תפעול ואחזקה."},
{t:"מבוא ויסודות",s:"מצגת",q:"מהם ראשי התיבות ESG ומה הם מבטאים?",o:["Economic Social Growth — צמיחה כלכלית-חברתית","Environmental, Social, Governance — שמירה על חברה וסביבה וממשל תאגידי תקין","Energy Saving Guidelines — הנחיות לחיסכון באנרגיה","External Service Grade — דירוג שירות חיצוני"],c:1,e:"ESG = Environmental, Social, Governance. אחד המשפיעים המרכזיים על הצורך בארגון מחדש של העסקים, לצד אוטומציה, דיגיטציה, סייבר, בינה מלאכותית, אנרגיה ירוקה ועוד."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהו \"מרכז שירות נושאי\" (shared services)?",o:["מוקד שירות טלפוני של ספק חיצוני","יחידה בתוך החברה הנותנת שירות נושאי לאזור או למרחב — כספים, משאבי אנוש, רכש, IT — ללא שיוך עסקי חד-ערכי","מרכז לוגיסטי משותף לכמה חברות","חדר בקרה לניהול מערכות המבנה"],c:1,e:"shared services = מרכזי שירות נושאיים בתוך חברות (כספים, משאבי אנוש, רכש וקניינות, IT), הנותנים שירות לאזור/מרחב ללא שיוך עסקי חד-ערכי. כולל מוקדי תמיכה גלובליים העונים לפונה בשפתו."}
];

{t:"הובלה והסעות",s:"מקראה",q:"מהו GDP בהקשר של הובלה ומה הוא מחייב?",o:["Gross Domestic Product — מדד כלכלי המשפיע על מחירי ההובלה","Good Distribution Process — רגולציה המחייבת ביצוע \"ולידציה\" לרכב המוביל, לוודא עמידה בתנאים כמו בקרת טמפרטורה, לחות ואטימות, לצד תיעוד רצוף","General Delivery Protocol — נוהל מסירה אחיד","Global Driver Program — תוכנית הכשרת נהגים בינלאומית"],c:1,e:"GDP = GOOD DISTRIBUTION PROCESS. מחייב ולידציה לרכב המוביל (בקרת טמפרטורה, לחות, אטימות) ותיעוד רצוף מנקודת המוצא לנקודת הקבלה — בעבר בתיעוד מודפס, כיום ב\"אמצעים חכמים\" (צ'יפים)."},
{t:"הובלה והסעות",s:"מקראה",q:"אילו אמצעי שליטה ובקרה מקובלים היום במערך ההובלה?",o:["רק דיווח טלפוני של הנהג","GPS וטכוגרף המאפשרים ניטור מתמיד — חיווי עצירה, פתיחת דלת מטען, התראה על חריגה ממסלול או מזמן, ובקרת טמפרטורה עם רישום דיגיטלי מקוון","רק תעודות משלוח חתומות","רק ביקורות פתע במחסני היעד"],c:1,e:"מערכות GPS וטכוגרף מאפשרות ניטור מרגע ההגעה לרמפה ועד היציאה לדרך: חיווי עצירה, פתיחת דלת מטען, חריגה ממסלול מסוכם, חריגה בזמן. ברכבי קירור — חיווי שוטף וספח מודפס או חיישן ורשם דיגיטלי מקוון."},
{t:"הובלה והסעות",s:"מקראה",q:"מהי MOBILITY בהקשר של הסעות עובדים והגעה לעבודה?",o:["מערכת ממוכנת לתכנון מסלולי הסעה","תפיסה מתפתחת (מובילות בה הולנד ואיטליה) של הקצאת תקציב חודשי ומערך הסכמים המאפשרים הגעה לעבודה ברכבת, מטרו, אוטובוס, אופניים או שילוב ביניהם, ולעיתים רכב לסוף שבוע","שירות הסעות מזדמנות במוניות","חברת ליסינג בינלאומית"],c:1,e:"MOBILITY — שילוב אמצעי ניידות בתוך תקציב מוגדר לעובד. המוטיב המוביל: איכות סביבה ובריאות. כולל רכבת, מטרו, אוטובוס, אופניים (עם מקלחת וחניה בטוחה) ואפשרות רכב לסוף שבוע או לאירוע."},
{t:"הובלה והסעות",s:"מקראה",q:"אילו קריטריונים צריך לקבוע נוהל (POLICY) הסעות עובדים?",o:["רק את שעות היציאה והחזרה","כמה עובד מוכן ללכת מביתו לנקודת איסוף, כמה זמן ישהה ברכב, מי רשאי להשתמש בהסעה, ומה קורה עם עובד שנרשם ולא הגיע","רק את סוג הרכב המשמש להסעה","רק את זהות חברת ההסעה"],c:1,e:"נוהל ההסעות קובע קריטריונים: מרחק הליכה מהבית לנקודת איסוף/הורדה; משך שהייה ברכב; מי רשאי להשתמש (למשל האם בעל רכב חברה או מקבל אחזקת רכב); טיפול בעובד שנרשם ולא הגיע; והוראות בטיחות מקצין בטיחות בתעבורה."},
{t:"הובלה והסעות",s:"מקראה",q:"בהתקשרות עם חברות כמו GETT או YANGO להסעות מזדמנות — על מה יש לשים לב במיוחד?",o:["על גובה העמלה בלבד","שבניגוד להסכם עם תחנת/חברת מוניות, אין יחסי עובד-מעביד בין בעל המונית לחברה, ולכן נושא הביטוח צריך לקבל ביטוי מיוחד ושונה","שהמחירים אינם אחידים בין אזורים","שלא ניתן לשלם בכרטיס אשראי"],c:1,e:"בהסכמים מסוג זה אין יחסי עובד-מעביד בין בעל המונית לחברה, ולכן יש לבחון את החשיפה המשפטית ואת נושא הביטוח באופן מיוחד. בעיה נוספת: מחויבות נמוכה של הנהגים משפיעה על זמינות בשעות הביקוש."},
{t:"הובלה והסעות",s:"מקראה",q:"מהו האתגר המרכזי ביצירת תהליך מסודר להגדרת צרכי הובלה בחברה?",o:["עלות מערכות המחשוב","הרצון של כל עסק לשמור על גמישות מרבית ולא לתכנן — למרות שהרוב ידוע מראש; נדרש שינוי בתרבות הארגונית","חוסר בנהגים מוסמכים","מחסור במשאיות מתאימות"],c:1,e:"האתגר: \"למרות הרצון של כל עסק לשמור על גמישות מרבית ולא לתכנן — לא צריך לאפשר זאת, הרוב ידוע מראש\". נדרש תהליך קבוע להגדרת צרכים עד יום קבוע בשבוע, ושינוי בתרבות הארגונית."},
{t:"הובלה והסעות",s:"מקראה",q:"מהי \"הובלת כספת\" שהוזכרה כטכנולוגיה מתפתחת?",o:["הובלה בליווי מאובטח חמוש","כספת הנסגרת ביעד השולח, וכשהיא מגיעה ליעד הפריקה מקבל מורשה ביעד קוד לפתיחתה","משאית ממוגנת ירי","מכולה עם בקרת טמפרטורה"],c:1,e:"טכנולוגיה מתפתחת לאבטחת מטענים רגישים (סמים בעולם התרופות, כסף, אבנים יקרות): הכספת נסגרת אצל השולח, ורק מקבל מורשה ביעד מקבל את הקוד לפתיחתה."},
{t:"הובלה והסעות",s:"מקראה",q:"מה קרה להובלה הימית לישראל בעקבות משבר החות'ים?",o:["הובלה ימית הופסקה לחלוטין","אוניות נדרשו להקיף דרך כף התקווה הטובה באפריקה במקום תעלת סואץ — מה שהאריך את הדרך וייקר את הפעילות","המחירים ירדו בשל ירידה בביקוש","ההובלה עברה כולה לרכבות"],c:1,e:"בעקבות המשבר עם החות'ים נדרשו אוניות להקיף דרך כף התקווה הטובה במקום תעלת סואץ בדרך לים התיכון — הארכת זמן וייקור הפעילות. בהובלה אווירית — ביטול טיסות רבות לישראל השפיע על הטסת מטען (שחלקו הגדול במטוסי נוסעים)."},
{t:"הובלה והסעות",s:"מקראה",q:"מה מאפיין את שוק חברות ההובלה בישראל?",o:["מונופול של חברה אחת גדולה","מספר חברות גדולות עם יכולת לוגיסטית משלימה, לצד חברות קטנות ובינוניות פרטיות וציבוריות המאוגדות לעיתים בקואופרטיב","רק חברות בבעלות ממשלתית","רק צי רכב עצמי של החברות המובילות"],c:1,e:"השוק מאופיין במספר חברות גדולות עם יכולת משלימה לוגיסטית כוללת, ולצידן חברות קטנות ובינוניות פרטיות וציבוריות, לעיתים מאוגדות בקואופרטיב. לעיתים גם צי הובלה בבעלות החברה — בהתאם לכדאיות עסקית ולמדיניות."},
{t:"הובלה והסעות",s:"מקראה",q:"מהו \"מרכז הובלה\" בחברה גדולה?",o:["מחסן מרכזי שבו מרוכזים כל המטענים","מרכז שליטה, תכנון ובקרה המאחד גורמים שונים בחברה שאין ביניהם קשר — כדי לשלב ולמצות נסיעות","המשרד של חברת ההובלה החיצונית","נקודת מפגש בין נהגים למחסנאים"],c:1,e:"\"מרכז הובלה\" הוא מרכז שליטה, תכנון ובקרה. הרעיון: גורמים שונים בחברה מזמינים הובלות ללא קשר ביניהם; ריכוזם מאפשר שילוב, מיצוי ונסיעה במטען מלא. אותו רעיון מיושם ב\"מוקד הסעות\" ארצי."}

{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מהי התכיפות המקובלת לניקיון משרדים, ומהו החידוש בגישה?",o:["כל יום, ללא יוצא מן הכלל","מקובל 3 פעמים בשבוע; החידוש — משרדים שאינם מאוישים אינם מנוקים אלא בסמוך לחזרת השימוש בהם, ופחי אשפה ממוינים מרוכזים במקום אחד בקומה","פעם בשבוע בלבד","פעמיים ביום בשעות העומס"],c:1,e:"במשרדים מקובל 3 פעמים בשבוע. גישה מתקדמת: פחי אשפה ממוינים (פלסטיק, נייר, זכוכית, קרטון) במקום אחד בקומה, ומשרדים לא מאוישים אינם מנוקים אלא בסמוך לחזרה לשימוש — חיסכון משמעותי."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מדוע הניקיון הוא גורם דומיננטי במיוחד בחברות תרופות ומזון?",o:["בגלל דרישות איכות הסביבה","כי ה-SET UP של סוויטת ייצור לוקח כיומיים בעוד הייצור עצמו נמשך בין חצי יום ליום — ונדרש ניקיון יסודי מתרופה/מזון קודמים בכל מחזור","כי העובדים דורשים תנאי עבודה מיוחדים","כי עלות חומרי הניקוי גבוהה מאוד"],c:1,e:"בחברות תרופות/מזון/תוספי מזון הניקיון הוא חלק מתהליך העבודה: ה-SET UP של הסוויטה נמשך כיומיים והייצור עצמו חצי יום עד יום. נדרש ניקיון יסודי מהמוצר הקודם, ובמערך סטרילי הדרישות גבוהות אף יותר."},

{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מהם שבעת התחומים העיקריים שבהם עוסק הביטחון בחברה? אחד מהבאים אינו נמנה עמם:",o:["אבטחה פיזית ומדיניות ביטחון (כניסת עובדים ואורחים)","ביטחון הקשור במהימנות עובדים וספקים, ותחום החקירות","ביטחון מידע לרבות סייבר, ומערכות בקרה ושליטה לאבטחה","ניהול תיקי ביטוח רכוש ואחריות מקצועית של החברה"],c:3,e:"ניהול תיקי הביטוח אינו חלק מתחומי הביטחון. שבעת התחומים: אבטחה פיזית; מדיניות ביטחון; מהימנות עובדים וספקים; אבטחת אתרים ושרשרת האספקה; חקירות; ביטחון מידע וסייבר; ומערכות בקרה ושליטה לאבטחה (כולל SOS)."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מהם המדדים המקובלים לבחינת עלות הביטחון?",o:["עלות לשעת שמירה בלבד","עלות מ\"ר בביטחון לפי סוגי אתר, ו/או עלות הביטחון ביחס לכמות האנשים באתר — לצד השוואה לחברות אחרות","מספר האירועים החריגים בשנה","מספר המצלמות המותקנות באתר"],c:1,e:"המושגים המוכרים: עלות מ\"ר בביטחון (לפי סוגי אתר — משרדים, מפעלים, מרכזים לוגיסטיים) ו/או עלות הביטחון ביחס לכמות האנשים באתר, עם השוואת benchmark לחברות אחרות."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מהו \"תיק אבטחה\" ומה תפקידו?",o:["תיק אישי של כל מאבטח עם הכשרותיו","תיק המגדיר בכל אתר את הסיכונים, המענה והפערים — ועל בסיסו מקיימים תרגילים מתוכננים ופתע","רשימת ציוד האבטחה באתר","חוזה ההתקשרות עם חברת האבטחה"],c:1,e:"תיק אבטחה מחייב בכל אתר ובכל פעילות ומגדיר סיכונים, מענה ופערים. על בסיסו מקיימים תרגילים מתוכננים ופתע, עם שגרת הפקת לקחים והעברת מידע בין האתרים ללמידה ושיפור מתמיד."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מהו האתגר הקשה ביותר בתחום הביטחון לאורך זמן?",o:["עלות המערכות הטכנולוגיות","השגרה — החזקת מתח מבצעי לאורך זמן, מה שמחייב שינויים מתמידים, תרגולים, ביקורות ותחקירים והקפדה על הוראות ללא פשרות","מציאת מאבטחים מוסמכים","התיאום עם המשטרה"],c:1,e:"\"אחד הדברים הקשים בביטחון — שגרה, החזקת מתח מבצעי לאורך זמן\". הפתרון: שינויים מתמידים, תרגולים, ביקורות, תחקירים והקפדה על הוראות ללא פשרות."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"למה מכוונות \"חברות הערכת סיכונים\" בתחום הביטחון?",o:["חברות ביטוח המעריכות נזק פוטנציאלי","חברות גלובליות העוסקות באיסוף מודיעין גלוי וחסוי ועורכות הערכות מצב ביטחוניות לכל מדינה, עיר ואזור בעולם","חברות המבצעות מבחני מהימנות תעסוקתית","חברות המתקינות מערכות בקרת כניסה"],c:1,e:"חברות הערכת סיכונים הן חברות גלובליות לאיסוף מודיעין גלוי וחסוי, העורכות הערכות מצב ביטחון לכל מדינה/עיר/אזור. לצדן פועלות חברות ביקורת, חברות חקירה וחברות למיומנות תעסוקתית."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מדוע מומלץ להפריד בין חברת המבחנים הממוחשבים למהימנות תעסוקתית לבין מכון הבדיקה המעמיק?",o:["כדי לחסוך בעלויות","כדי שהאחד לא \"יזין\" את השני — כלומר שלא ייווצר תמריץ להפנות בדיקות מעמיקות מיותרות","כדי לעמוד בדרישות רגולטוריות","כדי לקצר את זמן קליטת העובד"],c:1,e:"במקראה: \"כדאי מאוד להפריד בין 2 פעילויות אלו אחרת האחד מזין את השני\" — כלומר חברה שמבצעת גם את המבחן הממוחשב וגם את הבדיקה המעמיקה עלולה ליצור לעצמה עבודה נוספת."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"אילו מרכיבים חייב לכלול הסכם עם חברת אבטחה?",o:["רק את מספר המאבטחים והשכר","תיאור מדויק של רמת הדרישות, הכשרות ומיומנויות, משמרות וחפיפה, SLA מפורט, KPI להפרות וליקויים בביקורות עם מנגנון קנס-פרס, ונשק (נשיאה, הפעלה, החסנה וכשירות)","רק את שעות הפעילות","רק את זהות מנהל האבטחה"],c:1,e:"ההסכם חייב לכלול: דרישות מדויקות והכשרות; משמרות, כניסה, חפיפה והעברת משמרת; SLA מפורט; KPI להפרות/הערות/ליקויים עם מנגנון קנס-פרס; התייחסות לשבתות וחגים ותשלום 125%/150%; דרישות לבוש; וסוגיות נשק."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מהי מערכת SOS גלובלית בהקשר של ביטחון עובדים?",o:["מערכת כריזה באתרי החברה","מערכת חירום גלובלית המאפשרת קשר עם עובדים בכל מקום שבו מתרחש אירוע חירום — אסון טבע או טרור — לזהות מי בטווח הסכנה ולדאוג להעברתם למקום בטוח","מערכת גיבוי לנתוני החברה","מוקד תלונות של עובדים"],c:1,e:"ביטחון עובדים גלובלי, בעיקר לנוסעים לחו\"ל: מערכות חירום גלובליות המאפשרות בקרה על מי נמצא בטווח הסכנה בעת אירוע חירום, יצירת תקשורת עמם ודאגה להגעתם למקום בטוח."},

/* ===================== 5. ציי רכב ===================== */
{t:"ציי רכב",s:"מקראה",q:"מהו \"שווי שימוש\" ומהו השיעור המקובל?",o:["דמי הליסינג החודשיים שמשלמת החברה","החיוב במס על השימוש הפרטי ברכב חברה — כ-2.48% ממחיר הרכב החדש לפי מחירון היבואן","הפחת השנתי של הרכב בספרי החברה","ההשתתפות העצמית בתאונה"],c:1,e:"שימוש פרטי ברכב חברה נחשב הטבה ולכן מחויב במס — \"שווי שימוש\", כ-2.48% ממחיר הרכב החדש לפי מחירון היבואן, ללא קשר למודל בפועל. לרכב חשמלי/היברידי יש הקלה בשווי המס."},
{t:"ציי רכב",s:"מקראה",q:"מהו \"רכב תפעולי\" ומה מגבלותיו?",o:["רכב שניתן לעובד לשימוש מלא כולל פרטי","רכב המשמש לצורך עבודה בלבד, שיש להחזירו בסוף כל יום למקום העבודה, ואסור בשימוש פרטי על פי חוק","רכב בבעלות העובד המשמש לעבודה","רכב ליסינג ללא מגבלת קילומטראז'"],c:1,e:"רכב תפעולי מוגדר לשימוש עבודה בלבד, חייב לחזור בסוף כל יום למקום העבודה ואסור בשימוש פרטי על פי חוק. חייב להיות בפוליגון מוגדר (סלולרי או אחר), הסדר המקובל על רשות המיסים."},
{t:"ציי רכב",s:"מקראה",q:"מהי חובת ההדרכה לנוהגים ברכב חברה?",o:["הדרכה חד-פעמית עם קבלת הרכב","הדרכה פעילה לפחות אחת לשנתיים על ידי מנהל צי הרכב וקצין בטיחות בתעבורה, בתוספת מעקב אחר מעורבות בתאונות","הדרכה שנתית בלבד למי שהיה מעורב בתאונה","אין חובת הדרכה — רק רישיון בתוקף"],c:1,e:"מחייב הדרכה פעילה לנוהגים לפחות אחת לשנתיים על ידי מנהל צי הרכב וקצין בטיחות בתעבורה, מעקב אחר מעורבות בתאונות (באשמה ולא באשמה), ותיעוד ודיווח שנתי למשרד התחבורה. אפשרי גם בלומדה ממוכנת."},
{t:"ציי רכב",s:"מקראה",q:"מהו \"הסבת דו\"ח\" ומדוע היא חיונית?",o:["העברת הרכב לעובד אחר בחברה","העברת דו\"ח תנועה או חנייה לשם הנוהג שביצע את העבירה — כי הרכב רשום בבעלות החברה, ואם לא מסבים, הקנס לחברה גבוה מאוד","החזרת הרכב לחברת הליסינג לפני תום התקופה","הסבת החוזה מליסינג תפעולי למימוני"],c:1,e:"מאחר שהרכב רשום בבעלות החברה (בליסינג או אחרת), חייב להתקיים מנגנון \"הסבת דו\"ח\" לשם הנוהג. אם לא מסבים — הקנס המוטל על החברה גבוה מאוד."},
{t:"ציי רכב",s:"מקראה",q:"מהי מדיניות ההחלפה המקובלת ברכבי ליסינג?",o:["שנתיים או 50,000 ק\"מ","3-5 שנים או 100,000 ק\"מ, המקדים מביניהם — או גם וגם","7 שנים ללא מגבלת ק\"מ","החלפה רק בעת תקלה מהותית"],c:1,e:"מדיניות ההחלפה המקובלת: 3-5 שנים או 100,000 ק\"מ, המקדים מביניהם (או שילוב). המקראה מציינת שכיום זה מתנהג מעט אחרת בגלל מחסור בכלי רכב."},
{t:"ציי רכב",s:"מקראה",q:"מהי רמת השירות המקובלת להספקת רכב ליסינג מרגע ההזמנה?",o:["מיידית, מהמלאי באתר החברה","14 יום אם קיים במלאי הספק בארץ; אם לא — ניתן לוח זמנים צפוי ורכב חילופי/גישור באותה רמת זכאות","30 יום בכל מקרה","תלוי בסוג הרכב, ללא התחייבות"],c:1,e:"זמן הספקה מקובל: 14 יום אם קיים במלאי הספק בארץ. אם לא — ניתן לו\"ז צפוי ורכב חילופי/גישור באותה רמת זכאות."},
{t:"ציי רכב",s:"מקראה",q:"מהו הכלל המקובל להצבת מנהל צי רכב באתרי החברה?",o:["מנהל אחד לכל אתר, ללא קשר לגודלו","בערך אחד לכל 100 כלי רכב — כשחלקם גם קציני בטיחות בתעבורה","מנהל אחד לכל 500 כלי רכב","רק בחברות עם יותר מ-1,000 כלי רכב"],c:1,e:"מקובל להציב מנהל צי רכב בערך לכל 100 כלי רכב, וחלקם משמשים גם כקציני בטיחות בתעבורה. לגבי קציני בטיחות — אחד בכל מקרה, ועוד אחד לכל 300 כלי רכב נוספים (בסמכות משרד התחבורה)."},
{t:"ציי רכב",s:"מקראה",q:"מה מקובל לגבי החזרת רכבי ליסינג לפני תום התקופה?",o:["אין אפשרות להחזיר לפני תום התקופה","מסכמים מראש מנגנון קנס; מקובל שעד 15% מכמות הרכב יכולה להיות מוחזרת לספק ללא קנס בתקופה של 3 שנים","ניתן להחזיר את כל הצי ללא קנס","הקנס הוא תמיד מלוא יתרת התשלומים"],c:1,e:"מקובל: עד 15% מכמות הרכב ניתנת להחזרה לספק ללא קנס בתקופה של 3 שנים, בהתאם למדיניות החברה (למשל העברת רכב משומש לעובד אחר). את המנגנון יש לסכם מראש."},
{t:"ציי רכב",s:"מקראה",q:"מהן שלוש השיטות העיקריות להפעלת צי רכב?",o:["ליסינג תפעולי, ליסינג מימוני, שכירות יומית","רכב בבעלות החברה; רכב בשכירות/ליסינג תפעולי; ורכב בבעלות המופעל על ידי חברות הפעלה חיצוניות","רכב פרטי של העובד, רכב חברה, רכב מושכר","קנייה, החכרה, השאלה"],c:1,e:"שלוש השיטות: (1) רכב בבעלות שנרכש על ידי החברה; (2) רכב בשכירות/ליסינג תפעולי — בתפעול מלא או חלקי; (3) רכב בבעלות המופעל על ידי חברות הפעלה חיצוניות — מקובל מאוד באירופה ובדרום אמריקה."},
{t:"ציי רכב",s:"מקראה",q:"מהי \"תקנה 6\" בהקשר של ניהול צי רכב?",o:["חובת ביטוח מקיף לכל רכב חברה","חובת הרכב לשאת בחלקו האחורי פרטי התקשרות לתלונות (\"כוכבית 4 ספרות\"), עם מוקד המחייב ניהול, רישום טיפול ודיווח למשרד התחבורה","הגבלת מהירות לרכבי חברה","חובת התקנת מערכת GPS"],c:1,e:"תקנה 6 מחייבת שהרכב יישא בחלקו האחורי פרטי התקשרות לתלונות — \"כוכבית 4 ספרות\". מחייב מוקד, ניהול ורישום טיפול בתלונות ודיווח למשרד התחבורה."},
{t:"ציי רכב",s:"מקראה",q:"מהו \"בנק ק\"מ\" ומהו \"בנק צמיגים\"?",o:["חשבונות בנק ייעודיים למימון הצי","מנגנוני התחשבנות מצרפיים — ניהול הקילומטראז' והצמיגים ברמת הצי כולו ולא פרטנית לכל רכב","תוכניות מימון של יבואני הרכב","קרנות פיצוי על תאונות דרכים"],c:1,e:"בנק ק\"מ — קביעת מכסת נסועה שנתית לצי כולו עם מנגנון התחשבנות מוסכם מראש (הנסועה משפיעה על המחיר). בנק צמיגים — ניהול מצרפי ולא פרטני לכל רכב, לצד הגדרה אילו סוגים מותרים וכמה החלפות ב-4 שנים ללא חיוב."},
{t:"ציי רכב",s:"מקראה",q:"מהו \"השבה לקדמות\" בהחזרת רכב ליסינג?",o:["החזרת הרכב לחברת הליסינג בתום התקופה","מנגנון התחשבנות על מצב הרכב בהחזרה — אפשר לקבוע סכום קבוע ללא בדיקה, מקובל 100-400 דולר לרכב במשא ומתן","ניקוי הרכב לפני החזרתו","החלפת כל החלקים שהתבלו"],c:1,e:"בהחזרת הרכב נדרש מנגנון ברור להתחשבנות על נזקים. אפשרות: קביעת סכום קבוע ללא בדיקה, מקובל בין 100-400 דולר לרכב, נתון למשא ומתן; ואפשרות לכלול זאת בביטול ההשתתפות העצמית."},
{t:"ציי רכב",s:"מקראה",q:"מהו המדד המקובל למדידת בטיחות בצי רכב?",o:["מספר הדו\"חות שהוסבו לנהגים","כמות מעורבים בתאונות באשמה / לא באשמה ביחס לנסועה (כמות כלי רכב וכמות ק\"מ שנסעו) — נבדק מול שנה קודמת ומול השוואה כללית","עלות התיקונים השנתית","מספר הרכבים שהוחלפו בשנה"],c:1,e:"המדד: כמות מעורבים בתאונות באשמה/לא באשמה ביחס לנסועה. יוצר מדד הנבדק כל שנה מול שנה קודמת ומול השוואה כללית — לעובדים, לעסק ולאזור — ומאפשר לאתר מגמות ולאבחן בעיות תוך ציון סוגי הפגיעות."},
{t:"ציי רכב",s:"מקראה",q:"כמה כלי רכב בליסינג יש בישראל, לפי הנתונים שהוצגו?",o:["כ-50,000","כ-220,000 (לעומת כ-280,000 לפני הקורונה)","כ-500,000","כ-1,000,000"],c:1,e:"מרבית החברות רוכשות שירותי רכב בליסינג — כ-220,000 כלי רכב בישראל, לעומת כ-280,000 לפני הקורונה."},

{t:"רכש",s:"מקראה",q:"מי חייב להיות חבר בוועדת רכש/מכרזים בכל תהליך?",o:["רק מנהל הרכש","נציג כספים, נציג משפטית ונציג רכש — ולפי העניין גם מנהל העסק וגורמים רלוונטיים נוספים","רק מנהל העסק שהנושא באחריותו","נציג משאבי אנוש ונציג בטיחות"],c:1,e:"החברים המחויבים תמיד: נציג כספים, נציג משפטית ונציג רכש; ולפי העניין מנהל העסק וגורמים נוספים. בגופים ציבוריים — הרכב ועדת המכרזים נקבע בחוק/בתקשי\"ר."},

{t:"רכש",s:"מקראה",q:"מה מאפיין \"הסכם מסגרת\" לעומת הסכם רכש טובין?",o:["הסכם מסגרת מחייב רכישת כמות מינימלית","הסכם מסגרת מגדיר התקשרות מול ספק בערך כספי בלבד ואינו מכיל פריטים וכמויות — למשל קבלני בנייה ושיפוץ","הסכם מסגרת תקף לשנה אחת בלבד","הסכם מסגרת חל רק על שירותים ולא על טובין"],c:1,e:"הסכם מסגרת מגדיר התקשרות בערך כספי בלבד, ללא פריטים וכמויות (דוגמה: קבלני בנייה ושיפוץ). הסכם רכש טובין הוא מסמך התקשרות לרכישת פריטים ונכסים מוחשיים (למעט מקרקעין). הסכם רכש שירות מכיל פריטים, כמויות ורמת שירות אך אינו מכיל התחייבות."},

{t:"רכש",s:"מקראה",q:"מהי \"קבוצת רכישה\"?",o:["מחלקת הרכש של החברה","שיתוף פעולה בין חברות לביצוע רכש משותף, הנותן יתרון לגודל ויכולת פעולה מול מונופול או דואופול","קבוצת ספקים המאוגדת יחד","ועדת הרכש של הארגון"],c:1,e:"קבוצת רכישה = שיתוף פעולה בין חברות לרכש משותף. נותן יתרון לגודל ויכולת פעולה מול מונופול/דואופול. הערה חשובה: אם אנחנו העסק המוכר — זה יכול לפעול גם נגדנו."},
{t:"רכש",s:"מקראה",q:"מהם המרכיבים שחייבים להיכלל בכל הסכם רכש?",o:["רק מחיר ולוח זמנים","מנגנון תשלום ברור, מנגנון קנס-פרס, SLA מוגדר, מנגנוני הצמדה, אפשרויות יציאה דו-צדדיות, תהליך יישוב סכסוכים וסוגיות ביטוח","רק SLA ומנגנון קנס-פרס","רק תנאי התשלום ומנגנוני ההצמדה"],c:1,e:"ההסכם חייב לצמצם את מרחב אי-הוודאות: מנגנון תשלום; מנגנון קנס-פרס; SLA; מנגנוני הצמדה רלוונטיים (מדדי הלמ\"ס, שכר מינימום, מטבעות); אפשרויות יציאה דו-צדדיות ומנגנוני פיצוי; תהליך יישוב קונפליקטים (מגשר, בית משפט); וסוגיות ביטוח."},
{t:"רכש",s:"מקראה",q:"מהי הנחת היסוד המרכזית בניהול ספקים (SRM)?",o:["הספק והלקוח הם יריבים ויש למקסם את הרווח על חשבון הספק","הלקוח רוצה את המוצר/שירות ברמה הגבוהה ביותר במחיר הנמוך ביותר, והספק רוצה לתת את הטוב ביותר במחיר הגבוה ביותר — ועל המנהל למצוא את נקודת האיזון","הספק תמיד יודע טוב יותר מה נכון ללקוח","יש להחליף ספקים בתדירות גבוהה כדי לשמור על מחירים"],c:1,e:"הנחת היסוד: אינטרסים מנוגדים מובנים. תפקיד המנהל למצוא את נקודת האיזון ולקיים מערכת יחסים מכובדת ומכבדת. ההבנה שהספק צריך להרוויח באופן הוגן מייצרת שיתוף פעולה ארוך טווח, שקיפות והגינות."},
{t:"רכש",s:"מקראה",q:"מה מומלץ לגבי מפגשים קבועים בין לקוח לספק?",o:["להיפגש רק כשמתגלה בעיה","לקבוע מפגש קבוע (רבעוני/חצי שנתי/שנתי לפי הנושא) עם הגדרה ברורה של משתתפים ונושאים, סיכום עם משימות לשני הצדדים — והמפגש הבא נפתח בסקירת הסיכום הקודם","להיפגש רק בסיום תקופת ההסכם","המפגשים מיותרים אם יש SLA מפורט"],c:1,e:"יש לקבוע מפגש קבוע לפי מורכבות הנושא וחיוניותו. המפגש מוגדר: מי משתתף ובאיזו רמה, אילו נושאים מוצגים, דיון וסיכום עם משימות לשני הצדדים ואחריות ולוח זמנים. המפגש הבא נפתח בסקירת הסיכום הקודם. המפגש אינו תחליף לקשרי עבודה שוטפים."},

{t:"נדל\"ן",s:"מקראה",q:"מהי המטרה של ניהול נכסים (נדל\"ן עסקי)?",o:["למקסם את רווחי החברה ממכירת נכסים","לאפשר לעסק לפעול בכל מקום ובכל זמן בהתאם לצרכיו המשתנים, במחיר טוב וברמת שירות טובה, ולשמור על האינטרסים של החברה לאורך זמן","להחזיק כמה שיותר נכסים בבעלות","למזער את תשלומי הארנונה"],c:1,e:"ניהול נכסים צריך לאפשר לעסק לפעול בכל מקום ובכל זמן לפי צרכיו המשתנים, במחיר ורמת שירות טובים, ולשמור על אינטרסים של החברה לאורך זמן מפני שינויים בסביבה. קבועי הזמן ארוכים ולכן נדרש תכנון ארוך טווח."},
{t:"נדל\"ן",s:"מקראה",q:"מהו \"נסח טאבו\" ומדוע הוא חשוב?",o:["אישור מהרשות המקומית על תשלום ארנונה","מסמך לפי גוש, חלקה ותת-חלקה המציג את כל ההיסטוריה של הנכס — בעלויות, שעבודים ועיקולים — אם כי ייתכן שדבר-מה בתהליך ועדיין לא מופיע","תוכנית בניין עיר של האזור","הערכת שמאי לשווי הנכס"],c:1,e:"נסח טאבו מציג את היסטוריית הנכס: בעלויות, שעבודים, עיקולים — לפי גוש, חלקה ולעיתים תת-חלקה. אזהרה חשובה: ייתכן שמשהו נמצא בתהליך ועדיין לא ידוע/רשום."},
{t:"נדל\"ן",s:"מקראה",q:"מהן שלוש הגישות להערכת שווי נדל\"ן?",o:["גישת המחיר, גישת השוק, גישת המס","גישת היוון ההכנסות (לנדל\"ן מניב מסחרי), גישת ההשוואה (בעיקר ללא-מניב), וגישת העלות (רכישת קרקע, פיתוח ובנייה בניכוי פחת ורווח יזמי)","גישת הבעלות, גישת השכירות, גישת החכירה","גישת ה-IFRS, גישת ה-US GAAP, גישת התקן הישראלי"],c:1,e:"שלוש הגישות: היוון הכנסות — לנדל\"ן מניב מסחרי; השוואה — בעיקר לנדל\"ן לא מניב; עלות — כמה יעלה לרכוש קרקע, לפתח ולבנות, בניכוי פחת ורווח יזמי."},
{t:"נדל\"ן",s:"מקראה",q:"מהו \"סטנדרט בנייה\" (CONSTRUCTION STANDARD) ומה תפקידו?",o:["תקן ישראלי מחייב לבנייה","מסמך מפורט הקובע את הסטנדרט הנדרש לכל סוג נכס — גודל לעובד, פונקציות מחייבות, תשתיות, חומרים, תגמירים ושפה עיצובית — היוצר אחידות אדריכלית ומיתוגית בחברה","דרישות כיבוי אש ובטיחות","תקן LEED לבנייה ירוקה"],c:1,e:"הסטנדרט מגדיר גודל נדרש לעובד/יחידה/מחלקה, שטחים ופונקציות ציבוריות, תשתיות ומערכות, חומרים ואיכות תגמירים, ונראות עם אלמנטים וצבעים מאושרים. יוצר אחידות אדריכלית ומיתוגית, ומאפשר שימוש חוזר בתכנון — חיסכון בזמן ובעלויות."},
{t:"נדל\"ן",s:"מקראה",q:"מה ההבדל בין IFRS ל-US GAAP בכל הנוגע להערכת שווי נדל\"ן?",o:["אין הבדל מהותי","IFRS מחייב הערכת שווי נכסים מדי שנה על ידי שמאי מוסמך, ואילו ב-US GAAP מסתפקים בשווי רשום עם עדכוני מדדים","US GAAP מחייב שמאות שנתית ו-IFRS לא","שתי השיטות אוסרות הערכת שווי מחדש"],c:1,e:"IFRS מחייב הערכת שווי נכסים מדי שנה על ידי שמאי מוסמך. ב-US GAAP מסתפקים בשווי רשום עם עדכוני מדדים, אך נדרש דו\"ח שנתי 20F שבו יש לדווח על שינוי מהותי בנכסים במהלך השנה המדווחת."},
{t:"נדל\"ן",s:"מקראה",q:"מהי הארנונה בישראל ומה מאפיין אותה?",o:["מס המשולם לרשות המסים לפי שווי הנכס","מס נכסים המעוגן בחוק ואינו קשור לשירותים המתקבלים מהרשות המקומית; שיעור ההתייקרות השנתית מאושר על ידי שר הפנים והכנסת","תשלום וולונטרי עבור שירותים עירוניים","מס המשולם רק על נכסים מסחריים"],c:1,e:"בישראל תשלום הארנונה מעוגן בחוק ואינו קשור לשירותים המתקבלים מהרשות המקומית. ההתייקרות השנתית מאושרת על ידי שר הפנים והכנסת; התייקרות חריגה מחייבת בקשה מיוחדת ואישור שר הפנים."},
{t:"נדל\"ן",s:"מקראה",q:"מהי דרך מומלצת להוזלת תשלומי ארנונה?",o:["הגשת ערר לבית המשפט המחוזי","העסקת חברות המתמחות בבדיקת תשלומי ארנונה הפועלות על בסיס הצלחה — ומקבלות אחוז מההוזלה","הפסקת תשלום עד לבירור","פנייה ישירה לשר הפנים"],c:1,e:"מומלץ להעסיק חברות המתמחות בבדיקת חיובי ארנונה, הפועלות על בסיס הצלחה ומקבלות אחוז מההוזלה/ההחזר. בנוסף נדרשת ערנות שוטפת להשוואת החיוב מול הקיים בפועל בעסק."},
{t:"נדל\"ן",s:"מקראה",q:"מהו CO-OP בהקשר של סוגי בעלות בנדל\"ן?",o:["שיתוף פעולה בין שתי חברות נדל\"ן","מבנה שבו הקרקע בבעלות או בחכירה של גורם אחד והבניין שנבנה עליה בבעלות אחרת — בפועל רכישת זכות לגור בדירה, בתשלום דמי ניהול לבעל הקרקע","בעלות משותפת של דיירים על הבניין","חכירה ל-99 שנה מהמדינה"],c:1,e:"CO-OP מקובל מאוד בחו\"ל: קרקע בבעלות או בחכירה של גורם אחד, ועליה בניין מגורים או מסחר בבעלות אחרת. למעשה רוכשים זכות לגור בדירה, עם דמי ניהול לבעל הקרקע ובסוף התקופה תשלום על הארכה או עזיבה."},
{t:"נדל\"ן",s:"מקראה",q:"מהם הנתונים שכדאי לבדוק ברשויות לפני עסקת נדל\"ן?",o:["רק נסח טאבו","רמה סוציו-אקונומית (משרד הפנים), אחוזי אבטלה ושכר (משרד הכלכלה), רמת חינוך וזכאות לבגרות (משרד החינוך), נתוני רווחה, וכן תב\"ע ותמ\"א ברשות המקומית ובמינהל התכנון","רק מחירי עסקאות דומות באזור","רק את זהות הבעלים הרשומים"],c:1,e:"בדיקה רחבה: אתרי ממשלה (רמה סוציו-אקונומית, אבטלה ושכר, רמת חינוך וממוצע בגרויות, נתוני רווחה); רשות מקומית וועדה לתכנון עיר; ומינהל התכנון — תב\"ע ותמ\"א, המצב הסטטוטורי והתכנוני של האזור."},
{t:"נדל\"ן",s:"מקראה",q:"מה חשוב במיוחד בחוזה למכירת מפעל או מרכז לוגיסטי?",o:["רק המחיר ולוח התשלומים","הצהרת הרוכש שהוא יודע במפורט מה יוצר בנכס ומה החומרים שהיו בשימוש, ומודע לכל ההנחיות הרגולטוריות הנובעות מכך; לעיתים ההסכם והתשלום מותנים באבני דרך של ניקוי זיהום קרקע","רק אישור הרשות המקומית","רק הערכת שמאי עדכנית"],c:1,e:"בחוזה מכירה של מפעל/מו\"פ/מרכז לוגיסטי חיונית הצהרה מפורטת של הרוכש בדבר ידיעתו על מה שיוצר בנכס ועל החומרים שהיו בשימוש. במקומות עם זיהום קרקע ההסכם והתשלום מותנים באבני דרך של ניקוי עד אישור הרגולטורים המקומיים."},
{t:"נדל\"ן",s:"מקראה",q:"מהו הרעיון המרכזי בעבודה עם חברות ברוקרים גלובליות?",o:["חיסכון בעלויות התיווך","שימוש בידע ובניסיון הגלובלי שלהן — היכרותן עם השוק טובה לעין שיעור מזו של הלקוח, ומערכת הקשרים שלהן נותנת להן יתרון","עמידה בדרישות רגולטוריות","העברת האחריות המשפטית לברוקר"],c:1,e:"הרעיון: שימוש בידע ובניסיון הגלובלי, בהיכרות העדיפה עם השוק ובמערכת הקשרים העסקיים. מקובל לתחר את החברות בכל צורך ולבחור את הטובה ביותר, אם כי לכל חברה יש עדיפות במקומות מסוימים."},
{t:"נדל\"ן",s:"מקראה",q:"מה כדאי לעשות עם נכס שאינו בשימוש ואינו ראוי לשימוש?",o:["להשאירו כפי שהוא ולשלם ארנונה מלאה","עדיף להרוס אותו ואז לשלם מעט על שטח פתוח — מבנים כאלה זוכים להקלה במס לתקופה קצובה של 3-6 חודשים בלבד","להשכיר אותו בכל מחיר","למכור אותו מיד ללא בדיקה"],c:1,e:"מבנים לא בשימוש ולא ראויים לשימוש זוכים להקלה במס לתקופה קצובה בלבד (3-6 חודשים, תלוי מדינה). לכן עדיף להרוס ולשלם מעט על שטח פתוח."},
{t:"נדל\"ן",s:"מקראה",q:"מהן דרכים להשבחת נכסים ושיפור התמורה?",o:["רק שיפוץ פנימי של המבנה","שינוי ייעוד, ייזום שינוי תב\"ע והגדלת זכויות בנייה, פרצלציה (חלוקה או איחוד וחלוקה) — כדי למצות את פוטנציאל התכנון הסטטוטורי","רק העלאת דמי השכירות","רק הפחתת הוצאות התחזוקה"],c:1,e:"אפשרויות ההשבחה: שינוי ייעוד; ייזום שינוי תב\"ע והגדלת זכויות בנייה (דיור, מסחר, תעסוקה, חניות); פרצלציה — חלוקה ו/או איחוד וחלוקה. מכירה לאחר ייזום השבחה משקפת במחיר את הפוטנציאל העתידי."},
{t:"נדל\"ן",s:"מקראה",q:"מה מקובל בחוזה שכירות עסקי לגבי \"החזרת מצב לקדמותו\"?",o:["השוכר חייב תמיד להחזיר את הנכס למצבו המקורי המדויק","אין החזרת מצב לקדמותו; יש מנגנון ברור לבלאי כתוצאה משימוש ופונקציית זמן שמכתיבה את איכות הנכס בהחזרה","המשכיר אחראי לכל השיפוצים","הנושא אינו מוסדר בחוזה"],c:1,e:"בחוזה שכירות עסקי מקובל: \"אין החזרת מצב לקדמותו, יש מנגנון ברור לבלאי כתוצאה משימוש ופונקציית זמן שמכתיבה איכות הנכס בהחזרה\". לצד זאת: אפשרות יציאה מוקדמת, אופציה לשטחים נוספים, ואפשרות שוכר משנה."}
]);
