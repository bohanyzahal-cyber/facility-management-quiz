/* ===================== 6. רכש ===================== */
{t:"רכש",s:"מקראה",q:"איזה חלק מהמחזור מהווה הרכש בחברות, לפי המקראה?",o:["10%-20% מהמחזור, בעיקר בחברות שירותים שבהן עיקר ההוצאה היא שכר עבודה","50%-60% מהמחזור","כ-90% מהמחזור, מאחר שכמעט כל פעילות החברה מבוססת על רכישה מספקים","פחות מ-5% מהמחזור, מכיוון שרוב הפעילות מתבצעת במשאבים פנימיים של החברה"],c:1,e:"תחום הרכש נוגע בכל תחומי הפעילות — אמצעים, שירותים וכוח אדם — ומהווה כ-50%-60% מהמחזור. הוא חלק חשוב משרשרת ההספקה הארגונית."},
{t:"רכש",s:"מקראה",q:"מהי החלוקה העיקרית בין סוגי הרכש?",o:["רכש מקומי המבוצע ברמת המדינה מול רכש גלובלי המנוהל על ידי מטה הרכש הבינלאומי, לפי מיקום הספק ולפי המטבע שבו מתבצעת ההתחשבנות עמו","רכש ישיר (DIRECT) — בעיקר חומרי גלם, אריזה, מיכון וליבת העסק; ורכש לא ישיר (INDIRECT) — כלל השירותים והתמיכה","רכש טובין (פריטים ונכסים מוחשיים) מול רכש שירותים (ניקיון, אבטחה, הובלה והסעות), לפי טיב הפריט הנרכש ולפי מידת המוחשיות שלו מבחינה חשבונאית","רכש שוטף המבוצע לפי הסכמי מסגרת מול רכש חד-פעמי המבוצע בהזמנה נפרדת לכל צורך, לפי אופן ההתקשרות ולפי משך התקופה שנקבעה בהסכם עם הספק"],c:1,e:"רכש ישיר: חומרי גלם, חומרים, אריזה, מיכון, THIRD PARTY, מוצרים למכירה — ליבת העשייה. רכש לא ישיר: שירותים (רכב, ניקיון, אבטחה, מערכות מידע, הובלה, הסעות) וטובין (ציוד, ריהוט, נדל\"ן, FM, ביטוח, בטיחות)."},
{t:"רכש",s:"מקראה",q:"על אילו גופים חל חוק חובת המכרזים, תשנ\"ב-1992?",o:["על כל חברה בישראל שמחזור פעילותה השנתי עולה על סף שנקבע בחוק ומתעדכן מדי שנה, ובלבד שהיא מקבלת מימון ציבורי כלשהו או ערבות מדינה לפעילותה","על ארגונים ציבוריים — תאגיד ממשלתי, מערכת הביטחון, קופת חולים, מועצה דתית, ומוסד להשכלה גבוהה שהממשלה משתתפת בתקציבו","רק על משרדי ממשלה ויחידות הסמך שלהם, ולא על תאגידים ממשלתיים או על רשויות, ואשר לגביהם חלה חובת פרסום ברשומות ובאתר האינטרנט הממשלתי","רק על רשויות מקומיות ועל מועצות אזוריות, שבהן ועדת המכרזים מורכבת לפי החוק, ואשר לגביהן נקבע הרכב מיוחד של נציגי קואליציה ואופוזיציה"],c:1,e:"חוק חובת המכרזים, תשנ\"ב-1992 מחייב ארגונים ציבוריים: תאגיד ממשלתי, מערכת הביטחון, קופת חולים, מועצה דתית, ומוסד להשכלה גבוהה שהממשלה משתתפת בתקציבו."},
{t:"רכש",s:"מקראה",q:"חברה פרטית אינה כפופה לחוק חובת המכרזים. מה בכל זאת מומלץ לה?",o:["לוותר על תהליכי רכש פורמליים כדי לחסוך זמן ולהגיב מהר יותר לצרכים המשתנים","לקיים הליך דומה כדי לשמור על יושר, הגינות, שקיפות ומקצועיות","לפנות תמיד רק לספק אחד מוכר וותיק, שעמו נצבר ניסיון עבודה טוב לאורך השנים","להעביר את כל פעילות הרכש למיקור חוץ לחברת ניהול רכש חיצונית מקצועית"],c:1,e:"המקראה: \"קיום תהליך סדור גם בחברות שאינן מחויבות בחוק חובת המכרזים לקיים הליך דומה כדי לשמור על יושר, הגינות, שקיפות ומקצועיות\"."},
{t:"רכש",s:"מקראה",q:"מהו החלק החשוב ביותר בתהליך RFP/RFQ/RFI?",o:["בחירת רשימת הספקים שאליהם פונים, ובדיקת עמידתם בתנאי הסף שנקבעו מראש, וכן קביעת אופן ההתקשרות עמם ולוח הזמנים להגשת ההצעות","כתיבת מפרט הדרישות באופן מפורט, מקצועי ופשוט ככל האפשר — המבוסס על מדיניות החברה ומבטא את כל צרכיה וערכיה","קביעת תנאי התשלום, מנגנוני ההצמדה וסוג המטבע המחושב לאורך תקופת ההסכם, לרבות אופן הגשת החשבון לתשלום והמועד שבו הוא נחשב כהתקבל","קביעת מועד פתיחת ההצעות והרכב ועדת המכרזים שתדון בהן ותקבל את ההחלטה, וכן קביעת אופן פרסום התוצאות והודעה למציעים שלא זכו"],c:1,e:"\"החלק החשוב בתהליך RFQ/RFP/RFI (תיחור) הוא כתיבת מפרט הדרישות באופן מפורט ומקצועי ופשוט ככל האפשר. המפרט חייב להתבסס על מדיניות החברה ולבטא בו את כל צרכיה וערכיה\"."},
{t:"רכש",s:"מקראה",q:"מי חייב להיות חבר בוועדת רכש/מכרזים בכל תהליך?",o:["מנהל הרכש בלבד, שהוא בעל הסמכות המקצועית והאחריות לניהול תהליך התיחור, ואשר מוסמך לאשר את ההתקשרות עד לתקרה הכספית שנקבעה לו","נציג כספים, נציג משפטית ונציג רכש — ולפי העניין גם מנהל העסק וגורמים רלוונטיים נוספים","מנהל העסק שהנושא בתחום אחריותו בלבד, מכיוון שהוא זה שמגדיר את הצורך, ובסיוע יועץ חיצוני המלווה את התהליך מטעם החברה המזמינה","נציג משאבי אנוש ונציג בטיחות, כדי לוודא עמידה בדרישות העסקה ובטיחות בעבודה, וכן נציג אבטחת איכות בכל הנוגע לרכש טובין ושירותים לייצור"],c:1,e:"החברים המחויבים תמיד: נציג כספים, נציג משפטית ונציג רכש; ולפי העניין מנהל העסק וגורמים נוספים. בגופים ציבוריים — הרכב ועדת המכרזים נקבע בחוק/בתקשי\"ר."},
{t:"רכש",s:"מקראה",q:"מה מאשרת ועדת הרכש/מכרזים לפני היציאה לבקשת הצעות?",o:["את רשימת הספקים שאליהם ייצא התיחור בלבד, לאחר בדיקת עמידתם בתנאי הסף, ואת אופן פרסום ההודעה על הליך התיחור באתר החברה","את המסמכים לפני היציאה לבקשת הצעות/מכרז, וכן את טבלת שקלול ההצעות עם התכולה והמשקלים","את התקציב המאושר לפעילות ואת מקור המימון שממנו תשולם ההתקשרות החדשה, וכן את זהות הגורם המאשר את ההוצאה לפי מדרגי הסמכות בחברה","את לוח הזמנים לתהליך ואת מועדי הסיור, שאלות ההבהרה והגשת ההצעות הסופיות, וכן את זהות הגורם שירכז את שאלות ההבהרה מטעם החברה המזמינה"],c:1,e:"ועדת הרכש/מכרזים מאשרת את המסמכים לפני היציאה לבקשת הצעות או מכרז, וכן את טבלת שקלול ההצעות עם תכולה ומשקלים מקובלים — הכל לפני היציאה לתהליך."},
{t:"רכש",s:"מקראה",q:"מתי נמסרת ההודעה לספקים על תוצאות ההליך?",o:["מיד לאחר פתיחת ההצעות בוועדת הרכש ובדיקת עמידתם של המציעים בתנאי הסף","רק לאחר חתימה סופית על ההסכם","לאחר החלטת ועדת הרכש על הזוכה, עוד לפני תחילת המשא ומתן על התנאים המסחריים","בו-זמנית עם שליחת בקשת ההצעות, כדי לשמור על שקיפות מלאה מול כלל המציעים"],c:1,e:"\"הודעה לספקים נמסרת רק לאחר חתימה סופית על ההסכם\" — הן לזוכה והן למי שלא זכה (לעיתים בציון \"כשיר שני\"). זאת כדי לא לאבד את כוח המיקוח לפני החתימה."},
{t:"רכש",s:"מקראה",q:"מהו העיקרון המנחה בתהליך הרכש?",o:["לקבל את המחיר הנמוך ביותר האפשרי בכל מקרה, שהוא המדד המרכזי להצלחת הרכש, ולכן יש למקסם את הלחץ על הספק בכל סבב משא ומתן מחדש","לקבל את הטוב ביותר שנדרש, ברמת שירות מתאימה, במחיר הוגן המאפשר לספק להרוויח ברמה הוגנת","לבחור תמיד את הספק המוכר והוותיק ביותר בשוק, שעמו הסיכון להפרת ההסכם נמוך, ולחסוך בכך את העלות ואת הזמן הכרוכים בתהליך תיחור מלא וסדור","לצמצם את מספר הספקים למינימום המוחלט, כדי למקסם את יתרון הגודל של החברה, גם במחיר של פגיעה ברמת השירות ובזמינות של הספק הנבחר"],c:1,e:"\"העיקרון המנחה — לקבל את הטוב ביותר שנדרש, ברמת שירות מתאימה, במחיר הוגן המאפשר לספק להרוויח ברמה הוגנת\". תפיסה זו היא הבסיס גם ל-SRM ולשיתוף פעולה ארוך טווח."},
{t:"רכש",s:"מקראה",q:"מהו SRM?",o:["Service Request Management — מערכת לניהול קריאות שירות ותקלות מול ספקי האחזקה, ואשר מחוברת למערכת ה-ERP לצורך הפקת פקודות עבודה","Supplier Relationship Management — ניהול קשרי ספקים, לרבות תיעוד רמת השירות ושביעות הרצון לאורך תקופת החוזה","Strategic Resource Model — מודל להקצאת משאבים אסטרטגיים בין יחידות עסקיות בארגון, ואשר משמש לתכנון כוח אדם ותקציב בין יחידות הארגון השונות","Standard Risk Matrix — מטריצה סטנדרטית להערכת סיכונים בהתקשרויות עם ספקים חיצוניים, המשמשת לדירוג הסיכונים לפי הסתברות ההתרחשות ועוצמת ההשפעה"],c:1,e:"SRM = Supplier Relationship Management. מערכת לתיעוד רמת השירות ושביעות הרצון מהספק לאורך החוזה, המאפשרת החלטה מושכלת אם להמשיך או לצאת לתיחור חדש."},
{t:"רכש",s:"מקראה",q:"באיזו תדירות מומלץ לבצע תיחור מחדש (RFP/RFI/RFQ)?",o:["מדי שנה, כדי לוודא שהמחירים מעודכנים ותואמים את התנאים המשתנים בשוק","אחת ל-4-5 שנים, או החלטה להאריך הסכם קיים תוך נימוק מדוע","אחת ל-10 שנים, כדי לשמור על יציבות ועל מערכת יחסים ארוכת טווח עם הספק","רק כאשר הספק מפר את ההסכם או כאשר רמת השירות יורדת מתחת לסף שנקבע"],c:1,e:"מומלץ אחת ל-4-5 שנים לבצע תיחור חדש או להחליט על הארכת הסכם קיים תוך נימוק. לעיתים גם פחות, אם מתקיימים תנאים המחייבים פעולה אחרת."},
{t:"רכש",s:"מקראה",q:"מה מאפיין \"הסכם מסגרת\" לעומת הסכם רכש טובין?",o:["הסכם מסגרת מחייב את הלקוח לרכוש כמות מינימלית שנקבעה מראש לאורך תקופת ההסכם, ומאפשר לספק לתכנן מראש את כוח האדם ואת המלאי שיידרשו לו","הסכם מסגרת מגדיר התקשרות מול ספק בערך כספי בלבד ואינו מכיל פריטים וכמויות — למשל קבלני בנייה ושיפוץ","הסכם מסגרת תקף לשנה אחת בלבד ומחייב חידוש שנתי באישור ועדת הרכש של החברה, ואינו כולל מנגנון הצמדה או אפשרות יציאה מוקדמת לצדדים","הסכם מסגרת חל רק על רכש שירותים ולא על רכש טובין, ציוד או נכסים מוחשיים, ואשר תוקפו מוגבל לשנה אחת ומחייב חידוש שנתי בוועדת הרכש"],c:1,e:"הסכם מסגרת מגדיר התקשרות בערך כספי בלבד, ללא פריטים וכמויות (דוגמה: קבלני בנייה ושיפוץ). הסכם רכש טובין הוא מסמך התקשרות לרכישת פריטים ונכסים מוחשיים (למעט מקרקעין). הסכם רכש שירות מכיל פריטים, כמויות ורמת שירות אך אינו מכיל התחייבות."},
{t:"רכש",s:"מקראה",q:"מהי המגמה כיום לגבי מספר הספקים בחברה?",o:["הגדלת מספר הספקים בכל תחום, כדי להגביר את התחרות ולשפר את התנאים המסחריים, ולפזר את הסיכון כך שאי-עמידה של ספק אחד לא תפגע בפעילות","צמצום ספקים כדי למנף את גודל החברה, לקבל תנאים טובים יותר ולצמצם את מורכבות ניהול הספקים ברכש ובכספים","שמירה על מספר קבוע של ספקים בכל קטגוריה, לפי מדיניות שנקבעה בנוהל הרכש, ואשר מתעדכנת אחת לשנה בהתאם לביצועי הספקים ולצורכי החברה","החלפת כל הספקים אחת לשנה, כדי למנוע תלות ולשמור על רמת מחירים תחרותית, ולפרסם מכרז פומבי חדש בכל שנה גם כאשר השירות משביע רצון"],c:1,e:"הכיוון הוא לצמצם ספקים — למנף את הגודל, לקבל תנאים טובים יותר, ולהקטין את עומס הניהול (גם ספק לא פעיל שנשאר במערכת דורש תחזוקה שנתית מול רשויות המס). בחו\"ל אף לוקחים ספק מרכז נושא — לכך יתרונות וגם חסרונות."},
{t:"רכש",s:"מקראה",q:"מהי \"קבוצת רכישה\"?",o:["מחלקת הרכש של החברה, המאורגנת לפי קטגוריות נושאיות וגאוגרפיות ברמה גלובלית, והיא זו שמנהלת את קשרי העבודה השוטפים מול כלל הספקים בחברה","שיתוף פעולה בין חברות לביצוע רכש משותף, הנותן יתרון לגודל ויכולת פעולה מול מונופול או דואופול","קבוצת ספקים המאוגדת יחד כדי להציע ללקוח סל שירותים משולב במחיר אטרקטיבי, ואשר פועלת מול הלקוח באמצעות מנהל תיק לקוח יחיד ומרכז","ועדת הרכש של הארגון, המאשרת את המסמכים ואת טבלת השקלול לפני יציאה לתיחור, ואשר בה חברים נציגי הכספים, המשפטית והרכש של הארגון"],c:1,e:"קבוצת רכישה = שיתוף פעולה בין חברות לרכש משותף. נותן יתרון לגודל ויכולת פעולה מול מונופול/דואופול. הערה חשובה: אם אנחנו העסק המוכר — זה יכול לפעול גם נגדנו."},
{t:"רכש",s:"מקראה",q:"מהם המרכיבים שחייבים להיכלל בכל הסכם רכש?",o:["המחיר המוסכם ולוח הזמנים לאספקה בלבד — שאר הנושאים מוסדרים בדין הכללי","מנגנון תשלום ברור, מנגנון קנס-פרס, SLA מוגדר, מנגנוני הצמדה, אפשרויות יציאה דו-צדדיות, תהליך יישוב סכסוכים וסוגיות ביטוח","SLA ומנגנון קנס-פרס בלבד, שהם הכלים המרכזיים לניהול השוטף מול הספק","תנאי התשלום ומנגנוני ההצמדה בלבד, שהם המרכיבים המסחריים המהותיים בהסכם, שכן שאר הנושאים מוסדרים ממילא בדין הכללי ובפסיקת בתי המשפט"],c:1,e:"ההסכם חייב לצמצם את מרחב אי-הוודאות: מנגנון תשלום; מנגנון קנס-פרס; SLA; מנגנוני הצמדה רלוונטיים (מדדי הלמ\"ס, שכר מינימום, מטבעות); אפשרויות יציאה דו-צדדיות ומנגנוני פיצוי; תהליך יישוב קונפליקטים (מגשר, בית משפט); וסוגיות ביטוח."},
{t:"רכש",s:"מקראה",q:"מהי הנחת היסוד המרכזית בניהול ספקים (SRM)?",o:["הספק והלקוח הם יריבים, ותפקיד מנהל הרכש הוא למקסם את הרווח על חשבון הספק","הלקוח רוצה את המוצר/שירות ברמה הגבוהה ביותר במחיר הנמוך ביותר, והספק רוצה לתת את הטוב ביותר במחיר הגבוה ביותר — ועל המנהל למצוא את נקודת האיזון","הספק תמיד יודע טוב יותר מה נכון ללקוח, ולכן יש לסמוך על שיקול דעתו המקצועי, ולכן מומלץ להימנע ממעורבות יתר בהחלטותיו המקצועיות ובתמחור","יש להחליף ספקים בתדירות גבוהה כדי לשמור על מחירים תחרותיים ועל רמת שירות"],c:1,e:"הנחת היסוד: אינטרסים מנוגדים מובנים. תפקיד המנהל למצוא את נקודת האיזון ולקיים מערכת יחסים מכובדת ומכבדת. ההבנה שהספק צריך להרוויח באופן הוגן מייצרת שיתוף פעולה ארוך טווח, שקיפות והגינות."},
{t:"רכש",s:"מקראה",q:"מה מומלץ לגבי מפגשים קבועים בין לקוח לספק?",o:["להיפגש רק כשמתגלה בעיה או כשרמת השירות יורדת מתחת ליעד שנקבע ב-SLA","לקבוע מפגש קבוע (רבעוני/חצי שנתי/שנתי לפי הנושא) עם הגדרה ברורה של משתתפים ונושאים, סיכום עם משימות לשני הצדדים — והמפגש הבא נפתח בסקירת הסיכום הקודם","להיפגש רק בסיום תקופת ההסכם, לצורך סיכום והחלטה על הארכה או תיחור חדש, וכן במקרה של אירוע חריג המחייב בירור מיידי מול הנהלת הספק","המפגשים מיותרים כאשר קיים SLA מפורט ומנגנון קנס-פרס אוטומטי ומוסכם"],c:1,e:"יש לקבוע מפגש קבוע לפי מורכבות הנושא וחיוניותו. המפגש מוגדר: מי משתתף ובאיזו רמה, אילו נושאים מוצגים, דיון וסיכום עם משימות לשני הצדדים ואחריות ולוח זמנים. המפגש הבא נפתח בסקירת הסיכום הקודם. המפגש אינו תחליף לקשרי עבודה שוטפים."},

/* ===================== 7. נדל"ן ===================== */
{t:"נדל\"ן",s:"מקראה",q:"מהי המטרה של ניהול נכסים (נדל\"ן עסקי)?",o:["למקסם את רווחי החברה ממכירת נכסים ומהשבחתם, כמרכיב בתוצאות הפיננסיות","לאפשר לעסק לפעול בכל מקום ובכל זמן בהתאם לצרכיו המשתנים, במחיר טוב וברמת שירות טובה, ולשמור על האינטרסים של החברה לאורך זמן","להחזיק כמה שיותר נכסים בבעלות מלאה, כדי להימנע מתלות בבעלי נכסים חיצוניים, ולהקטין את התלות בשוק השכירות ואת החשיפה לעליות מחירים בו","למזער את תשלומי הארנונה ואת דמי הניהול המשולמים לרשויות ולבעלי הנכסים"],c:1,e:"ניהול נכסים צריך לאפשר לעסק לפעול בכל מקום ובכל זמן לפי צרכיו המשתנים, במחיר ורמת שירות טובים, ולשמור על אינטרסים של החברה לאורך זמן מפני שינויים בסביבה. קבועי הזמן ארוכים ולכן נדרש תכנון ארוך טווח."},
{t:"נדל\"ן",s:"מקראה",q:"מהו \"נסח טאבו\" ומדוע הוא חשוב?",o:["אישור מהרשות המקומית על תשלום ארנונה ועל היעדר חובות בגין הנכס הנדון","מסמך לפי גוש, חלקה ותת-חלקה המציג את כל ההיסטוריה של הנכס — בעלויות, שעבודים ועיקולים — אם כי ייתכן שדבר-מה בתהליך ועדיין לא מופיע","תוכנית בניין עיר (תב\"ע) של האזור, המפרטת את הייעוד ואת זכויות הבנייה בו, לרבות הזכויות המאושרות, אחוזי הבנייה, קווי הבניין וייעודי הקרקע","הערכת שמאי מוסמך לשווי הנכס, הנדרשת לצורך דיווח כספי בשיטת ה-IFRS"],c:1,e:"נסח טאבו מציג את היסטוריית הנכס: בעלויות, שעבודים, עיקולים — לפי גוש, חלקה ולעיתים תת-חלקה. אזהרה חשובה: ייתכן שמשהו נמצא בתהליך ועדיין לא ידוע/רשום."},
{t:"נדל\"ן",s:"מקראה",q:"מהן שלוש הגישות להערכת שווי נדל\"ן?",o:["גישת המחיר ההיסטורי, גישת שווי השוק וגישת השווי לצורכי מס — לפי חוק מיסוי מקרקעין, שלוש הגישות המקובלות בפסיקה ובשומות המוגשות לרשויות המס","גישת היוון ההכנסות (לנדל\"ן מניב מסחרי), גישת ההשוואה (בעיקר ללא-מניב), וגישת העלות (רכישת קרקע, פיתוח ובנייה בניכוי פחת ורווח יזמי)","גישת הבעלות, גישת השכירות וגישת החכירה — לפי סוג ההתקשרות הקיימת בנכס","גישת ה-IFRS, גישת ה-US GAAP וגישת התקן הישראלי — שלוש שיטות הדיווח החשבונאי"],c:1,e:"שלוש הגישות: היוון הכנסות — לנדל\"ן מניב מסחרי; השוואה — בעיקר לנדל\"ן לא מניב; עלות — כמה יעלה לרכוש קרקע, לפתח ולבנות, בניכוי פחת ורווח יזמי."},
{t:"נדל\"ן",s:"מקראה",q:"מהו \"סטנדרט בנייה\" (CONSTRUCTION STANDARD) ומה תפקידו?",o:["תקן ישראלי מחייב לבנייה, המפורסם על ידי מכון התקנים ומעודכן מעת לעת","מסמך מפורט הקובע את הסטנדרט הנדרש לכל סוג נכס — גודל לעובד, פונקציות מחייבות, תשתיות, חומרים, תגמירים ושפה עיצובית — היוצר אחידות אדריכלית ומיתוגית בחברה","מסמך הדרישות של כיבוי אש, המשטרה ומשרד הבריאות לצורך קבלת רישיון עסק, ואשר על בסיסו מונפק היתר הבנייה ואישור האכלוס (טופס 4) לנכס","תקן LEED לבנייה ירוקה, המדורג בארבע רמות — מאושר, כסף, זהב ופלטינום"],c:1,e:"הסטנדרט מגדיר גודל נדרש לעובד/יחידה/מחלקה, שטחים ופונקציות ציבוריות, תשתיות ומערכות, חומרים ואיכות תגמירים, ונראות עם אלמנטים וצבעים מאושרים. יוצר אחידות אדריכלית ומיתוגית, ומאפשר שימוש חוזר בתכנון — חיסכון בזמן ובעלויות."},
{t:"נדל\"ן",s:"מקראה",q:"מה ההבדל בין IFRS ל-US GAAP בכל הנוגע להערכת שווי נדל\"ן?",o:["אין הבדל מהותי — שתי השיטות מחייבות הערכת שווי שנתית על ידי שמאי מוסמך","IFRS מחייב הערכת שווי נכסים מדי שנה על ידי שמאי מוסמך, ואילו ב-US GAAP מסתפקים בשווי רשום עם עדכוני מדדים","US GAAP מחייב שמאות שנתית ואילו IFRS מסתפק בשווי הרשום בספרים ללא עדכון","שתי השיטות אוסרות הערכת שווי מחדש, ומחייבות רישום לפי עלות היסטורית בלבד, ולכן שינויי שווי אינם מוצאים ביטוי בדו\"חות הכספיים כלל"],c:1,e:"IFRS מחייב הערכת שווי נכסים מדי שנה על ידי שמאי מוסמך. ב-US GAAP מסתפקים בשווי רשום עם עדכוני מדדים, אך נדרש דו\"ח שנתי 20F שבו יש לדווח על שינוי מהותי בנכסים במהלך השנה המדווחת."},
{t:"נדל\"ן",s:"מקראה",q:"מהי הארנונה בישראל ומה מאפיין אותה?",o:["מס המשולם לרשות המסים לפי שווי הנכס בשוק, המתעדכן בהתאם לעסקאות באזור","מס נכסים המעוגן בחוק ואינו קשור לשירותים המתקבלים מהרשות המקומית; שיעור ההתייקרות השנתית מאושר על ידי שר הפנים והכנסת","תשלום וולונטרי עבור שירותים עירוניים, שגובהו נקבע בהסכם מול הרשות המקומית","מס המשולם רק על נכסים מסחריים ותעשייתיים, ואינו חל על נכסי מגורים ועל קרקעות, ואשר שיעורו נקבע לפי סיווג השימוש ולפי אזור הרשות המקומית"],c:1,e:"בישראל תשלום הארנונה מעוגן בחוק ואינו קשור לשירותים המתקבלים מהרשות המקומית. ההתייקרות השנתית מאושרת על ידי שר הפנים והכנסת; התייקרות חריגה מחייבת בקשה מיוחדת ואישור שר הפנים."},
{t:"נדל\"ן",s:"מקראה",q:"מהי דרך מומלצת להוזלת תשלומי ארנונה?",o:["הגשת ערר לוועדת הערר של הרשות המקומית ולאחר מכן ערעור לבית המשפט המחוזי, בליווי חוות דעת שמאי מטעם בעל הנכס המפרטת את השימושים בפועל","העסקת חברות המתמחות בבדיקת תשלומי ארנונה הפועלות על בסיס הצלחה — ומקבלות אחוז מההוזלה","הפסקת התשלום עד לבירור מלא של החיוב מול מחלקת הגבייה של הרשות המקומית","פנייה ישירה לשר הפנים בבקשה לאשר הפחתה חריגה בתעריף לסוג השימוש הנדון"],c:1,e:"מומלץ להעסיק חברות המתמחות בבדיקת חיובי ארנונה, הפועלות על בסיס הצלחה ומקבלות אחוז מההוזלה/ההחזר. בנוסף נדרשת ערנות שוטפת להשוואת החיוב מול הקיים בפועל בעסק."},
{t:"נדל\"ן",s:"מקראה",q:"מהו CO-OP בהקשר של סוגי בעלות בנדל\"ן?",o:["שיתוף פעולה בין שתי חברות נדל\"ן לצורך ייזום, פיתוח ושיווק של פרויקט משותף","מבנה שבו הקרקע בבעלות או בחכירה של גורם אחד והבניין שנבנה עליה בבעלות אחרת — בפועל רכישת זכות לגור בדירה, בתשלום דמי ניהול לבעל הקרקע","בעלות משותפת של כלל הדיירים על הבניין ועל השטחים המשותפים, בניהול ועד הבית, ואשר בסוף התקופה הבניין כולו עובר לבעלות הדיירים ללא תמורה","חכירה לתקופה ארוכה של 99 שנה מרשות מקרקעי ישראל או מהרשות המקומית"],c:1,e:"CO-OP מקובל מאוד בחו\"ל: קרקע בבעלות או בחכירה של גורם אחד, ועליה בניין מגורים או מסחר בבעלות אחרת. למעשה רוכשים זכות לגור בדירה, עם דמי ניהול לבעל הקרקע ובסוף התקופה תשלום על הארכה או עזיבה."},
{t:"נדל\"ן",s:"מקראה",q:"מהם הנתונים שכדאי לבדוק ברשויות לפני עסקת נדל\"ן?",o:["נסח טאבו בלבד, שבו מרוכזת כל ההיסטוריה המשפטית והרישומית של הנכס הנדון","רמה סוציו-אקונומית (משרד הפנים), אחוזי אבטלה ושכר (משרד הכלכלה), רמת חינוך וזכאות לבגרות (משרד החינוך), נתוני רווחה, וכן תב\"ע ותמ\"א ברשות המקומית ובמינהל התכנון","מחירי עסקאות דומות שבוצעו באזור בשנתיים האחרונות, כפי שהם מוצגים באפליקציות, ואשר מאפשרים להעריך את מגמת המחירים ואת קצב העסקאות באזור","זהות הבעלים הרשומים ופרטי השעבודים והעיקולים הרשומים על הנכס בלשכת הרישום"],c:1,e:"בדיקה רחבה: אתרי ממשלה (רמה סוציו-אקונומית, אבטלה ושכר, רמת חינוך וממוצע בגרויות, נתוני רווחה); רשות מקומית וועדה לתכנון עיר; ומינהל התכנון — תב\"ע ותמ\"א, המצב הסטטוטורי והתכנוני של האזור."},
{t:"נדל\"ן",s:"מקראה",q:"מה חשוב במיוחד בחוזה למכירת מפעל או מרכז לוגיסטי?",o:["המחיר המוסכם ולוח התשלומים, לרבות מנגנון ההצמדה וסוג המטבע המחושב בעסקה, וכן ההתניות בדבר מועד מסירת החזקה בנכס ואופן רישום הזכויות","הצהרת הרוכש שהוא יודע במפורט מה יוצר בנכס ומה החומרים שהיו בשימוש, ומודע לכל ההנחיות הרגולטוריות הנובעות מכך; לעיתים ההסכם והתשלום מותנים באבני דרך של ניקוי זיהום קרקע","קבלת אישור הרשות המקומית להעברת הבעלות ולהיעדר חובות ארנונה והיטלים","הערכת שמאי מוסמך ועדכנית לשווי הנכס, כבסיס למשא ומתן על המחיר הסופי"],c:1,e:"בחוזה מכירה של מפעל/מו\"פ/מרכז לוגיסטי חיונית הצהרה מפורטת של הרוכש בדבר ידיעתו על מה שיוצר בנכס ועל החומרים שהיו בשימוש. במקומות עם זיהום קרקע ההסכם והתשלום מותנים באבני דרך של ניקוי עד אישור הרגולטורים המקומיים."},
{t:"נדל\"ן",s:"מקראה",q:"מהו הרעיון המרכזי בעבודה עם חברות ברוקרים גלובליות?",o:["חיסכון בעלויות התיווך בזכות הסכם גלובלי אחיד המתומחר באחוזים נמוכים מהמקובל, ובזכות ריכוז כל עסקאות החברה בעולם אצל ספק תיווך יחיד ומוסכם","שימוש בידע ובניסיון הגלובלי שלהן — היכרותן עם השוק טובה לעין שיעור מזו של הלקוח, ומערכת הקשרים שלהן נותנת להן יתרון","עמידה בדרישות רגולטוריות המחייבות תיווך מורשה בעסקאות נדל\"ן מסחרי בחו\"ל","העברת האחריות המשפטית והכספית לברוקר, שנושא בסיכון אם העסקה לא תצא לפועל"],c:1,e:"הרעיון: שימוש בידע ובניסיון הגלובלי, בהיכרות העדיפה עם השוק ובמערכת הקשרים העסקיים. מקובל לתחר את החברות בכל צורך ולבחור את הטובה ביותר, אם כי לכל חברה יש עדיפות במקומות מסוימים."},
{t:"נדל\"ן",s:"מקראה",q:"מה כדאי לעשות עם נכס שאינו בשימוש ואינו ראוי לשימוש?",o:["להשאירו כפי שהוא ולשלם עליו ארנונה מלאה, עד שיימצא לו שימוש או קונה מתאים, תוך המשך תשלום דמי ניהול, ביטוח ותחזוקה שוטפת של המבנה הריק","עדיף להרוס אותו ואז לשלם מעט על שטח פתוח — מבנים כאלה זוכים להקלה במס לתקופה קצובה של 3-6 חודשים בלבד","להשכיר אותו בכל מחיר, גם נמוך, כדי לכסות לפחות חלק מההוצאות השוטפות","למכור אותו מיד בכל מחיר, כדי להיפטר מנטל התחזוקה ומהוצאות המס השוטפות"],c:1,e:"מבנים לא בשימוש ולא ראויים לשימוש זוכים להקלה במס לתקופה קצובה בלבד (3-6 חודשים, תלוי מדינה). לכן עדיף להרוס ולשלם מעט על שטח פתוח."},
{t:"נדל\"ן",s:"מקראה",q:"מהן דרכים להשבחת נכסים ושיפור התמורה?",o:["שיפוץ פנימי ושדרוג התגמירים והמערכות במבנה, כדי להעלות את דמי השכירות, ולהאריך את חוזי השכירות הקיימים בתנאים משופרים לטובת המשכיר","שינוי ייעוד, ייזום שינוי תב\"ע והגדלת זכויות בנייה, פרצלציה (חלוקה או איחוד וחלוקה) — כדי למצות את פוטנציאל התכנון הסטטוטורי","העלאת דמי השכירות לשוכרים הקיימים בהתאם למנגנון ההצמדה שנקבע בהסכם","הפחתת הוצאות התחזוקה והניהול של הנכס, כדי לשפר את התשואה נטו ממנו"],c:1,e:"אפשרויות ההשבחה: שינוי ייעוד; ייזום שינוי תב\"ע והגדלת זכויות בנייה (דיור, מסחר, תעסוקה, חניות); פרצלציה — חלוקה ו/או איחוד וחלוקה. מכירה לאחר ייזום השבחה משקפת במחיר את הפוטנציאל העתידי."},
{t:"נדל\"ן",s:"מקראה",q:"מה מקובל בחוזה שכירות עסקי לגבי \"החזרת מצב לקדמותו\"?",o:["השוכר חייב תמיד להחזיר את הנכס למצבו המקורי המדויק, כולל פירוק כל השינויים, ולשאת בעלות פירוק המערכות, התשתיות והתגמירים שהותקנו בו","אין החזרת מצב לקדמותו; יש מנגנון ברור לבלאי כתוצאה משימוש ופונקציית זמן שמכתיבה את איכות הנכס בהחזרה","המשכיר אחראי לכל השיפוצים וההתאמות, והשוכר משלם עליהם בדמי השכירות","הנושא אינו מוסדר בחוזה ונתון להסכמת הצדדים בעת סיום תקופת השכירות בפועל"],c:1,e:"בחוזה שכירות עסקי מקובל: \"אין החזרת מצב לקדמותו, יש מנגנון ברור לבלאי כתוצאה משימוש ופונקציית זמן שמכתיבה איכות הנכס בהחזרה\". לצד זאת: אפשרות יציאה מוקדמת, אופציה לשטחים נוספים, ואפשרות שוכר משנה."}
]);

/* ===================== 8. אחזקה ===================== */
{t:"אחזקה",s:"מקראה",q:"מהו תפקידו של מערך האחזקה?",o:["לתקן תקלות במהירות האפשרית ולהחזיר את המערכות לפעולה בזמן הקצר ביותר","לאפשר פעילות תקינה של מבנים, מערכות, תשתיות ואמצעים, כדי לאפשר לעסק לפעול ברציפות והמשכיות במחיר סביר וברמת שירות טובה","לחסוך בעלויות ככל האפשר ולהקטין את סעיף האחזקה בתקציב השנתי של החברה","לעמוד בדרישות הרגולציה ובהוראות היצרן, ולתעד את הפעילות לצורכי ביקורת, ולהפיק דו\"ח שנתי מרוכז על פעילות האחזקה שבוצעה בכל אתר ואתר"],c:1,e:"תפקיד מערך האחזקה: לאפשר פעילות תקינה של מבנים, מערכות, תשתיות ואמצעים — כדי שהעסק יפעל ברציפות והמשכיות, במחיר סביר וברמת שירות טובה. עיקרון מנחה: \"ככל שיודעים פחות מוציאים יותר\" — ניהול מבוסס נתונים."},
{t:"אחזקה",s:"מקראה",q:"מהם שלושת סוגי/שיטות האחזקה המרכזיים?",o:["אחזקה יומית, שבועית וחודשית — לפי תדירות הביצוע הנדרשת בכל מערכת ומתקן","אחזקה מונעת (יזומה), אחזקה מזדמנת (שבר), ואחזקה חזויה (Predictive)","אחזקה פנימית בעובדי חברה, אחזקה חיצונית במיקור חוץ, ואחזקה משולבת בין השתיים","אחזקה מכנית, אחזקה חשמלית ואחזקה אלקטרונית — לפי תחומי המקצוע של בעלי המלאכה"],c:1,e:"(1) אחזקה מונעת/יזומה — Preventive, לפי הוראות יצרן או גורם הנדסי מוסמך, בקבועי זמן מחייבים. (2) אחזקה מזדמנת/שבר — Occasional/Break, רק כשמופיעה תקלה. (3) אחזקה חזויה — Predictive, מבוססת איסוף מידע, ניתוח וקבלת החלטות."},
{t:"אחזקה",s:"מקראה",q:"מדוע בדרך כלל לא מבצעים אחזקה חזויה כאשר המערכות נמצאות באחריות יצרן?",o:["כי היא יקרה מדי ודורשת השקעה בחיישנים, במערכות ניתוח ובכוח אדם מקצועי","כדי לא לאבד את האחריות — היצרן מתנה את קיומה בביצוע הוראות היצרן לאחזקה יזומה","כי במערכות חדשות חסרים חיישנים ואין מספיק נתונים היסטוריים לניתוח מגמות","כי הרגולציה אוסרת שינוי מתכונת האחזקה בתקופת האחריות ללא אישור מכון התקנים, ולכן היא מותרת רק לאחר תום תקופת האחריות של היצרן על המערכת"],c:1,e:"אחזקה חזויה בדרך כלל לא תבוצע כשהמערכות באחריות יצרן, כדי לא לאבד את האחריות — היצרנים מתנים את קיום האחריות בכך שהלקוח מבצע את הוראות היצרן לאחזקה יזומה."},
{t:"אחזקה",s:"מקראה",q:"מהו MTBF ומה הוא משקף?",o:["Mean Time To Repair — משך הזמן הממוצע הנדרש לביצוע תיקון ולהשבת היחידה לפעילות","Mean Time Between Failures — משך זמן ממוצע בין תקלות, המשקף את זמינות ואמינות היחידה","Maximum Time Before Failure — פרק הזמן המרבי שבו היחידה יכולה לפעול עד לכשל צפוי, המחושב מנתוני היצרן ומהניסיון המצטבר של צוות האחזקה באתר","Maintenance Time Budget Factor — מקדם לחישוב תקציב שעות האחזקה הנדרשות למערכת"],c:1,e:"MTBF = Mean Time Between Failures — משך זמן ממוצע בין תקלות. משקף זמינות ואמינות היחידה. מושפע מגיל היחידה, מאיכות ואופן התחזוקה המונעת ומשימוש בחלקים מקוריים."},
{t:"אחזקה",s:"מקראה",q:"מהו MTTR?",o:["Mean Time To Repair — משך ממוצע לביצוע תיקון והשבה לפעילות","Mean Time To Replace — משך הזמן הממוצע להחלפת מערכת שלמה בסוף חייה השימושיים","Maximum Tolerable Time of Recovery — זמן ההתאוששות המרבי שהעסק מסוגל לספוג","Maintenance Task Time Ratio — היחס בין זמן ביצוע משימת אחזקה לזמן התכנון שלה"],c:0,e:"MTTR = Mean Time To Repair — משך ממוצע לביצוע תיקון והשבה לפעילות, על בסיס נתוני יצרן, ניסיון הצוות ומדידת ביצועים בעבר. יחד עם MTBF אלו מדדי הבסיס לתכנון מערך האחזקה."},
{t:"אחזקה",s:"מקראה",q:"מהו מדרג העוצמות הנכון בין מדיניות, סטנדרט ונוהל?",o:["נוהל >> סטנדרט >> מדיניות (Procedure >> Standard >> Policy) — מהפרטני אל הכללי","מדיניות >> סטנדרט >> נוהל (Policy >> Standard >> Procedure)","סטנדרט >> מדיניות >> נוהל — הסטנדרט הוא המסמך המחייב ביותר בארגון","שלושתם נמצאים באותה רמת מחייבות, ונבדלים זה מזה רק ברמת הפירוט שלהם"],c:1,e:"מדרג העוצמות: מדיניות (Policy) >> סטנדרט (Standard) >> נוהל (Procedure). ה-SOP — Standard Operating Procedure — מגדיר את הנורמות, התהליכים והסטנדרטים לפיהם יש לפעול בתחום מסוים."},
{t:"אחזקה",s:"מקראה",q:"מהם ראשי התיבות BOT, PFI ו-PPP?",o:["Build Operate Transfer; Private Finance Initiative; Public Private Partnership","Business Operations Team; Public Facility Investment; Preventive Planning Process","Budget Oriented Tender; Private Facility Investment; Public Procurement Policy","Building Operation Technology; Predictive Facility Intelligence; Physical Plant Protection"],c:0,e:"BOT = Build Operate Transfer; PFI = Private Finance Initiative; PPP = Public Private Partnership. הסכמים ארוכי טווח בין המגזר הפרטי לשירות הציבורי — קריות ממשלה, קריית ההדרכה, קריית המודיעין ועוד. החזר השקעה כ-25 שנה כולל תפעול ואחזקה."},
{t:"אחזקה",s:"מקראה",q:"מהי \"קרן חידוש\" בהקשר של תמחור אחזקה במודל BOT?",o:["קרן פנסיה והשתלמות של עובדי האחזקה המועסקים על ידי חברת ההפעלה בפרויקט","מנגנון תמחור המביא בחשבון החלפת מערכות לאורך תקופה ארוכה — כולל התייחסות לשנים הראשונות תחת אחריות ולירידת ערך המערכות עד להחלפה","קרן ייעודית להשקעה בטכנולוגיות חדשות ובשדרוג מערכות במהלך תקופת ההפעלה","קרן חירום המיועדת לכיסוי תיקוני שבר בלתי צפויים ולהחלפת ציוד שניזוק באירוע, ואשר גובהה נקבע כאחוז קבוע מהיקף ההשקעה ההונית בפרויקט"],c:1,e:"במודל BOT (תמחור ל-25 שנה) משלבים קרן חידוש וקרן פחת. הנחות היסוד לתמחור: כוח אדם, חלפים, חומרים ומכללים עד להחלפה — עם התייחסות לשנים ראשונות תחת אחריות ומערכת חדשה ההולכת ופוחתת עד החלפה."},
{t:"אחזקה",s:"מקראה",q:"מהו ההבדל בין QA ל-QC?",o:["QA היא בדיקה מדגמית של חלק מהמוצרים ו-QC היא בדיקה מלאה של כל פריט ופריט, ולכן היקף הדגימה בשתיהן נקבע לפי רמת הסיכון של המוצר הנבדק","QA (אבטחת איכות) היא ניהול האיכות — מגוון בדיקות לאורך תהליך הפיתוח, הייצור והאריזה למניעת פגמים; QC (בקרת איכות) היא פיקוח על ניהול האיכות ובדיקה מדגמית בסוף התהליך","QA מבוצעת על ידי הלקוח המזמין ו-QC מבוצעת על ידי הספק המייצר את המוצר","אין ביניהם הבדל מהותי — מדובר בשני מונחים המתארים את אותה פעילות בקרה"],c:1,e:"QA = Quality Assurance — אבטחת איכות, מניעת פגמים לאורך התהליך; למעשה ניהול האיכות. QC = Quality Control — בקרת איכות, פיקוח ובדיקה מדגמית בסוף התהליך ובקרה על תהליך אבטחת האיכות."},
{t:"אחזקה",s:"מקראה",q:"מהו העיקרון \"עשית לא תיעדת — לא עשית\"?",o:["כלל אצבע לניהול זמן, שלפיו יש לתעד כל משימה שבוצעה כדי לעקוב אחר ניצול השעות","עיקרון התיעוד באחזקה — כל הפעילות חייבת להיות מתועדת: תכנון, מדיניות, תוכנית אחזקה, אבטחת איכות, בטיחות, איכות סביבה, הדרכות והכשרות","כלל בטיחות בעבודה בגובה, המחייב תיעוד של קשירה, ציוד מגן והדרכה לפני כל משימה, ואשר מתועד בטופס ייעודי הנשמר בתיק הבטיחות של האתר במשך שנים","דרישה של חברות הביטוח בלבד, לצורך הוכחת תחזוקה תקינה במקרה של תביעת נזק"],c:1,e:"עיקרון התיעוד: \"עשית לא תיעדת, לא עשית\". נדרשת היערכות לתיעוד כלל הפעילות — מתכנון ומדיניות ועד תוכנית אחזקה מפורטת, אבטחת איכות, בטיחות, איכות סביבה, קיימות והכשרות — לפי דרישות הרגולטורים ומדיניות החברה."},
{t:"אחזקה",s:"מקראה",q:"מהו תקן LEED וכיצד הוא מדורג?",o:["תקן ישראלי לבנייה ירוקה — ת\"י 5281, שנכנס לתוקף וולונטרי ומדורג בארבע רמות, ואשר מיושם בישראל במקביל לתקן האמריקאי בפרויקטים גדולים","Leadership in Energy and Environmental Design — תקן אמריקאי המדורג: מאושר 49+, כסף 59+, זהב 79+, פלטינום 80+","תקן בינלאומי לבטיחות אש במבנים גבוהים, המחייב מערכות כיבוי, גילוי ופינוי","תקן לניהול איכות מסוג ISO, המחייב תיעוד תהליכים וביקורות תקופתיות בארגון"],c:1,e:"LEED = Leadership in Energy and Environmental Design. דירוג: מאושר 49+, כסף 59+, זהב 79+, פלטינום 80+. לכל קטגוריה משקל, כשחיסכון באנרגיה מקבל את המשקל הגבוה ביותר (35). התקן הישראלי המקביל: ת\"י 5281 לבנייה ירוקה."},
{t:"אחזקה",s:"מקראה",q:"מהי החלוקה המקובלת לגובה מבנים לפי הרשות להתחדשות עירונית?",o:["עד 10 קומות בניין נמוך, מעל 10 קומות בניין גבוה, ומעל 30 קומות מגדל מגורים","עד 4 קומות בניין נמוך, 5-9 בניין גבוה, 9-20 רב-קומות, מעל 20 מגדל, 60 ומעלה גורד שחקים","עד 8 קומות בניין רגיל, 8-30 קומות מגדל, ומעל 30 קומות גורד שחקים לפי תקן בינלאומי, לפי הסיווג המקובל בתקני הבנייה הבינלאומיים ובתקן הישראלי","אין בישראל חלוקה רשמית לגובה מבנים, והנושא נתון לשיקול דעת הוועדה המקומית"],c:1,e:"החלוקה: עד 4 קומות — בניין נמוך; 5-9 — בניין גבוה; 9-20 — בניין רב-קומות; מעל 20 — מגדל; 60 ומעלה — גורד שחקים. חשוב לציין: אין רגולציה בישראל לחברות ניהול נכסים (בכנסת בתהליכי חקיקה חיוב חברות ניהול בבניינים גבוהים)."},
{t:"אחזקה",s:"מקראה",q:"מהו ILS ומדוע הוא חשוב בבחינת מחזור חיים?",o:["Integrated Logistics Support — שילוב כלל הגורמים האפשריים משלב הייזום, ובעיקר המשתמש והעסק המפעיל","International Labour Standard — תקן עבודה בינלאומי המחייב תנאי העסקה מינימליים","Internal Loss Statement — דו\"ח פנימי המרכז את ההפסדים והנזקים שנגרמו בתקופה","Infrastructure Life Span — תוחלת החיים הצפויה של התשתית לפי נתוני היצרן והניסיון, ואשר משמשת בסיס לתכנון קרן הפחת וקרן החידוש של המערכת"],c:0,e:"ILS = Integrated Logistics Support. בעלי תפקידים שונים נושאים באחריות לכל שלב בחיי המערכת ויש להם אינטרסים נוגדים: היוזם מציג טכנולוגיה גבוהה במחיר נמוך; מנהל הפרויקט רוצה לו\"ז קצר ומחיר נמוך; והמשתמש נושא בתוצאות בתפעול ובתחזוקה."},
{t:"אחזקה",s:"מקראה",q:"מהי \"בעיית קבלני חצר\" באחזקה?",o:["קבלנים שאינם מורשים לעבוד באתר ואינם עומדים בדרישות הבטיחות וההכשרה הנדרשות","קבלנים המייצרים עבודה יזומה ולא הכרחית","קבלנים שאינם עומדים בלוחות הזמנים שנקבעו וגורמים לעיכובים בהשבת מערכות","קבלנים המעסיקים עובדים ללא היתר עבודה כחוק ומסכנים את מזמין העבודה משפטית"],c:1,e:"במקראה נכתב במפורש: \"קבלני חצר — מייצרים עבודה יזומה ולא הכרחית\". זהו סיכון מובנה כשהקבלן הוא גם המאבחן וגם המבצע. השילוב המומלץ: מחלקת הנדסה מקומית עם מומחים לפי תחומי עיסוק ושורת הסכמים 24/7 עם רמת שירות מוסכמת."},
{t:"אחזקה",s:"מקראה",q:"מהי חובת ההיערכות של עסק להמשכיות עסקית בחירום?",o:["רק במפעלים המוגדרים כחיוניים על ידי משרד הכלכלה, המחויבים בריתוק משקי של עובדים, וכן במפעלים שהוגדרו כמפעלים למתן שירותים קיומיים בחירום","חובת כל עסק לתכנן ולהיערך להמשכיות רצופה בכלל מצבי החירום; בחברה ציבורית אף חובה לדווח מדי שנה לרשות לניירות ערך סקר סיכונים ופתרונות","רק בחברות ממשלתיות ובתאגידים ציבוריים, החייבים בכך מכוח הוראות רגולטוריות","רק כאשר קיים איום מוחשי וידוע מראש, שלגביו התקבלה התרעה מגורמי הביטחון"],c:1,e:"חובת כל עסק לתכנן ולהיערך להמשכיות עסקית רצופה. מחייב חשיבה לאור ניתוח סיכונים; בחברה ציבורית חובה לדווח לרשות לניירות ערך ולבורסה מדי שנה סקר סיכונים ופתרון אפשרי לסיכונים ברמה הגבוהה ביותר. הקורונה המחישה שאף אחד לא צפה השבתה מוחלטת."},
{t:"אחזקה",s:"מקראה",q:"מי מנפיק רישיון עסק בישראל?",o:["משרד הפנים, באמצעות שר הפנים המוסמך לחתום על צווי רישוי עסקים ולעדכנם","אך ורק הרשות המקומית — לאחר אישורי הגורמים השונים (כיבוי אש, משטרה, משרד הבריאות ועוד)","מכון התקנים הישראלי, לאחר ביקורת ובדיקת עמידה בתקנים המחייבים לסוג העסק","משרד הכלכלה, באמצעות מנהל הרישוי ובתיאום עם המשרדים הממשלתיים הרלוונטיים, לאחר קבלת אישורי כיבוי אש, המשטרה ומשרד הבריאות הרלוונטיים"],c:1,e:"את הרישיון מנפיקה אך ורק הרשות המקומית, לאחר שלבים מקדימים של ביקורות: מחלקת רישוי עסקים, אגף הנדסה ורישוי בנייה, כיבוי אש, משטרה, משרד הבריאות ואחרים לפי העניין. (חוק רישוי עסקים — תיקון מספר 34.)"},
{t:"אחזקה",s:"מקראה",q:"מהו BMS?",o:["Business Management System — מערכת לניהול תהליכים עסקיים ותכנון משאבי הארגון","Building Management System — מערכת בקרת מבנה","Budget Monitoring Standard — תקן לבקרה תקציבית שוטפת על סעיפי ההוצאה בתשתיות","Basic Maintenance Schedule — לוח זמנים בסיסי לביצוע אחזקה מונעת לפי הוראות היצרן"],c:1,e:"BMS = בקרת מבנה. יחד עם IOT (ניטור באמצעות חיישנים — אקוסטי, מהירות, חום, לחות, לחצים, חזותי) ו-AI (עיבוד נתונים, השוואה, התראה והתערבות יזומה) מאפשרים אחזקה חזויה — התייעלות קווי ייצור של כ-40% והתראה לפני השבתה."},

/* ===================== 9. יעדים ומדדים ===================== */
{t:"יעדים ומדדים",s:"מקראה",q:"מהו העיקרון היסודי בניהול עסקי לפי המקראה?",o:["\"מה שנמדד — משתפר\", ולכן יש להתמקד במדידה של הנושאים המרכזיים בלבד","\"כל דבר נמדד; מה שאינו יכול להימדד לא קיים\"","\"מדדים הם כלי משני לניהול\", והשיקול הניהולי והניסיון גוברים עליהם תמיד","\"עדיף מדד אחד טוב מעשרה בינוניים\", ולכן יש לבחור מדד מוביל אחד לכל תחום"],c:1,e:"\"ניהול עסקי כולל בתוכו יעדים עסקיים ברורים להשגה וכן כל דבר נמדד, מה שאינו יכול להימדד לא קיים\". בנוסף: \"יעד צריך להיות אתגרי אבל בר השגה\"."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו ההבדל בין COST REDUCTION ל-COST AVOIDANCE?",o:["אין ביניהם הבדל — שני מונחים המתארים את אותה פעולה של הקטנת ההוצאה בפועל","COST REDUCTION הוא הורדת הוצאות באופן ברור ומוחלט על בסיס זהה; COST AVOIDANCE הוא מניעת הוצאה — יעד וערך בפני עצמו אך אינו מוחלט","COST AVOIDANCE הוא חיסכון גדול יותר, מכיוון שהוא מונע את ההוצאה כולה מראש","COST REDUCTION חל רק על השקעות הוניות ואילו COST AVOIDANCE חל על הוצאות שוטפות, ולכן שניהם נמדדים בנפרד בדו\"ח הרבעוני המוגש להנהלת החברה"],c:1,e:"COST REDUCTION — הורדת הוצאות מוחלטת, נבחנת מול שנה קודמת או רבעון מקביל. COST AVOIDANCE — מניעת הוצאה. דוגמה: שכירות שהייתה אמורה להתייקר ב-5% ולאחר מו\"מ עלתה ב-2% בלבד — זה אינו חיסכון (יקר משנה קודמת) אלא מניעת הוצאה גדולה יותר."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו LRP ומהו AOP?",o:["LRP היא תוכנית העבודה השנתית המפורטת ו-AOP היא התוכנית האסטרטגית ארוכת הטווח, ושתיהן נגזרות מהתקציב הרב-שנתי שאושר בדירקטוריון החברה","LRP (Long Range Plan) — תכנון אסטרטגי ל-3-5, 10 שנים ומעלה, מתעדכן כל שנה; AOP (Annual Operation Planning) — תוכנית עבודה שנתית מפורטת הנגזרת ממנה, מחולקת לרבעונים","LRP ו-AOP הם שני שמות לאותו תהליך תכנון, שהשתנה עם השנים בחברות גלובליות","LRP הוא דו\"ח כספי המוגש לשוק ההון ו-AOP הוא התקציב הפנימי המאושר בדירקטוריון"],c:1,e:"LRP = תכנון ארוך טווח (3-5, 10 שנים ואף יותר), מבטא כיוון אסטרטגי, מתעדכן שנתית ומשפיע מאוד על שוק ההון. AOP = תכנון שנתי מפורט להשגת יעדים עסקיים, מחולק לרבעונים: הכנסות, הוצאות, השקעות, תזרים, רווח תפעולי ונקי, EBITDA, EPS."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו LBE ומתי משתמשים בו?",o:["Long Business Estimate — הערכה עסקית ארוכת טווח המשמשת בסיס לתכנון האסטרטגי","Last Best Estimation — עדכון התכנון השנתי לאחר הרבעון הראשון, לאור שינויים בלתי צפויים; המדידה נעשית כל רבעון גם ביחס ל-AOP וגם ביחס ל-LBE","Local Business Expense — סיווג ההוצאה העסקית ברמת המדינה לצורכי דיווח ומיסוי","Limited Budget Execution — מנגנון להקפאת תקציב בעת חריגה מהותית מהתכנון המאושר, המופעל באישור מנהל הכספים לאחר בחינת ההשלכות על שאר הסעיפים"],c:1,e:"LBE = Last Best Estimation. מתבצע לאחר רבעון ראשון, בצמוד ל-AOP, לאור שינויים בלתי צפויים (למשל קורונה, מלחמה, אסונות טבע). התכנון המקורי נשאר תמיד כפי שתוכנן ולצדו ה-LBE; המדידה נעשית מול שניהם."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו KPI ומה תפקידו?",o:["Key Process Integration — שילוב תהליכים מרכזי בין מערכות המידע השונות בארגון, ואשר נועד למנוע כפילויות בהזנת נתונים ולשפר את איכות הדיווח","Key Performance Indicator — מדד ביצוע עיקרי המשקף ביצועים בתחום פעילות, מאפשר מיקוד והכוונה ניהוליים, השוואות ואיתור חריגים","Knowledge Performance Index — מדד לבחינת רמת הידע והמיומנות של עובדי הארגון","Key Planning Instrument — כלי מרכזי לתכנון תקציב שנתי ולהקצאת משאבים ליחידות"],c:1,e:"KPI = Key Performance Indicator, מדד ביצוע עיקרי. דוגמאות: עלות לייצור אלף טבליות, מחיר שכירות למ\"ר, עלות הסעדה לעובד, צפיפות למ\"ר, עלות ניקיון למ\"ר, עלות ביטחון למ\"ר."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו SLA ומה הוא כולל?",o:["Service Level Agreement — הסכם רמת שירות הקובע מהם המדדים, מהו היעד לכל מדד ומהי שיטת המדידה (מקור הנתונים, שיטת האיסוף ואופן החישוב)","Standard Level Assessment — הערכה תקופתית של רמת הסטנדרט המיושם בכל אחד מהאתרים, ואשר תוצאותיה מדווחות להנהלה הבכירה ולוועדת הביקורת בחברה","Supplier List Approval — תהליך אישור רשימת הספקים המורשים לעבוד מול החברה","Strategic Long-term Agreement — הסכם אסטרטגי ארוך טווח עם ספק מועדף בתחום"],c:0,e:"SLA = Service Level Agreement. מגדיר מהם המדדים, מהו היעד לכל מדד ומהי שיטת המדידה. דוגמאות: מענה תוך 2 דקות ב-95% מהמקרים במוקד; תיקון תקלה משביתה תוך שעתיים ב-95% מהמקרים; שביעות רצון ממוצעת של 90%."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו BENCHMARK בהקשר של מדידה בניהול תשתיות?",o:["הגדרת נקודת הפתיחה והמצב הקיים לפני תחילת תהליך שיפור, לצורך השוואה עתידית, ואשר משמשת להשוואה מול היעד השנתי שנקבע בתוכנית העבודה","השוואה בין עסקים בעלי זהות תפעולית — בין אתרים באותה חברה, בין מדינות (עם נרמול הערך הכספי) ומול עסקים אחרים","קביעת יעד שנתי לשיפור בכל אחד מהמדדים המרכזיים, שיהיה אתגרי אך בר-השגה","תקן בינלאומי לניהול תשתיות, המגדיר את המדדים המחייבים ואת שיטות המדידה"],c:1,e:"BENCHMARK = השוואת ביצועים בין עסקים בעלי עיסוק דומה. ניתן להשוות בין אתרים בעלי זהות תפקודית בחברה, בין מדינות עם נרמול הערך הכספי, ומול עסקים אחרים. (\"נקודת הפתיחה לפני שיפור\" היא BASELINE.)"},
{t:"יעדים ומדדים",s:"מקראה",q:"לפי איזה עיקרון בוחרים נושא לטיפול ולשיפור?",o:["לפי בקשות ותלונות שהתקבלו מהעובדים ומהמשתמשים בשירותים השונים באתר","לפי ניתוח היקף כספי (PARETO), חשיבות הנושא מבחינת העסק, או בחינה מחזורית של נושאים כל תקופת זמן","לפי סדר הנושאים כפי שהם מופיעים בתוכנית העבודה השנתית שאושרה בהנהלה, ובהתאם לסדר העדיפויות שקבעה ההנהלה בישיבת התכנון השנתית","לפי מידת הקלות של היישום ומהירות ההשגה של תוצאות מדידות בטווח הקצר"],c:1,e:"בחירת נושא לטיפול נעשית לפי ניתוח היקף כספי (עיקרון פארטו), חשיבות הנושא לעסק, או בחינה מחזורית של נושאים כל תקופת זמן."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו הסדר הנכון של שלבי בחינת נושא לשיפור?",o:["קביעת יעד מספרי ← מדידת המצב הקיים ← ביצוע השינוי ← בדיקת עמידה ביעד","הגדרת הנושא ← למידה שיטתית של הקיים בחברה ← למידה מחברות אחרות (BENCHMARK) ← הבנת צרכי העסק ← קביעת תוכנית מוסכמת עם סמכות ואחריות","ביצוע שינוי מהיר ← בדיקת התוצאות בשטח ← תיעוד הלקחים ← הטמעה בנהלים","פנייה ליועץ חיצוני מומחה ← קבלת המלצותיו ← יישום מלא של ההמלצות בארגון, ולאחר מכן ביצוע בקרה על יישומן ומדידת התוצאות בפועל בשטח"],c:1,e:"השלבים: הגדרת הנושא; למידה שיטתית — מה קיים, איך מתנהל, תהליכים מרכזיים, סמכות ואחריות, רמת שירות, KPI/SLA, מידע פיננסי משנים קודמות; למידה מחברות אחרות (BENCHMARK); הבנת צרכי העסק; וקביעת תוכנית מוסכמת עם סמכות ואחריות ותוכנית הטמעה."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו EPS ומדוע הוא רלוונטי למנהל תשתיות?",o:["Expense Per Site — ההוצאה הממוצעת לאתר, המשמשת להשוואה בין אתרים בעלי זהות תפעולית, ואשר מאפשרת לזהות אתרים חריגים הדורשים בחינה ניהולית מעמיקה","Earnings Per Share — רווח למניה; היעד בחברה עסקית ציבורית הוא להגדילו, ולכן קיים צורך מתמיד להוריד הוצאות","Employee Performance Score — ציון ביצועי העובד בהערכה השנתית שעורך לו הממונה","Energy Performance Standard — תקן לביצועי אנרגיה במבנים, המשמש בדירוג בנייה ירוקה"],c:1,e:"EPS = Earnings Per Share, רווח למניה. תפקיד המנהל בחברה ציבורית \"להעשיר ולהשיא רווחים לבעלי המניות\", ולכן יש צורך מתמיד להוריד הוצאות — גם בעסקים מצליחים ורווחיים. גם במלכ\"ר יש צורך דומה, כדי להוסיף או להרחיב שירותים."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו טווח ההחזר המקובל להשקעה (ROI) שיש להציג?",o:["עד שנה אחת, שאם לא כן ההשקעה אינה נחשבת כדאית מבחינה עסקית ואינה מאושרת","מקובל 5-8 שנים לכל היותר","15-20 שנה, בהתאם לאורך החיים הצפוי של המערכת או המתקן שבו מושקע הכסף","אין דרישה להצגת החזר השקעה — די בהצגת התועלת התפעולית הצפויה מהמהלך"],c:1,e:"בכל השקעה נדרש להציג החזר השקעה — תוך כמה זמן ההשקעה תוחזר כספית. המקובל: 5-8 שנים לכל היותר."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהם אמצעי המדידה של שביעות רצון שהוצגו?",o:["סקר שנתי מקיף בלבד, הנערך בקרב כלל העובדים ומנותח על ידי חברת מחקר חיצונית","סקר שנתי קבוע הדוגם אוכלוסייה דומה באותן שאלות; משוב הנשלח אחרי כל טיפול; ומספונים/מסכי שביעות רצון (בדרך כלל 4 פרצופים) במקומות שירות","ניתוח התלונות שהתקבלו במוקד השירות, בפילוח לפי נושא, אתר ומועד הפנייה","ראיונות אישיים מובנים עם מדגם עובדים, הנערכים אחת לרבעון על ידי מנהלי המשנה, ואשר תוצאותיהם מרוכזות בדו\"ח שנתי המוגש להנהלת החברה"],c:1,e:"שלושה אמצעים: סקר שנתי קבוע באותן שאלות לאוכלוסייה דומה; משוב אחרי כל טיפול; ומספונים/מסכים במקומות שירות (שירותים, חדר אוכל, מקלחות) — בדרך כלל 4 פרצופים עם אפשרות פירוט. חשוב לנתח, ולקבוע דרך פעולה לתלונה — אם קריטי, תוך 10 דקות."},
{t:"יעדים ומדדים",s:"מקראה",q:"מהו מדד MICE?",o:["מדד לבקרת מזיקים ולהדברה במבנים ובשטחים הציבוריים של אתרי החברה","מדד בתחום כנסים ואירועים — עלות למשתתף בכנס מקצועי, עלות למשתתף בכנס ניהולי","מדד יעילות אנרגטית המשווה את צריכת האנרגיה למ\"ר בין אתרים בעלי שימוש דומה","מדד שביעות רצון עובדים המשוקלל ממספר סקרים לאורך השנה בתחומי השירות השונים, ומשמש להשוואה בין יחידות עסקיות ובין אתרים באותה מדינה"],c:1,e:"MICE = תחום הכנסים והאירועים. המדדים: עלות למשתתף בכנס מקצועי, עלות למשתתף בכנס ניהולי. ניתן להפיק ממערכות לניהול כנסים ואירועים בחיבור עם מערכות נסיעות חו\"ל."},

/* ===================== 10. ניהול פיננסי ===================== */
{t:"ניהול פיננסי",s:"מקראה",q:"מהם שלושת הדו\"חות הכספיים המרכזיים החשובים למנהל עסקי?",o:["דו\"ח רווח והפסד, דו\"ח מאזן, דו\"ח תזרים מזומנים","דו\"ח רווח והפסד, דו\"ח מלאי ודו\"ח עלויות שכר — שלושת הדו\"חות התפעוליים","דו\"ח מאזן, דו\"ח ביצוע תקציב ודו\"ח ביקורת פנימית של רואה החשבון המבקר","דו\"ח תזרים מזומנים, דו\"ח השקעות הוניות ודו\"ח מיסוי — שלושת דו\"חות המימון"],c:0,e:"שלושת הדו\"חות: רווח והפסד (P&L); מאזן (Balance Sheet) — \"תצלום של הנכסים, ההתחייבויות וההון העצמי לסוף תקופה חשבונאית\"; ותזרים מזומנים (Cash Flow)."},
{t:"ניהול פיננסי",s:"מקראה",q:"מהו ההבדל בין EXPENSE ל-CAPEX?",o:["EXPENSE הן הוצאות גדולות מעל סף מסוים ו-CAPEX הן הוצאות קטנות ושוטפות","EXPENSE הן הוצאות ההפעלה והייצור שאינן השקעות; CAPEX הן סך ההשקעות ברכוש קבוע ובכלל, המוכרות כהשקעה בהיבט החשבונאי","EXPENSE חלות רק על עלויות שכר עבודה ו-CAPEX רק על רכישת ציוד ומכונות","אין ביניהם הבדל חשבונאי מהותי — שתיהן נרשמות בדו\"ח רווח והפסד באותו אופן, ולכן אין הבדל בהשפעתן על המאזן ועל דו\"ח תזרים המזומנים"],c:1,e:"EXPENSE = הוצאות ההפעלה והייצור שאינן השקעות, המוכרות בהיבט החשבונאי. CAPEX (Capital Expenditure) = סך ההשקעות ברכוש קבוע ובכלל, המוכרות כהשקעה. חשוב להבין את ההבדל ואת ההשפעה על הדו\"חות הכספיים."},
{t:"ניהול פיננסי",s:"מקראה",q:"מהו EBITDA?",o:["Earnings Before Interest, Taxes, Depreciation, Amortization — רווח לפני ריבית, מס, פחת והפחתות; מאפשר השוואה טובה יותר בין עסקים דומים","Estimated Business Income Total Direct Assets — אומדן ההכנסה העסקית מנכסים ישירים, ואשר משמש להשוואת ביצועים בין חברות באותו ענף פעילות","Expense Budget In Total Direct Allocation — תקציב ההוצאות בהקצאה ישירה מלאה","Earnings Balance In Trading Development Accounts — מאזן הרווחים בחשבונות המסחר"],c:0,e:"EBITDA = רווח לפני ריבית, מס, פחת והפחתות. מאפשר השוואה טובה יותר של ביצועים עסקיים בין עסקים דומים, מכיוון שהוא מנטרל השפעות מימון, מיסוי ומדיניות פחת."},
{t:"ניהול פיננסי",s:"מקראה",q:"מהו \"פחת\" (DEPRECIATION) ומה משמעותו?",o:["ירידת ערך של מלאי שלא נמכר ונותר במחסן מעבר לתקופה שנקבעה במדיניות החברה, ואשר נרשמת כהוצאה בדו\"ח רווח והפסד בתום כל שנת דיווח","הפחתת ערך ההשקעה לאורך שנים, הנרשמת בדו\"ח רווח והפסד תחת סעיף פחת, לפי הקבוע בהוראות רשות המיסים","ההפסד החשבונאי שנוצר כאשר נכס נמכר במחיר הנמוך מערכו הרשום בספרי החברה","הוצאה חד-פעמית הנרשמת במלואה בשנת הרכישה של הנכס, בהתאם לכללי החשבונאות"],c:1,e:"כל השקעה כרוכה בהפחתת ערך בדו\"ח רווח והפסד תחת סעיף פחת. עלות ההשקעה מופחתת לאורך שנים, לפי סוג ומספר שנים המאושרים על ידי רשות המיסים."},
{t:"ניהול פיננסי",s:"מקראה",q:"מהן שלוש שיטות הרישום והדיווח החשבונאי העיקריות?",o:["שיטת המזומן, השיטה המצטברת והשיטה המעורבת — שלוש שיטות רישום ההכנסות","תקן ישראלי (Israel GAAP), IFRS (הגישה האירופית, שאומצה גם בישראל), ו-US GAAP (השיטה האמריקאית)","FIFO, LIFO וממוצע משוקלל — שלוש שיטות הערכת המלאי המקובלות בדיווח הכספי, ואשר הבחירה ביניהן משפיעה על הרווח המדווח ועל גובה המס","שיטת העלות, שיטת השווי המאזני ושיטת האיחוד — שלוש שיטות הצגת ההשקעות"],c:1,e:"שלוש השיטות: Israel GAAP; IFRS — גישה אירופית שהרבה חברות בישראל אימצו; ו-US GAAP — שיטה אמריקאית שאומצה גם על ידי חברות בינלאומיות. מרגע שחברה מחליטה ומקבלת אישור היא חייבת לעבוד לפי כלל הנהלים של השיטה."},
{t:"ניהול פיננסי",s:"מקראה",q:"מול אילו פרמטרים נעשית הבקרה על הביצוע התקציבי?",o:["מול התכנון השנתי המאושר בלבד, שהוא הבסיס המחייב היחיד לבקרה התקציבית, שהוא המסמך המחייב היחיד לצורך בקרה ודיווח לשוק ההון","ביצוע מול תכנון מאושר (AOP), ביצוע מול רבעון מקביל אשתקד, ומרבעון 2 גם מול LBE אם קיים","מול תוצאות השנה הקודמת בלבד, כדי לבחון את מגמת השינוי לאורך זמן","מול תחזית הרבעון הבא, כדי לוודא שהתכנון המעודכן ריאלי ובר-השגה בפועל"],c:1,e:"כל מדידה נעשית מול: (1) ביצוע מול תכנון מאושר AOP; (2) ביצוע מול רבעון מקביל בשנה קודמת; (3) החל מבקרת רבעון 2 — גם מול LBE אם קיים."},
{t:"ניהול פיננסי",s:"מקראה",q:"מהי \"קומבינציה חשבונאית\" ומדוע היא קריטית למנהל FM?",o:["שילוב בין שתי שיטות דיווח חשבונאי שונות באותה קבוצת חברות בינלאומית","מספר בן 14-16 ספרות, המשתנה בכל חברה, המתאר את סוג העסק, התחום והחשבון — רישום נכון שלו מאפשר ניהול על בסיס הפעילות הכספית","הצמדה של מספר מטבעות שונים באותו חוזה, לצורך גידור סיכוני שער חליפין, ואשר נועדה להקטין את החשיפה לתנודות בשערי החליפין לאורך התקופה","שילוב בין תקציב ההוצאות השוטפות לתקציב ההשקעות ההוניות בתוכנית אחת"],c:1,e:"\"הכול מתחיל ברישום נכון\". הקומבינציה החשבונאית — מספר בן 14-16 ספרות המשתנה בכל חברה — מתארת את סוג העסק, התחום והחשבון. רישום נכון מאפשר ניהול ובקרה על בסיס הפעילות הכספית ובניית KPI אמינים."},
{t:"ניהול פיננסי",s:"מקראה",q:"מדוע רישום ההוצאות בחברה אינו בהכרח מספק את צרכי מנהל התשתיות?",o:["כי מערכות הכספים אינן מדויקות מספיק ואינן מתעדכנות בזמן אמת מול הפעילות","כי את הכספים מעניינים בעיקר הוצאות/השקעות לפי סוגים הרלוונטיים למיסוי, לרגולציה ולשוק ההון — ולא רמת הפירוט והסיווג שמנהלי תשתיות נדרשים לה; הרבה הוצאות נרשמות כ\"הוצאות שונות\" או \"הנהלה וכלליות\"","כי הרישום נעשה במטבע המדווח של החברה ולא במטבע המקומי שבו בוצעה ההוצאה","כי הדיווח הכספי הוא רבעוני בלבד, בעוד שמנהל התשתיות נדרש לנתונים חודשיים, ואשר אינו מאפשר איתור חריגות בזמן אמת ותיקונן במהלך הרבעון"],c:1,e:"בדרך כלל לא קיים בחברות פירוט מספק — הצרכים והאינטרסים שונים. הכספים מתמקדים במיסוי, ברגולציה ובשוק ההון; הרבה הוצאות נרשמות תחת \"שונות\" או \"הנהלה וכלליות\". לכן נדרשת בניית תשתית רישום ב-cost centers, בדרך כלל 3-5 לפי מדינה."},
{t:"ניהול פיננסי",s:"מקראה",q:"כיצד מתבצעת הבקרה על הוצאות בחברה ציבורית?",o:["באמצעות ביקורת שנתית של רואה החשבון המבקר בלבד, במסגרת הדו\"חות המבוקרים, ואשר ממצאיה מוצגים לוועדת הביקורת ולדירקטוריון אחת לשנה","אישור כל הוצאה על ידי לפחות 2 מאשרים מעבר לרכש ולגורמים המקצועיים, בקרה חודשית מחייבת, ודיווח רבעוני לשוק ההון","באישור מנהל הכספים בלבד, שהוא בעל הסמכות הבלעדית לאשר הוצאות בחברה","בקרה רק על הוצאות מעל סף של מיליון ש\"ח, ששאר ההוצאות מאושרות אוטומטית"],c:1,e:"בחברה ציבורית: אישור כל הוצאה לפחות על ידי 2 מאשרים, מעבר לרכש ולגורמים המקצועיים הרלוונטיים; בקרה חודשית מחייבת; ודיווח רבעוני לשוק ההון על התוצאות העסקיות."},
{t:"ניהול פיננסי",s:"מקראה",q:"אילו שני מרכיבים נבחנים בדיווח הפיננסי של יחידת ה-FM?",o:["הוצאות התפעול השוטפות בלבד, המפולחות לפי סעיפי השירות השונים ולפי אתרים","ההוצאות וההשקעות לפי הסעיפים השונים (הסעדה, הסעות וכו'), וכן עלות השכר של יחידת ה-FM — היקף כספי וכמות עובדים","עלות השכר של יחידת ה-FM בלבד, בהשוואה לתקן כוח האדם שאושר בתוכנית העבודה, ואשר נמדדת מול התקן שאושר ומול השנה הקודמת בכל רבעון","ההשקעות ברכוש קבוע בלבד, שהן המרכיב המהותי בפעילות התשתיות בחברה"],c:1,e:"שני המרכיבים: (1) ההוצאות וההשקעות לפי סעיפים — הסעדה, הסעות וכו'; (2) עלות השכר של יחידת ה-FM — היקף כספי וכמות עובדים. שניהם נבחנים מול תוכנית העבודה שאושרה, מול שנה קודמת ומול LBE אם קיים."},

/* ===================== 11. מנהיגות ניהולית ===================== */
{t:"מנהיגות ניהולית",s:"מקראה",q:"במה שונה מהותית \"ניהול מנהלים\" מניהול עובדים?",o:["בכך שמנהלים דורשים שכר גבוה יותר ותנאים משופרים, ולכן ניהולם יקר יותר לארגון, ולכן נדרשת מהם מוטת שליטה קטנה יותר ומשאבי ניהול רבים יותר","המנהלים שאתה מנהל הם ברמה גבוהה יותר, עם ניסיון והרגלים קיימים, ולעיתים מומחים בתחום שאתה לא — מה שמחייב תפיסה ניהולית מותאמת ומוטת שליטה מתאימה","בכך שאין צורך בהערכת ביצועים ובמשוב שנתי, שכן מנהלים מעריכים את עצמם","בכך שהניהול מתבצע רק דרך דו\"חות ומדדים, ללא צורך בפגישות אישיות שוטפות"],c:1,e:"ניהול מנהלים מאתגר מכיוון שהמנוהלים הם ברמה גבוהה יותר, בעלי ניסיון והרגלים, ולעיתים מומחים בתחומם שאתה אינך מומחה בו. התפיסה הניהולית צריכה להתאים לרמה ולהיקף המנוהל."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהי המשמעות של \"צניעות (ענווה)\" כתכונה ניהולית?",o:["להימנע מהצגת הישגים אישיים ולתת את הקרדיט לצוות ולמנהלים המדווחים בלבד","ההבנה שהאנשים שאתה מנהל חכמים ומקצועיים בתחומם לפחות כמוך אם לא יותר — ולכן יש לתת לכולם מקום, להקשיב ולהתייחס לדעתם; היתרון העיקרי שלך הוא הניסיון","לוותר על סמכות ניהולית ולאפשר לכל מנהל לפעול באופן עצמאי לחלוטין בתחומו, ולהתערב רק כאשר מתגלה חריגה מהותית מהיעדים שנקבעו מראש","לא לקבל החלטות לבד אלא רק בהסכמה מלאה של כל המנהלים המדווחים בפורום"],c:1,e:"צניעות = ההבנה שהמנוהלים חכמים, מהירי מחשבה ומקצועיים בתחומם לפחות כמוך. לכן: לתת מקום, להקשיב, להתייחס לדעות. \"העדיפות העיקרית שיש לך היא הניסיון\" — ולנהוג בכבוד, בסבלנות ובסובלנות לדעות שונות."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהו העיקרון \"פשטות\" בהנחיית מנהלים?",o:["לפשט את התהליכים העסקיים עצמם ולצמצם את מספר השלבים והאישורים הנדרשים, ולוותר על תהליכי בקרה שאינם תורמים ישירות לתוצאה העסקית","\"מה שלא פשוט — פשוט לא עובד\": יש להפריד בין תהליך התכנון הסבוך והמורכב לבין ההנחיה למנהלים, שחייבת להיות פשוטה וברורה — מה לעשות, איך ובאיזה לוח זמנים","להימנע מניתוחים מורכבים ומשימוש בכלים אנליטיים מתקדמים בקבלת החלטות","לצמצם את מספר המנהלים המדווחים, כדי לשמור על מוטת שליטה קטנה ופשוטה"],c:1,e:"\"מה שלא פשוט — פשוט לא עובד\". חייבת להיות הפרדה בין התכנון הסבוך והמורכב (אקסל עם ניתוחים רבים) לבין ההנחיה — שיש לזקק למספר משפטים קצרים וברורים. פשטות היא גם היכולת לקבל בעיות מורכבות ולפשט אותן."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"כיצד נתפסת \"יכולת הודאה בטעות\" אצל מנהל?",o:["כחולשה ניהולית שיש להימנע ממנה, מכיוון שהיא פוגעת בסמכות ובאמון הכפיפים, ולכן מומלץ לתקן טעויות בשקט ולהימנע מדיון פומבי בנושא","כעוצמה — היא משדרת אנושיות ומסר לכפיפים שמותר לטעות, בתנאי שאין מדובר בטעות חוזרת; יש לתחקר ולהסיק מסקנות אך לא להעניש על טעות","כדבר שיש לעשות רק מול הממונים ולא מול הכפיפים, כדי לשמור על מעמד ניהולי","כאירוע שיש לתעד בתיק האישי לצורכי משמעת ולהערכת הביצועים השנתית"],c:1,e:"\"היכולת להודות בטעות היא עוצמה, לא חולשה\" — תחת ההנחה שאינה חוזרת על עצמה. משדרת אנושיות ומסר שמותר לטעות. נדרשים תחקיר, הסקת מסקנות ויישום — אך לא ענישה על טעות שאינה סדרתית."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהי אחת ההחלטות הקשות והחשובות ביותר למנהל שתחום פעולתו רחב?",o:["את מי מהמנהלים לקדם ואת מי להחליף, בהתאם לביצועים ולהתאמה לתפקיד","במה הוא עוסק פחות ובמה בכלל לא — מבין הנושאים שבתחום אחריותו — מתוך הבנה שיש לכך מחיר, ותוך בניית מערכות בקרה למזעור נזקים","כמה תקציב להקצות לכל אחת מהיחידות הכפופות לו בתוכנית העבודה השנתית","באילו כנסים מקצועיים ותערוכות להשתתף כדי ללמוד ולזהות מגמות חדשות בשוק, ואילו נושאים לקדם בכל אחד מהרבעונים של שנת העבודה הקרובה"],c:1,e:"\"אחת ההחלטות הקשות אבל החשובות למנהל שתחום פעולתו רחב — במה הוא עוסק פחות ומה בכלל לא\". זה חייב להיות ברור, מוגדר ושקוף למנהלים המנוהלים, גם אם לא נעים, ומחייב מערכות בקרה למזעור נזקים אפשריים."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהן מסגרות העבודה שמנהל צריך לקבוע מול המנהלים המדווחים לו?",o:["פגישת הנהלה שבועית בלבד, שבה מתקיים סבב עדכונים של כל המשתתפים בפורום","פגישת הנהלה, הנהלה מורחבת (רבעונית), דיון נושאי, פגישת עבודה שוטפת (שבועית/דו-שבועית), ופגישה אישית שנתית בסמוך להערכת עובדים","פגישות אישיות בלבד עם כל מנהל מדווח, בתדירות המשתנה לפי הצורך והנסיבות, המתקיימות בתדירות שנקבעת מראש בתחילת כל שנת עבודה","דיונים נושאיים בלבד, המתקיימים לפי הצורך כאשר עולה סוגיה הדורשת החלטה"],c:1,e:"מסגרות העבודה: פגישת הנהלה; הנהלה מורחבת (מומלץ רבעונית, לרובד ניהולי שני); דיון נושאי; פגישת עבודה שוטפת (שבועית/דו-שבועית, כשעה עד שעה וחצי); ופגישה אישית שנתית. \"באין מסגרות עבודה קבועות וברורות ומוגדרות — יש מהומה\"."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהו הכלל לגבי פתיחת פגישה במסגרות עבודה קבועות?",o:["לפתוח בעדכון על תוצאות החברה ברבעון האחרון ועל מצבה מול היעדים השנתיים","לפתוח בסקירת הסיכום של הפגישה הקודמת","לפתוח בסבב עדכונים אישיים קצר של כל אחד מהמשתתפים בפגישה לפי סדר קבוע","לפתוח בהצגת יעדי הרבעון הקרוב ובחלוקת המשימות בין המנהלים המשתתפים"],c:1,e:"בכל מסגרות העבודה — פגישת הנהלה, מפגש ספק-לקוח, דיון נושאי — הכלל הוא: \"המפגש הבא תמיד יפתח בסקירת הסיכום של המפגש הקודם\". כך נוצרת אחריות למעקב ולביצוע."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהי השאלה שמנהל צריך לשאול את עצמו כל יום?",o:["האם עמדתי בכל לוחות הזמנים ובכל המשימות שתכננתי לעצמי לאותו יום עבודה, ומהו הפער מול התכנון שאושר לאותו שבוע בתוכנית העבודה","\"מה הערך שהבאתי היום לחברה?\" — ואם התשובה במשך יותר מיום אחד היא שלא הבאתי, יש בעיה שמחייבת שינוי","האם כל המנהלים והעובדים הכפופים לי מרוצים ומקבלים את המענה שהם צריכים","האם חרגתי מהתקציב המאושר ומהו הפער מול התכנון הרבעוני שאושר בהנהלה"],c:1,e:"\"מנהל חייב לשאול את עצמו כל יום — מה הערך שהבאתי היום לחברה? אם התשובה של יותר מיום אחד שלא הבאתי, אני בבעיה\". זה מניע לעסוק בעיקר ובחשוב ופחות בדחוף."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהו \"ניהול מטריציוני\" ומהו הכלל החשוב בו?",o:["ניהול המבוסס על מטריצת סיכונים, שבה כל נושא מדורג לפי הסתברות ועוצמת השפעה, ואשר משמש את ההנהלה לקביעת סדר עדיפויות בהקצאת המשאבים ובתקצוב","מבנה המקובל בחברות גלובליות שבו עובד מדווח למנהל מקצועי ממונה אך כפוף ניהולית לאחר; הכלל: כל מנהל חייב להיות מנוהל באופן ברור על ידי מנהל אחד, ויש להבחין בין הנחיה מקצועית להוראה עסקית","מבנה שבו כל עובד מדווח לשני מנהלים שווי מעמד, המחלקים ביניהם את הסמכות","מבנה ארגוני שטוח ללא היררכיה כלל, שבו כל העובדים מדווחים ישירות למנכ\"ל"],c:1,e:"ניהול מטריציוני (Business partnership) מקובל בחברות גלובליות. חשוב להקפיד על הגדרות סמכות ואחריות ולא לשבור קווים, ובוודאי לא הנחיות סותרות. \"כל מנהל חייב להיות מנוהל באופן ברור על ידי מנהל אחד\", והסמכות תמיד אצל המנהל הנושא באחריות."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהי הגישה הנכונה לקבלת החלטות בסביבה של אי-ודאות?",o:["להמתין עד שכל המידע הנדרש יהיה זמין ומאומת, כדי למזער את הסיכון לטעות","עדיפה החלטה מהירה עם מעט חוסר ודאות מאשר אי-החלטה — גם אם המחיר הוא טעויות מעטות; כאשר כל המידע כבר בידך, ההחלטה פחות רלוונטית","להעביר את ההחלטה לדרג גבוה יותר בארגון, שבידיו מידע רחב יותר ופרספקטיבה, ואשר יוכל לשקול את ההשלכות הרוחביות על כלל היחידות בארגון","להחליט רק על בסיס נתונים כמותיים מדידים, ולהימנע מהסתמכות על שיקול דעת"],c:1,e:"\"מניסיון, כאשר כבר כל המידע הנדרש בידך ההחלטה פחות רלוונטית\". בעולם של היצף מידע ניתן לזהות מגמות וטרנדים. \"עדיפה החלטה מהירה עם מעט חוסר ודאות מאשר אי החלטה, גם אם המחיר הוא טעויות מעטות\"."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהו \"סרגל המדידה\" שמנהל חייב לעבוד לפיו?",o:["עמידה ביעדים הכמותיים שנקבעו בתוכנית העבודה השנתית ובחלוקה לרבעונים","\"מה טוב ונכון לחברה, לעסק, לארגון\" — ללא משוא פנים, חף מאינטרסים לא רלוונטיים ומהטיות אישיות","מידת שביעות הרצון של העובדים והמנהלים הכפופים לו, כפי שהיא נמדדת בסקרים, ואשר משוקללת בהערכת הביצועים השנתית שלו מול הממונים עליו","הערכת הממונים עליו ומידת שביעות רצונם מתפקודו ומהישגיו לאורך השנה"],c:1,e:"סרגל המדידה: מה טוב ונכון לחברה/לעסק/לארגון, ללא משוא פנים, חף מאינטרסים לא רלוונטיים ומהטיות אנושיות ואישיות. \"זה משדר לארגון ענייניות ותכליתיות ראויה\"."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהו \"מנהל מוביל נושא\"?",o:["המנהל הבכיר ביותר בתחום מסוים, שאליו מדווחים כל העוסקים באותו נושא בארגון, ואשר אחראי על תקציב הנושא ועל כוח האדם המועסק בו בכל האתרים","מנוהל שקיבל אחריות וסמכות ישירה מהמנהל להוביל נושא מסוים בכל העסק/החברה — גם אם אינו בתחום תפקידו המוגדר — ולרכז את כלל המידע בו","נציג החברה מול הספקים בתחום מסוים, המנהל את ההתקשרות ואת קשרי העבודה","ראש צוות של פרויקט זמני, המתפרק עם סיום הפרויקט והשגת היעדים שהוגדרו לו"],c:1,e:"פרט לשני מרכיבים יסודיים (תקציב וכוח אדם), לכל נושא בתחום עיסוק המנהל צריך להיות מנוהל שמוביל אותו. הוא אחראי להוביל לפי ההנחיות, לעקוב אחר הביצוע ולרכז את המידע מכל החברה — גם אם זה מחוץ לתפקידו המוגדר — תחת הגדרה ברורה של אחריות וסמכות."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מהי \"יושרה\" (אינטגריטי) לפי המקראה?",o:["לומר תמיד את מה שהממונים רוצים לשמוע, כדי לשמור על יחסי עבודה תקינים","כנות ואמיתות — להמשיך לפעול בהגינות ותחת ערכים גם במצבים קשים, ולהביע תמיד עמדה מקצועית נכונה לפי אמונתך גם כשאתה מבין ש\"הרוח שונה\"","להימנע מעימותים בכל מחיר ולחפש תמיד את המכנה המשותף בין כל הצדדים","לפעול תמיד לפי הנהלים הכתובים בלבד, גם כאשר הם אינם מתאימים למצב בשטח, ולהימנע מהפעלת שיקול דעת עצמאי שעלול לחרוג מהמדיניות שנקבעה"],c:1,e:"יושרה = כנות ואמיתות; להמשיך לפעול בהגינות ויושר תחת ערכים חשובים גם במצבים קשים, מסובכים ומביכים. להביע עמדה מקצועית נכונה גם כשהציפיות שונות, ולעמוד על דעתך — באופן מנומס, מכובד ובפורום מתאים."},
{t:"מנהיגות ניהולית",s:"מקראה",q:"מה מומלץ לגבי איוש תפקיד שהתפנה?",o:["לפנות מיד לשוק החיצוני כדי להביא רעננות, ידע חדש וניסיון מארגונים אחרים, ולקצר את משך הזמן שבו התפקיד נותר בלתי מאויש בארגון","להפיץ ראשית אפשרות פנים-חברה לפני פנייה החוצה, ולהתעקש על מועמד פנימי מתאים גם אם המנהל שלו לא רוצה לוותר עליו","לקדם תמיד את העובד הוותיק ביותר ביחידה, לפי ותק וניסיון מצטבר בתפקיד","להשאיר את התפקיד פנוי עד שיימצא מועמד מושלם העונה על כל דרישות התפקיד"],c:1,e:"\"לכל תפקיד מתפנה להפיץ ראשית אפשרות פנים חברה לפני פנייה החוצה, להתעקש על מועמד מתאים פנימי גם שהמנהל שלו לא רוצה לוותר עליו\". זאת כחלק מפיתוח וטיפוח כפיפים ומתן אופק קידום."}
]);
