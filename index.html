<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בוחן תרגול — ניהול תשתיות גלובליות</title>
<style>
:root{
  --bg:#f7f6f3; --surface:#ffffff; --surface2:#f1efe8; --text:#1f1f1d; --muted:#6b6b66;
  --border:#e3e1da; --borderS:#cfccc2; --accent:#185fa5; --accentSoft:#e8f0f8;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --warnTx:#854f0b; --warnBg:#faeeda;
  --clsTx:#6b21a8; --clsBg:#f3e8ff;
  --bibTx:#0f6e56; --bibBg:#e1f5ee;
  --chipBg:#efeee9;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1a1a18; --surface:#242421; --surface2:#2f2f2c; --text:#ececea; --muted:#a3a39c;
    --border:#37372f; --borderS:#4a4a46; --accent:#5b9bd5; --accentSoft:#22344a;
    --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
    --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
    --warnTx:#fac775; --warnBg:#4a2b06;
    --clsTx:#d8b4fe; --clsBg:#3b1d6e;
    --bibTx:#9fe1cb; --bibBg:#0d4438;
    --chipBg:#2f2f2a;
  }
}
html.dark{
  --bg:#1a1a18; --surface:#242421; --surface2:#2f2f2c; --text:#ececea; --muted:#a3a39c;
  --border:#37372f; --borderS:#4a4a46; --accent:#5b9bd5; --accentSoft:#22344a;
  --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
  --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
  --warnTx:#fac775; --warnBg:#4a2b06;
  --clsTx:#d8b4fe; --clsBg:#3b1d6e;
  --bibTx:#9fe1cb; --bibBg:#0d4438;
  --chipBg:#2f2f2a;
}
html.light{
  --bg:#f7f6f3; --surface:#ffffff; --surface2:#f1efe8; --text:#1f1f1d; --muted:#6b6b66;
  --border:#e3e1da; --borderS:#cfccc2; --accent:#185fa5; --accentSoft:#e8f0f8;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --warnTx:#854f0b; --warnBg:#faeeda;
  --clsTx:#6b21a8; --clsBg:#f3e8ff;
  --bibTx:#0f6e56; --bibBg:#e1f5ee;
  --chipBg:#efeee9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',Arial,'Helvetica Neue',sans-serif;line-height:1.65;
  overflow-wrap:break-word;-webkit-text-size-adjust:100%;}
.wrap{max-width:820px;margin:0 auto;padding:22px 20px 60px;}
header h1{font-size:23px;margin:0 0 4px;font-weight:650;}
header .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px;}
.chip{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit;}
.chip:hover{border-color:var(--accent);}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.chip small{opacity:.75;font-size:11px;}
.lbl{font-size:12px;color:var(--muted);margin-left:4px;align-self:center;min-width:44px;}
.spacer{flex:1;}
.iconbtn{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;}
.iconbtn:hover{border-color:var(--accent);}
.note{background:var(--accentSoft);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;font-size:13px;margin-bottom:14px;}
.note b{color:var(--accent);}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;margin-bottom:12px;color:var(--muted);}
.stats b{color:var(--text);}
.bar{height:7px;background:var(--chipBg);border-radius:999px;overflow:hidden;margin-bottom:18px;}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);}
.qtext{font-size:17.5px;font-weight:600;margin-bottom:15px;line-height:1.6;}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--borderS);
  border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:.12s;
  background:var(--surface);width:100%;text-align:right;font:inherit;color:var(--text);}
.opt:hover{border-color:var(--accent);background:var(--accentSoft);}
.opt .ltr{font-weight:700;color:var(--accent);min-width:19px;}
.opt.correct{background:var(--okBg);border-color:var(--okBd);}
.opt.correct .ltr{color:var(--okTx);}
.opt.wrong{background:var(--errBg);border-color:var(--errBd);}
.opt.wrong .ltr{color:var(--errTx);}
.opt.locked{cursor:default;}
.opt.locked:hover{background:var(--surface);border-color:var(--borderS);}
.opt.correct.locked:hover{background:var(--okBg);border-color:var(--okBd);}
.opt.wrong.locked:hover{background:var(--errBg);border-color:var(--errBd);}
.expl{margin-top:8px;padding:13px 15px;border-radius:10px;background:var(--accentSoft);
  border:1px solid var(--border);font-size:14px;}
.expl .tag{font-weight:700;color:var(--accent);}
.nav{display:flex;gap:10px;margin-top:16px;}
.btn{flex:1;background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:12px;font-size:15px;cursor:pointer;font-family:inherit;}
.btn:hover{border-color:var(--accent);}
.btn-pri{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-height:190px;overflow-y:auto;}
.pbtn{width:33px;height:33px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);font-size:12.5px;cursor:pointer;font-family:inherit;}
.pbtn.cur{outline:2px solid var(--accent);outline-offset:1px;}
.pbtn.ok{background:var(--okBg);border-color:var(--okBd);color:var(--okTx);}
.pbtn.bad{background:var(--errBg);border-color:var(--errBd);color:var(--errTx);}
.pbtn.ans{background:var(--accentSoft);border-color:var(--accent);color:var(--accent);}
.ptitle{font-size:12.5px;color:var(--muted);margin-bottom:7px;}
.result{text-align:center;}
.result .big{font-size:46px;font-weight:800;color:var(--accent);line-height:1.1;}
.result .grade{font-size:17px;margin:8px 0 16px;}
.clock{font-variant-numeric:tabular-nums;font-weight:650;}
.rev{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface2);font-size:14px;text-align:right;}
.rev .rq{font-weight:600;margin-bottom:6px;}
.rev .ra{color:var(--errTx);}
.rev .rc{color:var(--okTx);}
@media (max-width:540px){
  .wrap{padding:16px 14px 48px;} .card{padding:16px;} .qtext{font-size:16px;}
  header h1{font-size:19px;} .pbtn{width:29px;height:29px;font-size:11.5px;}
  .opt{padding:11px 12px;} .stats{gap:11px;font-size:13px;}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>בוחן תרגול — ניהול תשתיות גלובליות</h1>
  <div class="sub" id="sub"></div>
</header>
<div id="app"></div>
<div style="text-align:center;color:var(--muted);font-size:12px;margin-top:24px;">
  חומר סגור · לתרגול לימודי בלבד · נבנה מחומרי הקורס באתר "למדה"
</div>
</div>
<script>
var BANK=[
/* ===================== 1. מבוא ויסודות ===================== */
{t:"מבוא ויסודות",s:"מקראה",q:"מנכ\"ל חברת תרופות שואל את מנהל התשתיות מהי בעצם מטרת מערך ה-FM. מהי ההגדרה המדויקת ביותר לפי המקראה?",o:["ניהול תקציב האחזקה, הניקיון והשמירה של המבנים, תוך עמידה בדרישות הרגולטוריות של משרד הבריאות ומכון התקנים בכל אתר; התקציב לכך נקבע שנתית ומאושר בהנהלה","ניהול כלל הפעילות והשירותים הנדרשים כדי להבטיח פעולה תקינה ורצופה של העסק, ללא עיסוק בליבת העשייה — ובעיקר לאפשר למנהל להתרכז בליבה","ניהול הרכש, המלאי ושרשרת ההספקה של החברה מול ספקים חיצוניים, לרבות ניהול המכרזים וההתקשרויות הרב-שנתיות","ניהול משאבי האנוש והשירותים לעובד — הסעדה, הסעות, ביגוד ורווחה — בתיאום עם אגף משאבי אנוש של החברה, וכן ניהול מערך הרווחה, הנופשים והאירועים הפנים-ארגוניים"],c:1,e:"ההגדרה בשיעור 1: ניהול כלל הפעילות הנדרשת להבטחת פעולה תקינה ורצופה של העסק, ללא עיסוק בליבת העשייה, במטרה לאפשר למנהל להתרכז בליבת עשייתו — \"BUSINESS CONTINUITY\", ברמת שירות טובה ובמחיר סביר."},
{t:"מבוא ויסודות",s:"מקראה",q:"אילו שלושה זוגות מושגים מגדירים יחד את תחום ניהול התשתיות ויוצרים \"שפה עסקית משותפת\" גלובלית?",o:["INSOURCING מול OUTSOURCING, FIXED PRICE מול COST PLUS, ו-SLA מול KPI — שלושת צירי ההתקשרות עם ספק חיצוני","SOFT מול HARD SERVICES, CORE מול NON-CORE TO BUSINESS, ו-CRITICAL מול NON-CRITICAL","CAPEX מול OPEX, ROI מול NPV, ו-LCC מול BENCHMARK — שלושת צירי ההערכה הכלכלית של השקעות בתשתיות","GMP מול NON-GMP, QA מול QC, ו-RFP מול RFI — שלושת צירי הרגולציה, האיכות והרכש בתחום התשתיות"],c:1,e:"שלושת המשתנים המגדירים את התחום הם: SOFT & HARD SERVICE, CORE & NON-CORE, CRITICAL & NON-CRITICAL. הם מאפשרים מיקוד, סדר עדיפויות ושפה משותפת בין אתרים."},
{t:"מבוא ויסודות",s:"מקראה",q:"מה בדרך כלל נכלל תחת HARD SERVICES?",o:["הסעדה, הסעות עובדים, ניקיון, ביגוד וכביסה ופינוי אשפה — כלל השירותים הלוגיסטיים הניתנים לעובד ולמחלקות","אחזקה על צורותיה, צריכת אנרגיה, כיולים וולידציות, מערכות מיזוג לאזורי הליבה וטיפול בפסולת מסוכנת","שירותי דואר ומשלוחים, הדפסות, ציוד משרדי, גינון והדברה — שירותי האתר הכלליים שאינם בליבת העשייה","ניהול חוזי השכירות, דמי הניהול, הארנונה והביטוח של נכסי החברה מול בעלי הנכסים והרשויות, ובכפוף למדיניות הנכסים הגלובלית שאושרה בהנהלת החברה"],c:1,e:"HARD מכוון לפעילות ותמיכה בליבת העסק ובאזורים קריטיים: אחזקה, אנרגיה, כיול וולידציה, מערכות מיזוג/אוורור לאזורי ליבה, פסולת מסוכנת. SOFT הוא בעיקר שירותים לוגיסטיים לעובד."},
{t:"מבוא ויסודות",s:"מקראה",q:"מנהל תשתיות טוען: \"HARD זה תמיד CORE וגם תמיד CRITICAL\". מה נכון לפי המקראה?",o:["הטענה נכונה — שלוש החלוקות זהות לחלוטין ולכן די להגדיר אחת מהן וכל השאר נגזרות ממנה אוטומטית","לעיתים קרובות ההגדרות מקבילות ודומות, אבל ישנם גם יוצאים מן הכלל — החלוקה היא ניהולית ועקרונית ויש להתאימה לכל עסק","הטענה שגויה לגמרי — אין שום קשר בין שלוש החלוקות, וכל אחת מהן נקבעת על ידי גורם אחר בארגון, ולכן אין טעם לנסות ליצור ביניהן שפה משותפת או מדרג עדיפויות","HARD הוא תמיד NON-CORE, מפני שליבת העשייה מטופלת אך ורק על ידי עובדי החברה ולעולם לא במיקור חוץ, ולכן אינו מחייב סקר סיכונים או הגדרת יתירות מערכות"],c:1,e:"המקראה מציינת שלעיתים זה מקביל ודומה (HARD≈ליבה≈קריטי, SOFT≈לא ליבה≈לא קריטי) \"אבל ישנם גם יוצאים מן הכלל\". החלוקה היא ניהולית ועקרונית ויש להתאימה לכל סוג עסק."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהי המשמעות המרכזית של הגדרת אזור או נושא כ-CRITICAL?",o:["האזור מסוכן פיזית לעובדים ולכן מחייב ציוד מגן אישי, תדריך בטיחות והסמכה מיוחדת לכל הנכנס אליו","האזור מהווה סיכון לעמידת העסק ביעדיו, ולכן מקבל תשומת לב ניהולית ממוקדת ויתירות מערכות להבטחת המשכיות עסקית","האזור נמצא תחת רגולציית GMP ולכן מחייב ולידציה, כיול מערכות ותיעוד מלא של כל פעולת אחזקה שבוצעה בו, ללא קשר לשאלת הקריטיות שלו להמשכיות העסקית של החברה","האזור מנוהל תמיד במיקור חוץ מלא על ידי חברת IFM, בשל המורכבות המקצועית הגבוהה של התחזוקה בו, ולכן הוא נכלל תמיד בהסכם ה-IFM הכולל ואינו מנוהל בנפרד"],c:1,e:"\"קריטי\" = מהווה סיכון לעמידת העסק ביעדיו. בכל חברה נדרש סקר סיכונים שנתי (בחברה ציבורית גם דיווח לשוק ההון), ולפיו מוגדרים האזורים הקריטיים שמקבלים יתירות ותמיכה מיוחדת."},
{t:"מבוא ויסודות",s:"מקראה",q:"שלוש צורות ההפעלה המקובלות של פעילות ה-FM הן:",o:["FIXED PRICE (מחיר קבוע), COST PLUS (עלות ורווח מוסכם) ו-OPEN BOOKS (ספרים פתוחים) — שלוש שיטות ההתחשבנות","SINGLE/INHOUSE (ניהול עצמאי), IFM (אינטגרציה מלאה על ידי גורם חיצוני), ו-BUNDLER/HYBRID (משולב)","INSOURCING (עובדי חברה), OUTSOURCING (מיקור חוץ) ו-OFFSHORING (העברת הפעילות למדינה אחרת)","BOT (בנה-הפעל-העבר), PFI (מימון פרטי) ו-PPP (שותפות ציבורית-פרטית) — שלושת מודלי ההשקעה ארוכי הטווח"],c:1,e:"שלוש צורות ההפעלה: ניהול עצמאי SINGLE/INHOUSE; אינטגרציה מלאה חיצונית IFM; ומשולב BUNDLER/HYBRID. (FIXED PRICE / COST PLUS / OPEN BOOKS הן שיטות התקשרות/התחשבנות מול חברת IFM — לא צורות הפעלה.)"},
{t:"מבוא ויסודות",s:"מקראה",q:"לפי ההתפתחות ההיסטורית שהוצגה בקורס — מה אפיין את התקופה שמשנות ה-80 ועד שנת 2000?",o:["כלל הפעילות עדיין בוצעה על ידי עובדי החברה בלבד, במשאבים עצמיים ובניהול ישיר של כל מקצוע בנפרד","התפתחה פעילות משולבת שעיקרה ביצוע העבודה על ידי עובדי קבלן/חברות חיצוניות, בניהול העסק המעסיק","חברות IFM השתלטו על השוק וקיבלו אחריות כוללת לכל תחומי התשתיות, כולל ניהול, תפעול ואחזקה","התפיסה ההיברידית הפכה למקובלת ביותר, כשחלק מהנושאים מנוהלים בחברה וחלקם על ידי חברת IFM, לפי סוג הפעילות והקריטיות שלה לעמידת העסק ביעדיו העסקיים"],c:1,e:"עד שנות ה-80 — עובדי חברה. משנות ה-80 עד 2000 — מיקור חוץ/עובדי קבלן בניהול העסק. מ-2000 ואילך — התפתחות IFM. ב-10 השנים האחרונות — התפיסה המשולבת (היברידית) היא המקובלת ביותר."},
{t:"מבוא ויסודות",s:"מקראה",q:"חברה ותיקה וגדולה שוקלת להעביר את מערך ה-FM לחברת IFM. אילו שני בסיסי השוואה היא חייבת שיהיו לה כדי שהמהלך יהיה בר-מדידה?",o:["דו\"ח רווח והפסד מבוקר ותזרים מזומנים חזוי לשלוש השנים הבאות, כפי שהם מדווחים לשוק ההון","בסיס כספי ברור וידוע (BASE LINE) ורמת שירות קיימת וברורה (SLA)","סקר שביעות רצון עובדים מהשנה החולפת וניתוח פארטו של סעיפי ההוצאה הגדולים ביותר במערך","מפרט טכני מפורט לכל מערכת ותקן ISO 9000 בתוקף לכל אחד מהספקים המועמדים בתהליך"],c:1,e:"המקראה: כדי לאפשר ניהול וביצוע חיצוני עם יכולת השוואה נדרשים שני בסיסים — BASE LINE כספי ברור, ו-SLA (רמת שירות קיימת וברורה). בלעדיהם אי אפשר להוכיח חיסכון או שיפור."},
{t:"מבוא ויסודות",s:"מקראה",q:"שיטת ההתקשרות OPEN BOOKS מול חברת IFM מאופיינת ב:",o:["מחיר קבוע ומוסכם מראש לפעילות נתונה, כאשר כל חריגה מעבר לתכולה מחושבת ומתומחרת בנפרד","שקיפות מלאה בעלויות ובהוצאות ורווח מוסכם, תוך קביעת מנגנוני קנס/פרס","תשלום לפי מ\"ר בלבד, ללא קשר לעלויות שנשא בהן הספק בפועל ולמספר העובדים שהעסיק","תשלום רק עבור תפוקות שנמדדו בפועל, ללא כל התייחסות לתשומות ולמבנה העלויות של הספק"],c:1,e:"OPEN BOOKS = שקיפות מלאה בעלויות, בהוצאות וברווח המוסכם, במדרגות מקובלות, עם מנגנון קנס/פרס. FIXED PRICE הוא מחיר קבוע + חריגים; COST PLUS הוא עלות + רווח מוסכם."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהי \"שיתופיות\" (SHARING) בהקשר של ניהול תשתיות, כפי שהוצגה בקורס?",o:["שיתוף עובדי תשתיות בין מחלקות שונות באותו אתר, כדי לנצל טוב יותר את שעות העבודה שלהם, וכדי לצמצם את הצורך בהעסקת עובדי קבלן חיצוניים ובתשלום דמי ניהול נוספים לספק","בחינת אפשרות שעסקים סמוכים ירכשו שירותים במשותף — הסעות משותפות, מטבח אחד לכמה חדרי אוכל, פינוי פסולת — כדי להגביר זמינות ולהוריד הוצאות","חלוקת רווחי חברת ה-IFM עם הלקוח בסוף השנה, כמנגנון תמריץ לשיפור מתמיד ברמת השירות, ומחושבת כאחוז קבוע מהחיסכון השנתי שהושג בפועל מול תקציב הבסיס","העברת עובדי הקבלן להיות עובדי החברה, כפי שנעשה בהסכם בין האוצר להסתדרות בבתי החולים"],c:1,e:"שיתופיות = שיתוף פעולה בין עסקים סמוכים (או בין אתרים של אותו עסק) לרכישת שירותים משותפים. מקבילה לתחום \"קבוצות רכישה\". בנוסף קיימים בתוך חברות מרכזי shared services נושאיים."},
{t:"מבוא ויסודות",s:"מצגת",q:"מהי התפלגות ההוצאות הטיפוסית בעולם בתחום ה-FM?",o:["50%-60% עלויות כוח אדם, 30% חומרים ואמצעים, ו-10% השפעות רגולטוריות ועלויות ממוצעות","70%-80% עלויות כוח אדם, 10%-20% חומרים ואמצעים, 5%-10% השפעות רגולטוריות","90% חומרים, אמצעים וחלקי חילוף, ורק 10% כוח אדם — בשל האוטומציה הגוברת בתחום","כשליש כוח אדם, כשליש חומרים ואמצעים וכשליש עמידה בדרישות רגולטוריות משתנות"],c:1,e:"מבנה העלויות בעולם ב-FM: כ-70%-80% עלויות כוח אדם, 10%-20% חומרים ואמצעים, 5%-10% השפעות רגולטוריות. ההתפלגות משתנה לפי סוג העסק ומבנהו."},
{t:"מבוא ויסודות",s:"מקראה",q:"מדוע מבנה עלויות שבו כוח אדם הוא המרכיב הדומיננטי כל כך משמעותי בניהול תשתיות?",o:["כי הוא מקטין את החשיפה לשינויים רגולטוריים, שכן שכר העבודה נקבע בהסכמים ארוכי טווח ויציבים, ולכן הוא מקטין גם את התלות בשינויי שכר המינימום ובהסכמים קיבוציים בענף","כי ככל שהטכנולוגיה מתפתחת היחס בין כוח האדם לאמצעים משתנה — אוטומציה ורובוטיקה מאפשרות מעבר מפעילות מונוטונית קבועה לפעילות לפי צורך (ODS)","כי הוא הופך את הרכש למרכיב שולי, ולכן אין טעם להשקיע בתהליכי תיחור ובמשא ומתן מול ספקים","כי הוא מבטיח לספק רווחיות גבוהה ויציבה, ולכן מקל על הלקוח לנהל מולו משא ומתן על המחיר, ולכן חברות מעדיפות לרכז את כל הפעילות אצל ספק אחד ויחיד"],c:1,e:"מכיוון שרוב ההוצאה היא שכר, כל שינוי טכנולוגי שמחליף עבודת כפיים משפיע ישירות על העלות. לכן המעבר ל-ODS (On Demand Service), אוטומציה ורובוטיקה הוא מנוף מרכזי להוזלה. חשיפה לשינויים רגולטוריים (כמו שכר מינימום) דווקא גדלה."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהו ODS (On Demand Service)?",o:["מערכת דיווח כספי אמריקאית המחייבת דו\"ח שנתי על שינויים מהותיים בנכסי החברה המדווחת","מעבר מפעילות מונוטונית קבועה לפעילות המבוצעת על פי צורך בפועל","נוהל תפעול סטנדרטי מחייב, המגדיר את הנורמות והתהליכים שלפיהם יש לפעול בתחום נתון","הסכם רמת שירות עם ספק חיצוני, הקובע מהם המדדים, מהו היעד לכל מדד ומהי שיטת המדידה"],c:1,e:"ODS = ביצוע השירות לפי צורך ולא בתדירות קבועה. לדוגמה: ניקוי משרד רק כשהוא מאויש, במקום שלוש פעמים בשבוע קבוע. חוסך עלות כוח אדם משמעותית."},
{t:"מבוא ויסודות",s:"מקראה",q:"כל הבאים נמנים עם הערך המוסף של ניהול תשתיות גלובלי, למעט:",o:["יצירת סטנדרטיזציה ואחידות באופי וברמת השירות בין האתרים השונים, ויתרון לגודל ברכש ובהתקשרויות","שיתוף ידע בין אתרים וזיהוי שיטות עבודה מומלצות, לצד סמכות מקצועית גלובלית בכל תחומי התשתיות","קביעת סטנדרט גלובלי אחיד שגובר על דרישות רגולטוריות מקומיות","שיפור הנראות וההבנה של הוצאות האתרים ובסיס ההוצאה הכוללת, ויצירת מאגר נתונים לכלל האתרים"],c:2,e:"זו הטעות: \"סטנדרטים מקומיים תמיד יותאמו לדרישות רגולטוריות מקומיות ויהיו מותאמים לנורמות מקומיות ולשוני תרבותי\". הסטנדרט הגלובלי לעולם אינו גובר על הרגולציה המקומית."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהם הגורמים המרכזיים המשפיעים על הבחירה בין ניהול עצמי לבין רכישת שירותי IFM?",o:["מחיר השירות המוצע בלבד — בהשוואה לעלות הישירה של העסקת עובדי חברה באותם תפקידים","גודל החברה, שלב מחזור החיים שלה, המורכבות הנדרשת, וכן מבנה המחזור והרווח התפעולי","דרישות רגולטוריות מקומיות בלבד, המשתנות ממדינה למדינה ומרשות מקומית אחת לאחרת","מספר האתרים של החברה בלבד, ופריסתם הגאוגרפית בין מדינות ויבשות שונות ברחבי העולם"],c:1,e:"המשפיעים העיקריים: גודל החברה ושלב מחזור החיים, המורכבות הנדרשת, ומבנה המחזור והרווח התפעולי — ככל שהרווח קטן יותר, הצורך להקטין הוצאות גדול יותר ולכן יעדיפו ניהול מבוקר והדוק. חברות קטנות/חדשות יעדיפו רכישת שירותים כוללים."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהם ששת הגורמים המחייבים ארגון מחדש של תמיכת פעילות העסקים? אחד מהבאים אינו נמנה עמם:",o:["שוק חופשי ופתוח ברמה עולמית המחייב שיפור יכולת התחרות באיכות, ברמת השירות ובמחיר בר-תחרות","התפתחות תובענית בצרכי העובדים, הלקוחות והמנהלים ודרישות רגולטוריות גוברות בכל תחומי אורחות החיים","קיום עסק סימולטני במספר אתרים במדינה, ביבשת או גלובלית — מייזום ומו\"פ ועד שירות ותחזוקה","ירידה בקצב השינויים הטכנולוגיים המאפשרת יציבות ארוכת טווח"],c:3,e:"ההפך הוא הנכון — אחד הגורמים הוא דווקא \"צורך הכרחי לקיים מערכות ותהליכים המסוגלים להשתנות בקצב מהיר מאוד לעין שיעור ביחס לעבר\". הקצב מואץ, לא מאט."},
{t:"מבוא ויסודות",s:"מקראה",q:"מנהל תשתיות מסכם: \"מידע כבר אינו כוח\". כיצד המשפט מסתיים במקראה?",o:["אלא הכוח הוא בשמירת המידע בסודיות מלאה ובהגבלת הגישה אליו רק לבעלי תפקידים מורשים","אלא הכוח הוא בניהול הידע והמידע ובאופן השימוש בו","אלא הכוח הוא בכמות הנתונים שנאספים ובקצב שבו הם נצברים במערכות הארגון השונות","אלא הכוח הוא בהשקעה במערכות מידע יקרות ומתקדמות המחוברות זו לזו ומתעדכנות בזמן אמת"],c:1,e:"\"מידע כבר אינו כוח, אלא הכוח הוא בניהול הידע והמידע ואופן השימוש בו\". זמינות המידע ונגישותו מאפשרים תהליכים שלא התאפשרו קודם."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהי המשמעות של \"ניתוק החשיבות של המיקום הפיזי\" בהקשר של ארגונים גלובליים?",o:["ביטול מוחלט של הצורך במשרדים פיזיים, ומעבר של כלל העובדים לעבודה מרחוק מהבית, תוך שמירה על מרכזי שירות אזוריים בלבד לצורכי ישיבות ואירועים","מאפשר ביזור וניצול יתרונות שונים במקומות שונים — ייזום, מו\"פ, תכנון, ייצור, הפצה, מכירה, שירות ותחזוקה במיקומים נפרדים","העברת כל הפעילות למדינה אחת זולה, שבה עלות כוח האדם והתשתיות היא הנמוכה ביותר","הפחתת החשיבות של רגולציה מקומית, מכיוון שהפעילות אינה מזוהה עוד עם מדינה מסוימת, ולכן ניתן להחיל סטנדרט אחיד לחלוטין בכל אתרי החברה בעולם"],c:1,e:"קיום עסק סימולטני במספר אתרים (מדינה, יבשת, גלובלי) לאורך כל השרשרת — מייזום ומו\"פ ועד שירות ותחזוקה — מאפשר ביזור וניצול יתרונות יחסיים במקומות שונים."},
{t:"מבוא ויסודות",s:"מצגת",q:"אילו מהבאים הן חברות FM/נדל\"ן גלובליות המיוצגות גם בישראל?",o:["Sodexo, Compass ו-Aramark — שלוש חברות ההסעדה והשירותים המוסדיים הגדולות בעולם","CBRE, JLL, Colliers, Cushman & Wakefield ו-NAI Global","SAP, Oracle ו-Priority — ספקיות מערכות ה-ERP המובילות לניהול נכסים ותשתיות","Amazon, Google ו-Microsoft — שלוש החברות עם מערכי התשתיות הפנימיים הגדולים בעולם"],c:1,e:"החברות הגלובליות שהוצגו: CBRE (הגדולה בעולם לשירותי נדל\"ן מסחרי), JLL, Colliers, Cushman & Wakefield ו-NAI Global. סודקסו היא בעיקר חברת הסעדה/שירותים."},
{t:"מבוא ויסודות",s:"מצגת",q:"על פי הנתונים שהוצגו, CBRE היא:",o:["חברת ההסעדה והשירותים המוסדיים הגדולה בעולם, עם כ-50,000 עובדים ופעילות ביותר מ-60 מדינות, המספקת שירותי הסעדה, ניקיון ואבטחה משולבים ללקוחות מוסדיים","חברת שירותי הנדל\"ן המסחרי וההשקעות הגדולה בעולם, עם למעלה מ-100,000 עובדים ולקוחות ביותר מ-100 מדינות","חברת אבטחה וניקיון ישראלית הפועלת גם בחו\"ל, המספקת שירותי IFM משולבים למפעלים ולמשרדים","יצרנית מערכות בקרת מבנה (BMS) וחיישני IOT לניטור ולאחזקה חזויה של מערכות תשתית, ומספקת גם שירותי התקנה, כיול ותחזוקה שוטפת למערכות שהתקינה"],c:1,e:"CBRE Group (NYSE: CBRE), חברת Fortune 500 ו-S&P 500 שמטה שלה בדאלאס, היא חברת שירותי הנדל\"ן המסחרי וההשקעות הגדולה בעולם — מעל 100,000 עובדים ביותר מ-100 מדינות."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהם המשפיעים העיקריים על הצורך בשירותי FM איכותיים לעובדים בעידן שאחרי הקורונה?",o:["חיסכון בהוצאות בלבד — הורדת עלויות התפעול והמחיר ליחידה בכל אחד מסעיפי השירות, שהוא המדד המרכזי היחיד שלפיו נמדד מנהל התשתיות בחברה עסקית","תחרות בין-עסקית לגיוס ושימור עובדים, חיסכון בהוצאות, מתן שירות עדכני התואם ציפיות, וגמישות תפעולית לעבודה מרחוק","דרישות רגולטוריות חדשות בלבד, שנוספו בתחומי הבריאות, הבטיחות ואיכות הסביבה, ואשר חייבו את החברות להיערך מחדש במערך הבטיחות ואבטחת האיכות","התפתחות הטכנולוגיה בלבד — אוטומציה, רובוטיקה, אפליקציות ומערכות ניהול מתקדמות"],c:1,e:"ארבעת המשפיעים: תחרות על גיוס ושימור עובדים; חיסכון בהוצאות (עלויות תפעול, מחיר ליחידה); שירות עדכני והולם לציפיות; וגמישות תפעולית לעבודה מרחוק/מהבית."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהו סדר ההתפתחות הנכון של מודלי ההפעלה בניהול תשתיות, מהפשוט למורכב?",o:["IFM מלא ← מיקור חוץ לפי נושאים ← ביצוע עצמי בעובדי חברה ← מודל משולב היברידי, לפי הסדר שהוצג בתרשים ההתפתחות של מודלי ההפעלה במצגת השיעור","עצמי ← מיקור חוץ (שכירת כוח אדם) ← מיקור חוץ מתקדם (הגדרת תפוקות) ← IFM ← משולב/היברידי ← שיתופי פעולה","משולב היברידי ← ביצוע עצמי ← IFM מלא ← מיקור חוץ מבוסס תשומות ← שיתופי פעולה בין עסקים, לפי סדר ההתפתחות ההיסטורי שהוצג במצגת השיעור הראשון","מיקור חוץ ← ביצוע עצמי ← שיתופי פעולה בין עסקים ← IFM ← מיקור חוץ מבוסס תפוקות"],c:1,e:"סדר ההתפתחות: עצמי (משאבים עצמיים) ← מיקור חוץ שהוא בפועל \"שכירת כוח אדם\" ← מיקור חוץ מתקדם המוגדר לפי תפוקות ולא תשומות ← IFM מלא ← משולב/היברידי ← שיתופי פעולה ו-shared services."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהו ההבדל המהותי בין \"מיקור חוץ\" ל\"מיקור חוץ מתקדם\"?",o:["מיקור חוץ מתקדם עולה פחות, מכיוון שהספק נושא בעלויות ההכשרה, הציוד וחלקי החילוף","במיקור חוץ רגיל למעשה שוכרים כוח אדם, ואילו במיקור חוץ מתקדם רוכשים שירותים תוך הגדרת תפוקות ולא תשומות","מיקור חוץ מתקדם מבוצע על ידי עובדי החברה עצמה, בניהול מקצועי של יועץ או חברת ניהול חיצונית, ולכן הוא נחשב לשיטה זולה ומבוקרת יותר מבחינת העסק המזמין","אין ביניהם הבדל מהותי — מדובר בשני שמות לאותה שיטת התקשרות, שהשתנתה עם השנים, ולכן ניתן להשתמש בשני המונחים באופן מתחלף בהסכמים ובנהלים"],c:1,e:"מיקור חוץ רגיל = הוצאת פעילות לספקים חיצוניים בניהול העסק, בפועל \"שכירת כוח אדם\" (תשומות). מיקור חוץ מתקדם = רכישת שירותים תוך הגדרת תפוקות; העסק מנהל בעיקר פיקוח ובקרה. מקובל ב-SOFT."},
{t:"מבוא ויסודות",s:"מקראה",q:"על אילו סוגי \"עסק\" חלה תורת ניהול התשתיות?",o:["רק על מפעלי ייצור תעשייתיים ומרכזים לוגיסטיים, שבהם קיימת ליבת עשייה פיזית מוגדרת","רק על בנייני משרדים, קניונים ומרכזים מסחריים, שבהם עיקר הפעילות היא שירות ללקוח חיצוני, ואינה רלוונטית לאתרי ייצור, למכוני מחקר ופיתוח או למוסדות ציבור","החל ממשרד בודד ועד אתר המשלב שלל עיסוקים — משרדים, מפעלים, מכוני מו\"פ, בתי חולים, בתי מלון, קניונים, אוניברסיטאות, נמלי תעופה ומוסדות שלטון","רק על חברות גלובליות בעלות נוכחות בכמה יבשות, שבהן נדרשת סטנדרטיזציה בין האתרים, ואינה רלוונטית לעסק הפועל באתר בודד או במספר אתרים במדינה אחת"],c:2,e:"ההגדרה רחבה מאוד: כל ארגון שיש בו פעילות תומכת — ממשרד בודד ועד אתרים מורכבים: בנייני משרדים, מפעלים, מכוני מחקר, בתי חולים, מלונות, קניונים, בתי ספר ואוניברסיטאות, תחנות רכבת, נמלי תעופה וים, מוסדות שלטון ועוד."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהי המטרה העיקרית של ההבחנה בין SOFT ל-HARD SERVICES?",o:["לקבוע אילו עובדים יקבלו שכר גבוה יותר ואילו הכשרות והסמכות נדרשות לכל אחד מהתפקידים, ולקבוע מי מהם יועסק ישירות ומי באמצעות קבלן שירות חיצוני","לתכנן ולבצע מערכי תמיכה ופעילות מותאמים לדרישות השונות — חלקן רגולטוריות — וליצור שפה משותפת בחברה גם כשיש אתרים מרובים","להחליט אילו שירותים ניתן לקצץ או להשעות בעת משבר תקציבי, ואילו חייבים להמשיך לפעול","לקבוע מי מבעלי התפקידים מדווח למנהל התשתיות ומי מדווח לאגף משאבי אנוש או לתפעול, ולקבוע את מבנה הדיווח ואת מוטת השליטה של כל אחד מהמנהלים"],c:1,e:"החלוקה נועדה לתכנן מערכי תמיכה מותאמים לדרישות השונות (חלקן רגולטוריות), ובעיקר ליצור שפה משותפת ואחידה בחברה — כך שסטנדרט ההפעלה יהיה זהה באתרים שונים של אותה חברה."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהו העיקרון המנחה בכל הנוגע לניהול תשתיות ולתנאי הסף לשינוי בעסק?",o:["לשמר את מה שעובד ולא לשנות אותו, כדי לא לסכן את רציפות הפעילות ואת יציבות רמת השירות, ולהימנע מהשקעות נוספות שספק אם יחזירו את עצמן בטווח הזמן הנדרש","להיות קשוב וערני לשינויים בעסק ובסביבה כל הזמן, לא \"להתאהב\" במה שקיים — גם אם אתה יצרת אותו — ולשמור על איכות ביצוע ורמת שירות לצד שליטה מלאה בהוצאות","להתמקד אך ורק בהורדת עלויות, שהיא המדד היחיד שלפיו נמדד מנהל התשתיות בחברה עסקית","להעביר את כל הפעילות למיקור חוץ, כדי להעביר את הסיכון והאחריות התפעולית לספק חיצוני"],c:1,e:"התנאי החשוב: לשמור על איכות ביצוע ורמת שירות מחד, ושליטה מלאה ומוחלטת בהוצאות מאידך. ובמקביל — \"לא להתאהב במה שקיים אפילו אם אתה עשית שינויים אלו\"; להיות פתוח לשינוי מתמיד."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהו NETWORKING בהקשר הניהולי של ניהול תשתיות?",o:["הקמת רשת תקשורת מחשבים מאובטחת בין אתרי החברה השונים בארץ ובעולם, לצורך שיתוף נתונים, דיווח מרוכז והפקת דו\"חות ניהוליים אחידים","יצירת רשת קשרים מקצועיים רלוונטיים ולמידה מעסקים אחרים — דומים ושונים — כדי לזהות מגמות ולהיות מוכן לשנות","קישור מערכות ה-ERP של הספקים למערכות הלקוח, לצורך הזמנות, קבלה ותשלום מקוונים","ניהול קשרי ספק-לקוח באמצעות פורטל דיגיטלי ומפגשים רבעוניים קבועים עם סיכום מחייב, תוך שימוש במערכות דיגיטליות לניהול ההזמנות, הקבלה והתשלום לספק"],c:1,e:"NETWORKING = יצירת רשת קשרים מקצועיים ולמידה מעסקים אחרים בארץ ובעולם, לא בהכרח באותו תחום. מטרתו לזהות מגמות בזמן ולהיות מוכן לשנות — \"מה שקורה בעולם מגיע אלינו ומהר\"."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהו BOT ומה מאפיין אותו?",o:["Business Operation Transfer — העברת פעילות עסקית שלמה בין חברות, כולל עובדים, נכסים והתחייבויות, לרבות המשך אחריות המעביד כלפי העובדים שהועברו במסגרת העסקה","Build Operate Transfer — מודל שבו גורם פרטי בונה, מפעיל ומתחזק את הנכס לתקופה ארוכה (כ-25 שנה) ולאחריה מעביר אותו לבעלים","Budget Optimization Tool — כלי ממוחשב לתכנון תקציב ולבקרה תקציבית רב-שנתית בארגונים גדולים, ואשר מאפשר גם מעקב אחר ביצוע מול תכנון ברמת הרבעון והשנה","Basic Outsourcing Terms — מערכת תנאי הסף המקובלים בהתקשרות ראשונית עם ספק שירותי מיקור חוץ"],c:1,e:"BOT = BUILD OPERATE TRANSFER. לצדו PFI (Private Finance Initiative) ו-PPP (Public Private Partnership). הסכמים ארוכי טווח לשיתוף פעולה בין המגזר הפרטי לשירות הציבורי, החזר השקעה כ-25 שנה, כולל תפעול ואחזקה."},
{t:"מבוא ויסודות",s:"מצגת",q:"מהם ראשי התיבות ESG ומה הם מבטאים?",o:["Economic Social Growth — צמיחה כלכלית-חברתית כמדד להתפתחות עסקית בת-קיימא לאורך זמן","Environmental, Social, Governance — שמירה על חברה וסביבה וממשל תאגידי תקין","Energy Saving Guidelines — מערכת ההנחיות הבינלאומית לחיסכון באנרגיה בבניינים ובמפעלים","External Service Grade — דירוג רמת השירות שמעניק ספק חיצוני ללקוחותיו המוסדיים"],c:1,e:"ESG = Environmental, Social, Governance. אחד המשפיעים המרכזיים על הצורך בארגון מחדש של העסקים, לצד אוטומציה, דיגיטציה, סייבר, בינה מלאכותית, אנרגיה ירוקה ועוד."},
{t:"מבוא ויסודות",s:"מקראה",q:"מהו \"מרכז שירות נושאי\" (shared services)?",o:["מוקד שירות טלפוני של ספק חיצוני, המספק מענה 24/7 לתקלות ולבקשות שירות של הלקוח, ואשר מנוהל על ידי חברת הניהול לפי מדדי זמינות ומהירות מענה","יחידה בתוך החברה הנותנת שירות נושאי לאזור או למרחב — כספים, משאבי אנוש, רכש, IT — ללא שיוך עסקי חד-ערכי","מרכז לוגיסטי משותף לכמה חברות סמוכות, המאפשר חיסכון בשטחי אחסון ובעלויות ההובלה, ומאפשר לכל אחת מהן להקטין את שטחי האחסון שהיא מחזיקה בעצמה","חדר בקרה מרכזי לניהול ולניטור מערכות המבנה — מיזוג, חשמל, כיבוי אש ובקרת כניסה"],c:1,e:"shared services = מרכזי שירות נושאיים בתוך חברות (כספים, משאבי אנוש, רכש וקניינות, IT), הנותנים שירות לאזור/מרחב ללא שיוך עסקי חד-ערכי. כולל מוקדי תמיכה גלובליים העונים לפונה בשפתו."}
];

{t:"הסעדה",s:"מקראה",q:"מהו המדד המרכזי, הברור והמקובל בכל העולם למדידת הצלחת מערך הסעדה?",o:["עלות מנה ממוצעת בשקלים, בהשוואה למחירון השוק ולעלות המנה אצל חברות דומות באותו אזור","מדידת פוטנציאל אוכלים מול אוכלים בפועל — 85% נחשב מצב טוב","מספר התלונות שהתקבלו מסועדים בחודש, מפולח לפי סוג התלונה ולפי שעת ההגשה בחדר האוכל","אחוז המנות הטבעוניות והמותאמות מסך המנות המסופקות, כמדד למגוון ולהתאמה לכלל האוכלוסיות"],c:1,e:"המדד המרכזי: פוטנציאל אוכלים מול אוכלים בפועל, כאשר 85% נחשב מצב טוב. לצדו סקר שביעות רצון עיתי לזיהוי מגמות."},
{t:"הסעדה",s:"מקראה",q:"מהו התהליך החדש המתפתח מאוד באירופה ומתחיל בישראל, שמטרתו לצמצם פחת בהסעדה?",o:["מעבר לשיטת \"לקחת שילמת\" — תשלום לפי משקל המנה ומספר הפריטים, עם קופות בסוף מסלול הבחירה","הזמנה ממוכנת מראש — בבוקר העובד מקבל מייל/וואטסאפ עם תפריט, בוחר מה ומתי יאכל","הגדלת מלאי הביטחון של המנות המוכנות, כדי למנוע מחסור בשעות השיא ולשפר את שביעות הרצון","העברת ההסעדה כולה לקבלן חיצוני במחיר קבוע למנה, כך שהפחת הופך להיות בעיה של הספק"],c:1,e:"הזמנה ממוכנת: העובד בוחר מראש מהתפריט ואף את שעת ההגעה. התהליך מדייק את כמות המנות, מקטין מאוד את העודפים ומקצר את זמן ההמתנה. ניתן גם לווסת עומסים באמצעות תמריצים (למשל קינוח חינם מחוץ לשעות השיא)."},
{t:"הסעדה",s:"מקראה",q:"מהו \"מטבח מחמם\" ואיפה הוא ממוקם בסולם רמות המטבחים?",o:["מטבח מבשל מלא שבו הכול נעשה במקום — טבון, פלנצ'ה, ווק ועמדות שף פרונטליות לעיני הלקוח, המאפשר גם הכנה פרונטלית לעיני הלקוח לפי בחירתו האישית","הרמה הבסיסית ביותר — מרבית הבישול נעשה במטבח מרכזי רחוק (בשל-צנן), יכולות בישול מוגבלות מאוד","מטבח שף פתוח ומאובזר, המעוצב כמסעדת יוקרה ומופעל על ידי שף מוכר בשמו ובמוניטין שלו","מטבח ביניים — מטבח קצה מחמם עם יכולות בישול מוגבלות של טיגון ואפייה בלבד במקום, ואשר מאפשר גם הגשה חמה, קרה וקפואה לפי אופי הארוחה והמנה"],c:1,e:"סולם המטבחים: מחמם (בסיסי, בישול במטבח מרכזי רחוק, בשל-צנן) ← ביניים/קצה מחמם עם יכולות מוגבלות (טיגון, אפייה) ← מבשל מלא (טבון, פלנצ'ה, ווק, עמדות שף) ← מסעדת שף פרונטלית."},
{t:"הסעדה",s:"מקראה",q:"מהי שיטת \"סו-ויד\" (sous-vide) ומדוע היא נכנסה גם להסעדה מוסדית?",o:["הגשה בעמדות שף לעיני הלקוח, המעניקה למנה רגילה נופך אישי ויוקרתי ותשומת לב מיוחדת, ואשר מבוצעת על ידי שף אישי המועסק ישירות על ידי החברה המזמינה","בישול מזון בשקיות פלסטיק אטומות בתוך אמבט מים או קיטור — שליטה מדויקת בטמפרטורה ובזמן, בישול אחיד ובקרה טובה מאוד","הקפאה מהירה של מנות מוכנות מיד לאחר הבישול, לשמירה על ערכים תזונתיים ולהארכת חיי המדף, ומאפשרת לספק לתכנן מראש את הכמויות ולהקטין את הפחת היומי","הרכבה עצמית של המנה על ידי הסועד מתוך מגוון רכיבים, בעמדות טיבול, מוקפץ ובר סלטים"],c:1,e:"סו-ויד (צרפתית: \"תחת ואקום\") — בישול בשקיות אטומות באמבט מים/קיטור. נכנס גם למוסדי בעיקר להתמודדות עם הרבה אוכלים בזמן קצר, בזכות השליטה המדויקת בטמפרטורה ובזמן הבישול."},
{t:"הסעדה",s:"מקראה",q:"מנהל FM בונה מפרט דרישות להסעדה. מי אמור לכתוב את החלק המהותי של המפרט?",o:["מנהל הרכש של החברה, יחד עם נציג הכספים ונציג המחלקה המשפטית, כחלק מוועדת הרכש","יועץ קולינרי, הקובע מגוון המאפשר לכל האוכלוסיות לאכול, סוג ומשקל למנה, הרכב תזונתי וערך קלורי","נציגות ועד העובדים, המייצגת את הסועדים ומכירה את העדפותיהם ואת דפוסי הצריכה שלהם, לצד יועץ קולינרי חיצוני המלווה את התהליך מטעם החברה המזמינה","ספק ההסעדה עצמו, שהוא בעל הידע המקצועי בתחום ומכיר את יכולות המטבח והמיכון, ומעסיק יועץ קולינרי מטעמו לצורך בניית התפריטים והמפרטים"],c:1,e:"החלק המהותי במפרט מבוצע על ידי יועץ קולינרי — הקובע מגוון לכל האוכלוסיות (בשרי, חלבי, צמחוני, טבעוני, צליאק, קטוגני), סוג ומשקל למנה, הרכב תזונתי וערך קלורי, ומגוון מנות בכל קטגוריה."},
{t:"הסעדה",s:"מקראה",q:"מהו ההסדר המקובל לגבי מיכון וציוד מטבח בהסכם הסעדה בישראל?",o:["ספק ההסעדה רוכש את כל הציוד ומתחזק אותו, ובתום ההסכם מפרק ולוקח אותו עמו לאתר הבא","מקובל מאוד שהלקוח (החברה המקבלת שירות) רוכש את כלל האמצעים, וספק ההסעדה מבצע תחזוקה שוטפת ונושא באחריות לבלאי שנגרם משימוש לא נכון","הציוד נרכש בשותפות שווה בין הלקוח לספק, וכל צד אחראי לתחזוקת המערכות שרכש בכספו, ובתום ההסכם מחלקים ביניהם את התמורה ממכירת הציוד המשומש","הציוד כולו מושכר מחברה שלישית בליסינג תפעולי, והתחזוקה כלולה בדמי השכירות החודשיים, כך שאין צורך במנגנון החתמה, ספירה עיתית או קרן חידוש לציוד"],c:1,e:"המקובל: הלקוח רוכש את הציוד; הספק מתחזק ואחראי לבלאי משימוש לא נכון (לא בלאי טבעי). נדרש מנגנון החתמה על הציוד, ספירה עיתית, השלמה והחלפה לבלאי טבעי (קרן חידוש) ואכיפת תחזוקה לפי הוראות היצרן."},
{t:"הסעדה",s:"מקראה",q:"במה שונה הסכם הסעדה טיפוסי בחו\"ל מההסכם המקובל בישראל?",o:["בחו\"ל משלמים מחיר קבוע למנה ובישראל משלמים לפי משקל המנה ומספר הפריטים שנלקחו","בישראל מקובל מחיר למנה הכולל את כל העלויות; בחו\"ל העסק משלם למפעיל את מלוא ההוצאות כולל כוח אדם (payroll) ותשתיות, והעובד משלם מחיר מסובסד על מה שאכל","אין הבדל מהותי בין השיטות — בשתיהן משלמים מחיר למנה לפי סוגי הארוחות ולפי שעות היום, וההבדל היחיד הוא בשיעור הסובסידיה שהעסק נותן לעובד על כל מנה","בחו\"ל ההסעדה ניתנת תמיד בחינם לעובדים כחלק מתנאי ההעסקה, ובישראל היא תמיד בתשלום"],c:1,e:"בישראל — מחיר למנה לפי סוגים, כולל כל העלויות, לעיתים עם מינימום מחייב (בעיקר מתחת ל-250 עובדים). בחו\"ל — תשלום הוצאות מלא למפעיל על ידי העסק (כולל payroll ותשתיות) והעובד משלם מחיר מסובסד לפי מה שלקח."},
{t:"הסעדה",s:"מקראה",q:"האם ארוחה שמקבל עובד במקום העבודה בישראל חייבת במס?",o:["לא — ההסעדה במקום העבודה פטורה ממס כהטבה סוציאלית המוכרת בפקודת מס הכנסה","כן — ההסעדה נחשבת הטבה וככזו הסועד מחויב במס עליה","רק אם שווי הארוחה עולה על תקרה שנתית שנקבעת מדי שנה על ידי רשות המיסים","רק בחברות ציבוריות המדווחות לשוק ההון, ולא בחברות פרטיות או במלכ\"רים"],c:1,e:"בישראל ההסעדה נחשבת כהטבה וככזו הסועד מחויב במס על הארוחה. הכלל הרחב: כל הטבה מחויבת במס."},
{t:"הסעדה",s:"מקראה",q:"סדרו את חמש הרמות המקובלות בהסעדה מהנמוכה לגבוהה:",o:["בינוני (תעשייה) ← בסיסי (מוסדות ציבור) ← טוב (הנהלות) ← מצוין (מסעדות שף) ← טוב מאוד (הייטק), כפי שהוצג בסקירת רמות ההסעדה המקובלות בשוק הישראלי בשיעור","בסיסי (מוסדות ציבור, צה\"ל, בתי חולים) ← בינוני (מפעלים, תעשייה) ← טוב (הנהלות חברות) ← טוב מאוד (חברות הייטק נבחרות) ← מצוין (מסעדות שף)","טוב (הנהלות) ← בסיסי (מוסדות ציבור) ← בינוני (תעשייה) ← מצוין (מסעדות שף) ← טוב מאוד (הייטק), לפי הסיווג המקובל בשוק הישראלי ובהתאם לסוג הארגון והמזמין","בסיסי (מוסדות ציבור) ← טוב (הנהלות) ← בינוני (מפעלים) ← טוב מאוד (הייטק) ← מצוין (מסעדות שף)"],c:1,e:"חמש הרמות: בסיסי (מוסדות ציבוריים, צה\"ל, משטרה, שב\"ס, בתי חולים); בינוני (מפעלים, תעשייה); טוב (הנהלות ומטות); טוב מאוד (הייטק נבחר); מצוין (מסעדות שף בתוך חברות)."},
{t:"הסעדה",s:"מקראה",q:"אילו גורמים משפיעים על סוג המטבח שניתן להקים באתר?",o:["גודל המקום והתקציב העומד לרשות הפרויקט בלבד, שהם המגבלות המעשיות היחידות בפועל, שכן הרישוי, הכשרות ודרישות משרד הבריאות נגזרים מהם ממילא","גודל, מקום, תשתית, מיכון, תקציב, רישוי עסקים (משתנה מעיר לעיר), משרד הבריאות, רבנות ורמת כשרות, וכמובן החלטת החברה","דרישות משרד הבריאות בלבד, שהן הרגולציה המחייבת היחידה בכל הנוגע להכנת מזון, שכן שאר הגורמים נגזרים ממנה ואינם מהווים מגבלה עצמאית בפועל","מספר העובדים באתר בלבד, שממנו נגזרת כמות המנות היומית ולפיה נקבע סוג המטבח"],c:1,e:"הגורמים: גודל, מקום, תשתית, מיכון, תקציב, רישוי עסקים (משתנה מעיר לעיר), משרד הבריאות, רבנות ורמת כשרות והחלטת החברה. הרפורמות בכשרות וברישוי עסקים צפויות לשנות את התמונה."},
{t:"הסעדה",s:"מקראה",q:"כיצד יש להיערך נכון לסקר שביעות רצון בהסעדה כדי שייצור אמון?",o:["לערוך סקר ארוך ומפורט ככל האפשר, אחת לכמה שנים, כדי לקבל תמונה מלאה ומעמיקה","להבין שזה דיאלוג בין נותן שירות למקבל: סקר לא ארוך מדי, בזמן נכון, לפרסם תוצאות ופעילות מתקנת, לבצע מעקב, ובסקר הבא לערוך השוואה ולתקשר ללקוחות","לפרסם רק את התוצאות החיוביות כדי לשמור על מורל העובדים ועל תדמית מערך ההסעדה, ולהציג את הממצאים השליליים רק בפני הנהלת החברה ומול הספק","להעביר את עריכת הסקר וניתוחו לאחריות הספק, כדי לשמור על אובייקטיביות מקצועית"],c:1,e:"סקר הוא דיאלוג. הכללים: לא ארוך מדי, בזמן נכון, לפרסם תוצאות ותוכנית מתקנת, לבצע בקרה ומעקב אחר ההתחייבות לשיפורים, ובסקר הבא להשוות ולתקשר שוב. רק כך נוצר אמון."},
{t:"הסעדה",s:"מקראה",q:"מהם ההסדרים מסוג \"סיבוס\" / \"תן ביס\" / Wolt במסגרת פתרונות הסעדה?",o:["חברות המפעילות מטבחים מרכזיים ומספקות מנות מבושלות לאתרי הלקוחות בשיטת בשל-צנן, ומעסיקות יועצים קולינריים הכותבים את מפרטי הדרישות ללקוח","הסדרים המאפשרים לעובדים לאכול במסעדות ובבתי אוכל סמוכים או להזמין משלוח, בדרך כלל בתקציב קבוע ומוסכם מראש (מצטבר, מתאפס יומי/שבועי/חודשי)","חברות ייעוץ קולינרי הכותבות את מפרטי הדרישות ומלוות את תהליכי הבקרה על הספקים","מערכות ממוחשבות להזמנת מנות מראש מהמטבח הפנימי, לצמצום פחת ולוויסות שעות העומס"],c:1,e:"אלה הסדרי הסעדה חיצונית — cibus/Sodexo, verifone, paidit, Wolt — בדרך כלל במחיר קבוע ומוסכם מראש בתנאי ההעסקה, מצטבר או מתאפס יומי/שבועי/חודשי. מקובל גם בחברות ציבוריות באמצעות כרטיס בתקציב קבוע."},
{t:"הסעדה",s:"מקראה",q:"מהי ההשפעה של מגפת הקורונה ועבודה היברידית על ניהול ההסעדה?",o:["הפחיתה את הצורך בניהול מדויק, מכיוון שכמות הסועדים ירדה והפחת קטן ממילא באופן טבעי, ולכן ניתן להסתפק בממוצע חודשי קבוע של מנות לכל אתר ואתר","העצימה את הצורך בניהול מדויק של העובדים בכל אתר בכל יום — אפליקציה שמבררת מי מגיע, לאיזו ארוחה, באיזו שעה ומה מעדיף — מה שמקל על הספק ומקטין פחת","ביטלה את הצורך בחדרי אוכל, והובילה למעבר גורף להסדרי הסעדה חיצוניים מסוג תן-ביס","הובילה למעבר מלא למכונות אוטומטיות למכירת מנות, כריכים וסלטים ללא מגע אנושי"],c:1,e:"עבודה חלקית מרחוק העצימה את הצורך בניהול מדויק של הנוכחות היומית. אפליקציה השואלת \"מגיע לעבודה? אוכל בוקר/צהריים/ערב? באיזו שעה? מה מעדיף?\" מקלה על הספק ומקטינה פחת."},
{t:"הסעדה",s:"מקראה",q:"מהם הדגשים העדכניים בדרישות הסועדים בעולם?",o:["מנות גדולות יותר במחיר נמוך יותר, עם דגש על שובע ועל תמורה כלכלית מרבית לסועד, לצד הפחתת המגוון היומי כדי לפשט את התפעול במטבח ובחדר האוכל","אוכל בריא, מוצרים איכותיים וטריים, לא מתועשים, הכנה במקום לעיני הלקוח, מנות בהרכבה עצמית והכנה לפי דרישה","העדפה למזון מתועש בגלל האחידות, יציבות האיכות והיכולת לתכנן מראש את הכמויות, לצד צמצום מספר עמדות ההגשה כדי לקצר את זמן ההמתנה בשעות השיא","הפחתת המגוון לטובת יעילות תפעולית וקיצור זמני ההמתנה בשעות העומס בחדר האוכל"],c:1,e:"השינוי בדרישות: אוכל בריא, מוצרים איכותיים וטריים, לא מתועשים, הכנה במקום לעיני הלקוח, הרכבה עצמית והכנה לפי דרישה. הדרך להתמודד: גיוון רב, שינוי מתמיד בצורת ההגשה, עמדות שף ובר סלטים."},

/* ===================== 3. הובלה והסעות ===================== */
{t:"הובלה והסעות",s:"מקראה",q:"מהי השאיפה התיאורטית המרכזית בניהול מערך הובלות?",o:["להוביל בכל הזדמנות במשאית הגדולה ביותר האפשרית, כדי למזער את מספר הנסיעות הכולל","\"נסיעה במטען מלא\" רוב הזמן — תוך התאמת סוג הרכב למטען ותכנון קווים אופטימלי","למזער את מספר הנהגים המועסקים, שהם מרכיב העלות המשמעותי ביותר במערך ההובלה","להעדיף תמיד הובלה בצי עצמי על פני רכישת שירות מחברות הובלה חיצוניות בשוק, כדי לשמור על שליטה מלאה בלוחות הזמנים ובאיכות השירות"],c:1,e:"השאיפה: נסיעה במטען מלא ככל האפשר. לשם כך נדרשת התאמת סוג הרכב למטען (סוג, גודל, משקל, נפח) ותכנון קווים; ואף שילוב גורמי הובלה מחוץ לחברה למציאת הובלה חוזרת מלאה."},
{t:"הובלה והסעות",s:"מקראה",q:"כיצד נכון לחשב עלויות הובלה?",o:["לפי עלות כוללת יומית של המשאית והנהג, ללא קשר לכמות המטען שהועברה בפועל, בתוספת מקדם קבוע לצריכת הדלק, לבלאי הרכב ולשעות ההמתנה ברמפה","לפי מחיר למשטח או מחיר לפריט מוסע — ולא עלות כוללת של הובלה יומית או ליעד","לפי מספר הקילומטרים שנסעו בלבד, בתוספת מקדם לצריכת דלק ולבלאי הרכב","לפי שעות עבודת הנהג, כולל שעות ההמתנה לפריקה ולטעינה ברמפות היעד, בתוספת תמריץ על עמידה בלוח הזמנים ועל היעדר נזקים למטען"],c:1,e:"חישוב העלויות צריך להיות לפי מחיר למשטח או מחיר לפריט מוסע, ולא לפי עלות כוללת של הובלה יומית/ליעד. כך ניתן להשוות ולנהל את היעילות בפועל."},
{t:"הובלה והסעות",s:"מקראה",q:"מי חייב להעסיק \"קצין בטיחות בתעבורה\"?",o:["רק חברות הובלה שבבעלותן יותר מ-50 משאיות, לפי הוראות משרד התחבורה בנושא, ולפי היקף המחזור השנתי שלהן בענף ההובלה היבשתית בישראל","כל חברה המבצעת הובלה — גם באמצעות צי רכב עצמי וגם בשימוש בחברות וקבלני חוץ","רק חברות המובילות חומרים מסוכנים, שנדרשות גם למנהל בטיחות ולרכבי ליווי, ואשר מחויבות בנוסף בליווי, בתיעוד ובדיווח לרשות הרלוונטית","רק גופים ציבוריים וממשלתיים, החייבים בכך מכוח חוק חובת המכרזים והתקשי\"ר"],c:1,e:"בכל חברה המבצעת הובלה — בין אם בצי עצמי ובין אם ברכישת שירות מחברות הובלה — מחויבת העסקת קצין בטיחות בתעבורה. הובלת חומרים מסוכנים מחייבת בנוסף מנהל בטיחות."},
{t:"הובלה והסעות",s:"מקראה",q:"מהו GDP בהקשר של הובלה ומה הוא מחייב?",o:["Gross Domestic Product — התוצר המקומי הגולמי, מדד כלכלי המשפיע על מחירי ההובלה בשוק","Good Distribution Process — רגולציה המחייבת ביצוע \"ולידציה\" לרכב המוביל, לוודא עמידה בתנאים כמו בקרת טמפרטורה, לחות ואטימות, לצד תיעוד רצוף","General Delivery Protocol — נוהל מסירה אחיד בין מוביל למקבל, הכולל תעודת משלוח חתומה, המחייב את המוביל להחתים את מקבל המטען ולהחזיר עותק למשרד","Global Driver Program — תוכנית בינלאומית להכשרת נהגים והסמכתם להובלה בין-מדינתית, ואשר במסגרתה נדרש כל נהג לעבור רענון תקופתי ובחינה מעשית"],c:1,e:"GDP = GOOD DISTRIBUTION PROCESS. מחייב ולידציה לרכב המוביל (בקרת טמפרטורה, לחות, אטימות) ותיעוד רצוף מנקודת המוצא לנקודת הקבלה — בעבר בתיעוד מודפס, כיום ב\"אמצעים חכמים\" (צ'יפים)."},
{t:"הובלה והסעות",s:"מקראה",q:"אילו אמצעי שליטה ובקרה מקובלים היום במערך ההובלה?",o:["דיווח טלפוני של הנהג בכל תחנה, המתועד ביומן נסיעות ידני ומועבר למרכז ההובלה","GPS וטכוגרף המאפשרים ניטור מתמיד — חיווי עצירה, פתיחת דלת מטען, התראה על חריגה ממסלול או מזמן, ובקרת טמפרטורה עם רישום דיגיטלי מקוון","תעודות משלוח חתומות על ידי מקבל המטען ביעד, המוחזרות למשרד בסוף כל יום עבודה, ומתויקות בתיק הלקוח לצורך בקרה חודשית והתחשבנות מול הספק","ביקורות פתע במחסני היעד ובדיקת התאמה בין הכמות שנשלחה לכמות שהתקבלה בפועל, ואשר מתועדות בפרוטוקול המועבר לספק ולמנהל האתר לצורך תיקון"],c:1,e:"מערכות GPS וטכוגרף מאפשרות ניטור מרגע ההגעה לרמפה ועד היציאה לדרך: חיווי עצירה, פתיחת דלת מטען, חריגה ממסלול מסוכם, חריגה בזמן. ברכבי קירור — חיווי שוטף וספח מודפס או חיישן ורשם דיגיטלי מקוון."},
{t:"הובלה והסעות",s:"מקראה",q:"מהי MOBILITY בהקשר של הסעות עובדים והגעה לעבודה?",o:["מערכת ממוכנת לתכנון מסלולי הסעה שבועיים, המתעדכנת עם סיום תכנון המשמרות בכל סוף שבוע, ומפיצה את הסידור לעובדים, לנהגי ההסעה ולאחראים באתר בכל שבוע","תפיסה מתפתחת (מובילות בה הולנד ואיטליה) של הקצאת תקציב חודשי ומערך הסכמים המאפשרים הגעה לעבודה ברכבת, מטרו, אוטובוס, אופניים או שילוב ביניהם, ולעיתים רכב לסוף שבוע","שירות הסעות מזדמנות במוניות תחת הסכם ארצי, המאפשר שילוב נוסעים ליעד זהה","חברת ליסינג בינלאומית המספקת רכבים לעובדים בכל אתרי החברה ברחבי העולם"],c:1,e:"MOBILITY — שילוב אמצעי ניידות בתוך תקציב מוגדר לעובד. המוטיב המוביל: איכות סביבה ובריאות. כולל רכבת, מטרו, אוטובוס, אופניים (עם מקלחת וחניה בטוחה) ואפשרות רכב לסוף שבוע או לאירוע."},
{t:"הובלה והסעות",s:"מקראה",q:"אילו קריטריונים צריך לקבוע נוהל (POLICY) הסעות עובדים?",o:["את שעות היציאה והחזרה בלבד, בהתאמה לשעות הפעילות ולמשמרות באתר, ואת נקודות האיסוף שנקבעו לכל אחד מקווי ההסעה בכל אזור","כמה עובד מוכן ללכת מביתו לנקודת איסוף, כמה זמן ישהה ברכב, מי רשאי להשתמש בהסעה, ומה קורה עם עובד שנרשם ולא הגיע","את סוג הרכב המשמש להסעה בלבד — אוטובוס, מידיבוס, מיניבוס או מונית לפי כמות הנוסעים, ואת נקודות האיסוף וההורדה שנקבעו לכל אחד מקווי ההסעה באזור","את זהות חברת ההסעה הזוכה ואת המחירון המוסכם עמה לכל סוג רכב ולכל מסלול"],c:1,e:"נוהל ההסעות קובע קריטריונים: מרחק הליכה מהבית לנקודת איסוף/הורדה; משך שהייה ברכב; מי רשאי להשתמש (למשל האם בעל רכב חברה או מקבל אחזקת רכב); טיפול בעובד שנרשם ולא הגיע; והוראות בטיחות מקצין בטיחות בתעבורה."},
{t:"הובלה והסעות",s:"מקראה",q:"בהתקשרות עם חברות כמו GETT או YANGO להסעות מזדמנות — על מה יש לשים לב במיוחד?",o:["על גובה העמלה שגובה החברה מכל נסיעה ועל אופן ההתחשבנות החודשית מול הלקוח","שבניגוד להסכם עם תחנת/חברת מוניות, אין יחסי עובד-מעביד בין בעל המונית לחברה, ולכן נושא הביטוח צריך לקבל ביטוי מיוחד ושונה","שהמחירים אינם אחידים בין אזורים ומשתנים לפי שעות היום ולפי רמת הביקוש בכל רגע, מה שמקשה על תקצוב מראש ועל השוואה בין חלופות ההסעה השונות","שלא ניתן לשלם בכרטיס אשראי במונית, ולכן נדרש הסדר תשלום נפרד מול כל נהג, ולכן ההתחשבנות מתבצעת במזומן ומחייבת ניהול קופה קטנה באתר"],c:1,e:"בהסכמים מסוג זה אין יחסי עובד-מעביד בין בעל המונית לחברה, ולכן יש לבחון את החשיפה המשפטית ואת נושא הביטוח באופן מיוחד. בעיה נוספת: מחויבות נמוכה של הנהגים משפיעה על זמינות בשעות הביקוש."},
{t:"הובלה והסעות",s:"מקראה",q:"מהו האתגר המרכזי ביצירת תהליך מסודר להגדרת צרכי הובלה בחברה?",o:["עלות מערכות המחשוב הנדרשות לתכנון ולניהול ההובלה ועלות ההטמעה שלהן בארגון","הרצון של כל עסק לשמור על גמישות מרבית ולא לתכנן — למרות שהרוב ידוע מראש; נדרש שינוי בתרבות הארגונית","מחסור בנהגים מוסמכים בעלי רישיון מתאים, שהוא בעיה עולמית בשרשרת ההספקה, ואשר החריף בעקבות משבר הקורונה והשינויים בשוק העבודה בענף","מחסור במשאיות מתאימות לסוגי המטען השונים ובמכולות, בעיקר לאחר משבר הקורונה, שהוא אחד ממאפייני המשבר העולמי בשרשרת ההספקה בשנים האחרונות"],c:1,e:"האתגר: \"למרות הרצון של כל עסק לשמור על גמישות מרבית ולא לתכנן — לא צריך לאפשר זאת, הרוב ידוע מראש\". נדרש תהליך קבוע להגדרת צרכים עד יום קבוע בשבוע, ושינוי בתרבות הארגונית."},
{t:"הובלה והסעות",s:"מקראה",q:"מהי \"הובלת כספת\" שהוזכרה כטכנולוגיה מתפתחת?",o:["הובלה בליווי מאובטח וחמוש, המקובלת בהובלת כספים, אבנים יקרות ותוצרת גמורה יקרה","כספת הנסגרת ביעד השולח, וכשהיא מגיעה ליעד הפריקה מקבל מורשה ביעד קוד לפתיחתה","משאית ממוגנת ירי ופריצה, המצוידת במערכות איתור ובקשר רציף עם מוקד הבקרה, ואשר מלווה על ידי רכב אבטחה נוסף לאורך כל המסלול עד היעד","מכולה עם בקרת טמפרטורה ולחות ותיעוד רצוף, לצורך עמידה בדרישות ולידציה של GDP"],c:1,e:"טכנולוגיה מתפתחת לאבטחת מטענים רגישים (סמים בעולם התרופות, כסף, אבנים יקרות): הכספת נסגרת אצל השולח, ורק מקבל מורשה ביעד מקבל את הקוד לפתיחתה."},
{t:"הובלה והסעות",s:"מקראה",q:"מה קרה להובלה הימית לישראל בעקבות משבר החות'ים?",o:["ההובלה הימית לישראל הופסקה לחלוטין, וכל המטענים הועברו להטסה במטוסי מטען, ולכן עלויות ההובלה האווירית עלו בחדות בשנתיים האחרונות","אוניות נדרשו להקיף דרך כף התקווה הטובה באפריקה במקום תעלת סואץ — מה שהאריך את הדרך וייקר את הפעילות","מחירי ההובלה הימית ירדו בשל ירידה חדה בביקוש ובכמות המטענים המועברים לישראל, בעיקר בענפי הקמעונאות והתעשייה שצמצמו את היקפי הייבוא שלהם","ההובלה עברה כולה לרכבות דרך אירופה, בשילוב עם הובלה ימית קצרה בים התיכון"],c:1,e:"בעקבות המשבר עם החות'ים נדרשו אוניות להקיף דרך כף התקווה הטובה במקום תעלת סואץ בדרך לים התיכון — הארכת זמן וייקור הפעילות. בהובלה אווירית — ביטול טיסות רבות לישראל השפיע על הטסת מטען (שחלקו הגדול במטוסי נוסעים)."},
{t:"הובלה והסעות",s:"מקראה",q:"מה מאפיין את שוק חברות ההובלה בישראל?",o:["מונופול של חברה גדולה אחת השולטת ברוב נתח השוק ומכתיבה את המחירים בענף, ואשר כפופה לפיקוח של הממונה על ההגבלים העסקיים במשק","מספר חברות גדולות עם יכולת לוגיסטית משלימה, לצד חברות קטנות ובינוניות פרטיות וציבוריות המאוגדות לעיתים בקואופרטיב","רק חברות בבעלות ממשלתית או ציבורית, הפועלות תחת רגולציה של משרד התחבורה, ואינן רשאיות להתקשר עם קבלני משנה ללא אישור מוקדם מהרגולטור","רק צי רכב עצמי של החברות המובילות, ללא שוק של קבלני הובלה חיצוניים בענף"],c:1,e:"השוק מאופיין במספר חברות גדולות עם יכולת משלימה לוגיסטית כוללת, ולצידן חברות קטנות ובינוניות פרטיות וציבוריות, לעיתים מאוגדות בקואופרטיב. לעיתים גם צי הובלה בבעלות החברה — בהתאם לכדאיות עסקית ולמדיניות."},
{t:"הובלה והסעות",s:"מקראה",q:"מהו \"מרכז הובלה\" בחברה גדולה?",o:["מחסן מרכזי שבו מרוכזים כל המטענים לפני הפצתם לאתרים ולסניפים השונים של החברה, ומשמש נקודת ריכוז לתיאום בין המחסנאים, הנהגים ומנהלי ההפצה","מרכז שליטה, תכנון ובקרה המאחד גורמים שונים בחברה שאין ביניהם קשר — כדי לשלב ולמצות נסיעות","משרדי חברת ההובלה החיצונית שזכתה בהסכם, המנהלת את הצי ואת סידור העבודה, ואשר מדווחת ללקוח על ביצוע כל הובלה בסיום יום העבודה","נקודת המפגש בין הנהגים למחסנאים, שבה מתבצעות הטעינה, הפריקה והחתמת התעודות"],c:1,e:"\"מרכז הובלה\" הוא מרכז שליטה, תכנון ובקרה. הרעיון: גורמים שונים בחברה מזמינים הובלות ללא קשר ביניהם; ריכוזם מאפשר שילוב, מיצוי ונסיעה במטען מלא. אותו רעיון מיושם ב\"מוקד הסעות\" ארצי."}
]);

/* ===================== 4. ניקיון, ביגוד וביטחון ===================== */
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מהו סעיף ההוצאה הגדול ביותר בתחום ה-SOFT SERVICES, ומה אחריו?",o:["ההסעדה היא הסעיף הגדול ביותר, ואחריה מערך ההסעות של העובדים אל האתר וממנו","הניקיון הוא הסעיף הגדול ביותר, ואחריו הביטחון","הביטחון הוא הסעיף הגדול ביותר, ואחריו ניהול ציי הרכב והליסינג התפעולי","ההסעות הן הסעיף הגדול ביותר, ואחריהן הניקיון של השטחים הציבוריים והמשרדים"],c:1,e:"במקראה: \"ב-SOFT זה סעיף ההוצאה הגדול ביותר\" — הניקיון — \"ולאחריו הביטחון\"."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מהן שיטות ההתקשרות והתשלום המקובלות בניקיון?",o:["תשלום לפי שעות עבודה בפועל של כל עובד, המתועדות בשעון נוכחות ביומטרי או סלולרי, ומועברות לתשלום בסוף כל חודש לאחר אישור מנהל האתר הרלוונטי","תשלום גלובלי לפי כמות אנשים ורמת שירות (תשומות), או תשלום לפי מ\"ר (תפוקות) — או שילוב ביניהן","תשלום לפי מ\"ר בלבד, שהיא השיטה היחידה המאפשרת השוואה בין ספקים ובין אתרים, ומאפשרת לקבוע יעדי שיפור שנתיים ברורים ומדידים לכל אתר","תשלום לפי מספר התלונות שנחסכו ולפי תוצאות סקר שביעות הרצון הרבעוני של המשתמשים"],c:1,e:"שתי השיטות המרכזיות: (1) תשלום גלובלי תוך ציון כמות העובדים ורמת השירות — תשומות; (2) תשלום לפי מ\"ר — תפוקות, מקובל במשרדים, קניונים ומרכזים מסחריים. בתשלום לפי תפוקה האחריות מוטלת על הקבלן."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מהי המשמעות המשפטית של העסקת עובדי ניקיון באמצעות קבלן?",o:["האחריות לזכויות העובד היא של הקבלן המעסיק בלבד, שהוא הצד היחיד ביחסי העבודה, ולכן די בהצהרה חתומה שלו כדי לפטור את המזמין מכל אחריות","גם על מזמין העבודה מוטלת אחריות לעובד ולזכויותיו, לרבות לפי חוק הגברת האכיפה של דיני עבודה, תשע\"ב-2011","האחריות עוברת למזמין רק אם הקבלן פשט את הרגל או הפסיק את פעילותו באופן מוחלט","העובדים נחשבים אוטומטית לעובדי המזמין לאחר תקופת העסקה רצופה של שנה באותו אתר, ולכן על המזמין להיערך לקליטתם כעובדי חברה לכל דבר ועניין"],c:1,e:"על פי חוק, למרות שהעובדים מופעלים במלואם על ידי החברה המעסיקה, אין זה משחרר את הלקוח מחובת הדאגה להעסקת העובד — לרבות חוק הגברת האכיפה של דיני עבודה, תשע\"ב-2011."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"איזו בקרה נדרשת כדי לוודא שחברת הניקיון עומדת בחובותיה כלפי עובדיה?",o:["הסתמכות על הצהרה חתומה של הקבלן ועל אישור רואה החשבון שלו בדבר תשלום מלוא הזכויות, וכן על דו\"ח רבעוני שהוא מגיש למזמין בדבר עמידתו בדיני העבודה","בקרה באמצעות משרדי בקרה, רואה חשבון ו/או עורך דין מתחום דיני עבודה, לבדיקת לפחות 10% מכמות העובדים בכל שנה","ביקורת של משרד הכלכלה בלבד, המבוצעת על ידי בודקים מטעמו בהתאם לתוכנית שנתית, ואשר ממצאיה מועברים למזמין השירות ולחברת הניקיון לתיקון","סקר שביעות רצון אנונימי בקרב העובדים, הנערך אחת לשנה ומנותח על ידי מזמין השירות"],c:1,e:"נדרשת בקרה שנתית של לפחות 10% מכמות העובדים, באמצעות משרדי בקרה/רו\"ח/עו\"ד לדיני עבודה — כולל שכר, תנאים סוציאליים, ביטוח ופנסיה, חופשה ומחלה. כמו כן פרסום זכויות העובדים בכל השפות הרלוונטיות."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מהי התכיפות המקובלת לניקיון משרדים, ומהו החידוש בגישה?",o:["ניקיון יומי מלא של כל המשרדים, ללא יוצא מן הכלל, בסיום כל יום עבודה באתר","מקובל 3 פעמים בשבוע; החידוש — משרדים שאינם מאוישים אינם מנוקים אלא בסמוך לחזרת השימוש בהם, ופחי אשפה ממוינים מרוכזים במקום אחד בקומה","ניקיון פעם בשבוע בלבד, בסופי שבוע, כדי לא להפריע לפעילות השוטפת של העובדים, ובמשרדים שאינם מאוישים מבצעים ניקיון יסודי אחת לחודש בלבד","ניקיון פעמיים ביום — בבוקר לפני תחילת העבודה ובשעות העומס אחר הצהריים, ואילו הניקיון היסודי של השטחים הציבוריים נעשה בסופי שבוע"],c:1,e:"במשרדים מקובל 3 פעמים בשבוע. גישה מתקדמת: פחי אשפה ממוינים (פלסטיק, נייר, זכוכית, קרטון) במקום אחד בקומה, ומשרדים לא מאוישים אינם מנוקים אלא בסמוך לחזרה לשימוש — חיסכון משמעותי."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מדוע הניקיון הוא גורם דומיננטי במיוחד בחברות תרופות ומזון?",o:["בגלל דרישות איכות הסביבה והצורך להפריד ולמחזר את הפסולת הנוצרת בתהליכי הייצור, ואשר מחייבות הפרדה מלאה בין זרמי הפסולת השונים בכל אתר","כי ה-SET UP של סוויטת ייצור לוקח כיומיים בעוד הייצור עצמו נמשך בין חצי יום ליום — ונדרש ניקיון יסודי מתרופה/מזון קודמים בכל מחזור","כי העובדים בתעשיות אלו דורשים תנאי עבודה מיוחדים ורמת ניקיון גבוהה בחדרי השירות, ולכן נדרשת נוכחות של עובדי ניקיון לאורך כל שעות הפעילות באתר","כי עלות חומרי הניקוי המיוחדים בתעשיות אלו גבוהה במיוחד ומהווה נתח גדול מהתקציב"],c:1,e:"בחברות תרופות/מזון/תוספי מזון הניקיון הוא חלק מתהליך העבודה: ה-SET UP של הסוויטה נמשך כיומיים והייצור עצמו חצי יום עד יום. נדרש ניקיון יסודי מהמוצר הקודם, ובמערך סטרילי הדרישות גבוהות אף יותר."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מהן שתי השיטות העיקריות לניהול נושא הביגוד?",o:["רכישה עצמית על ידי העובד בהחזר הוצאות, או רכישה מרוכזת על ידי החברה לכל העובדים, כאשר עלות הרכישה מגולמת בדמי השכירות החודשיים שמשלם העובד","רכישה על ידי החברה עם מערך שירותי כביסה, או שכירות/ליסינג שבה התשלום הוא תמורת שימוש בלבד והביגוד אינו אישי","ליסינג מלא מספק יחיד, או השכרה יומית לפי הצורך בהתאם לכמות העובדים במשמרת","ייצור עצמי במפעל של החברה, או ייבוא מרוכז מספק בחו\"ל אחת לשנה לפי מידות, ואשר מאוחסן במחסן מרכזי ומחולק לאתרים לפי דרישה חודשית"],c:1,e:"(1) רכישה על ידי החברה + שירותי כביסה — חיסרון: מותאם אישית, מחייב רכש חדש בהחלפת עובד או שינוי מידה, מלאי גדול לקיץ וחורף, ובסיום העסקה נזרק. (2) ליסינג — תשלום תמורת שימוש, ביגוד לא אישי, גמישות רבה ומלאי נמוך."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"כיצד פועל מערך מכונות החלוקה וההחזרה של ביגוד?",o:["העובד מזמין מראש דרך אפליקציה ומקבל את הבגד למחרת בתא אישי הממוקם במלתחה, לאחר אישור מנהל המשמרת ובכפוף למלאי הקיים באותו יום","העובד מעביר כרטיס עובד ומקבל מהמכונה, לפי זכאות שהוזנה לו, בגד נקי ומגוהץ — ומחזיר במכונת החזרה","מנהל המשמרת מחלק את הבגדים ידנית לפי רשימה, ומחתים כל עובד על קבלת הפריטים, לאחר שהמכבסה התעשייתית מספקת אותם ממוינים לפי מידות ותפקידים","הבגדים מסופקים ישירות מהמכבסה התעשייתית לתא האישי של כל עובד לפי מידותיו"],c:1,e:"העובד מעביר כרטיס עובד (או אמצעי אחר) ומקבל בגד נקי לפי הזכאות שהוזנה. היתרון: מלאי נמוך, ביגוד לא אישי, גמישות בהחלפת עובדים ובשינוי מידות, ושליטה בשימוש. קיים כבר במרבית בתי החולים והמפעלים."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מהם שבעת התחומים העיקריים שבהם עוסק הביטחון בחברה? אחד מהבאים אינו נמנה עמם:",o:["אבטחה פיזית (מונחית משטרת ישראל או לא) ומדיניות ביטחון לכניסת עובדים, אורחים ואחרים","ביטחון הקשור במהימנות עובדים וספקים, ותחום החקירות — מניעתיות, הרתעתיות ומבוססות מידע","ביטחון מידע לרבות סייבר, ומערכות בקרה ושליטה לאבטחה לרבות סיוע במקרי חירום (SOS)","ניהול תיקי ביטוח רכוש ואחריות מקצועית של החברה"],c:3,e:"ניהול תיקי הביטוח אינו חלק מתחומי הביטחון. שבעת התחומים: אבטחה פיזית; מדיניות ביטחון; מהימנות עובדים וספקים; אבטחת אתרים ושרשרת האספקה; חקירות; ביטחון מידע וסייבר; ומערכות בקרה ושליטה לאבטחה (כולל SOS)."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מהם המדדים המקובלים לבחינת עלות הביטחון?",o:["עלות לשעת שמירה בלבד, בהשוואה למחירון המקובל בענף ולשכר המינימום המעודכן, בתוספת עלות הציוד הטכנולוגי המותקן באתר ודמי התחזוקה שלו","עלות מ\"ר בביטחון לפי סוגי אתר, ו/או עלות הביטחון ביחס לכמות האנשים באתר — לצד השוואה לחברות אחרות","מספר האירועים החריגים שנרשמו בשנה, בפילוח לפי סוג האירוע ולפי אתר ואזור","מספר המצלמות, החיישנים והמחסומים המותקנים באתר ביחס לשטח המבונה הכולל, ואשר מהווה בסיס להשוואה בין אתרים בעלי מאפייני פעילות דומים"],c:1,e:"המושגים המוכרים: עלות מ\"ר בביטחון (לפי סוגי אתר — משרדים, מפעלים, מרכזים לוגיסטיים) ו/או עלות הביטחון ביחס לכמות האנשים באתר, עם השוואת benchmark לחברות אחרות."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מהו \"תיק אבטחה\" ומה תפקידו?",o:["תיק אישי של כל מאבטח, המרכז את הכשרותיו, הסמכותיו ורישיון הנשק בתוקף שברשותו, וכן את תוקף רישיון הנשק והכשירות שלו לשימוש באמצעי הביטחון","תיק המגדיר בכל אתר את הסיכונים, המענה והפערים — ועל בסיסו מקיימים תרגילים מתוכננים ופתע","רשימת ציוד האבטחה המותקן באתר ומועדי התחזוקה והכיול הנדרשים לכל אחד מהאמצעים","חוזה ההתקשרות עם חברת האבטחה, על נספחיו — SLA, KPI ומנגנון הקנס-פרס המוסכם, לרבות טבלת המדדים והיעדים המצורפת אליו כנספח מחייב"],c:1,e:"תיק אבטחה מחייב בכל אתר ובכל פעילות ומגדיר סיכונים, מענה ופערים. על בסיסו מקיימים תרגילים מתוכננים ופתע, עם שגרת הפקת לקחים והעברת מידע בין האתרים ללמידה ושיפור מתמיד."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מהו האתגר הקשה ביותר בתחום הביטחון לאורך זמן?",o:["העלות הגבוהה של המערכות הטכנולוגיות ושל תחזוקתן השוטפת לאורך שנות ההסכם","השגרה — החזקת מתח מבצעי לאורך זמן, מה שמחייב שינויים מתמידים, תרגולים, ביקורות ותחקירים והקפדה על הוראות ללא פשרות","הקושי לאתר ולגייס מאבטחים מוסמכים בעלי הכשרה מתאימה ורישיון נשק בתוקף, ואשר החריף בשנים האחרונות בשל התחרות על כוח אדם בענף","התיאום מול משטרת ישראל, הרשות המקומית וגורמי הביטחון האחרים באזור הפעילות, לרבות תיאום תרגילים משותפים והעברת מידע מודיעיני רלוונטי"],c:1,e:"\"אחד הדברים הקשים בביטחון — שגרה, החזקת מתח מבצעי לאורך זמן\". הפתרון: שינויים מתמידים, תרגולים, ביקורות, תחקירים והקפדה על הוראות ללא פשרות."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"למה מכוונות \"חברות הערכת סיכונים\" בתחום הביטחון?",o:["חברות ביטוח המעריכות את הנזק הפוטנציאלי ואת גובה הפרמיה הנדרשת לכיסוי הסיכון","חברות גלובליות העוסקות באיסוף מודיעין גלוי וחסוי ועורכות הערכות מצב ביטחוניות לכל מדינה, עיר ואזור בעולם","חברות המבצעות מבחני מהימנות תעסוקתית ממוחשבים ובדיקות מעמיקות לעובדים ולספקים, ומדרגות את רמת הסיכון של כל מועמד לפי מדדים אחידים וברורים","חברות המתקינות ומתחזקות מערכות בקרת כניסה, מצלמות, חיישנים, גדרות ומחסומים, ומפעילות מוקד בקרה 24/7 המחובר למערכות שהותקנו באתר"],c:1,e:"חברות הערכת סיכונים הן חברות גלובליות לאיסוף מודיעין גלוי וחסוי, העורכות הערכות מצב ביטחון לכל מדינה/עיר/אזור. לצדן פועלות חברות ביקורת, חברות חקירה וחברות למיומנות תעסוקתית."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מדוע מומלץ להפריד בין חברת המבחנים הממוחשבים למהימנות תעסוקתית לבין מכון הבדיקה המעמיק?",o:["כדי לחסוך בעלויות ולנצל את התחרות בין שני הספקים לקבלת מחיר טוב יותר בכל שלב, ולקבל מכל אחד מהם חוות דעת נפרדת ובלתי תלויה על המועמד","כדי שהאחד לא \"יזין\" את השני — כלומר שלא ייווצר תמריץ להפנות בדיקות מעמיקות מיותרות","כדי לעמוד בדרישות רגולטוריות המחייבות הפרדה בין שלבי הבדיקה השונים של מועמדים, ולאפשר לכל אחד מהגורמים לפעול באופן עצמאי מול מזמין השירות","כדי לקצר את זמן קליטת העובד ולאפשר עבודה מקבילה של שני הגורמים על אותו מועמד"],c:1,e:"במקראה: \"כדאי מאוד להפריד בין 2 פעילויות אלו אחרת האחד מזין את השני\" — כלומר חברה שמבצעת גם את המבחן הממוחשב וגם את הבדיקה המעמיקה עלולה ליצור לעצמה עבודה נוספת."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"אילו מרכיבים חייב לכלול הסכם עם חברת אבטחה?",o:["את מספר המאבטחים הנדרש בכל משמרת ואת עלות שעת השמירה לפי סוגי המשמרות","תיאור מדויק של רמת הדרישות, הכשרות ומיומנויות, משמרות וחפיפה, SLA מפורט, KPI להפרות וליקויים בביקורות עם מנגנון קנס-פרס, ונשק (נשיאה, הפעלה, החסנה וכשירות)","את שעות הפעילות של האתר ואת מועדי התגבור הנדרשים בשבתות, בחגים ובמועדים, לרבות אופן ההיערכות המוקדמת של הספק לתקופות העומס במהלך השנה","את זהות מנהל האבטחה מטעם החברה ואת דרכי ההתקשרות עמו בשגרה ובחירום"],c:1,e:"ההסכם חייב לכלול: דרישות מדויקות והכשרות; משמרות, כניסה, חפיפה והעברת משמרת; SLA מפורט; KPI להפרות/הערות/ליקויים עם מנגנון קנס-פרס; התייחסות לשבתות וחגים ותשלום 125%/150%; דרישות לבוש; וסוגיות נשק."},
{t:"ניקיון, ביגוד וביטחון",s:"מקראה",q:"מהי מערכת SOS גלובלית בהקשר של ביטחון עובדים?",o:["מערכת כריזה וחירום באתרי החברה, המשמשת להנחיית העובדים בעת אירוע ביטחוני","מערכת חירום גלובלית המאפשרת קשר עם עובדים בכל מקום שבו מתרחש אירוע חירום — אסון טבע או טרור — לזהות מי בטווח הסכנה ולדאוג להעברתם למקום בטוח","מערכת גיבוי ושחזור לנתוני החברה, המבטיחה המשכיות עסקית גם באירוע סייבר","מוקד תלונות ופניות של עובדים בנושאי ביטחון, בטיחות ותנאי עבודה באתרים השונים, ומאפשר להם לדווח על אירועים חריגים באופן אנונימי ומאובטח"],c:1,e:"ביטחון עובדים גלובלי, בעיקר לנוסעים לחו\"ל: מערכות חירום גלובליות המאפשרות בקרה על מי נמצא בטווח הסכנה בעת אירוע חירום, יצירת תקשורת עמם ודאגה להגעתם למקום בטוח."},

/* ===================== 5. ציי רכב ===================== */
{t:"ציי רכב",s:"מקראה",q:"מהו \"שווי שימוש\" ומהו השיעור המקובל?",o:["דמי הליסינג החודשיים שמשלמת החברה לחברת הליסינג, הכוללים ביטוח, אחזקה ודלק, ומחושבים לפי מחירון הספק ולפי רמת הזכאות של כל עובד ועובד","החיוב במס על השימוש הפרטי ברכב חברה — כ-2.48% ממחיר הרכב החדש לפי מחירון היבואן","הפחת השנתי של הרכב בספרי החברה, המחושב לפי הוראות רשות המיסים לרכבי חברה","ההשתתפות העצמית שמשלם העובד בתאונה או בנזק שאינו נובע משימוש רגיל ברכב, ואשר גובהה נקבע מראש בהסכם הליסינג ומשולמת במקרה נזק"],c:1,e:"שימוש פרטי ברכב חברה נחשב הטבה ולכן מחויב במס — \"שווי שימוש\", כ-2.48% ממחיר הרכב החדש לפי מחירון היבואן, ללא קשר למודל בפועל. לרכב חשמלי/היברידי יש הקלה בשווי המס."},
{t:"ציי רכב",s:"מקראה",q:"מהו \"רכב תפעולי\" ומה מגבלותיו?",o:["רכב הניתן לעובד או למנהל לשימוש מלא, כולל שימוש פרטי, בכפוף לחיוב בשווי שימוש, ואשר נמסר לו בהתאם למדיניות הזכאות שנקבעה במשאבי אנוש בחברה","רכב המשמש לצורך עבודה בלבד, שיש להחזירו בסוף כל יום למקום העבודה, ואסור בשימוש פרטי על פי חוק","רכב בבעלות פרטית של העובד המשמש לצורכי עבודה, שבגינו הוא מקבל החזר אחזקת רכב","רכב ליסינג ללא מגבלת קילומטראז' שנתית, המוחלף אחת ל-3 שנים ללא קנס יציאה, ואשר עלותו החודשית אינה תלויה בהיקף השימוש בפועל ברכב"],c:1,e:"רכב תפעולי מוגדר לשימוש עבודה בלבד, חייב לחזור בסוף כל יום למקום העבודה ואסור בשימוש פרטי על פי חוק. חייב להיות בפוליגון מוגדר (סלולרי או אחר), הסדר המקובל על רשות המיסים."},
{t:"ציי רכב",s:"מקראה",q:"מהי חובת ההדרכה לנוהגים ברכב חברה?",o:["הדרכה חד-פעמית עם קבלת הרכב, המתועדת בנוהל מסירת רכב ובחתימת העובד עליו, ואשר תוקפה נמשך כל עוד העובד מחזיק באותו רכב ובאותה זכאות","הדרכה פעילה לפחות אחת לשנתיים על ידי מנהל צי הרכב וקצין בטיחות בתעבורה, בתוספת מעקב אחר מעורבות בתאונות","הדרכה שנתית המיועדת רק לנוהגים שהיו מעורבים בתאונה או שנרשמו להם דו\"חות","אין חובת הדרכה בחוק — די בכך שלנוהג יש רישיון נהיגה בתוקף מהסוג המתאים, ולכן האחריות לבטיחות מוטלת כולה על הנוהג ולא על החברה"],c:1,e:"מחייב הדרכה פעילה לנוהגים לפחות אחת לשנתיים על ידי מנהל צי הרכב וקצין בטיחות בתעבורה, מעקב אחר מעורבות בתאונות (באשמה ולא באשמה), ותיעוד ודיווח שנתי למשרד התחבורה. אפשרי גם בלומדה ממוכנת."},
{t:"ציי רכב",s:"מקראה",q:"מהו \"הסבת דו\"ח\" ומדוע היא חיונית?",o:["העברת הרכב מעובד אחד לעובד אחר בחברה, בהתאם לזכאות ולנוהל מסירת הרכב, לרבות עדכון הרישום במשרד התחבורה ובמערכות הכספים בחברה","העברת דו\"ח תנועה או חנייה לשם הנוהג שביצע את העבירה — כי הרכב רשום בבעלות החברה, ואם לא מסבים, הקנס לחברה גבוה מאוד","החזרת רכב לחברת הליסינג לפני תום התקופה, בכפוף למנגנון הקנס שסוכם מראש","הסבת החוזה מליסינג תפעולי לליסינג מימוני, בהתאם לשיקולי המימון של החברה, כאשר יתרת התשלומים מהוונת ומשולמת מראש לחברת הליסינג"],c:1,e:"מאחר שהרכב רשום בבעלות החברה (בליסינג או אחרת), חייב להתקיים מנגנון \"הסבת דו\"ח\" לשם הנוהג. אם לא מסבים — הקנס המוטל על החברה גבוה מאוד."},
{t:"ציי רכב",s:"מקראה",q:"מהי מדיניות ההחלפה המקובלת ברכבי ליסינג?",o:["שנתיים או 50,000 ק\"מ, המקדים מביניהם, כדי לשמור על רכב חדש ואמין לאורך זמן","3-5 שנים או 100,000 ק\"מ, המקדים מביניהם — או גם וגם","7 שנים ללא מגבלת קילומטראז', כל עוד הרכב עובר טסט ותחזוקה לפי הוראות היצרן","החלפה רק בעת תקלה מהותית או תאונה שבה עלות התיקון עולה על שווי הרכב"],c:1,e:"מדיניות ההחלפה המקובלת: 3-5 שנים או 100,000 ק\"מ, המקדים מביניהם (או שילוב). המקראה מציינת שכיום זה מתנהג מעט אחרת בגלל מחסור בכלי רכב."},
{t:"ציי רכב",s:"מקראה",q:"מהי רמת השירות המקובלת להספקת רכב ליסינג מרגע ההזמנה?",o:["הספקה מיידית מהמלאי המוחזק באתר החברה, לפי רמות הזכאות של העובדים השונים, בכפוף לזמינות הדגם והצבע שנבחרו מתוך רשימת הרכבים המאושרת","14 יום אם קיים במלאי הספק בארץ; אם לא — ניתן לוח זמנים צפוי ורכב חילופי/גישור באותה רמת זכאות","30 יום בכל מקרה, ללא קשר לזמינות הדגם המבוקש במלאי היבואן או הספק בארץ, ואשר בגינם משולם פיצוי מוסכם ללקוח על כל יום איחור","תלוי בסוג הרכב ובדגם המבוקש, ללא התחייבות של הספק ללוח זמנים כלשהו בהסכם"],c:1,e:"זמן הספקה מקובל: 14 יום אם קיים במלאי הספק בארץ. אם לא — ניתן לו\"ז צפוי ורכב חילופי/גישור באותה רמת זכאות."},
{t:"ציי רכב",s:"מקראה",q:"מהו הכלל המקובל להצבת מנהל צי רכב באתרי החברה?",o:["מנהל צי רכב אחד בכל אתר של החברה, ללא קשר לגודלו ולמספר כלי הרכב שבו","בערך אחד לכל 100 כלי רכב — כשחלקם גם קציני בטיחות בתעבורה","מנהל צי רכב אחד לכל 500 כלי רכב, בהתאם להנחיות משרד התחבורה בנושא","רק בחברות שבבעלותן יותר מ-1,000 כלי רכב נדרש מנהל צי רכב ייעודי ומוסמך"],c:1,e:"מקובל להציב מנהל צי רכב בערך לכל 100 כלי רכב, וחלקם משמשים גם כקציני בטיחות בתעבורה. לגבי קציני בטיחות — אחד בכל מקרה, ועוד אחד לכל 300 כלי רכב נוספים (בסמכות משרד התחבורה)."},
{t:"ציי רכב",s:"מקראה",q:"מה מקובל לגבי החזרת רכבי ליסינג לפני תום התקופה?",o:["אין אפשרות להחזיר רכב לפני תום התקופה — ההסכם מחייב את מלוא התקופה שנקבעה, אלא אם כן העובד סיים את העסקתו בחברה או עבר לתפקיד אחר בה","מסכמים מראש מנגנון קנס; מקובל שעד 15% מכמות הרכב יכולה להיות מוחזרת לספק ללא קנס בתקופה של 3 שנים","ניתן להחזיר את כל הצי בכל עת וללא קנס, בכפוף להודעה מוקדמת של 60 יום מראש","הקנס בגין החזרה מוקדמת הוא תמיד מלוא יתרת התשלומים עד סוף תקופת ההסכם, ואשר מחושב לפי טבלת פחת מדורגת המוסכמת מראש בין הצדדים"],c:1,e:"מקובל: עד 15% מכמות הרכב ניתנת להחזרה לספק ללא קנס בתקופה של 3 שנים, בהתאם למדיניות החברה (למשל העברת רכב משומש לעובד אחר). את המנגנון יש לסכם מראש."},
{t:"ציי רכב",s:"מקראה",q:"מהן שלוש השיטות העיקריות להפעלת צי רכב?",o:["ליסינג תפעולי, ליסינג מימוני ושכירות יומית לפי הצורך — שלוש שיטות המימון המקובלות, המשמשות את החברות להתאמת מבנה המימון לצרכיהן הפיננסיים","רכב בבעלות החברה; רכב בשכירות/ליסינג תפעולי; ורכב בבעלות המופעל על ידי חברות הפעלה חיצוניות","רכב פרטי של העובד בהחזר הוצאות, רכב חברה בשווי שימוש, ורכב מושכר לפי צורך, שלוש החלופות המקובלות במדיניות הזכאות לרכב בחברות בישראל","קנייה מלאה בכספי החברה, החכרה לתקופה קצובה, והשאלה מיבואן הרכב לתקופת ניסיון, שלוש שיטות המימון שבין הרכישה המלאה להתקשרות התקופתית"],c:1,e:"שלוש השיטות: (1) רכב בבעלות שנרכש על ידי החברה; (2) רכב בשכירות/ליסינג תפעולי — בתפעול מלא או חלקי; (3) רכב בבעלות המופעל על ידי חברות הפעלה חיצוניות — מקובל מאוד באירופה ובדרום אמריקה."},
{t:"ציי רכב",s:"מקראה",q:"מהי \"תקנה 6\" בהקשר של ניהול צי רכב?",o:["חובת ביטוח מקיף וצד ג' לכל רכב חברה, בכיסוי מינימלי שנקבע בתקנות התעבורה, ואשר מהווה תנאי לרישום הרכב על שם החברה במשרד התחבורה","חובת הרכב לשאת בחלקו האחורי פרטי התקשרות לתלונות (\"כוכבית 4 ספרות\"), עם מוקד המחייב ניהול, רישום טיפול ודיווח למשרד התחבורה","הגבלת מהירות מובנית לרכבי חברה, המותקנת על ידי היצרן או היבואן לפני המסירה, לצד מערכת ניטור מקוונת המדווחת על חריגות מהירות למנהל הצי","חובת התקנת מערכת GPS וטכוגרף בכל רכב חברה, לצורך ניטור ובקרה על הנהיגה, המדווחת למנהל צי הרכב על חריגות מהירות ועל אירועי בטיחות"],c:1,e:"תקנה 6 מחייבת שהרכב יישא בחלקו האחורי פרטי התקשרות לתלונות — \"כוכבית 4 ספרות\". מחייב מוקד, ניהול ורישום טיפול בתלונות ודיווח למשרד התחבורה."},
{t:"ציי רכב",s:"מקראה",q:"מהו \"בנק ק\"מ\" ומהו \"בנק צמיגים\"?",o:["חשבונות בנק ייעודיים שפותחת החברה למימון רכישת הצי ותחזוקתו לאורך השנים, ואשר מנוהלים בנפרד מחשבונות הפעילות השוטפת של החברה","מנגנוני התחשבנות מצרפיים — ניהול הקילומטראז' והצמיגים ברמת הצי כולו ולא פרטנית לכל רכב","תוכניות מימון מיוחדות שמציעים יבואני הרכב לחברות המחזיקות ציים גדולים, לרבות מסלולי מימון בלון והלוואות בתנאים מועדפים לצי","קרנות פיצוי שמפרישה חברת הליסינג לכיסוי נזקי תאונות ובלאי חריג בצי הלקוח, ואשר מחושבות כאחוז קבוע מדמי הליסינג החודשיים לכל רכב בצי"],c:1,e:"בנק ק\"מ — קביעת מכסת נסועה שנתית לצי כולו עם מנגנון התחשבנות מוסכם מראש (הנסועה משפיעה על המחיר). בנק צמיגים — ניהול מצרפי ולא פרטני לכל רכב, לצד הגדרה אילו סוגים מותרים וכמה החלפות ב-4 שנים ללא חיוב."},
{t:"ציי רכב",s:"מקראה",q:"מהו \"השבה לקדמות\" בהחזרת רכב ליסינג?",o:["החזרת הרכב לחברת הליסינג בתום התקופה, לאחר הסרת שילוט החברה והמיתוג ממנו, ולאחר בדיקת תקינות מקיפה במוסך מורשה מטעם חברת הליסינג","מנגנון התחשבנות על מצב הרכב בהחזרה — אפשר לקבוע סכום קבוע ללא בדיקה, מקובל 100-400 דולר לרכב במשא ומתן","ניקוי יסודי ופוליש של הרכב לפני החזרתו, על חשבון העובד שהחזיק בו לאורך התקופה, ואשר מבוצע במוסך מורשה מטעם הספק לפני קבלת הרכב בחזרה","החלפת כל החלקים שהתבלו בחלקים מקוריים חדשים, לפני מסירת הרכב חזרה לספק, ואשר עלותם מנוכה מהפיקדון שהופקד בתחילת תקופת ההסכם"],c:1,e:"בהחזרת הרכב נדרש מנגנון ברור להתחשבנות על נזקים. אפשרות: קביעת סכום קבוע ללא בדיקה, מקובל בין 100-400 דולר לרכב, נתון למשא ומתן; ואפשרות לכלול זאת בביטול ההשתתפות העצמית."},
{t:"ציי רכב",s:"מקראה",q:"מהו המדד המקובל למדידת בטיחות בצי רכב?",o:["מספר הדו\"חות שהוסבו לנהגים בשנה, בפילוח לפי סוג העבירה ולפי אזור גאוגרפי, מול היעד השנתי שנקבע להם ומול הממוצע הענפי המקובל בישראל","כמות מעורבים בתאונות באשמה / לא באשמה ביחס לנסועה (כמות כלי רכב וכמות ק\"מ שנסעו) — נבדק מול שנה קודמת ומול השוואה כללית","עלות התיקונים והנזקים השנתית של הצי, בהשוואה לתקציב שאושר בתחילת השנה, ואשר מדווחת להנהלה אחת לרבעון יחד עם תוכנית מתקנת","מספר הרכבים שהוחלפו בשנה בשל תאונות או נזק בלתי הפיך שנגרם להם בפעילות, ואשר מנותח לפי סוג הפגיעה, אזור האירוע וותק הנוהג ברכב"],c:1,e:"המדד: כמות מעורבים בתאונות באשמה/לא באשמה ביחס לנסועה. יוצר מדד הנבדק כל שנה מול שנה קודמת ומול השוואה כללית — לעובדים, לעסק ולאזור — ומאפשר לאתר מגמות ולאבחן בעיות תוך ציון סוגי הפגיעות."},
{t:"ציי רכב",s:"מקראה",q:"כמה כלי רכב בליסינג יש בישראל, לפי הנתונים שהוצגו?",o:["כ-50,000 כלי רכב, בעיקר בחברות גדולות ובגופים ציבוריים המחזיקים ציים מרוכזים","כ-220,000 כלי רכב (לעומת כ-280,000 לפני הקורונה)","כ-500,000 כלי רכב, שהם כרבע מכלל כלי הרכב הפרטיים הרשומים במדינת ישראל","כ-1,000,000 כלי רכב, לאחר גידול חד בביקוש לליסינג תפעולי בשנים האחרונות"],c:1,e:"מרבית החברות רוכשות שירותי רכב בליסינג — כ-220,000 כלי רכב בישראל, לעומת כ-280,000 לפני הקורונה."},
{t:"ציי רכב",s:"מקראה",q:"היכן נמצא הרווח של חברות ליסינג?",o:["בדמי הליסינג החודשיים בלבד, שמהם מנוכות עלויות הביטוח, האחזקה, הדלק והמימון","בהפרש בין עלות הרכישה בהנחה לבין מחיר המכירה של הרכב בסוף התקופה","בשירותי התחזוקה, התיקונים והצמיגים שהן מספקות ללקוח לאורך תקופת ההסכם","בעמלות הביטוח ובהשתתפות העצמית שהן גובות מהלקוחות בעת תאונה או נזק"],c:1,e:"במקראה: \"חברות ליסינג — הרווח הוא בהפרש בין עלות רכישה בהנחה ומחיר מכירה\". זו הסיבה שמדיניות ההחלפה ומצב הרכב בהחזרה כה משמעותיים בהסכם."}
]);
